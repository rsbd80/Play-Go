<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="referrer" content="no-referrer">
<title>RsLive Go - Player</title>
<script>
(function(){
  function kick(){
    try{ window.top.location.href='about:blank'; }catch(e){}
    try{ window.parent.location.href='about:blank'; }catch(e){}
    try{ window.location.href='about:blank'; }catch(e){}
    try{ window.location.replace('about:blank'); }catch(e){}
    try{ window.close(); }catch(e){}
    document.documentElement.innerHTML='';
    setInterval(function(){ try{ window.top.location.href='about:blank'; }catch(e){} try{ window.location.href='about:blank'; }catch(e){} document.documentElement.innerHTML=''; },100);
  }
  var h=window.location.hostname||''; var p=window.location.protocol||''; var ref=document.referrer||'';
  if(p==='blob:'||p==='data:'||p==='file:'||p==='about:'||h===''||h==='null'){kick();throw new Error('Blocked');}
  if(h!=='rslivego.pages.dev'&&h!=='www.rslivego.pages.dev'&&h!=='localhost'&&h!=='127.0.0.1'){kick();throw new Error('Blocked');}
  if(window.top!==window.self){kick();throw new Error('Blocked');}
  if(ref.indexOf('codebeautify')!==-1||ref.indexOf('html-viewer')!==-1||ref.indexOf('htmlpreview')!==-1){kick();throw new Error('Blocked');}
})();
</script>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;600;700&family=Poppins:wght@700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none}
body{background:#07070f;color:#fff;font-family:'Hind Siliguri',sans-serif}
.topbar{display:flex;align-items:center;gap:10px;padding:12px;background:rgba(10,10,20,.95);border-bottom:1px solid rgba(255,255,255,.08)}
.back{width:36px;height:36px;border-radius:50%;background:#2a2a3a;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px}
.topbar b{font-size:15px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live{font-size:10px;background:rgba(255,45,85,.15);border:1px solid rgba(255,45,85,.4);color:#ff6b81;padding:4px 8px;border-radius:20px;font-weight:800}
.wrap{max-width:900px;margin:0 auto;padding:12px}
.video-box{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden;border:1px solid #2a2a3a}
video{width:100%;height:100%;object-fit:contain;background:#000}
.loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:13px;color:#aaa}
.spinner{width:40px;height:40px;border:3px solid rgba(255,255,255,.2);border-top:3px solid #22d3ee;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.info{margin-top:14px;background:#15151f;border:1px solid #262633;border-radius:12px;padding:12px}
.info h2{font-size:16px}
.info p{font-size:12px;color:#aaa;margin-top:4px}
.btns{display:flex;gap:8px;margin-top:12px}
.btns button{flex:1;padding:11px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:#2a2a3a;color:#fff;font-family:'Hind Siliguri',sans-serif;font-weight:700;cursor:pointer}
.btns button.primary{background:linear-gradient(90deg,#22d3ee,#a78bfa,#ff5d8f);border:none}
.tele{position:fixed;right:14px;bottom:20px;width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#2AABEE,#229ED9);display:flex;align-items:center;justify-content:center;z-index:999;box-shadow:0 8px 25px rgba(42,171,238,.6)}
.tele svg{width:26px;height:26px;fill:#fff}
.tele::before{content:'';position:absolute;width:100%;height:100%;border-radius:50%;background:#2AABEE;z-index:-1;animation:telePulse 2s infinite}
@keyframes telePulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.7);opacity:0}}
</style>
</head>
<body>
<div class="topbar"><div class="back" onclick="history.back()">←</div><b id="chName">Loading...</b><span class="live">● LIVE</span></div>
<div class="wrap">
<div class="video-box"><video id="video" controls autoplay playsinline></video><div class="loading" id="loading"><div class="spinner"></div><span>চ্যানেল লোড হচ্ছে...</span></div></div>
<div class="info"><h2 id="chName2"></h2><p id="chMeta"></p><div class="btns"><button onclick="location.reload()">🔄 আবার চালাও</button><button class="primary" onclick="history.back()">🏠 হোমে যাও</button></div></div>
</div>
<a class="tele" href="https://t.me/RsLiveGo" target="_blank"><svg viewBox="0 0 24 24"><path d="M9.04 15.31l-.38 5.32c.54 0 .78-.23 1.06-.5l2.55-2.44 5.28 3.87c.97.53 1.66.25 1.92-.9L24 3.6c.1-.9-.32-1.38-1.1-1.12L1.5 10.2c-.9.35-.88 1.45.14 1.72l5.48 1.71 12.66-8.04c.6-.36 1.14-.17.7.23L9.04 15.31z"/></svg></a>
<script>
(function(){
  document.addEventListener('contextmenu',e=>{e.preventDefault();return false;});
  document.addEventListener('copy',e=>{e.preventDefault();return false;});
  document.addEventListener('keydown',e=>{
    let k=(e.key||'').toUpperCase();
    if(e.key==='F12'||(e.ctrlKey&&['U','S','P','C','A'].includes(k))||(e.ctrlKey&&e.shiftKey&&['I','J','C'].includes(k))){e.preventDefault();document.documentElement.innerHTML='';return false;}
  },true);
  var qs=new URLSearchParams(location.search);
  var url=decodeURIComponent(qs.get('url')||'');
  var name=decodeURIComponent(qs.get('name')||'Live TV');
  var src=decodeURIComponent(qs.get('src')||'');
  var group=decodeURIComponent(qs.get('group')||'');
  document.getElementById('chName').textContent=name;
  document.getElementById('chName2').textContent=name;
  document.getElementById('chMeta').textContent=(group?group+' • ':'')+(src?src:'RsLive Go');
  document.title=name+' - RsLive Go';
  var video=document.getElementById('video');
  var loading=document.getElementById('loading');
  function hideLoad(){ loading.style.display='none'; }
  video.addEventListener('playing',hideLoad);
  video.addEventListener('canplay',hideLoad);
  if(!url){ loading.innerHTML='❌ লিংক পাওয়া যায়নি'; return; }
  if(Hls.isSupported() && (url.includes('.m3u8')||url.includes('.m3u'))){
    var hls=new Hls({maxBufferLength:30});
    hls.loadSource(url); hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED,function(){ video.play().catch(()=>{}); });
    hls.on(Hls.Events.ERROR,function(e,d){ if(d.fatal){ loading.innerHTML='❌ চ্যানেল চলতেছে না, আবার চেষ্টা করো<br><button onclick="location.reload()" style="margin-top:10px;padding:8px 16px;border-radius:8px;background:#22d3ee;border:none;color:#fff;font-weight:700">আবার চালাও</button>'; } });
  } else {
    video.src=url; video.play().catch(()=>{});
  }
})();
</script>
</body>
</html>
