<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>RsLive Go - Player</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.compiled.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;600;700&family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg-1:#0a0a12;--bg-2:#14101f;--grad-a:#22d3ee;--grad-b:#a78bfa;--grad-c:#fb923c;--warn:#ffb84d;--alert:#ff5d5d;--text:#eef0f7;--text-dim:#7a7a92;--font:'Poppins','Hind Siliguri','Segoe UI',sans-serif;--mono:'JetBrains Mono','Courier New',monospace}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;background:#07070f;font-family:var(--font);overflow-x:hidden}
body{padding:0;background:radial-gradient(600px 300px at 50% -80px, rgba(167,139,250,.18), transparent 70%), radial-gradient(500px 250px at 100% 0%, rgba(34,211,238,.12), transparent 70%), #07070f;-webkit-user-select:none;user-select:none}
.topbar{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 14px;background:rgba(10,10,20,.88);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);border-bottom:1px solid rgba(255,255,255,.10);overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,.35)}
.topbar::before{content:"";position:absolute;top:-50px;left:-20px;width:200px;height:110px;background:radial-gradient(circle,rgba(34,211,238,.30),transparent 70%);filter:blur(10px);pointer-events:none}
.topbar::after{content:"";position:absolute;top:-50px;right:-20px;width:200px;height:110px;background:radial-gradient(circle,rgba(167,139,250,.32),transparent 70%);filter:blur(10px);pointer-events:none}
.brand{display:flex;align-items:center;gap:9px;position:relative;z-index:2;flex-shrink:0;cursor:pointer}
.brand:active{transform:scale(.96)}
.brand .play-ico{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,#22d3ee,#a78bfa,#ff5d8f);display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;box-shadow:0 5px 18px rgba(167,139,250,.55), inset 0 1px 0 rgba(255,255,255,.45);animation:logoFloat 3s ease-in-out infinite}
@keyframes logoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.brand-text{line-height:1}
.brand-text .pg{font-size:18px;font-weight:900;letter-spacing:.3px;color:#fff!important;-webkit-text-fill-color:#fff!important;text-shadow:0 2px 10px rgba(167,139,250,.35);white-space:nowrap}
.brand-text .pg i{font-style:normal;background:linear-gradient(90deg,#22d3ee,#a78bfa,#ff5d8f,#22d3ee);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:shine 3s linear infinite}
@keyframes shine{to{background-position:200% center}}
.brand-text .tag{font-size:8px;letter-spacing:2.8px;color:#9a9ab5;font-weight:700;margin-top:3px}
.live-pill{margin-left:auto;display:flex;align-items:center;gap:6px;background:rgba(255,45,85,.16);border:1px solid rgba(255,45,85,.40);color:#ff6b81;font-size:10px;font-weight:800;letter-spacing:1px;padding:7px 11px;border-radius:20px;flex-shrink:0;position:relative;z-index:2;box-shadow:0 0 16px rgba(255,45,85,.25)}
.live-pill i{width:7px;height:7px;background:#ff2d55;border-radius:50%;box-shadow:0 0 0 0 rgba(255,45,85,.7);animation:pulseDot 1.4s infinite}
@keyframes pulseDot{0%{box-shadow:0 0 0 0 rgba(255,45,85,.7)}70%{box-shadow:0 0 0 7px rgba(255,45,85,0)}100%{box-shadow:0 0 0 0 rgba(255,45,85,0)}}
.main-layout{width:100%;display:block}
.player-col{width:100%}
#player-wrapper{position:relative;width:calc(100% - 24px);margin:12px auto 0;aspect-ratio:16/9;background:#000;overflow:hidden;border-radius:16px;border:1px solid rgba(255,255,255,.12);box-shadow:0 10px 36px rgba(0,0,0,.55), 0 0 0 1px rgba(167,139,250,.12), 0 0 32px rgba(167,139,250,.12);touch-action:manipulation}
#player-wrapper:fullscreen{width:100vw;height:100vh;margin:0;aspect-ratio:auto;border-radius:0;border:none;box-shadow:none}
#player-wrapper:fullscreen #player{width:100vw!important;height:100vh!important}
#player-wrapper:fullscreen #player video{object-fit:fill!important}
#player{position:absolute;inset:0;width:100%!important;height:100%!important;touch-action:manipulation}
#player video{width:100%!important;height:100%!important;object-fit:fill!important;background:#000;touch-action:manipulation}
video::-webkit-media-controls{display:none!important}
#loader{position:absolute;inset:0;background:radial-gradient(80% 60% at 50% 40%,var(--bg-2) 0%,var(--bg-1) 70%);display:flex;justify-content:center;align-items:center;flex-direction:column;z-index:99;transition:opacity .1s ease,visibility .1s ease;pointer-events:none}
#loader.hide-now{opacity:0!important;visibility:hidden!important;pointer-events:none!important}
.tuner{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;width:100%;margin:0 auto;padding:0}
.tv-wrap{position:relative;width:68px;height:68px;display:flex;align-items:center;justify-content:center;margin:0 auto;flex-shrink:0}
.tv-glow{position:absolute;width:100%;height:100%;border-radius:50%;background:radial-gradient(circle,rgba(167,139,250,.40),transparent 70%);animation:glow-pulse 2.4s ease-in-out infinite}
@keyframes glow-pulse{0%,100%{transform:scale(.85);opacity:.5}50%{transform:scale(1.15);opacity:1}}
.tv-icon{position:relative;width:56px;height:56px;filter:drop-shadow(0 6px 18px rgba(167,139,250,.35));display:block;margin:0 auto}
.tv-icon .tv-body{fill:none;stroke:var(--text);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tv-icon .screen-bars rect{transform-origin:bottom;animation:bar-flicker 1.6s ease-in-out infinite}
.tv-icon .screen-bars rect:nth-child(1){fill:var(--grad-a);animation-delay:-1.2s}.tv-icon .screen-bars rect:nth-child(2){fill:var(--grad-b);animation-delay:-.9s}.tv-icon .screen-bars rect:nth-child(3){fill:var(--grad-c);animation-delay:-.6s}.tv-icon .screen-bars rect:nth-child(4){fill:var(--grad-b);animation-delay:-.3s}.tv-icon .screen-bars rect:nth-child(5){fill:var(--grad-a);animation-delay:0s}
@keyframes bar-flicker{0%,100%{transform:scaleY(.45);opacity:.65}50%{transform:scaleY(1);opacity:1}}
.brand-name{font-size:18px;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;color:#fff;text-shadow:0 4px 20px rgba(167,139,250,.4);white-space:nowrap;text-align:center;margin:0;line-height:1}
.brand-name b{color:#fff}
.brand-name i{font-style:normal;background:linear-gradient(90deg,var(--grad-a),var(--grad-b),#ff5d8f);-webkit-background-clip:text;background-clip:text;color:transparent}
.dots{display:flex;gap:6px;justify-content:center;align-items:center;margin:2px 0 0}.dots span{width:6px;height:6px;border-radius:50%;background:var(--grad-b);animation:dot-pulse 1.2s ease-in-out infinite;box-shadow:0 0 8px rgba(167,139,250,.7)}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes dot-pulse{0%,80%,100%{transform:scale(.6);opacity:.35}40%{transform:scale(1);opacity:1}}
.status-line{font-family:var(--mono);font-size:9.5px;letter-spacing:2.8px;color:var(--text-dim);text-transform:uppercase;text-align:center;margin:0;line-height:1}
.state-content{text-align:center;color:var(--text);z-index:100;padding:0 24px;pointer-events:auto;display:flex;flex-direction:column;align-items:center;justify-content:center}
.state-content .glyph{font-size:34px;color:var(--alert);margin-bottom:14px}
.state-content .glyph.warn{color:var(--warn)}
.state-content p.title{font-size:13px;letter-spacing:1px;font-weight:600}
.state-content p.sub{font-family:var(--mono);font-size:10.5px;color:var(--text-dim);margin-top:8px;max-width:280px;overflow-wrap:anywhere}
.state-content .brand-name{display:block;margin-top:18px}
#controls{position:absolute;bottom:0;left:0;right:0;z-index:50;display:flex;align-items:center;gap:8px;padding:14px 14px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(0deg,rgba(0,0,0,.88),transparent);opacity:0;transition:opacity .3s;touch-action:manipulation}
#player-wrapper.show-controls #controls{opacity:1}
#controls button{background:rgba(255,255,255,.16)!important;border:1px solid rgba(255,255,255,.28)!important;color:#fff!important;width:44px;height:44px;border-radius:50%;font-size:16px;cursor:pointer;backdrop-filter:blur(8px);box-shadow:0 4px 14px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;flex-shrink:0}
#controls button:active{transform:scale(.90)}
#controls .ctrl-ico{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
#seek{flex:1;-webkit-appearance:none;height:5px;background:rgba(255,255,255,.30);border-radius:5px;outline:none;min-width:0}
#seek::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:#fff;border:3px solid #a78bfa;cursor:pointer;box-shadow:0 2px 8px rgba(167,139,250,.6)}
#time-label{font-family:var(--mono);font-size:11px;color:#fff;white-space:nowrap;background:rgba(255,45,85,.18);border:1px solid rgba(255,45,85,.35);padding:4px 8px;border-radius:10px}
/* ===== QUALITY SELECTOR ===== */
#qualityBtn{width:auto!important;min-width:52px;padding:0 10px!important;border-radius:20px!important;font-size:11px!important;font-weight:800!important;letter-spacing:.3px}
#qualityBtn.low{border-color:#22d3ee!important;color:#22d3ee!important}
#qualityMenu{display:none;position:absolute;bottom:64px;right:12px;z-index:200;background:#16161f;border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:6px;min-width:150px;box-shadow:0 12px 30px rgba(0,0,0,.6)}
#qualityMenu.show{display:block}
#qualityMenu .qm-title{font-size:10px;letter-spacing:1px;color:#888;padding:6px 10px 4px;font-weight:700}
#qualityMenu .qm-opt{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;color:#fff}
#qualityMenu .qm-opt:active{background:rgba(255,255,255,.12)}
#qualityMenu .qm-opt.active{background:linear-gradient(90deg,rgba(34,211,238,.25),rgba(167,139,250,.25));border:1px solid rgba(167,139,250,.5)}
#qualityMenu .qm-opt small{font-size:10px;color:#22d3ee;font-weight:700}
#qualityMenu .qm-opt.active small{color:#fff}
#lowNetHint{display:none;position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:120;background:rgba(0,0,0,.7);border:1px solid rgba(255,184,77,.5);color:#ffb84d;font-size:11px;font-weight:700;padding:6px 12px;border-radius:20px;white-space:nowrap}
.suggest{margin:16px 0 0;width:100%;overflow:hidden}
.suggest-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 14px 12px;width:100%;box-sizing:border-box}
.suggest-head h3{font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px;color:#fff!important;margin:0;line-height:1;letter-spacing:.2px;white-space:nowrap}
.suggest-head h3 .suggest-ico{width:28px;height:28px;flex-shrink:0;background:rgba(255,138,0,.15);border:1px solid rgba(255,138,0,.35);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px}
.suggest-head h3 #suggestTitle{width:auto;height:auto;background:none!important;border:none!important;border-radius:0!important;box-shadow:none!important;display:inline;flex-shrink:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.suggest-head a{font-size:14px;font-weight:800;flex-shrink:0;display:flex;align-items:center;justify-content:center;gap:7px;height:32px;padding:0 2px;background:none!important;background-color:transparent!important;border:none!important;box-shadow:none!important;color:#fff!important;line-height:1;white-space:nowrap;text-decoration:none}
.suggest-head a .arrow-ico{width:26px;height:26px;flex-shrink:0;border-radius:50%;background:linear-gradient(135deg,#22d3ee 0%,#a78bfa 50%,#ff5d8f 100%);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(167,139,250,.55), inset 0 1px 0 rgba(255,255,255,.5);animation:arrowNudge 1.8s ease-in-out infinite}
.suggest-head a .arrow-ico svg{width:14px;height:14px;fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
@keyframes arrowNudge{0%,100%{transform:translateX(0)}50%{transform:translateX(3px)}}
.suggest-head a:active{transform:scale(.94);opacity:.8}
.suggest-grid{display:flex;gap:10px;overflow-x:auto;padding:4px 14px 10px;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;align-items:stretch}
.suggest-grid::-webkit-scrollbar{display:none}
.sug-card{flex:0 0 86px;width:86px;height:104px;scroll-snap-align:start;background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:10px 6px 8px;text-align:center;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.35);transition:.2s;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;overflow:hidden;flex-shrink:0}
.sug-card:hover{border-color:#a78bfa;transform:translateY(-3px);box-shadow:0 12px 24px rgba(167,139,250,.30)}
.sug-card:active{transform:scale(.93);border-color:#a78bfa}
.sug-card img{width:44px;height:44px;min-height:44px;object-fit:contain;background:#fff;border-radius:12px;padding:4px;box-shadow:0 4px 12px rgba(0,0,0,.35);pointer-events:none;flex-shrink:0}
.sug-card p{font-size:11.5px;font-weight:600;margin-top:8px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;color:#fff!important;font-family:'Hind Siliguri',sans-serif}
.sug-card small{display:block;font-size:8.5px;color:#22d3ee;letter-spacing:1px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.sug-skel{flex:0 0 86px;width:86px;height:104px;border-radius:18px;background:#15151f;position:relative;overflow:hidden;flex-shrink:0}
.sug-skel::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent);animation:shimmer 1.2s infinite}
@keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.server-row{display:flex;gap:8px;overflow-x:auto;padding:4px 14px 12px;scrollbar-width:none}
.server-row::-webkit-scrollbar{display:none}
.server-chip{flex:0 0 auto;min-width:92px;padding:10px 14px;text-align:center;border-radius:12px;cursor:pointer;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);box-shadow:0 4px 12px rgba(0,0,0,.30);transition:.2s}
.server-chip:active{transform:scale(.94)}
.server-chip .sv-name{font-size:13px;font-weight:800;color:#fff;letter-spacing:.3px}
.server-chip .sv-sub{font-size:9px;font-weight:700;letter-spacing:1px;color:#888;margin-top:3px}
.server-chip.playing{background:linear-gradient(135deg,rgba(34,211,238,.18),rgba(167,139,250,.18));border-color:#22d3ee;box-shadow:0 0 0 1px #22d3ee, 0 6px 16px rgba(34,211,238,.25)}
.server-chip.playing .sv-sub{color:#22d3ee}
.server-chip.fail{border-color:rgba(255,93,93,.50);opacity:.55}
.server-chip.fail .sv-sub{color:#ff5d5d}
.ad-wrap{margin:14px 14px 0;background:linear-gradient(180deg,#14141f,#111118);border:1px solid rgba(255,255,255,.09);border-radius:18px;padding:12px 12px 14px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.30)}
.ad-label{font-size:9px;letter-spacing:3px;color:#777;text-align:center;margin-bottom:10px;font-family:var(--mono)}
.ad-box{border-radius:12px;overflow:hidden;background:#0a0a12;display:flex;justify-content:center}
#container-cdeccdd75d3e2e6916a42ce9653cfb08{width:100%!important;max-width:100%!important}
.ad-note{text-align:center;font-size:11px;color:#666;margin:14px 0 22px}
.ad-note b{color:#a78bfa}
#blockScreen{display:none;position:fixed;inset:0;background:#07070f;z-index:99999;align-items:center;justify-content:center;text-align:center;padding:30px}
@media(min-width:900px){
  .main-layout{display:flex;gap:16px;align-items:flex-start;padding:0 14px;max-width:1400px;margin:0 auto}
  .player-col{flex:1;min-width:0}
  #player-wrapper{width:100%;margin:12px 0 0}
  .suggest{width:330px;flex-shrink:0;margin:12px 0 0;background:#111118;border:1px solid rgba(255,255,255,.09);border-radius:18px;padding:12px 0 8px;position:sticky;top:62px;max-height:calc(100vh - 80px);display:flex;flex-direction:column}
  .suggest-head{padding:0 12px 12px}
  .suggest-head h3{font-size:13px}
  .suggest-head a{font-size:12px}
  .suggest-grid{display:flex;flex-direction:column;overflow-x:hidden;overflow-y:auto;padding:0 10px 10px;scroll-snap-type:none;gap:8px;flex:1}
  .suggest-grid::-webkit-scrollbar{display:block;width:5px}
  .suggest-grid::-webkit-scrollbar-thumb{background:#333;border-radius:10px}
  .sug-card{flex:none;width:100%;height:62px;flex-direction:row;align-items:center;justify-content:flex-start;text-align:left;padding:8px 10px;gap:10px;border-radius:14px}
  .sug-card:hover{transform:translateX(-3px)}
  .sug-card img{width:42px;height:42px;min-height:42px;margin:0}
  .sug-card .sug-txt{flex:1;min-width:0;text-align:left;display:flex;flex-direction:column;justify-content:center}
  .sug-card p{margin:0;font-size:13px;text-align:left}
  .sug-card small{margin-top:2px;font-size:10px;text-align:left}
  .sug-card .sug-play{width:30px;height:30px;flex-shrink:0;border-radius:50%;background:linear-gradient(135deg,#22d3ee,#a78bfa);display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff}
  .sug-skel{flex:none;width:100%;height:62px}
  .server-row{flex-direction:column;overflow-x:hidden;overflow-y:auto;padding:0 10px 10px}
  .server-chip{width:100%;min-width:0}
  .ad-wrap{max-width:1400px;margin-left:auto;margin-right:auto}
}
@media(min-width:1300px){ .suggest{width:380px} }
</style>
</head>
<body>
<div id="blockScreen"><div><div style="font-size:50px">🔒</div><h2 style="margin:12px 0">Security Alert</h2><p style="color:#aaa">DevTools বন্ধ করে আবার ঢুকো<br>RsLive Go Protected</p><button onclick="location.reload()" style="margin-top:16px;padding:10px 20px;border:none;border-radius:10px;background:linear-gradient(90deg,#22d3ee,#a78bfa);font-weight:800">Reload</button></div></div>
<div class="topbar">
<div class="brand" onclick="goHome()"><div class="play-ico">▶</div><div class="brand-text"><div class="pg">RsLive <i>Go</i></div><div class="tag">LIVE TV • BANGLADESH</div></div></div>
<div class="live-pill"><i></i> LIVE</div>
</div>
<div class="main-layout">
<div class="player-col">

</div>
<div class="brand-name"><b>RsLive</b> <i>Go</i></div>

</div>
</div>
<div id="player"></div>

<button id="muteBtn" title="Sound On/Off"><svg class="ctrl-ico" id="muteIco" viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4V5z"/><line id="muteLine1" x1="23" y1="9" x2="17" y2="15" style="display:none"/><line id="muteLine2" x1="17" y1="9" x2="23" y2="15" style="display:none"/><path id="muteWave" d="M15.5 8.5a5 5 0 0 1 0 7" style="display:"/></svg></button>

</div>
</div>

  if(url.includes('.mpd')){
    loadDASH(url, viaProxy, mySession);
    return;
  }
  if(url.includes('.m3u8') || url.includes('m3u8')){
    if(window.Hls && Hls.isSupported()){
      const hlsConfig = { maxBufferLength:8, maxMaxBufferLength:16, maxBufferSize: 8*1000*1000, enableWorker:true, lowLatencyMode:true, backBufferLength:0, manifestLoadingMaxRetry:0, levelLoadingMaxRetry:1, fragLoadingMaxRetry:1, manifestLoadingRetryDelay:300, levelLoadingRetryDelay:300, fragLoadingRetryDelay:300, manifestLoadingTimeOut:4000, levelLoadingTimeOut:4000, fragLoadingTimeOut:4000, startLevel:-1, autoStartLoad:true, abrEwmaDefaultEstimate: 2000000, abrEwmaFastLive: 3, abrEwmaSlowLive: 9 };
      if(viaProxy){ hlsConfig.loader = ProxyLoader; }
      hls = new Hls(hlsConfig);
      hls.loadSource(url); hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, ()=>{ doPlay(); buildQualityMenu(); });
      hls.on(Hls.Events.LEVEL_SWITCHED, ()=>{ buildQualityMenu(); });
      hls.on(Hls.Events.ERROR, (e,data)=>{
        if(mySession !== playSession) return;
        if(!data.fatal) return;
        if(data.type===Hls.ErrorTypes.MEDIA_ERROR){ try{ hls.recoverMediaError(); }catch(err){} return; }
        tryNextServerOrFail();
      });
    } else if(video.canPlayType('application/vnd.apple.mpegurl')){ video.src=url; doPlay(); }
    else { showNoStreamState(); }
  } else { video.src=url; doPlay(); }
}
async function loadDASH(url, viaProxy, mySession){
  ensureVideo();
  if(!window.shaka){ showNoStreamState(); return; }
  if(shakaPlayer){ try{ await shakaPlayer.destroy(); }catch(e){} shakaPlayer = null; }
  if(mySession !== playSession) return;
  try{ shaka.Player.polyfill.installAll(); }catch(e){}
  shakaPlayer = new shaka.Player(video);
  try{
    shakaPlayer.configure({
      drm: (currentKid && currentKey) ? { clearKeys: { [currentKid]: currentKey } } : {},
      abr: { enabled: true, defaultBandwidthEstimate: 2000000, switchInterval: 4, bandwidthUpgradeTarget: 0.85, bandwidthDowngradeTarget: 0.95 },
      streaming: { bufferingGoal: 4, rebufferingGoal: 1, bufferBehind: 2, safeSeekOffset: 2, retryParameters: { timeout: 4000, maxAttempts: 1, baseDelay: 200, backoffFactor: 1, fuzzFactor: 0 }, smallGapLimit: 0.5, jumpLargeGaps: true },
      manifest: { retryParameters: { timeout: 4000, maxAttempts: 1, baseDelay: 200, backoffFactor: 1, fuzzFactor: 0 } }
    });
  }catch(e){}
  if(viaProxy){
    try{
      shakaPlayer.getNetworkingEngine().registerRequestFilter((type, request)=>{
        if(request.uris && request.uris[0] && !request.uris[0].startsWith(PROXY)){
          request.uris[0] = makeProxyUrl(request.uris[0]);
        }
      });
    }catch(e){}
  }
  shakaPlayer.addEventListener('error', ()=>{ if(mySession === playSession) tryNextServerOrFail(); });
  shakaPlayer.addEventListener('adaptation', ()=>{ buildQualityMenu(); });
  try{
    await shakaPlayer.load(url);
    if(mySession === playSession){ doPlay(); buildQualityMenu(); }
  }catch(e){
    if(mySession === playSession) tryNextServerOrFail();
  }
}
function playServer(idx){
  if(!SERVER_LIST[idx]) return;
  everPlayed = false;
  CURRENT_SERVER_IDX = idx;
  streamSource = SERVER_LIST[idx].url;
  currentKid = SERVER_LIST[idx].kid || currentKid || '';
  currentKey = SERVER_LIST[idx].key || currentKey || '';
  triedProxyForThisServer = true;
  updateServerUI(idx, -1);
  showLoader();
  loadStream(streamSource, false);
}
window.playServer = playServer;
muteBtnEl.addEventListener('click', (e)=>{
  e.stopPropagation(); if(!video) return; video.muted = !video.muted; if(!video.muted){ video.volume=1; video.play().catch(()=>{}); } updateMuteBtn(); showControls();
});
playBtn.addEventListener('click',(e)=>{ e.stopPropagation(); if(!video) return; if(video.paused){ video.muted=false; video.volume=1; video.play(); updateMuteBtn(); } else { video.pause(); } showControls(); });
fsBtn.addEventListener('click',(e)=>{ e.stopPropagation(); toggleFullscreen(); showControls(); });
async function loadSuggestions(){
  const grid = document.getElementById('suggestGrid');
  const myCat = getCategory(currentName, currentGroup);
  const mySrc = (srcParam || '').toLowerCase();
  const titleEl = document.getElementById('suggestTitle');
  if(isLiveSports()){
    if(titleEl) titleEl.textContent = 'Extra Server দেখো';
    grid.classList.add('server-row');
    let stored = null;
    try{ stored = JSON.parse(localStorage.getItem('rslive_sports_match')||'null'); }catch(e){}
    let jsonServers = [];
    if(stored && stored.streams && stored.streams.length && stored.name === currentName){
      jsonServers = stored.streams.map((s)=>({ name: currentName, url: s.stream_url || s.url || '', logo:'', group:'Events', src:'Server', kid: s.kid || '', key: s.key || '' })).filter(x=>x.url);
    }
    let playlistServers = [];
    try{
      let list = await fetchAllPlaylistChannels();
      const clean = (s)=> cleanName(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');
      const myClean = clean(currentName);
      let parts = currentName.split(/vs/i).map(p=>clean(p)).filter(p=>p.length>3);
      playlistServers = list.filter(c=>{
        let cn = clean(c.name);
        if(cn === myClean) return true;
        if(parts.length===2 && (cn.includes(parts[0]) || cn.includes(parts[1]))) return true;
        return false;
      });
    }catch(e){}
    let seen = new Set();
    SERVER_LIST = [...jsonServers, ...playlistServers].filter(s=>{
      if(!s.url || seen.has(s.url)) return false;
      seen.add(s.url); return true;
    });
    if(streamSource && !SERVER_LIST.find(s=>s.url===streamSource)){
      SERVER_LIST.unshift({name:currentName, url:streamSource, logo:'', group:currentGroup, src:srcParam, kid: currentKid || '', key: currentKey || ''});
    }
    CURRENT_SERVER_IDX = 0;
    triedProxyForThisServer = true;
    if(!SERVER_LIST.length){
      grid.innerHTML = `<div style="flex:0 0 100%;text-align:center;font-size:12px;color:#888;padding:10px">এই ম্যাচে আর Server নাই</div>`;
      return;
    }
    SERVER_LIST = await sortServersBySpeed(SERVER_LIST);
    if(SERVER_LIST.length && !currentKid && SERVER_LIST[0].kid){
      currentKid = SERVER_LIST[0].kid || '';
      currentKey = SERVER_LIST[0].key || '';
    }
    if(!streamSource){
      streamSource = SERVER_LIST[0].url;
      currentKid = SERVER_LIST[0].kid || currentKid || '';
      currentKey = SERVER_LIST[0].key || currentKey || '';
    } else {
      let found = SERVER_LIST.findIndex(s=>s.url===streamSource);
      CURRENT_SERVER_IDX = found >= 0 ? found : 0;
      if(found >= 0){ currentKid = SERVER_LIST[found].kid || currentKid || ''; currentKey = SERVER_LIST[found].key || currentKey || ''; }
    }
    grid.innerHTML = SERVER_LIST.map((c,i)=>`<div class="server-chip ${i===CURRENT_SERVER_IDX?'playing':''}" id="server-${i}" onclick="playServer(${i})"><div class="sv-name">Server ${i+1}</div><div class="sv-sub" id="server-sub-${i}">${i===CURRENT_SERVER_IDX?'▶ PLAYING':'TAP TO PLAY'}</div></div>`).join("");
    if(!everPlayed && !video?.src){
      showLoader();
      loadStream(streamSource, false);
    }
    return;
  }
  grid.classList.remove('server-row');
  if(titleEl){
    let label = myCat === 'sports' ? 'Sports' : myCat === 'news' ? 'News' : myCat === 'movies' ? 'Movies' : myCat === 'kids' ? 'Kids' : myCat === 'music' ? 'Music' : myCat === 'bangla' ? 'Bangla' : myCat === 'entertainment' ? 'Entertainment' : 'একই ক্যাটাগরি';
    titleEl.textContent = 'আরো ' + label + ' দেখো';
  }
  try{
    let list = await fetchAllPlaylistChannels();
    let filtered = list.filter(c=>c.url !== streamSource && c.name.toLowerCase() !== currentName.toLowerCase());
    let sameBoth = filtered.filter(c => c.src.toLowerCase() === mySrc && getCategory(c.name, c.group) === myCat);
    let samePlaylist = filtered.filter(c => c.src.toLowerCase() === mySrc && getCategory(c.name, c.group) !== myCat);
    let sameCat = filtered.filter(c => c.src.toLowerCase() !== mySrc && getCategory(c.name, c.group) === myCat);
    const show = [...shuffle(sameBoth), ...shuffle(samePlaylist), ...shuffle(sameCat)].slice(0,20);
    if(show.length===0) throw new Error('empty');
    grid.innerHTML = show.map(c=>`<div class="sug-card" title="${cleanName(c.name)}" onclick="openSuggest('${encodeURIComponent(c.url)}','${encodeURIComponent(c.name)}','${c.src}','${encodeURIComponent(c.group)}')"><img src="${c.logo || 'https://cdn-icons-png.flaticon.com/512/1179/1179069.png'}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/1179/1179069.png'"><div class="sug-txt"><p>${cleanName(c.name)}</p><small>LIVE • HD</small></div><div class="sug-play">▶</div></div>`).join("");
  }catch(e){ grid.innerHTML = `<div style="flex:0 0 100%;text-align:center;font-size:12px;color:#888;padding:10px">এই ক্যাটাগরিতে আর চ্যানেল নাই - <a href="index.html" style="color:#a78bfa">সব চ্যানেল দেখো</a></div>`; }
}
function openSuggest(urlEnc, nameEnc, src, groupEnc){ const url = decodeURIComponent(urlEnc); window.location.href = `player.html?url=${encodeURIComponent(url)}&name=${nameEnc}&src=${encodeURIComponent(src||'')}&group=${groupEnc||''}&t=${Date.now()}`; }
loadSuggestions();
ensureVideo();
if(streamSource){
  loadStream(streamSource, false);
} else {
  showLoader();
}
</script>
