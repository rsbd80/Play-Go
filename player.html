<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Play Go - Player</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;600;700&family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg-1:#0a0a12;--bg-2:#14101f;--grad-a:#22d3ee;--grad-b:#a78bfa;--grad-c:#fb923c;--warn:#ffb84d;--alert:#ff5d5d;--text:#eef0f7;--text-dim:#7a7a92;--font:'Poppins','Hind Siliguri','Segoe UI',sans-serif;--mono:'JetBrains Mono','Courier New',monospace}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;background:#07070f;font-family:var(--font)}
body{padding:0}
/* ✅ হেডার - Back বাটন বাদ */
.topbar{position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:12px;padding:12px 14px;background:rgba(10,10,20,.95);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.08);overflow:hidden}
.topbar::before{content:"";position:absolute;top:-50px;left:-20px;width:180px;height:100px;background:radial-gradient(circle,rgba(34,211,238,.25),transparent 70%);filter:blur(10px);pointer-events:none}
.topbar::after{content:"";position:absolute;top:-50px;right:-20px;width:180px;height:100px;background:radial-gradient(circle,rgba(167,139,250,.28),transparent 70%);filter:blur(10px);pointer-events:none}
.brand{display:flex;align-items:center;gap:9px;position:relative;z-index:2;flex-shrink:0}
.brand .play-ico{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#22d3ee,#a78bfa,#ff5d8f);display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;box-shadow:0 4px 16px rgba(167,139,250,.5)}
.brand-text{line-height:1}
.brand-text .pg{font-size:17px;font-weight:900;letter-spacing:.3px;color:#fff!important;-webkit-text-fill-color:#fff!important}
.brand-text .pg i{font-style:normal;background:linear-gradient(90deg,#22d3ee,#a78bfa,#ff5d8f);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.brand-text .tag{font-size:8px;letter-spacing:2.5px;color:#9a9ab5;font-weight:700;margin-top:2px}
.divider{width:1px;height:32px;background:rgba(255,255,255,.12);flex-shrink:0;position:relative;z-index:2}
#chName{font-weight:700;font-size:14px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative;z-index:2}
#chSub{font-size:10px;color:#888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative;z-index:2}
#chSub b{color:#7CFC00}
.live-pill{margin-left:auto;display:flex;align-items:center;gap:6px;background:rgba(255,45,85,.14);border:1px solid rgba(255,45,85,.35);color:#ff6b81;font-size:10px;font-weight:800;letter-spacing:1px;padding:6px 10px;border-radius:20px;flex-shrink:0;position:relative;z-index:2}
.live-pill i{width:7px;height:7px;background:#ff2d55;border-radius:50%;box-shadow:0 0 0 0 rgba(255,45,85,.7);animation:pulseDot 1.4s infinite}
@keyframes pulseDot{0%{box-shadow:0 0 0 0 rgba(255,45,85,.7)}70%{box-shadow:0 0 0 7px rgba(255,45,85,0)}100%{box-shadow:0 0 0 0 rgba(255,45,85,0)}}
#player-wrapper{position:relative;width:100%;aspect-ratio:16/9;background:#000;overflow:hidden}
#player-wrapper:fullscreen{width:100vw;height:100vh;aspect-ratio:auto}
#player-wrapper:fullscreen #player{width:100vw!important;height:100vh!important}
#player-wrapper:fullscreen #player video{object-fit:fill!important}
#player{position:absolute;inset:0;width:100%!important;height:100%!important}
#player video{width:100%!important;height:100%!important;object-fit:contain!important;background:#000}
video::-webkit-media-controls{display:none!important}
#loader{position:absolute;inset:0;background:radial-gradient(80% 60% at 50% 40%,var(--bg-2) 0%,var(--bg-1) 70%);display:flex;justify-content:center;align-items:center;flex-direction:column;z-index:99;transition:opacity .1s ease,visibility .1s ease;pointer-events:none}
#loader.hide-now{opacity:0!important;visibility:hidden!important;pointer-events:none!important}
.tuner{display:flex;flex-direction:column;align-items:center;gap:20px}
.tv-wrap{position:relative;width:78px;height:78px;display:flex;align-items:center;justify-content:center}
.tv-glow{position:absolute;width:100%;height:100%;border-radius:50%;background:radial-gradient(circle,rgba(167,139,250,.35),transparent 70%);animation:glow-pulse 2.4s ease-in-out infinite}
@keyframes glow-pulse{0%,100%{transform:scale(.85);opacity:.5}50%{transform:scale(1.15);opacity:1}}
.tv-icon{position:relative;width:60px;height:60px}
.tv-icon .tv-body{fill:none;stroke:var(--text);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tv-icon .screen-bars rect{transform-origin:bottom;animation:bar-flicker 1.6s ease-in-out infinite}
.tv-icon .screen-bars rect:nth-child(1){fill:var(--grad-a);animation-delay:-1.2s}.tv-icon .screen-bars rect:nth-child(2){fill:var(--grad-b);animation-delay:-.9s}.tv-icon .screen-bars rect:nth-child(3){fill:var(--grad-c);animation-delay:-.6s}.tv-icon .screen-bars rect:nth-child(4){fill:var(--grad-b);animation-delay:-.3s}.tv-icon .screen-bars rect:nth-child(5){fill:var(--grad-a);animation-delay:0s}
@keyframes bar-flicker{0%,100%{transform:scaleY(.45);opacity:.65}50%{transform:scaleY(1);opacity:1}}
.brand-name{font-size:18px;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:#fff}
.brand-name b{color:#fff}
.brand-name i{font-style:normal;background:linear-gradient(90deg,var(--grad-a),var(--grad-b),#ff5d8f);-webkit-background-clip:text;background-clip:text;color:transparent}
.dots{display:flex;gap:6px}.dots span{width:6px;height:6px;border-radius:50%;background:var(--grad-b);animation:dot-pulse 1.2s ease-in-out infinite}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes dot-pulse{0%,80%,100%{transform:scale(.6);opacity:.35}40%{transform:scale(1);opacity:1}}
.status-line{font-family:var(--mono);font-size:9.5px;letter-spacing:2.5px;color:var(--text-dim);text-transform:uppercase}
.state-content{text-align:center;color:var(--text);z-index:100;padding:0 24px;pointer-events:auto}
.state-content .glyph{font-size:34px;color:var(--alert);margin-bottom:14px}
.state-content .glyph.warn{color:var(--warn)}
.state-content p.title{font-size:13px;letter-spacing:1px;font-weight:600}
.state-content p.sub{font-family:var(--mono);font-size:10.5px;color:var(--text-dim);margin-top:8px;max-width:280px;overflow-wrap:anywhere}
.state-content .brand-name{display:block;margin-top:18px}
.retry-btn{margin-top:16px;padding:8px 20px;font-weight:600;font-size:11px;color:#0a0a12;background:linear-gradient(90deg,var(--grad-a),var(--grad-b));border:none;border-radius:18px;cursor:pointer}
#controls{position:absolute;bottom:0;left:0;right:0;z-index:50;display:flex;align-items:center;gap:10px;padding:14px 14px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(0deg,rgba(0,0,0,.85),transparent);opacity:0;transition:opacity .3s}
#player-wrapper.show-controls #controls{opacity:1}
#controls button{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);color:#fff;width:42px;height:42px;border-radius:50%;font-size:16px;cursor:pointer;backdrop-filter:blur(5px)}
#seek{flex:1;-webkit-appearance:none;height:4px;background:rgba(255,255,255,.3);border-radius:4px;outline:none}
#seek::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--grad-b);cursor:pointer}
#time-label{font-family:var(--mono);font-size:11px;color:#fff;white-space:nowrap}
/* ✅ সাজেশন - ছোট + ১ লাইনে স্ক্রল + লেখা সাদা */
.suggest{margin:12px 0 0}
.suggest-head{display:flex;align-items:center;justify-content:space-between;margin:0 14px 8px}
.suggest-head h3{font-size:13px;font-weight:800;display:flex;align-items:center;gap:6px;color:#fff!important}
.suggest-head h3 span{font-size:14px}
.suggest-head a{font-size:11px;color:#a78bfa;text-decoration:none;font-weight:700}
.suggest-grid{display:flex;gap:9px;overflow-x:auto;padding:0 14px 6px;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.suggest-grid::-webkit-scrollbar{display:none}
.sug-card{flex:0 0 72px;scroll-snap-align:start;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:8px 4px 7px;text-align:center;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.sug-card:active{transform:scale(.93);border-color:#a78bfa}
.sug-card img{width:38px;height:38px;object-fit:contain;background:#fff;border-radius:10px;padding:3px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.sug-card p{font-size:11px;font-weight:600;margin-top:6px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff!important;font-family:'Hind Siliguri',sans-serif}
.sug-skel{flex:0 0 72px;height:70px;border-radius:14px;background:#15151f;position:relative;overflow:hidden}
.sug-skel::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent);animation:shimmer 1.2s infinite}
@keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.ad-wrap{margin:12px 14px 0;background:#111118;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:10px 10px 12px;overflow:hidden}
.ad-label{font-size:9px;letter-spacing:2.5px;color:#777;text-align:center;margin-bottom:10px;font-family:var(--mono)}
.ad-box{border-radius:10px;overflow:hidden;background:#0a0a12;display:flex;justify-content:center}
#container-cdeccdd75d3e2e6916a42ce9653cfb08{width:100%!important;max-width:100%!important}
.ad-note{text-align:center;font-size:11px;color:#666;margin:12px 0 20px}
.ad-note b{color:#a78bfa}
</style>
</head>
<body>
<!-- ✅ হেডার - Back বাটন বাদ -->
<div class="topbar">
<div class="brand"><div class="play-ico">▶</div><div class="brand-text"><div class="pg">Play <i>Go</i></div><div class="tag">LIVE TV</div></div></div>
<div class="divider"></div>
<div style="min-width:0;flex:1"><div id="chName">Play Go</div><div id="chSub">● <b>Now Playing</b> • HD Live</div></div>
<div class="live-pill"><i></i> LIVE</div>
</div>

<div id="player-wrapper">
<div id="loader">
<div class="tuner">
<div class="tv-wrap"><div class="tv-glow"></div>
<svg class="tv-icon" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"><path class="tv-body" d="M22 12 32 20 42 12"/><clipPath id="screenClip"><rect x="12" y="20" width="40" height="26" rx="4"/></clipPath><g class="screen-bars" clip-path="url(#screenClip)"><rect x="12" y="20" width="8" height="26"/><rect x="20" y="20" width="8" height="26"/><rect x="28" y="20" width="8" height="26"/><rect x="36" y="20" width="8" height="26"/><rect x="44" y="20" width="8" height="26"/></g><rect class="tv-body" x="12" y="20" width="40" height="26" rx="4"/><line class="tv-body" x1="24" y1="46" x2="24" y2="50"/><line class="tv-body" x1="40" y1="46" x2="40" y2="50"/><line class="tv-body" x1="20" y1="50" x2="44" y2="50"/></svg>
</div>
<div class="brand-name"><b>Play</b> <i>Go</i></div>
<div class="dots"><span></span><span></span><span></span></div>
<div class="status-line" id="status-line">LOADING</div>
</div>
</div>
<div id="player"></div>
<div id="controls"><button id="playBtn">▶</button><input type="range" id="seek" value="0" min="0" max="100"><span id="time-label">LIVE</span><button id="fsBtn">⛶</button></div>
</div>

<div class="suggest">
<div class="suggest-head"><h3><span>🔥</span> তুমি আরো দেখতে পারো</h3><a href="index.html">সব দেখো →</a></div>
<div class="suggest-grid" id="suggestGrid">
<div class="sug-skel"></div><div class="sug-skel"></div><div class="sug-skel"></div><div class="sug-skel"></div><div class="sug-skel"></div>
</div>
</div>

<div class="ad-wrap">
<div class="ad-label">ADVERTISEMENT</div>
<div class="ad-box">
<div id="container-cdeccdd75d3e2e6916a42ce9653cfb08"></div>
</div>
</div>
<div class="ad-note">তুমি দেখছো <b id="chName2">Play Go</b> • কোনো সমস্যা হলে টেলিগ্রামে জানাও</div>

<script async="async" data-cfasync="false" src="https://czernik.org/21/cdeccdd75d3e2e6916a42ce9653cfb08"></script>

<script>
const urlParams = new URLSearchParams(window.location.search);
let streamSource = urlParams.get('url') || '';
try{ streamSource = decodeURIComponent(streamSource); }catch(e){}
const chNameParam = urlParams.get('name') || '';
let currentName = '';
try{ if(chNameParam){ const decodedName = decodeURIComponent(chNameParam); currentName = decodedName; document.getElementById('chName').textContent = decodedName; document.getElementById('chName2').textContent = decodedName; document.title = decodedName + ' - Play Go'; } }catch(e){}
const startMuted = urlParams.get('mute') === '1';
const loaderEl = document.getElementById('loader');
const statusEl = document.getElementById('status-line');
const wrapper = document.getElementById('player-wrapper');
const playBtn = document.getElementById('playBtn');
const fsBtn = document.getElementById('fsBtn');
const statusMessages = ['LOADING','CONNECTING','BUFFERING'];
let statusIdx = 0;
let statusTimer = setInterval(()=>{ if(loaderEl.classList.contains('hide-now')) return; statusIdx=(statusIdx+1)%statusMessages.length; statusEl.textContent=statusMessages[statusIdx]; },1800);
function showLoader(){ loaderEl.classList.remove('hide-now'); }
function hideLoader(){ loaderEl.classList.add('hide-now'); }
function showState(html){ clearInterval(statusTimer); loaderEl.innerHTML=html; showLoader(); }
function brandBlock(){ return `<div class="brand-name"><b>Play</b> <i>Go</i></div>`; }
let wakeLock=null,wakeLockWanted=false;
async function requestWakeLock(){ wakeLockWanted=true; if(!('wakeLock' in navigator))return; if(wakeLock)return; if(document.visibilityState!=='visible')return; try{ wakeLock=await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release',()=>{wakeLock=null;}); }catch(e){ wakeLock=null; } }
async function releaseWakeLock(){ wakeLockWanted=false; if(wakeLock){ try{await wakeLock.release();}catch(e){} wakeLock=null; } }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&wakeLockWanted) requestWakeLock(); });
let hideCtrlTimer=null;
function showControls(){ wrapper.classList.add('show-controls'); clearTimeout(hideCtrlTimer); hideCtrlTimer=setTimeout(()=>wrapper.classList.remove('show-controls'),3000); }
wrapper.addEventListener('click',showControls); wrapper.addEventListener('touchstart',showControls,{passive:true}); wrapper.addEventListener('mousemove',showControls);
function cleanName(name){
  return name.replace(/\(.*?\)/g,'').replace(/\[.*?\]/g,'').replace(/HD|FHD|4K|1080p|720p/gi,'').replace(/\s+/g,' ').trim();
}
async function loadSuggestions(){
  const grid = document.getElementById('suggestGrid');
  const popularNames = ['T Sports','BTV','NTV','Channel i','Somoy','Jamuna','Maasranga','Star Jalsha','Zee Bangla','Sony','Star Plus','Colors','Gazi TV','DBC','Independent','ATN Bangla'];
  try{
    const res = await fetch("/proxy?url=" + encodeURIComponent("https://iptv-org.github.io/iptv/countries/bd.m3u"));
    const text = await res.text();
    const lines = text.split("\n"); let list=[]; let cur=null;
    for(let line of lines){ line=line.trim(); if(line.startsWith("#EXTINF")){ const name=line.split(",").pop().trim(); const logoMatch=line.match(/tvg-logo="([^"]+)"/); const groupMatch=line.match(/group-title="([^"]+)"/); cur={name,logo:logoMatch?logoMatch[1]:"",group:groupMatch?groupMatch[1]:"General"}; } else if(line.startsWith("http") && cur){ cur.url=line; if(cur.name&&cur.url) list.push(cur); cur=null; } }
    let filtered = list.filter(c=>c.url !== streamSource && c.name.toLowerCase() !== currentName.toLowerCase());
    filtered.sort((a,b)=>{
      const ai = popularNames.findIndex(n=>a.name.toLowerCase().includes(n.toLowerCase()));
      const bi = popularNames.findIndex(n=>b.name.toLowerCase().includes(n.toLowerCase()));
      if(ai!==-1 && bi!==-1) return ai-bi;
      if(ai!==-1) return -1;
      if(bi!==-1) return 1;
      return 0;
    });
    const show = filtered.slice(0,20);
    if(show.length===0) throw new Error('empty');
    grid.innerHTML = show.map(c=>`
      <div class="sug-card" onclick="openSuggest('${encodeURIComponent(c.url)}','${encodeURIComponent(c.name)}')">
        <img src="${c.logo || 'https://cdn-icons-png.flaticon.com/512/1179/1179069.png'}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/1179/1179069.png'">
        <p>${cleanName(c.name)}</p>
      </div>
    `).join("");
  }catch(e){
    grid.innerHTML = `<div style="flex:0 0 100%;text-align:center;font-size:12px;color:#888;padding:10px">সাজেশন লোড হচ্ছে না - <a href="index.html" style="color:#a78bfa">সব চ্যানেল দেখো</a></div>`;
  }
}
function openSuggest(urlEnc, nameEnc){
  const url = decodeURIComponent(urlEnc);
  window.location.href = `player.html?url=${encodeURIComponent(url)}&name=${nameEnc}`;
}
loadSuggestions();
if(!streamSource){
  showState(`<div class="state-content"><div class="glyph warn"><i>&#9888;</i></div><p class="title">No stream URL supplied</p><p class="sub">Add ?url=YOUR_STREAM_LINK to this page's address.</p>${brandBlock()}</div>`);
} else {
  const video = document.createElement('video');
  video.setAttribute('playsinline',''); video.setAttribute('webkit-playsinline','');
  video.muted = startMuted; video.autoplay = true; video.controls = false;
  video.style.cssText='width:100%;height:100%;object-fit:contain;background:#000';
  document.getElementById('player').appendChild(video);
  let hls=null, everPlayed=false, retryCount=0; const maxRetries=6;
  function doPlay(){ video.play().then(()=>{ hideLoader(); everPlayed=true; requestWakeLock(); }).catch(()=>{}); }
  function loadStream(url){
    if(hls){ try{hls.destroy();}catch(e){} hls=null; }
    video.removeAttribute('src'); video.load();
    if(url.includes('.m3u8') || url.includes('m3u8')){
      if(window.Hls && Hls.isSupported()){
        hls = new Hls({ maxBufferLength:30, maxMaxBufferLength:60, enableWorker:true, lowLatencyMode:true, manifestLoadingMaxRetry:3, levelLoadingMaxRetry:4, fragLoadingMaxRetry:4 });
        hls.loadSource(url); hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, ()=>{ doPlay(); });
        hls.on(Hls.Events.ERROR, (e,data)=>{ if(!data.fatal) return; if(data.type===Hls.ErrorTypes.NETWORK_ERROR){ hls.startLoad(); } else if(data.type===Hls.ErrorTypes.MEDIA_ERROR){ hls.recoverMediaError(); } else { tryReconnect(url); } });
      } else if(video.canPlayType('application/vnd.apple.mpegurl')){ video.src=url; doPlay(); } else { showNoStreamState({message:'Browser HLS support নেই'}); }
    } else if(url.includes('.mpd')){ showNoStreamState({message:'DASH লিংক এই প্লেয়ারে সাপোর্ট করে না, M3U8 লিংক ইউজ করো'}); } else { video.src=url; doPlay(); }
  }
  function tryReconnect(baseUrl){ if(retryCount>=maxRetries){ showNoStreamState({message:'The source could not be reached.'}); return; } retryCount++; statusEl.textContent='RECONNECTING ('+retryCount+'/'+maxRetries+')'; showLoader(); const sep = baseUrl.includes('?')?'&':'?'; const retryUrl = baseUrl + sep + '_rs=' + Date.now(); setTimeout(()=>loadStream(retryUrl), Math.min(1000*retryCount,4000)); }
  function showNoStreamState(err){ releaseWakeLock(); showState(`<div class="state-content"><div class="glyph"><i>&#10060;</i></div><p class="title">No streaming — this link won't play</p><p class="sub">${err&&err.message?err.message:'The source could not be reached.'}</p><button class="retry-btn" onclick="location.reload()">Retry</button>${brandBlock()}</div>`); }
  video.addEventListener('playing',()=>{ hideLoader(); everPlayed=true; retryCount=0; requestWakeLock(); });
  video.addEventListener('waiting',()=>{ if(!video.paused) showLoader(); });
  video.addEventListener('pause',()=>{ playBtn.textContent='▶'; releaseWakeLock(); });
  video.addEventListener('play',()=>{ playBtn.textContent='❚❚'; requestWakeLock(); });
  video.addEventListener('error',()=>{ if(!everPlayed) tryReconnect(streamSource); });
  playBtn.addEventListener('click',(e)=>{ e.stopPropagation(); if(video.paused){ video.play(); } else { video.pause(); } showControls(); });
  fsBtn.addEventListener('click',(e)=>{ e.stopPropagation(); if(document.fullscreenElement){ document.exitFullscreen(); } else { wrapper.requestFullscreen().catch(()=>{}); } showControls(); });
  async function lockLandscape(){ try{ if(screen.orientation&&screen.orientation.lock) await screen.orientation.lock('landscape'); }catch(e){} }
  function unlockLandscape(){ try{ if(screen.orientation&&screen.orientation.unlock) screen.orientation.unlock(); }catch(e){} }
  document.addEventListener('fullscreenchange',()=>{ if(document.fullscreenElement){ lockLandscape(); video.style.objectFit='fill'; } else { unlockLandscape(); video.style.objectFit='contain'; } });
  setTimeout(()=>{ if(!everPlayed && video.readyState===0){ tryReconnect(streamSource); } },25000);
  loadStream(streamSource);
}
</script>
</body>
</html>
