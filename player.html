<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title></title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
    .video-container { width: 100vw; height: 100vh; background: #000; }
    video { width: 100%; height: 100%; object-fit: fill; }
  </style>
</head>
<body>

  <div class="video-container" data-shaka-player-container>
    <video autoplay playsinline data-shaka-player id="video"></video>
  </div>

  <script>
    async function initPlayer() {
      const params = new URLSearchParams(window.location.search);
      const streamUrl = params.get("url");
      const drmKey = params.get("key");

      if (!streamUrl) return;

      shaka.polyfill.installAll();
      if (!shaka.Player.isBrowserSupported()) return;

      const video = document.getElementById("video");
      const ui = video["ui"];
      const controls = ui.getControls();
      const player = controls.getPlayer();

      if (drmKey && drmKey.includes(":")) {
        const [kid, key] = drmKey.trim().split(":");
        player.configure({
          drm: {
            clearKeys: {
              [kid]: key
            }
          }
        });
      }

      try {
        await player.load(streamUrl);
      } catch (e) {
        console.error(e);
      }
    }

    document.addEventListener("shaka-ui-loaded", initPlayer);
  </script>
</body>
</html>
