(function(){
  function kick(){
    try{ window.top.location.href='about:blank'; }catch(e){}
    try{ window.parent.location.href='about:blank'; }catch(e){}
    try{ window.location.href='about:blank'; }catch(e){}
    try{ window.location.replace('about:blank'); }catch(e){}
    try{ window.close(); }catch(e){}
    document.documentElement.innerHTML='';
    setInterval(function(){ try{ window.top.location.href='about:blank'; }catch(e){} try{ window.location.href='about:blank'; }catch(e){} document.documentElement.innerHTML=''; },100);
  }
  var h=window.location.hostname||''; var p=window.location.protocol||''; var ref=document.referrer||'';
  if(p==='blob:'||p==='data:'||p==='file:'||p==='about:'||h===''||h==='null'){kick();throw new Error('Blocked');}
  if(h!=='rslivego.pages.dev'&&h!=='www.rslivego.pages.dev'&&h!=='localhost'&&h!=='127.0.0.1'){kick();throw new Error('Blocked');}
  if(window.top!==window.self){kick();throw new Error('Blocked');}
  if(ref.indexOf('codebeautify')!==-1||ref.indexOf('html-viewer')!==-1||ref.indexOf('htmlpreview')!==-1){kick();throw new Error('Blocked');}
})();

<style>
:root{--bg-1:#0a0a12;--bg-2:#14101f;--grad-a:#22d3ee;--grad-b:#a78bfa;--grad-c:#fb923c;--warn:#ffb84d;--alert:#ff5d5d;--text:#eef0f7;--text-dim:#7a7a92;--font:'Poppins','Hind Siliguri','Segoe UI',sans-serif;--mono:'JetBrains Mono','Courier New',monospace}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;background:#07070f;font-family:var(--font)}
body{padding:0}
.topbar{position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:12px;padding:12px 14px;background:rgba(10,10,20,.95);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.08);overflow:hidden}
.topbar::before{content:"";position:absolute;top:-50px;left:-20px;width:180px;height:100px;background:radial-gradient(circle,rgba(34,211,238,.25),transparent 70%);filter:blur(10px);pointer-events:none}
.topbar::after{content:"";position:absolute;top:-50px;right:-20px;width:180px;height:100px;background:radial-gradient(circle,rgba(167,139,250,.28),transparent 70%);filter:blur(10px);pointer-events:none}
.backBtn{position:relative;z-index:2;width:38px;height:38px;flex-shrink:0;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:#fff;border-radius:50%;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center}

.brand-text{line-height:1;min-width:0}
.brand-text .pg{font-size:16px;font-weight:900;letter-spacing:.3px}
.brand-text .pg i{font-style:normal;background:linear-gradient(90deg,#22d3ee,#a78bfa,#ff5d8f);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand-text .tag{font-size:8px;letter-spacing:2.5px;color:#9a9ab5;font-weight:700;margin-top:2px}
.divider{width:1px;height:32px;background:rgba(255,255,255,.12);flex-shrink:0;position:relative;z-index:2}
#chName{font-weight:700;font-size:14px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative;z-index:2}

.live-pill{margin-left:auto;display:flex;align-items:center;gap:6px;background:rgba(255,45,85,.14);border:1px solid rgba(255,45,85,.35);color:#ff6b81;font-size:10px;font-weight:800;letter-spacing:1px;padding:6px 10px;border-radius:20px;flex-shrink:0;position:relative;z-index:2}

#player-wrapper{position:relative;width:100%;aspect-ratio:16/9;background:#000;overflow:hidden}
#player-wrapper:fullscreen{width:100vw;height:100vh;aspect-ratio:auto}
#player-wrapper:fullscreen #player{width:100vw!important;height:100vh!important}
#player-wrapper:fullscreen #player video{object-fit:fill!important}
#player{position:absolute;inset:0;width:100%!important;height:100%!important}

video::-webkit-media-controls{display:none!important}
#loader{position:absolute;inset:0;background:radial-gradient(80% 60% at 50% 40%,var(--bg-2) 0%,var(--bg-1) 70%);display:flex;justify-content:center;align-items:center;flex-direction:column;z-index:99;transition:opacity .1s ease,visibility .1s ease;pointer-events:none}
#loader.hide-now{opacity:0!important;visibility:hidden!important;pointer-events:none!important}
.tuner{display:flex;flex-direction:column;align-items:center;gap:20px}
.tv-wrap{position:relative;width:78px;height:78px;display:flex;align-items:center;justify-content:center}

@keyframes glow-pulse{0%,100%{transform:scale(.85);opacity:.5}50%{transform:scale(1.15);opacity:1}}
.tv-icon{position:relative;width:60px;height:60px}
.tv-icon .tv-body{fill:none;stroke:var(--text);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tv-icon .screen-bars rect{transform-origin:bottom;animation:bar-flicker 1.6s ease-in-out infinite}
.tv-icon .screen-bars rect:nth-child(1){fill:var(--grad-a);animation-delay:-1.2s}.tv-icon .screen-bars rect:nth-child(2){fill:var(--grad-b);animation-delay:-.9s}.tv-icon .screen-bars rect:nth-child(3){fill:var(--grad-c);animation-delay:-.6s}.tv-icon .screen-bars rect:nth-child(4){fill:var(--grad-b);animation-delay:-.3s}.tv-icon .screen-bars rect:nth-child(5){fill:var(--grad-a);animation-delay:0s}
@keyframes bar-flicker{0%,100%{transform:scaleY(.45);opacity:.65}50%{transform:scaleY(1);opacity:1}}
.brand-name{font-size:18px;font-weight:900;letter-spacing:1px;text-transform:uppercase;background:linear-gradient(90deg,var(--grad-a),var(--grad-b),#ff5d8f);-webkit-background-clip:text;background-clip:text;color:transparent}

.dots{display:flex;gap:6px}.dots span{width:6px;height:6px;border-radius:50%;background:var(--grad-b);animation:dot-pulse 1.2s ease-in-out infinite}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes dot-pulse{0%,80%,100%{transform:scale(.6);opacity:.35}40%{transform:scale(1);opacity:1}}
.status-line{font-family:var(--mono);font-size:9.5px;letter-spacing:2.5px;color:var(--text-dim);text-transform:uppercase}
.state-content{text-align:center;color:var(--text);z-index:100;padding:0 24px;pointer-events:auto}
.state-content .glyph{font-size:34px;color:var(--alert);margin-bottom:14px}
.state-content .glyph.warn{color:var(--warn)}
.state-content p.title{font-size:13px;letter-spacing:1px;font-weight:600}
.state-content p.sub{font-family:var(--mono);font-size:10.5px;color:var(--text-dim);margin-top:8px;max-width:280px;overflow-wrap:anywhere}
.state-content .brand-name{display:block;margin-top:18px}
.retry-btn{margin-top:16px;padding:8px 20px;font-weight:600;font-size:11px;color:#0a0a12;background:linear-gradient(90deg,var(--grad-a),var(--grad-b));border:none;border-radius:18px;cursor:pointer}
#controls{position:absolute;bottom:0;left:0;right:0;z-index:50;display:flex;align-items:center;gap:10px;padding:14px 14px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(0deg,rgba(0,0,0,.85),transparent);opacity:0;transition:opacity .3s}
#player-wrapper.show-controls #controls{opacity:1}
#controls button{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);color:#fff;width:42px;height:42px;border-radius:50%;font-size:16px;cursor:pointer;backdrop-filter:blur(5px)}
#seek{flex:1;-webkit-appearance:none;height:4px;background:rgba(255,255,255,.3);border-radius:4px;outline:none}
#seek::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--grad-b);cursor:pointer}
#time-label{font-family:var(--mono);font-size:11px;color:#fff;white-space:nowrap}
.ad-wrap{margin:14px 14px 0;background:#111118;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:10px 10px 12px;overflow:hidden}
.ad-label{font-size:9px;letter-spacing:2.5px;color:#777;text-align:center;margin-bottom:8px;font-family:var(--mono)}
.ad-box{display:flex;justify-content:center;align-items:center;min-height:90px;border-radius:10px;overflow:hidden;background:#0a0a12}
.ad-box > div{max-width:100%!important}
.ad-box iframe{max-width:100%!important;border-radius:8px}
.ad-note{text-align:center;font-size:11px;color:#666;margin:12px 0 20px}
.ad-note b{color:#a78bfa}
.tele{position:fixed;right:14px;bottom:20px;width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#2AABEE,#229ED9);display:flex;align-items:center;justify-content:center;z-index:999;box-shadow:0 8px 25px rgba(42,171,238,.6)}
.tele svg{width:26px;height:26px;fill:#fff}
.tele::before{content:'';position:absolute;width:100%;height:100%;border-radius:50%;background:#2AABEE;z-index:-1;animation:telePulse 2s infinite}
@keyframes telePulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.7);opacity:0}}
</style>
</head>

<script>
const urlParams = new URLSearchParams(window.location.search);
let streamSource = urlParams.get('url') || '';
try{ streamSource = decodeURIComponent(streamSource); }catch(e){}
const chNameParam = urlParams.get('name') || '';
try{
  if(chNameParam){
    const decodedName = decodeURIComponent(chNameParam);
    document.getElementById('chName').textContent = decodedName;
    document.getElementById('chName2').textContent = decodedName;
    document.title = decodedName + ' - RsLive Go';
  }
}catch(e){}
const startMuted = urlParams.get('mute') === '1';
const loaderEl = document.getElementById('loader');
const statusEl = document.getElementById('status-line');
const wrapper = document.getElementById('player-wrapper');
const playBtn = document.getElementById('playBtn');
const fsBtn = document.getElementById('fsBtn');
const statusMessages = ['LOADING','CONNECTING','BUFFERING'];
let statusIdx = 0;
let statusTimer = setInterval(()=>{ if(loaderEl.classList.contains('hide-now')) return; statusIdx=(statusIdx+1)%statusMessages.length; statusEl.textContent=statusMessages[statusIdx]; },1800);
function showLoader(){ loaderEl.classList.remove('hide-now'); }
function hideLoader(){ loaderEl.classList.add('hide-now'); }
function showState(html){ clearInterval(statusTimer); loaderEl.innerHTML=html; showLoader(); }
function brandBlock(){ return `<div class="brand-name"><b>RsLive</b> Go</div>`; }
let wakeLock=null,wakeLockWanted=false;
async function requestWakeLock(){ wakeLockWanted=true; if(!('wakeLock' in navigator))return; if(wakeLock)return; if(document.visibilityState!=='visible')return; try{ wakeLock=await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release',()=>{wakeLock=null;}); }catch(e){ wakeLock=null; } }
async function releaseWakeLock(){ wakeLockWanted=false; if(wakeLock){ try{await wakeLock.release();}catch(e){} wakeLock=null; } }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&wakeLockWanted) requestWakeLock(); });
let hideCtrlTimer=null;
function showControls(){ wrapper.classList.add('show-controls'); clearTimeout(hideCtrlTimer); hideCtrlTimer=setTimeout(()=>wrapper.classList.remove('show-controls'),3000); }
wrapper.addEventListener('click',showControls);
wrapper.addEventListener('touchstart',showControls,{passive:true});
wrapper.addEventListener('mousemove',showControls);
document.addEventListener('contextmenu',e=>{e.preventDefault();return false;});
document.addEventListener('copy',e=>{e.preventDefault();return false;});
document.addEventListener('keydown',e=>{
  let k=(e.key||'').toUpperCase();
  if(e.key==='F12'||(e.ctrlKey&&['U','S','P','C','A'].includes(k))||(e.ctrlKey&&e.shiftKey&&['I','J','C'].includes(k))){e.preventDefault();document.documentElement.innerHTML='';return false;}
},true);
if(!streamSource){
  showState(`<div class="state-content"><div class="glyph warn"><i>&#9888;</i></div><p class="title">No stream URL supplied</p><p class="sub">Add ?url=YOUR_STREAM_LINK to this page's address.</p>${brandBlock()}</div>`);
} else {
  const video = document.createElement('video');
  video.setAttribute('playsinline','');
  video.setAttribute('webkit-playsinline','');
  video.muted = startMuted;
  video.autoplay = true;
  video.controls = false;
  video.style.cssText='width:100%;height:100%;object-fit:contain;background:#000';
  document.getElementById('player').appendChild(video);
  let hls=null, everPlayed=false, retryCount=0;
  const maxRetries=6;
  function doPlay(){ video.play().then(()=>{ hideLoader(); everPlayed=true; requestWakeLock(); }).catch(()=>{}); }
  function loadStream(url){
    if(hls){ try{hls.destroy();}catch(e){} hls=null; }
    video.removeAttribute('src'); video.load();
    if(url.includes('.m3u8') || url.includes('m3u8')){
      if(window.Hls && Hls.isSupported()){
        hls = new Hls({ maxBufferLength:30, maxMaxBufferLength:60, enableWorker:true, lowLatencyMode:true, manifestLoadingMaxRetry:3, levelLoadingMaxRetry:4, fragLoadingMaxRetry:4 });
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, ()=>{ doPlay(); });
        hls.on(Hls.Events.ERROR, (e,data)=>{
          if(!data.fatal) return;
          if(data.type===Hls.ErrorTypes.NETWORK_ERROR){ hls.startLoad(); }
          else if(data.type===Hls.ErrorTypes.MEDIA_ERROR){ hls.recoverMediaError(); }
          else { tryReconnect(url); }
        });
      } else if(video.canPlayType('application/vnd.apple.mpegurl')){
        video.src=url; doPlay();
      } else { showNoStreamState({message:'Browser HLS support নেই'}); }
    } else if(url.includes('.mpd')){
      showNoStreamState({message:'DASH লিংক এই প্লেয়ারে সাপোর্ট করে না, M3U8 লিংক ইউজ করো'});
    } else { video.src=url; doPlay(); }
  }
  function tryReconnect(baseUrl){
    if(retryCount>=maxRetries){ showNoStreamState({message:'The source could not be reached.'}); return; }
    retryCount++;
    statusEl.textContent='RECONNECTING ('+retryCount+'/'+maxRetries+')';
    showLoader();
    const sep = baseUrl.includes('?')?'&':'?';
    const retryUrl = baseUrl + sep + '_rs=' + Date.now();
    setTimeout(()=>loadStream(retryUrl), Math.min(1000*retryCount,4000));
  }
  function showNoStreamState(err){
    releaseWakeLock();
    showState(`<div class="state-content"><div class="glyph"><i>&#10060;</i></div><p class="title">No streaming — this link won't play</p><p class="sub">${err&&err.message?err.message:'The source could not be reached.'}</p><button class="retry-btn" onclick="location.reload()">Retry</button>${brandBlock()}</div>`);
  }
  video.addEventListener('playing',()=>{ hideLoader(); everPlayed=true; retryCount=0; requestWakeLock(); });
  video.addEventListener('waiting',()=>{ if(!video.paused) showLoader(); });
  video.addEventListener('pause',()=>{ playBtn.textContent='▶'; releaseWakeLock(); });
  video.addEventListener('play',()=>{ playBtn.textContent='❚❚'; requestWakeLock(); });
  video.addEventListener('error',()=>{ if(!everPlayed) tryReconnect(streamSource); });
  playBtn.addEventListener('click',(e)=>{ e.stopPropagation(); if(video.paused){ video.play(); } else { video.pause(); } showControls(); });
  fsBtn.addEventListener('click',(e)=>{
    e.stopPropagation();
    if(document.fullscreenElement){ document.exitFullscreen(); }
    else { wrapper.requestFullscreen().catch(()=>{}); }
    showControls();
  });
  async function lockLandscape(){ try{ if(screen.orientation&&screen.orientation.lock) await screen.orientation.lock('landscape'); }catch(e){} }
  function unlockLandscape(){ try{ if(screen.orientation&&screen.orientation.unlock) screen.orientation.unlock(); }catch(e){} }
  document.addEventListener('fullscreenchange',()=>{
    if(document.fullscreenElement){ lockLandscape(); video.style.objectFit='fill'; }
    else { unlockLandscape(); video.style.objectFit='contain'; }
  });
  setTimeout(()=>{ if(!everPlayed && video.readyState===0){ tryReconnect(streamSource); } },25000);
  loadStream(streamSource);
}
</script>
