<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>RsLive Go - Player</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/shaka-player.compiled.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;600;700&family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg-1:#0a0a12;--bg-2:#14101f;--grad-a:#22d3ee;--grad-b:#a78bfa;--grad-c:#fb923c;--warn:#ffb84d;--alert:#ff5d5d;--text:#eef0f7;--text-dim:#7a7a92;--font:'Poppins','Hind Siliguri','Segoe UI',sans-serif;--mono:'JetBrains Mono','Courier New',monospace}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;background:#07070f;font-family:var(--font);overflow-x:hidden}
body{padding:0;background:radial-gradient(600px 300px at 50% -80px,rgba(167,139,250,.18),transparent 70%),radial-gradient(500px 250px at 100% 0%,rgba(34,211,238,.12),transparent 70%),#07070f;-webkit-user-select:none;user-select:none}
.topbar{position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:12px;padding:14px 14px 13px;background:#000;border-bottom:1px solid #ffffff14;overflow:hidden}
.topbar::before{content:"";position:absolute;inset:0;background:radial-gradient(220px 70px at 20% 0%,rgba(139,124,255,.22),transparent 70%),radial-gradient(220px 70px at 85% 0%,rgba(34,211,238,.14),transparent 70%);pointer-events:none}
.topbar::after{display:none}
.brand{display:flex;align-items:center;gap:9px;position:relative;z-index:2;flex-shrink:0;cursor:pointer}
.brand:active{transform:scale(.96)}
.brand .play-ico{width:24px;height:24px;border-radius:8px;background:linear-gradient(135deg,#22d3ee,#a78bfa,#ff5d8f);display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;box-shadow:0 5px 18px rgba(167,139,250,.55),inset 0 1px 0 rgba(255,255,255,.45);animation:logoFloat 3s ease-in-out infinite}
@keyframes logoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.brand-text{line-height:1}
.brand-text .pg{font-size:18px;font-weight:900;letter-spacing:.3px;color:#fff!important;-webkit-text-fill-color:#fff!important;text-shadow:0 2px 10px rgba(167,139,250,.35);white-space:nowrap}
.brand-text .pg i{font-style:normal;background:linear-gradient(90deg,#22d3ee,#a78bfa,#ff5d8f,#22d3ee);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:shine 3s linear infinite}
@keyframes shine{to{background-position:200% center}}
.brand-text .tag{font-size:8px;letter-spacing:2.8px;color:#9a9ab5;font-weight:700;margin-top:3px}
.divider{width:1px;height:34px;background:linear-gradient(180deg,transparent,rgba(255,255,255,.25),transparent);flex-shrink:0;position:relative;z-index:2}
#chName{font-weight:700;font-size:14.5px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative;z-index:2}
#chSub{font-size:10px;color:#888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative;z-index:2;margin-top:1px}
#chSub b{color:#7CFC00}
.live-pill{margin-left:auto;display:flex;align-items:center;gap:6px;background:rgba(255,45,85,.16);border:1px solid rgba(255,45,85,.40);color:#ff6b81;font-size:10px;font-weight:800;letter-spacing:1px;padding:6px 10px;border-radius:20px;flex-shrink:0;position:relative;z-index:2;box-shadow:0 0 16px rgba(255,45,85,.25)}
.live-pill i{width:6px;height:6px;background:#ff2d55;border-radius:50%;animation:pulseDot 1.4s infinite}
@keyframes pulseDot{0%{box-shadow:0 0 0 0 rgba(255,45,85,.7)}70%{box-shadow:0 0 0 7px rgba(255,45,85,0)}100%{box-shadow:0 0 0 0 rgba(255,45,85,0)}}
.main-layout{width:100%;display:block}
.player-col{width:100%}
#player-wrapper{position:relative;width:calc(100% - 24px);margin:12px auto 0;aspect-ratio:16/9;background:#000;overflow:hidden;border-radius:16px;border:1px solid rgba(255,255,255,.12);box-shadow:0 10px 36px rgba(0,0,0,.55),0 0 0 1px rgba(167,139,250,.12),0 0 32px rgba(167,139,250,.12);touch-action:manipulation}
#player-wrapper:fullscreen{width:100vw;height:100vh;margin:0;aspect-ratio:auto;border-radius:0;border:none;box-shadow:none}
#player-wrapper:fullscreen #player{width:100vw!important;height:100vh!important}
#player-wrapper:fullscreen #player video{object-fit:fill!important}
#player{position:absolute;inset:0;width:100%!important;height:100%!important;touch-action:manipulation}
#player video{width:100%!important;height:100%!important;object-fit:contain!important;background:#000;touch-action:manipulation}
video::-webkit-media-controls{display:none!important}
#loader{position:absolute;inset:0;background:radial-gradient(80% 60% at 50% 40%,var(--bg-2) 0%,var(--bg-1) 70%);display:flex;justify-content:center;align-items:center;flex-direction:column;z-index:99;transition:opacity .1s ease,visibility .1s ease;pointer-events:none}
#loader.hide-now{opacity:0!important;visibility:hidden!important;pointer-events:none!important}
.tuner{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;width:100%;margin:0 auto;padding:0}
.tv-wrap{position:relative;width:68px;height:68px;display:flex;align-items:center;justify-content:center;margin:0 auto;flex-shrink:0}
.tv-glow{position:absolute;width:100%;height:100%;border-radius:50%;background:radial-gradient(circle,rgba(167,139,250,.40),transparent 70%);animation:glow-pulse 2.4s ease-in-out infinite}
@keyframes glow-pulse{0%,100%{transform:scale(.85);opacity:.5}50%{transform:scale(1.15);opacity:1}}
.tv-icon{position:relative;width:56px;height:56px;filter:drop-shadow(0 6px 18px rgba(167,139,250,.35));display:block;margin:0 auto}
.tv-icon .tv-body{fill:none;stroke:var(--text);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tv-icon .screen-bars rect{transform-origin:bottom;animation:bar-flicker 1.6s ease-in-out infinite}
.tv-icon .screen-bars rect:nth-child(1){fill:var(--grad-a);animation-delay:-1.2s}
.tv-icon .screen-bars rect:nth-child(2){fill:var(--grad-b);animation-delay:-.9s}
.tv-icon .screen-bars rect:nth-child(3){fill:var(--grad-c);animation-delay:-.6s}
.tv-icon .screen-bars rect:nth-child(4){fill:var(--grad-b);animation-delay:-.3s}
.tv-icon .screen-bars rect:nth-child(5){fill:var(--grad-a);animation-delay:0s}
@keyframes bar-flicker{0%,100%{transform:scaleY(.45);opacity:.65}50%{transform:scaleY(1);opacity:1}}
.brand-name{font-size:18px;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;color:#fff;text-shadow:0 4px 20px rgba(167,139,250,.4);white-space:nowrap;text-align:center;margin:0;line-height:1}
.brand-name b{color:#fff}
.brand-name i{font-style:normal;background:linear-gradient(90deg,var(--grad-a),var(--grad-b),#ff5d8f);-webkit-background-clip:text;background-clip:text;color:transparent}
.dots{display:flex;gap:6px;justify-content:center;align-items:center;margin:2px 0 0}
.dots span{width:6px;height:6px;border-radius:50%;background:var(--grad-b);animation:dot-pulse 1.2s ease-in-out infinite;box-shadow:0 0 8px rgba(167,139,250,.7)}
.dots span:nth-child(2){animation-delay:.2s}
.dots span:nth-child(3){animation-delay:.4s}
@keyframes dot-pulse{0%,80%,100%{transform:scale(.6);opacity:.35}40%{transform:scale(1);opacity:1}}
.status-line{font-family:var(--mono);font-size:9.5px;letter-spacing:2.8px;color:var(--text-dim);text-transform:uppercase;text-align:center;margin:0;line-height:1}
.state-content{text-align:center;color:var(--text);z-index:100;padding:0 24px;pointer-events:auto;display:flex;flex-direction:column;align-items:center;justify-content:center}
.state-content .glyph{font-size:34px;color:var(--alert);margin-bottom:14px}
.state-content .glyph.warn{color:var(--warn)}
.state-content p.title{font-size:13px;letter-spacing:1px;font-weight:600}
.state-content p.sub{font-family:var(--mono);font-size:10.5px;color:var(--text-dim);margin-top:8px;max-width:280px;overflow-wrap:anywhere}
.state-content .brand-name{display:block;margin-top:18px}
.retry-btn{margin-top:16px;padding:10px 22px;font-weight:700;font-size:12px;color:#0a0a12;background:linear-gradient(90deg,var(--grad-a),var(--grad-b));border:none;border-radius:20px;cursor:pointer;box-shadow:0 6px 20px rgba(167,139,250,.4)}
.retry-btn2{margin-top:10px;padding:10px 22px;font-weight:700;font-size:12px;color:#fff;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:20px;cursor:pointer}
#tapPlay{position:absolute;inset:0;z-index:120;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:rgba(0,0,0,.55);backdrop-filter:blur(2px);cursor:pointer;text-align:center;padding:20px}
#tapPlay.show{display:flex}
#tapPlay .tp-btn{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#22d3ee,#a78bfa,#ff5d8f);display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;box-shadow:0 10px 30px rgba(167,139,250,.6);animation:tpPulse 1.6s infinite}
@keyframes tpPulse{0%{box-shadow:0 0 0 0 rgba(167,139,250,.6)}70%{box-shadow:0 0 0 18px rgba(167,139,250,0)}100%{box-shadow:0 0 0 0 rgba(167,139,250,0)}}
#tapPlay p{font-size:14px;font-weight:700;color:#fff}
#tapPlay small{font-size:11px;color:#ccc}
#controls{position:absolute;bottom:0;left:0;right:0;z-index:50;display:flex;align-items:center;gap:8px;padding:14px 12px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(0deg,rgba(0,0,0,.88),transparent);opacity:0;transition:opacity .3s;touch-action:manipulation}
#player-wrapper.show-controls #controls{opacity:1}
#controls button{background:rgba(255,255,255,.16)!important;border:1px solid rgba(255,255,255,.28)!important;color:#fff!important;width:38px!important;height:38px!important;border-radius:50%;font-size:13px!important;cursor:pointer;backdrop-filter:blur(8px);box-shadow:0 4px 14px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;flex-shrink:0}
#controls button:active{transform:scale(.90)}
#controls button.active-low{background:rgba(255,255,255,.25)!important;border-color:#fff!important}
#controls .ctrl-ico{width:17px!important;height:17px!important;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
#seek{-webkit-appearance:none;appearance:none;flex:1;height:5px;background:rgba(255,255,255,.30);border-radius:5px;outline:none;min-width:0}
#seek::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid #fff;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.6)}
#time-label{font-family:var(--mono);font-size:11px;font-weight:800;letter-spacing:1px;color:#ff2d55!important;white-space:nowrap;background:rgba(255,255,255,.12)!important;border:1px solid rgba(255,255,255,.25)!important;padding:5px 10px;border-radius:10px}
#lowBadge{display:none;font-size:8px;font-weight:800;letter-spacing:1px;color:#fff;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.4);padding:3px 6px;border-radius:99px;white-space:nowrap}
#settingsBtn{color:#fff!important;font-size:12px!important}
#settingsBtn .sig-ico{width:18px!important;height:18px!important;display:block;fill:#fff}
#qualityMenu{position:absolute;bottom:56px;right:10px;z-index:80;display:none;background:rgba(20,20,20,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:6px;width:170px;max-height:220px;overflow-y:auto;box-shadow:0 10px 30px rgba(0,0,0,.6)}
#qualityMenu.show{display:block}
#player-wrapper:not(.show-controls) #qualityMenu{display:none!important}
#qualityMenu .q-head{display:flex;align-items:center;gap:5px;font-size:9px;letter-spacing:1.5px;color:#fff;padding:4px 6px 6px;position:sticky;top:0;background:rgba(20,20,20,.92)}
#qualityMenu .q-head .sig-ico{width:11px;height:11px;fill:#fff;display:block}
#qualityMenu button{width:100%!important;height:30px!important;border-radius:7px!important;padding:5px 10px!important;display:flex!important;flex-direction:row!important;align-items:center!important;justify-content:space-between!important;margin-bottom:2px!important;background:transparent!important;border:1px solid transparent!important;color:#fff!important;box-shadow:none!important;flex-shrink:0}
#qualityMenu button .q-main{font-size:11.5px!important;font-weight:700;color:#fff}
#qualityMenu button .q-tick{font-size:12px;color:#fff;opacity:0}
#qualityMenu button.sel{background:rgba(255,255,255,.12)!important;border:1px solid rgba(255,255,255,.35)!important}
#qualityMenu button.sel .q-main{color:#fff}
#qualityMenu button.sel .q-tick{opacity:1}
.suggest{margin:16px 0 0;width:100%;overflow:hidden}
.suggest-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 14px 12px;width:100%;box-sizing:border-box}
.suggest-head h3{font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px;color:#fff!important;margin:0;line-height:1;letter-spacing:.2px;white-space:nowrap}
.suggest-head h3 .suggest-ico{width:20px;height:20px;flex-shrink:0;background:rgba(255,138,0,.15);border:1px solid rgba(255,138,0,.35);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px}
.suggest-head h3 #suggestTitle{width:auto;height:auto;background:none!important;border:none!important;border-radius:0!important;box-shadow:none!important;display:inline;flex-shrink:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.suggest-head a{font-size:14px;font-weight:800;flex-shrink:0;display:flex;align-items:center;justify-content:center;gap:7px;height:32px;padding:0 2px;background:none!important;border:none!important;box-shadow:none!important;color:#fff!important;line-height:1;white-space:nowrap;text-decoration:none}
.suggest-head a .arrow-ico{width:18px;height:18px;flex-shrink:0;border-radius:50%;background:linear-gradient(135deg,#22d3ee 0%,#a78bfa 50%,#ff5d8f 100%);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(167,139,250,.55),inset 0 1px 0 rgba(255,255,255,.5);animation:arrowNudge 1.8s ease-in-out infinite}
.suggest-head a .arrow-ico svg{width:10px;height:10px;fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
@keyframes arrowNudge{0%,100%{transform:translateX(0)}50%{transform:translateX(3px)}}
.suggest-head a:active{transform:scale(.94);opacity:.8}
.suggest-grid{display:flex;gap:10px;overflow-x:auto;padding:4px 14px 10px;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;align-items:stretch}
.suggest-grid::-webkit-scrollbar{display:none}
.sug-card{flex:0 0 86px;width:86px;height:104px;scroll-snap-align:start;background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:10px 6px 8px;text-align:center;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.35);transition:.2s;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;overflow:hidden;flex-shrink:0}
.sug-card:hover{border-color:#a78bfa;transform:translateY(-3px);box-shadow:0 12px 24px rgba(167,139,250,.30)}
.sug-card:active{transform:scale(.93);border-color:#a78bfa}
.sug-card img{width:44px;height:44px;min-height:44px;object-fit:contain;background:#fff;border-radius:12px;padding:4px;box-shadow:0 4px 12px rgba(0,0,0,.35);pointer-events:none;flex-shrink:0}
.sug-card p{font-size:11.5px;font-weight:600;margin-top:8px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;color:#fff!important;font-family:'Hind Siliguri',sans-serif}
.sug-card small{display:block;font-size:8.5px;color:#22d3ee;letter-spacing:1px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.sug-skel{flex:0 0 86px;width:86px;height:104px;border-radius:18px;background:#15151f;position:relative;overflow:hidden;flex-shrink:0}
.sug-skel::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent);animation:shimmer 1.2s infinite}
@keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.ad-wrap{margin:14px 14px 0;background:linear-gradient(180deg,#14141f,#111118);border:1px solid rgba(255,255,255,.09);border-radius:18px;padding:12px 12px 14px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.30)}
.ad-label{font-size:9px;letter-spacing:3px;color:#777;text-align:center;margin-bottom:10px;font-family:var(--mono)}
.ad-box{border-radius:12px;overflow:hidden;background:#0a0a12;display:flex;justify-content:center}
#container-cdeccdd75d3e2e6916a42ce9653cfb08{width:100%!important;max-width:100%!important}
.ad-note{text-align:center;font-size:11px;color:#666;margin:14px 0 22px}
.ad-note b{color:#a78bfa}
@media(min-width:900px){.main-layout{display:flex;gap:16px;align-items:flex-start;padding:0 14px;max-width:1400px;margin:0 auto}.player-col{flex:1;min-width:0}#player-wrapper{width:100%;margin:12px 0 0}.suggest{width:330px;flex-shrink:0;margin:12px 0 0;background:#111118;border:1px solid rgba(255,255,255,.09);border-radius:18px;padding:12px 0 8px;position:sticky;top:62px;max-height:calc(100vh - 80px);display:flex;flex-direction:column}.suggest-head{padding:0 12px 12px}.suggest-head h3{font-size:13px}.suggest-head a{font-size:12px}.suggest-grid{display:flex;flex-direction:column;overflow-x:hidden;overflow-y:auto;padding:0 10px 10px;scroll-snap-type:none;gap:8px;flex:1}.suggest-grid::-webkit-scrollbar{display:block;width:5px}.suggest-grid::-webkit-scrollbar-thumb{background:#333;border-radius:10px}.sug-card{flex:none;width:100%;height:62px;flex-direction:row;align-items:center;justify-content:flex-start;text-align:left;padding:8px 10px;gap:10px;border-radius:14px}.sug-card:hover{transform:translateX(-3px)}.sug-card img{width:42px;height:42px;min-height:42px;margin:0}.sug-card .sug-txt{flex:1;min-width:0;text-align:left;display:flex;flex-direction:column;justify-content:center}.sug-card p{margin:0;font-size:13px;text-align:left}.sug-card small{margin-top:2px;font-size:10px;text-align:left}.sug-card .sug-play{width:22px;height:22px;flex-shrink:0;border-radius:50%;background:linear-gradient(135deg,#22d3ee,#a78bfa);display:flex;align-items:center;justify-content:center;font-size:8px;color:#fff}.sug-skel{flex:none;width:100%;height:62px}.ad-wrap{max-width:1400px;margin-left:auto;margin-right:auto}}
@media(min-width:1300px){.suggest{width:380px}}
</style>
</head>

async function loadStream(url,viaProxy){try{showLoader();tapPlayEl.classList.remove('show');await destroyCurrentPlayer();var isMPD=/\.mpd(?:$|[?#])/i.test(url)||/\.mpd/i.test(url);var isM3U8=/\.m3u8(?:$|[?#])/i.test(url)||/m3u8/i.test(url);activeFormat=isMPD?'MPD':isM3U8?'HLS':'VIDEO';if(isMPD){if(!window.shaka||!shaka.Player.isBrowserSupported()){showNoStreamState({message:'এই ব্রাউজারে MPD সাপোর্ট নেই'});return;}shaka.polyfill.installAll();shakaPlayer=new shaka.Player(video);window._shaka=shakaPlayer;if(isLowQuality()){shakaPlayer.configure({streaming:{bufferingGoal:8,rebufferingGoal:2,bufferBehind:8,retryParameters:{maxAttempts:4,baseDelay:1000,backoffFactor:2,fuzzFactor:0.5,timeout:30000}},abr:{restrictions:{maxBandwidth:800000,maxHeight:360}}});}else{shakaPlayer.configure({streaming:{bufferingGoal:30,rebufferingGoal:2,bufferBehind:30,retryParameters:{maxAttempts:4,baseDelay:1000,backoffFactor:2,fuzzFactor:0.5,timeout:30000}}});}shakaPlayer.addEventListener('error',function(event){var error=event.detail;if(!everPlayed){showNoStreamState({message:'MPD Error: '+(error.message||error.code||'Stream failed')});}});shakaPlayer.addEventListener('buffering',function(event){if(event.buffering&&!video.paused)showLoader();});await shakaPlayer.load(url);try{var tracks=shakaPlayer.getVariantTracks();var hs=[];tracks.forEach(function(tr){if(tr.height&&hs.indexOf(tr.height)===-1)hs.push(tr.height);});availableHeights=hs.sort(function(a,b){return b-a;});renderQualityList();applyQualityToPlayer();}catch(e){}doPlay();return;}if(isM3U8){if(window.Hls&&Hls.isSupported()){var hlsConfig={maxBufferLength:isLowQuality()?8:30,maxMaxBufferLength:isLowQuality()?12:60,enableWorker:false,lowLatencyMode:false,manifestLoadingMaxRetry:3,levelLoadingMaxRetry:4,fragLoadingMaxRetry:4,manifestLoadingRetryDelay:800,fragLoadingRetryDelay:800};if(viaProxy){hlsConfig.loader=Hls.DefaultConfig.loader;}hls=new Hls(hlsConfig);window._hls=hls;hls.loadSource(url);hls.attachMedia(video);hls.on(Hls.Events.MANIFEST_PARSED,function(){try{var hs2=[];hls.levels.forEach(function(lv){if(lv.height&&hs2.indexOf(lv.height)===-1)hs2.push(lv.height);});availableHeights=hs2.sort(function(a,b){return b-a;});renderQualityList();applyQualityToPlayer();}catch(e){}doPlay();});hls.on(Hls.Events.ERROR,function(e,data){if(!data.fatal)return;if(data.type===Hls.ErrorTypes.NETWORK_ERROR){if(!viaProxy&&canUseProxy&&!triedProxy){triedProxy=true;loadStream(makeProxyUrl(streamSource),true);}else if(viaProxy&&!triedDirect){triedDirect=true;loadStream(streamSource,false);}else{hls.startLoad();}}else if(data.type===Hls.ErrorTypes.MEDIA_ERROR){hls.recoverMediaError();}else{showNoStreamState({message:'HLS Error: '+data.details});}});}else if(video.canPlayType('application/vnd.apple.mpegurl')){video.src=url;doPlay();}else{showNoStreamState({message:'Browser HLS support নেই'});}return;}video.src=url;doPlay();}catch(error){showNoStreamState({message:error.message||'ভিডিও চালানো যাচ্ছে না'});}}
function showNoStreamState(err){releaseWakeLock();tapPlayEl.classList.remove('show');var proxyBtn='<br><button class="retry-btn2" onclick="tryProxyManually()">🌐 Proxy দিয়ে চেষ্টা করো</button>';var directBtn='<br><button class="retry-btn2" onclick="tryDirectManually()">📡 Direct দিয়ে চেষ্টা করো</button>';showState('<div class="state-content"><div class="glyph"><i>&#10060;</i></div><p class="title">এই চ্যানেলটা এখন চলছে না</p><p class="sub">'+(err&&err.message?err.message:'The source could not be reached.')+'</p><button class="retry-btn" onclick="location.reload()">🔄 Retry</button>'+proxyBtn+directBtn+'<br><button class="retry-btn2" onclick="location.href=\'index.html\'">🏠 হোমে যাও</button>'+brandBlock()+'</div>');}
window.tryProxyManually=function(){if(/\.mpd/i.test(streamSource)){showNoStreamState({message:'MPD Proxy এই প্লেয়ারে কনফিগার করা নেই। Direct লিংক ব্যবহার করো।'});return;}showLoader();loadStream(makeProxyUrl(streamSource),true);};
window.tryDirectManually=function(){showLoader();loadStream(streamSource,false);};
video.addEventListener('playing',function(){hideLoader();everPlayed=true;tapPlayEl.classList.remove('show');updateMuteBtn();requestWakeLock();});
video.addEventListener('waiting',function(){if(!video.paused)showLoader();});
video.addEventListener('canplay',function(){if(!video.paused)hideLoader();});
video.addEventListener('pause',function(){playBtn.textContent='▶';releaseWakeLock();});
video.addEventListener('play',function(){playBtn.textContent='❚❚';requestWakeLock();});
video.addEventListener('volumechange',function(){updateMuteBtn();});
video.addEventListener('webkitbeginfullscreen',function(){video.style.objectFit='fill';});
video.addEventListener('webkitendfullscreen',function(){video.style.objectFit='contain';});
video.addEventListener('error',function(){if(!everPlayed&&canUseProxy&&!triedProxy&&!/\.mpd/i.test(streamSource)){triedProxy=true;loadStream(makeProxyUrl(streamSource),true);}});
playBtn.addEventListener('click',function(e){e.stopPropagation();if(video.paused){video.muted=false;video.volume=1;video.play().catch(function(){tapPlayEl.classList.add('show');});updateMuteBtn();}else{video.pause();}showControls();});
fsBtn.addEventListener('click',function(e){e.stopPropagation();toggleFullscreen();showControls();});
if(isToffee){loadStream(makeProxyUrl(streamSource),true);}else{loadStream(streamSource,false);}
setTimeout(function(){if(!everPlayed&&!triedProxy&&canUseProxy&&!(/\.mpd/i.test(streamSource))){triedProxy=true;loadStream(makeProxyUrl(streamSource),true);}},6000);
}
</script>
<script>
// RsLive Go - SAFE KICK OUT - Mobile এ Kick করবে না
(function(){
  function kickOut(){
    try{ document.body.innerHTML=""; }catch(e){}
    try{ window.location.replace("about:blank"); setTimeout(()=>{ window.location.href="https://www.google.com"; },200); }catch(e){}
  }
  const isDesktop = window.innerWidth > 768 && !/Android|iPhone|iPad|Mobile/i.test(navigator.userAgent);
  if(!isDesktop) return;
  try{ if(window.top !== window.self) kickOut(); }catch(e){ kickOut(); }
  document.addEventListener('keydown', function(e){
    var k = e.key.toUpperCase();
    if(e.key==='F12' || (e.ctrlKey && ['U'].indexOf(k)!==-1) || (e.ctrlKey && e.shiftKey && ['I','J','C'].indexOf(k)!==-1)){
      e.preventDefault(); kickOut();
    }
  }, true);
})();
</script>
