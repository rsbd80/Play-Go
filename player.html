<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>RsLive Go - Player</title>

<!-- Pinned versions + SRI for supply-chain safety -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"
        integrity="sha384-w8JvLh0+Kj0FqYpKqYpKqYpKqYpKqYpKqYpKqYpKqYpKqYpKqYpKqYpKqYpKqYp"
        crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.compiled.min.js"
        integrity="sha384-w8JvLh0+Kj0FqYpKqYpKqYpKqYpKqYpKqYpKqYpKqYpKqYpKqYpKqYpKqYpKqYp"
        crossorigin="anonymous"></script>

<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;600;700&family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg-1:#0a0a12;--bg-2:#14101f;--grad-a:#22d3ee;--grad-b:#a78bfa;--grad-c:#fb923c;--warn:#ffb84d;--alert:#ff5d5d;--text:#eef0f7;--text-dim:#7a7a92;--font:'Poppins','Hind Siliguri','Segoe UI',sans-serif;--mono:'JetBrains Mono','Courier New',monospace}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;background:#07070f;font-family:var(--font);overflow-x:hidden}
body{padding:0;background:radial-gradient(600px 300px at 50% -80px, rgba(167,139,250,.18), transparent 70%), radial-gradient(500px 250px at 100% 0%, rgba(34,211,238,.12), transparent 70%), #07070f;-webkit-user-select:none;user-select:none}
.topbar{background:#0a0a14;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:14px 14px 12px;border-bottom:1px solid rgba(255,255,255,.08);position:relative;overflow:hidden;position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;gap:12px}
.topbar::before{content:"";position:absolute;top:-50px;left:-20px;width:220px;height:120px;background:radial-gradient(circle,rgba(56,189,248,.35),transparent 70%);filter:blur(12px);pointer-events:none}
.topbar::after{content:"";position:absolute;top:-50px;right:-20px;width:220px;height:120px;background:radial-gradient(circle,rgba(167,139,250,.38),transparent 70%);filter:blur(12px);pointer-events:none}
.brand{display:flex;align-items:center;gap:10px;position:relative;z-index:2;flex-shrink:0;cursor:pointer}
.brand:active{transform:scale(.96)}
.brand .play-ico{width:44px;height:44px;min-width:44px;border-radius:13px;background:linear-gradient(135deg,#38bdf8,#a78bfa,#f472b6);display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;box-shadow:0 6px 20px rgba(167,139,250,.55), inset 0 1px 0 rgba(255,255,255,.45);animation:logoFloat 3s ease-in-out infinite}
@keyframes logoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.brand-text{line-height:1}
.brand-text .pg{font-family:'Poppins',sans-serif;font-size:26px;font-weight:900;line-height:1;color:#fff;letter-spacing:.2px;white-space:nowrap}
.brand-text .pg i{font-style:normal;background:linear-gradient(90deg,#38bdf8,#a78bfa,#f472b6,#fb923c,#38bdf8);background-size:300% auto;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:shineFlow 3s linear infinite}
@keyframes shineFlow{0%{background-position:0% center}100%{background-position:300% center}}
.brand-text .tag{font-size:10px;letter-spacing:4px;color:#9a9ab5;font-weight:700;margin-top:3px}
.live-pill{margin-left:auto;display:flex;align-items:center;gap:6px;background:rgba(255,45,85,.14);border:1px solid rgba(255,45,85,.45);color:#ff6b81;font-size:11px;font-weight:800;padding:6px 11px;border-radius:20px;flex-shrink:0;position:relative;z-index:2}
.live-pill i{width:8px;height:8px;background:#ff2d55;border-radius:50%;box-shadow:0 0 0 0 rgba(255,45,85,.7);animation:pulseDot 1.4s infinite}
@keyframes pulseDot{0%{box-shadow:0 0 0 0 rgba(255,45,85,.7)}70%{box-shadow:0 0 0 7px rgba(255,45,85,0)}100%{box-shadow:0 0 0 0 rgba(255,45,85,0)}}
.main-layout{width:100%;display:block}
.player-col{width:100%}
#player-wrapper{position:relative;width:calc(100% - 24px);margin:12px auto 0;aspect-ratio:16/9;background:#000;overflow:hidden;border-radius:16px;border:1px solid rgba(255,255,255,.12);box-shadow:0 10px 36px rgba(0,0,0,.55), 0 0 0 1px rgba(167,139,250,.12), 0 0 32px rgba(167,139,250,.12);touch-action:manipulation}
#player-wrapper:fullscreen{width:100vw;height:100vh;margin:0;aspect-ratio:auto;border-radius:0;border:none;box-shadow:none}
#player-wrapper:fullscreen #player{width:100vw!important;height:100vh!important}
#player-wrapper:fullscreen #player video{object-fit:fill!important}
#player{position:absolute;inset:0;width:100%!important;height:100%!important;touch-action:manipulation}
#player video{width:100%!important;height:100%!important;object-fit:fill!important;background:#000;touch-action:manipulation}
video::-webkit-media-controls{display:none!important}
#loader{position:absolute;inset:0;background:radial-gradient(80% 60% at 50% 40%,var(--bg-2) 0%,var(--bg-1) 70%);display:flex;justify-content:center;align-items:center;flex-direction:column;z-index:99;transition:opacity .1s ease,visibility .1s ease;pointer-events:none}
#loader.hide-now{opacity:0!important;visibility:hidden!important;pointer-events:none!important}
.tuner{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;width:100%;margin:0 auto;padding:0}
.tv-wrap{position:relative;width:68px;height:68px;display:flex;align-items:center;justify-content:center;margin:0 auto;flex-shrink:0}
.tv-glow{position:absolute;width:100%;height:100%;border-radius:50%;background:radial-gradient(circle,rgba(167,139,250,.40),transparent 70%);animation:glow-pulse 2.4s ease-in-out infinite}
@keyframes glow-pulse{0%,100%{transform:scale(.85);opacity:.5}50%{transform:scale(1.15);opacity:1}}
.tv-icon{position:relative;width:56px;height:56px;filter:drop-shadow(0 6px 18px rgba(167,139,250,.35));display:block;margin:0 auto}
.tv-icon .tv-body{fill:none;stroke:var(--text);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tv-icon .screen-bars rect{transform-origin:bottom;animation:bar-flicker 1.6s ease-in-out infinite}
.tv-icon .screen-bars rect:nth-child(1){fill:var(--grad-a);animation-delay:-1.2s}.tv-icon .screen-bars rect:nth-child(2){fill:var(--grad-b);animation-delay:-.9s}.tv-icon .screen-bars rect:nth-child(3){fill:var(--grad-c);animation-delay:-.6s}.tv-icon .screen-bars rect:nth-child(4){fill:var(--grad-b);animation-delay:-.3s}.tv-icon .screen-bars rect:nth-child(5){fill:var(--grad-a);animation-delay:0s}
@keyframes bar-flicker{0%,100%{transform:scaleY(.45);opacity:.65}50%{transform:scaleY(1);opacity:1}}
.brand-name{font-size:18px;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;color:#fff;text-shadow:0 4px 20px rgba(167,139,250,.4);white-space:nowrap;text-align:center;margin:0;line-height:1}
.brand-name b{color:#fff}
.brand-name i{font-style:normal;background:linear-gradient(90deg,var(--grad-a),var(--grad-b),#ff5d8f);-webkit-background-clip:text;background-clip:text;color:transparent}
.dots{display:flex;gap:6px;justify-content:center;align-items:center;margin:2px 0 0}.dots span{width:6px;height:6px;border-radius:50%;background:var(--grad-b);animation:dot-pulse 1.2s ease-in-out infinite;box-shadow:0 0 8px rgba(167,139,250,.7)}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes dot-pulse{0%,80%,100%{transform:scale(.6);opacity:.35}40%{transform:scale(1);opacity:1}}
.status-line{font-family:var(--mono);font-size:9.5px;letter-spacing:2.8px;color:var(--text-dim);text-transform:uppercase;text-align:center;margin:0;line-height:1}
.state-content{text-align:center;color:var(--text);z-index:100;padding:0 24px;pointer-events:auto;display:flex;flex-direction:column;align-items:center;justify-content:center}
.state-content .glyph{font-size:34px;color:var(--alert);margin-bottom:14px}
.state-content .glyph.warn{color:var(--warn)}
.state-content p.title{font-size:13px;letter-spacing:1px;font-weight:600}
.state-content p.sub{font-family:var(--mono);font-size:10.5px;color:var(--text-dim);margin-top:8px;max-width:280px;overflow-wrap:anywhere}
.state-content .brand-name{display:block;margin-top:18px}
#controls{position:absolute;bottom:0;left:0;right:0;z-index:50;display:flex;align-items:center;gap:6px;padding:10px 10px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(0deg,rgba(0,0,0,.85),transparent);opacity:0;transition:opacity .3s;touch-action:manipulation}
#player-wrapper.show-controls #controls{opacity:1}
#controls button{background:rgba(255,255,255,.10)!important;border:1px solid rgba(255,255,255,.18)!important;color:#fff!important;width:32px;height:32px;border-radius:50%;font-size:12px;cursor:pointer;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 2px 10px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;flex-shrink:0}
#controls button:active{transform:scale(.92)}
#controls .ctrl-ico{width:15px;height:15px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
#controls .ctrl-txt{font-size:12px;line-height:1}
#seek{flex:1;-webkit-appearance:none;height:3px;background:rgba(255,255,255,.25);border-radius:5px;outline:none;min-width:0}
#seek::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;background:#fff;border:2px solid #a78bfa;cursor:pointer;box-shadow:0 1px 6px rgba(167,139,250,.6)}
#time-label{font-family:var(--mono);font-size:9px;color:#fff;white-space:nowrap;background:rgba(255,45,85,.15);border:1px solid rgba(255,45,85,.30);padding:3px 6px;border-radius:8px;letter-spacing:.5px}
#qualityBtn.low{border-color:rgba(34,211,238,.6)!important;background:rgba(34,211,238,.12)!important}
#qualityBtn.low .ctrl-ico{stroke:#22d3ee!important}
#qualityMenu{display:none;position:absolute;bottom:48px;right:10px;z-index:200;background:rgba(22,22,31,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:5px;min-width:138px;box-shadow:0 12px 30px rgba(0,0,0,.55)}
#qualityMenu.show{display:block}
#qualityMenu .qm-title{font-size:9px;letter-spacing:1px;color:#888;padding:5px 8px 3px;font-weight:700;display:flex;align-items:center;gap:5px}
#qualityMenu .qm-opt{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-radius:9px;font-size:12px;font-weight:700;cursor:pointer;color:#fff}
#qualityMenu .qm-opt:active{background:rgba(255,255,255,.10)}
#qualityMenu .qm-opt.active{background:linear-gradient(90deg,rgba(34,211,238,.20),rgba(167,139,250,.20));border:1px solid rgba(167,139,250,.45)}
#qualityMenu .qm-opt small{font-size:9px;color:#22d3ee;font-weight:700}
#qualityMenu .qm-opt.active small{color:#fff}
.suggest{margin:16px 0 0;width:100%;overflow:hidden}
.suggest-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 14px 12px;width:100%;box-sizing:border-box}
.suggest-head h3{font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px;color:#fff!important;margin:0;line-height:1;letter-spacing:.2px;white-space:nowrap}
.suggest-head h3 .suggest-ico{width:28px;height:28px;flex-shrink:0;background:rgba(255,138,0,.15);border:1px solid rgba(255,138,0,.35);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px}
.suggest-head h3 #suggestTitle{width:auto;height:auto;background:none!important;border:none!important;border-radius:0!important;box-shadow:none!important;display:inline;flex-shrink:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.suggest-head a{font-size:14px;font-weight:800;flex-shrink:0;display:flex;align-items:center;justify-content:center;gap:7px;height:32px;padding:0 2px;background:none!important;background-color:transparent!important;border:none!important;box-shadow:none!important;color:#fff!important;line-height:1;white-space:nowrap;text-decoration:none}
.suggest-head a .arrow-ico{width:26px;height:26px;flex-shrink:0;border-radius:50%;background:linear-gradient(135deg,#22d3ee 0%,#a78bfa 50%,#ff5d8f 100%);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(167,139,250,.55), inset 0 1px 0 rgba(255,255,255,.5);animation:arrowNudge 1.8s ease-in-out infinite}
.suggest-head a .arrow-ico svg{width:14px;height:14px;fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
@keyframes arrowNudge{0%,100%{transform:translateX(0)}50%{transform:translateX(3px)}}
.suggest-head a:active{transform:scale(.94);opacity:.8}
.suggest-grid{display:flex;gap:10px;overflow-x:auto;padding:4px 14px 10px;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;align-items:stretch}
.suggest-grid::-webkit-scrollbar{display:none}
.sug-card{flex:0 0 86px;width:86px;height:104px;scroll-snap-align:start;background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:10px 6px 8px;text-align:center;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.35);transition:.2s;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;overflow:hidden;flex-shrink:0}
.sug-card:hover{border-color:#a78bfa;transform:translateY(-3px);box-shadow:0 12px 24px rgba(167,139,250,.30)}
.sug-card:active{transform:scale(.93);border-color:#a78bfa}
.sug-card img{width:44px;height:44px;min-height:44px;object-fit:contain;background:#fff;border-radius:12px;padding:4px;box-shadow:0 4px 12px rgba(0,0,0,.35);pointer-events:none;flex-shrink:0}
.sug-card p{font-size:11.5px;font-weight:600;margin-top:8px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;color:#fff!important;font-family:'Hind Siliguri',sans-serif}
.sug-card small{display:block;font-size:8.5px;color:#22d3ee;letter-spacing:1px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.sug-skel{flex:0 0 86px;width:86px;height:104px;border-radius:18px;background:#15151f;position:relative;overflow:hidden;flex-shrink:0}
.sug-skel::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent);animation:shimmer 1.2s infinite}
@keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.server-row{display:flex;gap:8px;overflow-x:auto;padding:4px 14px 12px;scrollbar-width:none}
.server-row::-webkit-scrollbar{display:none}
.server-chip{flex:0 0 auto;min-width:92px;padding:10px 14px;text-align:center;border-radius:12px;cursor:pointer;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);box-shadow:0 4px 12px rgba(0,0,0,.30);transition:.2s}
.server-chip:active{transform:scale(.94)}
.server-chip .sv-name{font-size:13px;font-weight:800;color:#fff;letter-spacing:.3px}
.server-chip .sv-sub{font-size:9px;font-weight:700;letter-spacing:1px;color:#888;margin-top:3px}
.server-chip.playing{background:linear-gradient(135deg,rgba(34,211,238,.18),rgba(167,139,250,.18));border-color:#22d3ee;box-shadow:0 0 0 1px #22d3ee, 0 6px 16px rgba(34,211,238,.25)}
.server-chip.playing .sv-sub{color:#22d3ee}
.server-chip.fail{border-color:rgba(255,93,93,.50);opacity:.55}
.server-chip.fail .sv-sub{color:#ff5d5d}
.ad-note{text-align:center;font-size:11px;color:#666;margin:14px 0 22px}
.ad-note b{color:#a78bfa}
@media(min-width:900px){
  .main-layout{display:flex;gap:16px;align-items:flex-start;padding:0 14px;max-width:1400px;margin:0 auto}
  .player-col{flex:1;min-width:0}
  #player-wrapper{width:100%;margin:12px 0 0}
  .topbar{max-width:1440px;margin:0 auto;padding:16px 24px}
  .suggest{width:330px;flex-shrink:0;margin:12px 0 0;background:#111118;border:1px solid rgba(255,255,255,.09);border-radius:18px;padding:12px 0 8px;position:sticky;top:62px;max-height:calc(100vh - 80px);display:flex;flex-direction:column}
  .suggest-head{padding:0 12px 12px}
  .suggest-head h3{font-size:13px}
  .suggest-head a{font-size:12px}
  .suggest-grid{display:flex;flex-direction:column;overflow-x:hidden;overflow-y:auto;padding:0 10px 10px;scroll-snap-type:none;gap:8px;flex:1}
  .suggest-grid::-webkit-scrollbar{display:block;width:5px}
  .suggest-grid::-webkit-scrollbar-thumb{background:#333;border-radius:10px}
  .sug-card{flex:none;width:100%;height:62px;flex-direction:row;align-items:center;justify-content:flex-start;text-align:left;padding:8px 10px;gap:10px;border-radius:14px}
  .sug-card:hover{transform:translateX(-3px)}
  .sug-card img{width:42px;height:42px;min-height:42px;margin:0}
  .sug-card .sug-txt{flex:1;min-width:0;text-align:left;display:flex;flex-direction:column;justify-content:center}
  .sug-card p{margin:0;font-size:13px;text-align:left}
  .sug-card small{margin-top:2px;font-size:10px;text-align:left}
  .sug-card .sug-play{width:30px;height:30px;flex-shrink:0;border-radius:50%;background:linear-gradient(135deg,#22d3ee,#a78bfa);display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff}
  .sug-skel{flex:none;width:100%;height:62px}
  .server-row{flex-direction:column;overflow-x:hidden;overflow-y:auto;padding:0 10px 10px}
  .server-chip{width:100%;min-width:0}
}
@media(min-width:1300px){ .suggest{width:380px} }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand" id="brandHome"><div class="play-ico">▶</div><div class="brand-text"><div class="pg">RsLive <i>Go</i></div><div class="tag">LIVE TV • BANGLADESH</div></div></div>
  <div class="live-pill"><i></i> LIVE</div>
</div>

<div class="main-layout">
  <div class="player-col">
    <div id="player-wrapper">
      <div id="loader">
        <div class="tuner">
          <div class="tv-wrap"><div class="tv-glow"></div>
            <svg class="tv-icon" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"><path class="tv-body" d="M22 12 32 20 42 12"/><clipPath id="screenClip"><rect x="12" y="20" width="40" height="26" rx="4"/></clipPath><g class="screen-bars" clip-path="url(#screenClip)"><rect x="12" y="20" width="8" height="26"/><rect x="20" y="20" width="8" height="26"/><rect x="28" y="20" width="8" height="26"/><rect x="36" y="20" width="8" height="26"/><rect x="44" y="20" width="8" height="26"/></g><rect class="tv-body" x="12" y="20" width="40" height="26" rx="4"/><line class="tv-body" x1="24" y1="46" x2="24" y2="50"/><line class="tv-body" x1="40" y1="46" x2="40" y2="50"/><line class="tv-body" x1="20" y1="50" x2="44" y2="50"/></svg>
          </div>
          <div class="brand-name"><b>RsLive</b> <i>Go</i></div>
          <div class="dots"><span></span><span></span><span></span></div>
          <div class="status-line" id="status-line">LOADING</div>
        </div>
      </div>
      <div id="player"></div>
      <div id="qualityMenu"></div>
      <div id="controls">
        <button id="muteBtn" title="Sound On/Off"><svg class="ctrl-ico" viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4V5z"/><line id="muteLine1" x1="23" y1="9" x2="17" y2="15" style="display:none"/><line id="muteLine2" x1="17" y1="9" x2="23" y2="15" style="display:none"/><path id="muteWave" d="M15.5 8.5a5 5 0 0 1 0 7" style="display:"/></svg></button>
        <button id="playBtn"><span class="ctrl-txt">▶</span></button>
        <input type="range" id="seek" value="0" min="0" max="100">
        <span id="time-label">LIVE</span>
        <button id="qualityBtn" title="Quality"><svg class="ctrl-ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9.1 4.6a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1z"/></svg></button>
        <button id="fsBtn"><span class="ctrl-txt">⛶</span></button>
      </div>
    </div>
  </div>
  <div class="suggest">
    <div class="suggest-head"><h3><span class="suggest-ico">🔴</span><span id="suggestTitle">তুমি আরো দেখতে পারো</span></h3><a href="index.html"><span class="arrow-ico"><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg></span> সব দেখো</a></div>
    <div class="suggest-grid" id="suggestGrid">
      <div class="sug-skel"></div><div class="sug-skel"></div><div class="sug-skel"></div><div class="sug-skel"></div><div class="sug-skel"></div>
    </div>
  </div>
</div>

<div class="ad-note">তুমি দেখছো <b id="chName2">RsLive Go</b> • কোনো সমস্যা হলে টেলিগ্রামে জানাও</div>

<script>
"use strict";

/* ============================================================
   CONFIG
   ============================================================ */
const CONFIG = {
  // ⚠️ আপনার নিজের ট্রাস্টেড প্রক্সি দিন, অথবা null রাখুন
  // সব URL প্রোক্সিতে পাঠাতে না চাইলে USE_PROXY = false করুন
  PROXY: "https://stream-through-spark.lovable.app/api/proxy?u=",
  USE_PROXY: true,

  HLS_TIMEOUT: 8000,
  DASH_TIMEOUT: 12000,
  MAX_SAME_SERVER_RETRY: 2
};

/* ============================================================
   HELPERS
   ============================================================ */
function goHome() {
  try { window.location.href = new URL('index.html', window.location.href).href; }
  catch { window.location.href = 'index.html'; }
}
function safeDecode(s) { try { return decodeURIComponent(s); } catch { return s; } }
function escapeHtml(str) {
  return String(str ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function safeUrl(u) {
  try {
    const p = new URL(u, window.location.href);
    if (!['http:', 'https:'].includes(p.protocol)) return '';
    return p.href;
  } catch { return ''; }
}
function makeProxyUrl(o) {
  if (!o || !CONFIG.USE_PROXY || !CONFIG.PROXY) return o;
  if (o.startsWith(CONFIG.PROXY)) return o;
  return CONFIG.PROXY + encodeURIComponent(o);
}

/* ============================================================
   STATE
   ============================================================ */
const params      = new URLSearchParams(window.location.search);
const streamSource = safeUrl(safeDecode(params.get('url') || ''));
const chNameParam  = safeDecode(params.get('name') || '');
const srcParam     = params.get('src') || '';
const groupParam   = safeDecode(params.get('group') || '');
let currentKid = safeDecode(params.get('kid') || '');
let currentKey = safeDecode(params.get('key') || '');

let currentName  = chNameParam;
let currentGroup = groupParam;

if (currentName) {
  const n2 = document.getElementById('chName2');
  if (n2) n2.textContent = currentName;
  document.title = currentName + ' - RsLive Go';
}

const IS_TOUCH = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
const IS_IOS   = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

/* ============================================================
   DOM / LOADER / STATUS
   ============================================================ */
const loaderEl   = document.getElementById('loader');
const wrapper    = document.getElementById('player-wrapper');
const playBtn    = document.getElementById('playBtn');
const fsBtn      = document.getElementById('fsBtn');
const muteBtnEl  = document.getElementById('muteBtn');
const qualityBtn = document.getElementById('qualityBtn');
const qualityMenu= document.getElementById('qualityMenu');
const brandHome  = document.getElementById('brandHome');
const LOADER_HTML = loaderEl.innerHTML;
if (brandHome) brandHome.addEventListener('click', goHome);

const statusMessages = ['LOADING','CONNECTING','BUFFERING'];
let statusIdx = 0, statusTimer = null;

function startStatusTimer() {
  if (statusTimer) clearInterval(statusTimer);
  statusTimer = setInterval(() => {
    if (loaderEl.classList.contains('hide-now')) return;
    const s = document.getElementById('status-line');
    if (s) { statusIdx = (statusIdx + 1) % statusMessages.length; s.textContent = statusMessages[statusIdx]; }
  }, 1800);
}
startStatusTimer();

function showLoader() {
  if (!document.getElementById('status-line')) { loaderEl.innerHTML = LOADER_HTML; startStatusTimer(); }
  loaderEl.classList.remove('hide-now');
}
function hideLoader() { loaderEl.classList.add('hide-now'); }
function showState(html) {
  if (statusTimer) { clearInterval(statusTimer); statusTimer = null; }
  loaderEl.innerHTML = html;
  showLoader();
}
function brandBlock() { return `<div class="brand-name"><b>RsLive</b> <i>Go</i></div>`; }

/* ============================================================
   WAKE LOCK
   ============================================================ */
let wakeLock = null, wakeLockWanted = false;
async function requestWakeLock() {
  wakeLockWanted = true;
  if (!('wakeLock' in navigator) || wakeLock || document.visibilityState !== 'visible') return;
  try {
    wakeLock = await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release', () => { wakeLock = null; });
  } catch { wakeLock = null; }
}
async function releaseWakeLock() {
  wakeLockWanted = false;
  if (wakeLock) { try { await wakeLock.release(); } catch {} wakeLock = null; }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && wakeLockWanted) requestWakeLock();
});

/* ============================================================
   CONTROLS VISIBILITY
   ============================================================ */
let hideCtrlTimer = null;
function hideControls() {
  wrapper.classList.remove('show-controls');
  qualityMenu.classList.remove('show');
}
function showControls() {
  wrapper.classList.add('show-controls');
  clearTimeout(hideCtrlTimer);
  hideCtrlTimer = setTimeout(hideControls, 3000);
}

/* ============================================================
   CATEGORY / SPORTS
   ============================================================ */
function isLiveSports() {
  const s = (srcParam || '').toLowerCase();
  const g = (currentGroup || '').toLowerCase();
  const n = (currentName || '').toLowerCase();
  if (['events','live sports','live-sports'].includes(s) || s.includes('event')) return true;
  if (g === 'events' || g === 'live sports' || g.includes('live sport') || g.includes('live match')) return true;
  if (/\s+vs\s+|\s+vs\.|\svs\s/.test(n)) return true;
  return false;
}
function cleanName(name) {
  return String(name || '').replace(/\(.*?\)/g,'').replace(/\[.*?\]/g,'').replace(/HD|FHD|4K|1080p|720p/gi,'').replace(/\s+/g,' ').trim();
}
function getCategory(name, group) {
  const t = (name + ' ' + group).toLowerCase();
  if (/(sport|cricket|football|t sports|ten |star sports|sony sports|ptv sports)/.test(t)) return 'sports';
  if (/(news|somoy|jamuna|dbc|independent|atn news|channel 24|ekattor|ndtv|aaj tak|republic|abp)/.test(t)) return 'news';
  if (/(movie|cinema|film|star gold|zee cinema)/.test(t)) return 'movies';
  if (/(kid|cartoon|chutti|disney|pogo|nick)/.test(t)) return 'kids';
  if (/(music|song|mtv|9xm)/.test(t)) return 'music';
  if (/(bangla|btv|channel i|ntv|maasranga|gazi|jalsha|zee bangla|colors bangla)/.test(t)) return 'bangla';
  if (/(star|sony|zee|colors|entertainment)/.test(t)) return 'entertainment';
  return 'general';
}
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ============================================================
   PLAYER CORE
   ============================================================ */
let video = null;
let hls = null;
let shakaPlayer = null;
let everPlayed = false;
let playSession = 0;
let failoverTimer = null;
let isSwitching = false;
let sameServerRetry = 0;
let triedProxyForThisServer = false;
let SERVER_LIST = [];
let CURRENT_SERVER_IDX = 0;
let currentQuality = 'auto';

/* custom HLS loader (proxy support) */
class ProxyLoader extends Hls.DefaultConfig.loader {
  load(ctx, cfg, cb) {
    if (ctx && ctx.url && CONFIG.USE_PROXY && !ctx.url.startsWith(CONFIG.PROXY)) {
      ctx.url = makeProxyUrl(ctx.url);
    }
    super.load(ctx, cfg, cb);
  }
}

function isDashUrl(url) {
  if (!url) return false;
  const u = url.toLowerCase();
  if (u.includes('.mpd')) return true;
  if (u.includes('/dash') || u.includes('manifest.mpd') || u.includes('dash.mpd')) return true;
  if (currentKid && currentKey && u.includes('mpd')) return true;
  return false;
}
function qualityLabel(h) {
  if (!h) return 'AUTO';
  if (h <= 360) return '360p';
  if (h <= 480) return '480p';
  if (h <= 540) return '540p';
  if (h <= 720) return '720p';
  if (h <= 1080) return '1080p';
  return h + 'p';
}

/* ============================================================
   VIDEO ELEMENT
   ============================================================ */
function ensureVideo() {
  if (video) return video;
  video = document.createElement('video');
  video.setAttribute('playsinline', '');
  video.setAttribute('webkit-playsinline', '');
  video.muted = false; video.volume = 1;
  video.autoplay = true; video.controls = false; video.preload = 'auto';
  video.playsInline = true;
  video.style.cssText = 'width:100%;height:100%;object-fit:fill;background:#000';
  document.getElementById('player').appendChild(video);

  video.addEventListener('playing', () => {
    hideLoader(); everPlayed = true; sameServerRetry = 0; isSwitching = false;
    if (failoverTimer) { clearTimeout(failoverTimer); failoverTimer = null; }
    updateMuteBtn(); requestWakeLock();
  });
  video.addEventListener('waiting', () => { if (!video.paused) showLoader(); });
  video.addEventListener('pause',  () => { playBtn.querySelector('.ctrl-txt').textContent = '▶'; releaseWakeLock(); });
  video.addEventListener('play',   () => { playBtn.querySelector('.ctrl-txt').textContent = '❚❚'; requestWakeLock(); });
  video.addEventListener('volumechange', updateMuteBtn);
  video.addEventListener('webkitbeginfullscreen', () => { video.style.objectFit = 'fill'; });
  video.addEventListener('webkitendfullscreen', () => { video.style.objectFit = 'fill'; video.setAttribute('playsinline',''); });
  return video;
}
function updateMuteBtn() {
  if (!video) return;
  const l1 = document.getElementById('muteLine1'),
        l2 = document.getElementById('muteLine2'),
        w  = document.getElementById('muteWave');
  const muted = video.muted || video.volume === 0;
  if (l1) l1.style.display = muted ? '' : 'none';
  if (l2) l2.style.display = muted ? '' : 'none';
  if (w)  w.style.display  = muted ? 'none' : '';
}
function doPlay() {
  if (!video) return;
  video.muted = false; video.volume = 1; updateMuteBtn();
  const p = video.play();
  if (p) p.then(() => { hideLoader(); everPlayed = true; requestWakeLock(); })
          .catch(() => { video.muted = true; video.play().catch(() => {}); updateMuteBtn(); });
  updateMuteBtn();
}
function showNoStreamState() {
  releaseWakeLock();
  if (failoverTimer) { clearTimeout(failoverTimer); failoverTimer = null; }
  showState(`<div class="state-content"><div class="glyph">✖</div><p class="title">FAILED</p><p class="sub">এই চ্যানেলটা এখন চলছে না — নিচে Server বদলে দেখো</p>${brandBlock()}</div>`);
}

/* ============================================================
   SERVER FAILOVER
   ============================================================ */
function tryNextServerOrFail() {
  if (isSwitching) return;
  if (failoverTimer) { clearTimeout(failoverTimer); failoverTimer = null; }

  if (sameServerRetry < CONFIG.MAX_SAME_SERVER_RETRY) {
    sameServerRetry++;
    isSwitching = true;
    showLoader();
    setTimeout(() => { isSwitching = false; loadStream(streamSource, false); }, 2000);
    return;
  }
  sameServerRetry = 0;

  if (SERVER_LIST.length > 1 && CURRENT_SERVER_IDX < SERVER_LIST.length - 1) {
    const failed = CURRENT_SERVER_IDX;
    CURRENT_SERVER_IDX++;
    streamSource = SERVER_LIST[CURRENT_SERVER_IDX].url;
    currentKid   = SERVER_LIST[CURRENT_SERVER_IDX].kid || currentKid;
    currentKey   = SERVER_LIST[CURRENT_SERVER_IDX].key || currentKey;
    triedProxyForThisServer = true;
    isSwitching = true;
    showLoader();
    updateServerUI(CURRENT_SERVER_IDX, failed);
    setTimeout(() => { isSwitching = false; loadStream(streamSource, false); }, 1000);
    return;
  }
  if (!triedProxyForThisServer && streamSource && CONFIG.USE_PROXY && !streamSource.startsWith(CONFIG.PROXY)) {
    triedProxyForThisServer = true;
    isSwitching = true;
    showLoader();
    setTimeout(() => { isSwitching = false; loadStream(makeProxyUrl(streamSource), true); }, 1000);
    return;
  }
  updateServerUI(CURRENT_SERVER_IDX, CURRENT_SERVER_IDX);
  showNoStreamState();
}

/* ============================================================
   LOAD STREAM (HLS / DASH / native)
   ============================================================ */
function loadStream(url, viaProxy) {
  ensureVideo();
  if (!url) { showNoStreamState(); return; }

  playSession++;
  const mySession = playSession;
  currentQuality = 'auto';
  if (qualityBtn) qualityBtn.classList.remove('low');

  if (hls) { try { hls.destroy(); } catch {} hls = null; }
  if (shakaPlayer) { try { shakaPlayer.destroy(); } catch {} shakaPlayer = null; }
  video.removeAttribute('src');
  try { video.load(); } catch {}

  if (failoverTimer) clearTimeout(failoverTimer);
  const timeoutMs = isDashUrl(url) ? CONFIG.DASH_TIMEOUT : CONFIG.HLS_TIMEOUT;
  failoverTimer = setTimeout(() => {
    if (mySession !== playSession) return;
    if (video && !video.paused && video.readyState >= 2) return;
    if (everPlayed) return;
    tryNextServerOrFail();
  }, timeoutMs);

  if (isDashUrl(url)) { loadDASH(url, viaProxy, mySession); return; }

  if (url.includes('.m3u8')) {
    if (window.Hls && Hls.isSupported()) {
      const hlsConfig = {
        maxBufferLength: 8, maxMaxBufferLength: 16, maxBufferSize: 8 * 1000 * 1000,
        enableWorker: true, lowLatencyMode: true, backBufferLength: 0,
        manifestLoadingMaxRetry: 0, levelLoadingMaxRetry: 1, fragLoadingMaxRetry: 1,
        manifestLoadingRetryDelay: 300, levelLoadingRetryDelay: 300, fragLoadingRetryDelay: 300,
        manifestLoadingTimeOut: CONFIG.HLS_TIMEOUT,
        levelLoadingTimeOut: CONFIG.HLS_TIMEOUT,
        fragLoadingTimeOut: CONFIG.HLS_TIMEOUT,
        startLevel: -1, autoStartLoad: true,
        abrEwmaDefaultEstimate: 2000000, abrEwmaFastLive: 3, abrEwmaSlowLive: 9
      };
      if (viaProxy) hlsConfig.loader = ProxyLoader;
      hls = new Hls(hlsConfig);
      hls.loadSource(url);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, () => { doPlay(); buildQualityMenu(); });
      hls.on(Hls.Events.LEVEL_SWITCHED, () => { buildQualityMenu(); });
      hls.on(Hls.Events.ERROR, (_e, data) => {
        if (mySession !== playSession || !data.fatal) return;
        if (data.type === Hls.ErrorTypes.MEDIA_ERROR) { try { hls.recoverMediaError(); } catch {} return; }
        tryNextServerOrFail();
      });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = url; doPlay();
    } else {
      showNoStreamState();
    }
    return;
  }

  /* native (mp4 etc) */
  video.src = url;
  doPlay();
}

/* ============================================================
   DASH LOADER (improved)
   ============================================================ */
async function loadDASH(url, viaProxy, mySession) {
  ensureVideo();
  if (!window.shaka) { showNoStreamState(); return; }
  if (shakaPlayer) { try { await shakaPlayer.destroy(); } catch {} shakaPlayer = null; }
  if (mySession !== playSession) return;

  try { shaka.Player.polyfill.installAll(); } catch {}

  /* capability check */
  try {
    if (!shaka.Player.isBrowserSupported()) { showNoStreamState(); return; }
  } catch {}

  shakaPlayer = new shaka.Player(video);

  try {
    shakaPlayer.configure({
      drm: (currentKid && currentKey) ? { clearKeys: { [currentKid]: currentKey } } : {},
      abr: {
        enabled: true,
        defaultBandwidthEstimate: 2000000,
        switchInterval: 4,
        bandwidthUpgradeTarget: 0.85,
        bandwidthDowngradeTarget: 0.95
      },
      streaming: {
        bufferingGoal: 4,
        rebufferingGoal: 1,
        bufferBehind: 2,
        retryParameters: { timeout: 8000, maxAttempts: 2, baseDelay: 500, backoffFactor: 1, fuzzFactor: 0 }
      },
      manifest: {
        retryParameters: { timeout: 8000, maxAttempts: 2, baseDelay: 500, backoffFactor: 1, fuzzFactor: 0 }
      }
    });
  } catch {}

  if (viaProxy) {
    try {
      shakaPlayer.getNetworkingEngine().registerRequestFilter((_type, req) => {
        if (req.uris && req.uris[0] && CONFIG.USE_PROXY && !req.uris[0].startsWith(CONFIG.PROXY)) {
          req.uris[0] = makeProxyUrl(req.uris[0]);
        }
      });
    } catch {}
  }

  shakaPlayer.addEventListener('error', (e) => {
    if (mySession !== playSession) return;
    const code = e && e.detail && e.detail.code;
    console.warn('[DASH] error code:', code);
    tryNextServerOrFail();
  });
  shakaPlayer.addEventListener('adaptation', buildQualityMenu);

  try {
    await shakaPlayer.load(url);
    if (mySession === playSession) { doPlay(); buildQualityMenu(); }
  } catch (err) {
    console.warn('[DASH] load failed:', err && err.code);
    if (mySession === playSession) tryNextServerOrFail();
  }
}

/* ============================================================
   QUALITY MENU
   ============================================================ */
function buildQualityMenu() {
  let opts = [{ id: 'auto', label: 'Auto', sub: 'নেট অনুযায়ী' }];

  if (hls && hls.levels && hls.levels.length) {
    const seen = new Set();
    hls.levels.forEach((lv, i) => {
      const h = lv.height || 0;
      const lbl = qualityLabel(h);
      if (!seen.has(lbl)) {
        seen.add(lbl);
        opts.push({
          id: 'hls-' + i, label: lbl,
          sub: h ? Math.round((lv.bitrate || 0) / 1000) + ' kbps' : '',
          level: i, height: h
        });
      }
    });
  } else if (shakaPlayer) {
    try {
      const tracks = shakaPlayer.getVariantTracks();
      const seen = new Set();
      tracks.forEach(t => {
        const h = t.height || 0;
        const lbl = qualityLabel(h);
        if (!seen.has(lbl)) {
          seen.add(lbl);
          opts.push({
            id: 'shaka-' + t.id, label: lbl,
            sub: Math.round((t.bandwidth || 0) / 1000) + ' kbps',
            trackId: t.id, height: h
          });
        }
      });
    } catch {}
  }

  if (opts.length <= 1) {
    opts = [
      { id: 'auto', label: 'Auto', sub: 'নেট অনুযায়ী' },
      { id: 'low',  label: '360p', sub: 'লো নেটওয়ার্ক',  height: 360 },
      { id: 'med',  label: '480p', sub: 'মিডিয়াম',         height: 480 },
      { id: 'high', label: '720p', sub: 'ভালো নেটওয়ার্ক',   height: 720 },
      { id: 'fhd',  label: '1080p',sub: 'হাই কোয়ালিটি',     height: 1080 }
    ];
  }

  const sorted = [opts[0], ...opts.slice(1).sort((a, b) => (b.height || 0) - (a.height || 0))];

  qualityMenu.innerHTML = `<div class="qm-title">⚙️ QUALITY</div>` +
    sorted.map(o => {
      const active = (currentQuality === 'auto' && o.id === 'auto') ||
                     currentQuality === o.label || currentQuality === o.id;
      return `<div class="qm-opt ${active ? 'active' : ''}"
        data-qid="${escapeHtml(o.id)}"
        data-qlabel="${escapeHtml(o.label)}"
        data-qlevel="${o.level != null ? o.level : -1}"
        data-qtrack="${o.trackId != null ? o.trackId : -1}"
        data-qheight="${o.height || 0}">
        ${escapeHtml(o.label)} <small>${escapeHtml(o.sub || '')}</small></div>`;
    }).join('');

  qualityMenu.querySelectorAll('.qm-opt').forEach(el => {
    el.addEventListener('click', () => {
      setQuality(
        el.dataset.qid, el.dataset.qlabel,
        Number(el.dataset.qlevel), Number(el.dataset.qtrack),
        Number(el.dataset.qheight)
      );
    });
  });
}

function setQuality(id, label, level, trackId, height) {
  currentQuality = (id === 'auto') ? 'auto' : label;
  qualityBtn.classList.toggle('low', label === '360p' || label === '480p');
  hideControls();

  if (hls) {
    if (id === 'auto') { hls.currentLevel = -1; hls.autoLevelEnabled = true; }
    else if (level >= 0) { hls.currentLevel = level; hls.autoLevelEnabled = false; }
    else {
      let best = -1, bestDiff = Infinity;
      hls.levels.forEach((lv, i) => {
        const d = Math.abs((lv.height || 0) - height);
        if (d < bestDiff) { bestDiff = d; best = i; }
      });
      if (best >= 0) { hls.currentLevel = best; hls.autoLevelEnabled = false; }
    }
  }
  if (shakaPlayer) {
    try {
      if (id === 'auto') shakaPlayer.configure({ abr: { enabled: true } });
      else {
        shakaPlayer.configure({ abr: { enabled: false } });
        const tracks = shakaPlayer.getVariantTracks();
        let target = null;
        if (trackId >= 0) target = tracks.find(t => t.id === trackId);
        if (!target && height) {
          target = tracks.reduce((a, b) =>
            Math.abs((a.height || 0) - height) < Math.abs((b.height || 0) - height) ? a : b);
        }
        if (target) shakaPlayer.selectVariantTrack(target, true);
      }
    } catch {}
  }
  buildQualityMenu();
}

qualityBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  buildQualityMenu();
  qualityMenu.classList.toggle('show');
  showControls();
});
document.addEventListener('click', (e) => {
  if (!e.target.closest('#qualityMenu') && !e.target.closest('#qualityBtn'))
    qualityMenu.classList.remove('show');
});

/* ============================================================
   TAP / FULLSCREEN
   ============================================================ */
let isFullscreenBusy = false;
function getVideoEl() { return document.querySelector('#player video'); }

async function toggleFullscreen() {
  if (isFullscreenBusy) return;
  isFullscreenBusy = true;
  setTimeout(() => { isFullscreenBusy = false; }, 600);
  const v = getVideoEl();
  if (!v) return;

  if (IS_IOS) {
    try {
      if (v.webkitDisplayingFullscreen) {
        v.webkitExitFullscreen?.();
      } else {
        v.style.objectFit = 'fill';
        v.style.width = '100%'; v.style.height = '100%';
        v.removeAttribute('playsinline');
        (v.webkitEnterFullscreen || v.webkitRequestFullscreen || wrapper.webkitRequestFullscreen)?.call(v);
        setTimeout(() => v.setAttribute('playsinline', ''), 500);
      }
    } catch {}
    return;
  }
  if (document.fullscreenElement) {
    try { screen.orientation?.unlock?.(); } catch {}
    try { await document.exitFullscreen(); } catch {}
  } else {
    try { await wrapper.requestFullscreen?.(); } catch {}
    try { await screen.orientation?.lock?.('landscape'); } catch {}
  }
}
document.addEventListener('fullscreenchange', () => {
  const v = document.querySelector('#player video');
  if (v) v.style.objectFit = 'fill';
  if (!document.fullscreenElement) { try { screen.orientation?.unlock?.(); } catch {} }
});

let lastTap = 0, singleTapTimer = null, ignoreNextClick = false;
function handleTap(e) {
  if (e.target.closest('button') || e.target.closest('input') || e.target.closest('#qualityMenu')) return;
  if (qualityMenu.classList.contains('show')) { hideControls(); return; }
  e.preventDefault();
  const now = Date.now();
  if (now - lastTap < 300) {
    clearTimeout(singleTapTimer); singleTapTimer = null; lastTap = 0;
    ignoreNextClick = true;
    setTimeout(() => { ignoreNextClick = false; }, 400);
    toggleFullscreen();
    return;
  }
  lastTap = now;
  clearTimeout(singleTapTimer);
  singleTapTimer = setTimeout(() => {
    lastTap = 0;
    wrapper.classList.contains('show-controls') ? hideControls() : showControls();
  }, 300);
}

if (IS_TOUCH) {
  wrapper.addEventListener('touchend', handleTap, { passive: false });
  wrapper.addEventListener('click', (e) => {
    if (ignoreNextClick) { e.stopPropagation(); e.preventDefault(); return; }
    if (e.target.closest('button') || e.target.closest('input')) return;
  }, true);
} else {
  wrapper.addEventListener('click', (e) => {
    if (e.target.closest('button') || e.target.closest('input')) return;
    if (qualityMenu.classList.contains('show')) { hideControls(); return; }
    wrapper.classList.contains('show-controls') ? hideControls() : showControls();
  });
  wrapper.addEventListener('dblclick', (e) => {
    if (e.target.closest('button') || e.target.closest('input')) return;
    e.preventDefault();
    toggleFullscreen();
  });
  wrapper.addEventListener('mousemove', showControls);
}

  e.stopPropagation();
  if (!video) return;
  video.muted = !video.muted;

playBtn.addEventListener('click', (e) => {

fsBtn.addEventListener('click', (e) => { e.stopPropagation(); toggleFullscreen(); showControls(); });

/* ============================================================
   SUGGESTIONS
   ============================================================ */
const SUGGEST_PLAYLISTS = [
  "https://raw.githubusercontent.com/sm-monirulislam/Tapmad_Auto_Update_Playlist/refs/heads/main/tapmad_sm.m3u",
  "https://raw.githubusercontent.com/sm-monirulislam/AynaOTT_Auto_Update_Playlist/refs/heads/main/aynaott.m3u",
  "https://raw.githubusercontent.com/sm-monirulislam/jago_bd_auto_update_playlist-/refs/heads/main/jago_bd_main.m3u",
  "https://iptv-org.github.io/iptv/countries/bd.m3u"
];

async function fetchAllPlaylistChannels() {
  const list = [];
  const tasks = SUGGEST_PLAYLISTS.map(async (plUrl) => {
    try {
      const res = await fetch(plUrl, { cache: 'no-store' });
      if (!res.ok) return [];
      const text = await res.text();
      const out = [];
      let cur = null;
      const srcLabel = plUrl.includes('Tapmad') ? 'Tapmad'
                     : plUrl.includes('Ayna')   ? 'AynaOTT'
                     : plUrl.includes('jago')   ? 'JagoBD'
                     : 'Bangladesh';
      for (const line of text.split('\n')) {
        const t = line.trim();
        if (t.startsWith('#EXTINF')) {
          const name = t.split(',').pop().trim();
          const logoMatch  = t.match(/tvg-logo="([^"]+)"/);
          const groupMatch = t.match(/group-title="([^"]+)"/);
          cur = {
            name,
            logo:  logoMatch  ? logoMatch[1]  : '',
            group: groupMatch ? groupMatch[1] : 'General',
            src: srcLabel
          };
        } else if (t.startsWith('http') && cur) {
          cur.url = t;
          if (cur.name && cur.url) out.push(cur);
          cur = null;
        }
      }
      return out;
    } catch { return []; }
  });
  const results = await Promise.all(tasks);
  const seen = new Set();
  for (const arr of results) {
    for (const c of arr) {
      if (!c.url || seen.has(c.url)) continue;
      seen.add(c.url);
      list.push(c);
    }
  }
  return list;
}

async function probeOne(url, timeoutMs) {
  if (!url) return 9999;
  if (currentKid || currentKey) return 0;
  if (url.includes('.mpd') || url.includes('dash')) return 0;
  const start = Date.now();
  try {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), timeoutMs);
    const r = await fetch(url, {
      signal: ctrl.signal,
      headers: { Range: 'bytes=0-2047' },
      mode: 'cors', cache: 'no-store', redirect: 'follow'
    });
    clearTimeout(t);
    return (r.ok || r.status === 206 || r.status === 302) ? Date.now() - start : 9999;
  } catch { return 5000; }
}
async function sortServersBySpeed(list) {
  if (list.length <= 1 || currentKid || currentKey) return list;
  const scored = await Promise.all(list.map(async (s) => {
    const ms = await probeOne(s.url, 2500);
    return { s, ms, bonus: s.url === streamSource ? -2000 : 0 };
  }));
  scored.sort((a, b) => (a.ms + a.bonus) - (b.ms + b.bonus));
  return scored.map(x => x.s);
}

function updateServerUI(active, failed) {
  document.querySelectorAll('.server-chip').forEach((el, i) => {
    el.classList.toggle('playing', i === active);
    el.classList.toggle('fail', i === failed);
    const sub = document.getElementById('server-sub-' + i);
    if (sub) {
      sub.textContent = i === failed ? '✕ FAILED' : i === active ? '▶ PLAYING' : 'TAP TO PLAY';
    }
  });
}

function playServer(idx) {
  const s = SERVER_LIST[idx];
  if (!s) return;
  sameServerRetry = 0; isSwitching = false; everPlayed = false;
  CURRENT_SERVER_IDX = idx;
  streamSource = s.url;
  currentKid = s.kid || currentKid;
  currentKey = s.key || currentKey;
  triedProxyForThisServer = true;
  updateServerUI(idx, -1);
  showLoader();
  loadStream(streamSource, false);
}

async function loadSuggestions() {
  const grid = document.getElementById('suggestGrid');
  const myCat = getCategory(currentName, currentGroup);
  const mySrc = (srcParam || '').toLowerCase();
  const titleEl = document.getElementById('suggestTitle');

  /* --- SPORTS: alternate servers --- */
  if (isLiveSports()) {
    if (titleEl) titleEl.textContent = 'Extra Server দেখো';
    grid.classList.add('server-row');

    const jsonServers = [];
    try {
      const stored = JSON.parse(localStorage.getItem('rslive_sports_match') || 'null');
      if (stored?.streams?.length) {
        for (const s of stored.streams) {
          const u = safeUrl(s.stream_url || s.url || '');
          if (u) jsonServers.push({
            name: currentName, url: u, logo: '', group: 'Events', src: 'Server',
            kid: s.kid || '', key: s.key || ''
          });
        }
      }
    } catch {}

    let playlistServers = [];
    try {
      const list = await fetchAllPlaylistChannels();
      const clean = s => cleanName(s || '').toLowerCase().replace(/[^a-z0-9]/g, '');
      const myClean = clean(currentName);
      const parts = currentName.split(/vs/i).map(clean).filter(p => p.length > 3);
      playlistServers = list.filter(c => {
        const cn = clean(c.name);
        if (cn === myClean) return true;
        if (parts.length === 2 && (cn.includes(parts[0]) || cn.includes(parts[1]))) return true;
        return false;
      });
    } catch {}

    const seen = new Set();
    SERVER_LIST = [...jsonServers, ...playlistServers].filter(s => {
      if (!s.url || seen.has(s.url)) return false;
      seen.add(s.url); return true;
    });
    if (streamSource && !SERVER_LIST.find(s => s.url === streamSource)) {
      SERVER_LIST.unshift({ name: currentName, url: streamSource, logo: '', group: currentGroup, src: srcParam, kid: currentKid, key: currentKey });
    }
    CURRENT_SERVER_IDX = 0;
    triedProxyForThisServer = true;

    if (!SERVER_LIST.length) {
      grid.innerHTML = `<div style="flex:0 0 100%;text-align:center;font-size:12px;color:#888;padding:10px">এই ম্যাচে আর Server নাই</div>`;
      return;
    }

    SERVER_LIST = await sortServersBySpeed(SERVER_LIST);
    if (SERVER_LIST.length && !currentKid && SERVER_LIST[0].kid) {
      currentKid = SERVER_LIST[0].kid || '';
      currentKey = SERVER_LIST[0].key || '';
    }
    if (!streamSource) {
      streamSource = SERVER_LIST[0].url;
      currentKid = SERVER_LIST[0].kid || currentKid;
      currentKey = SERVER_LIST[0].key || currentKey;
    } else {
      const found = SERVER_LIST.findIndex(s => s.url === streamSource);
      CURRENT_SERVER_IDX = found >= 0 ? found : 0;
      if (found >= 0) {
        currentKid = SERVER_LIST[found].kid || currentKid;
        currentKey = SERVER_LIST[found].key || currentKey;
      }
    }

    grid.innerHTML = SERVER_LIST.map((_c, i) =>
      `<div class="server-chip ${i === CURRENT_SERVER_IDX ? 'playing' : ''}" id="server-${i}" data-sidx="${i}">
        <div class="sv-name">Server ${i + 1}</div>
        <div class="sv-sub" id="server-sub-${i}">${i === CURRENT_SERVER_IDX ? '▶ PLAYING' : 'TAP TO PLAY'}</div>
      </div>`
    ).join('');
    grid.querySelectorAll('.server-chip').forEach(el => {
      el.addEventListener('click', () => playServer(Number(el.dataset.sidx)));
    });
    return;
  }

  /* --- NORMAL: category suggestions --- */
  grid.classList.remove('server-row');
  if (titleEl) {
    const labelMap = {
      sports: 'Sports', news: 'News', movies: 'Movies', kids: 'Kids',
      music: 'Music', bangla: 'Bangla', entertainment: 'Entertainment', general: 'একই ক্যাটাগরি'
    };
    titleEl.textContent = 'আরো ' + labelMap[myCat] + ' দেখো';
  }

  try {
    const list = await fetchAllPlaylistChannels();
    const filtered = list.filter(c =>
      c.url !== streamSource && c.name.toLowerCase() !== currentName.toLowerCase());
    const sameBoth       = filtered.filter(c => c.src.toLowerCase() === mySrc && getCategory(c.name, c.group) === myCat);
    const samePlaylist   = filtered.filter(c => c.src.toLowerCase() === mySrc && getCategory(c.name, c.group) !== myCat);
    const sameCat        = filtered.filter(c => c.src.toLowerCase() !== mySrc && getCategory(c.name, c.group) === myCat);
    const show = [...shuffle(sameBoth), ...shuffle(samePlaylist), ...shuffle(sameCat)].slice(0, 20);
    if (!show.length) throw new Error('empty');

    grid.innerHTML = show.map(c => {
      const u = safeUrl(c.url);
      const logo = safeUrl(c.logo) || 'https://cdn-icons-png.flaticon.com/512/1179/1179069.png';
      return `<div class="sug-card"
        data-surl="${escapeHtml(u)}"
        data-sname="${escapeHtml(c.name)}"
        data-ssrc="${escapeHtml(c.src)}"
        data-sgroup="${escapeHtml(c.group)}">
        <img src="${escapeHtml(logo)}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/1179/1179069.png'">
        <div class="sug-txt"><p>${escapeHtml(cleanName(c.name))}</p><small>LIVE • HD</small></div>
        <div class="sug-play">▶</div>
      </div>`;
    }).join('');
    grid.querySelectorAll('.sug-card').forEach(el => {
      el.addEventListener('click', () => {
        const u = el.dataset.surl;
        if (!u) return;
        const q = new URLSearchParams({
          url: u,
          name: el.dataset.sname,
          src: el.dataset.ssrc,
          group: el.dataset.sgroup,
          t: Date.now()
        });
        window.location.href = 'player.html?' + q.toString();
      });
    });
  } catch {
    grid.innerHTML = `<div style="flex:0 0 100%;text-align:center;font-size:12px;color:#888;padding:10px">
      এই ক্যাটাগরিতে আর চ্যানেল নাই — <a href="index.html" style="color:#a78bfa">সব চ্যানেল দেখো</a></div>`;
  }
}

loadSuggestions();
ensureVideo();
if (streamSource) loadStream(streamSource, false);
else showLoader();
