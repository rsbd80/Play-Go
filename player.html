wrapper.addEventListener('mousemove',showControls);
function cleanName(name){return String(name||'').replace(/\(.*?\)/g,'').replace(/\[.*?\]/g,'').replace(/HD|FHD|4K|1080p|720p/gi,'').replace(/\s+/g,' ').trim();}
function makeProxyUrl(original,idx=0){if(!original)return original;if(PROXIES.some(p=>original.startsWith(p)))return original;return PROXIES[idx]+encodeURIComponent(original);}
let selectedQuality=-1;let availableHeights=[];
try{var sq=parseInt(localStorage.getItem('rslive_quality')||'-1');if(!isNaN(sq))selectedQuality=sq;}catch(e){}
function isLowQuality(){return selectedQuality!==-1 && selectedQuality<=360;}
function renderQualityList(){var list=document.getElementById('qList');if(!list)return;list.innerHTML='';function makeBtn(label,val){var b=document.createElement('button');var s1=document.createElement('span');s1.className='q-main';s1.textContent=label;var tick=document.createElement('span');tick.textContent='✓';b.append(s1,tick);if(selectedQuality===val)b.classList.add('sel');b.addEventListener('click',e=>{e.stopPropagation();setQuality(val);});list.appendChild(b);}makeBtn('Quality Auto',-1);if(availableHeights.length===0){makeBtn('Quality 240p',240);}else{availableHeights.forEach(h=>makeBtn('Quality '+h+'p',h));}var badge=document.getElementById('lowBadge');if(badge)badge.style.display=(selectedQuality!==-1 && selectedQuality<=360)?'inline-block':'none';}
function setQuality(val){selectedQuality=val;try{localStorage.setItem('rslive_quality',String(val));}catch(e){}applyQualityToPlayer();renderQualityList();var m=document.getElementById('qualityMenu');if(m)m.classList.remove('show');}
function applyQualityToPlayer(){if(window._hls){try{if(selectedQuality===-1){window._hls.autoLevelCapping=-1;window._hls.currentLevel=-1;}else{var idx=-1,best=99999;for(var i=0;i<window._hls.levels.length;i++){var h=window._hls.levels[i].height||0,d=Math.abs(h-selectedQuality);if(d<best){best=d;idx=i;}}if(idx>=0){window._hls.autoLevelCapping=idx;window._hls.currentLevel=idx;}}}catch(e){}}if(window._shaka){try{if(selectedQuality===-1){window._shaka.configure({abr:{enabled:true}});}else{var tracks=window._shaka.getVariantTracks();var match=tracks.find(t=>t.height===selectedQuality)||tracks[0];if(match)window._shaka.selectVariantTrack(match,true);}}catch(e){}}}
document.getElementById('settingsBtn').addEventListener('click',e=>{e.stopPropagation();document.getElementById('qualityMenu').classList.toggle('show');showControls();});
document.addEventListener('click',e=>{if(!e.target.closest('#qualityMenu')&&!e.target.closest('#settingsBtn')){var m=document.getElementById('qualityMenu');if(m)m.classList.remove('show');}});
renderQualityList();
function getCategory(name,group){var t=(String(name||'')+' '+String(group||'')).toLowerCase();if(t.includes('sport')||t.includes('cricket')||t.includes('football')||t.includes('t sports')||t.includes('star sports')||t.includes('sony sports')||t.includes('willow')||t.includes('ptv sports'))return 'sports';if(t.includes('news')||t.includes('somoy')||t.includes('jamuna')||t.includes('dbc')||t.includes('independent')||t.includes('atn news')||t.includes('channel 24')||t.includes('ekattor')||t.includes('ndtv'))return 'news';if(t.includes('movie')||t.includes('cinema')||t.includes('film'))return 'movies';if(t.includes('kid')||t.includes('cartoon')||t.includes('disney')||t.includes('pogo')||t.includes('nick'))return 'kids';if(t.includes('music')||t.includes('mtv')||t.includes('9xm'))return 'music';if(t.includes('bangla')||t.includes('btv')||t.includes('channel i')||t.includes('ntv')||t.includes('maasranga')||t.includes('gazi')||t.includes('jalsha')||t.includes('zee bangla'))return 'bangla';if(t.includes('star')||t.includes('sony')||t.includes('zee')||t.includes('colors')||t.includes('entertainment'))return 'entertainment';return 'general';}
function shuffle(arr){for(var i=arr.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var tmp=arr[i];arr[i]=arr[j];arr[j]=tmp;}return arr;}
const CONFIG_URL='https://raw.githubusercontent.com/rsbd80/RsLive-Go/main/data/config.json';
async function loadSuggestions(){
  var grid=document.getElementById('suggestGrid');
  var myCat=getCategory(currentName,currentGroup);
  var titleEl=document.getElementById('suggestTitle');
  if(titleEl){var label=myCat==='sports'?'Sports':myCat==='news'?'News':myCat==='movies'?'Movies':myCat==='kids'?'Kids':myCat==='music'?'Music':myCat==='bangla'?'Bangla':myCat==='entertainment'?'Entertainment':'Same Category';titleEl.textContent='আরো '+label+' দেখো';}
  try{
    var list=[];let plUrls=[];
    try{let cr=await fetch(CONFIG_URL+'?t='+Date.now());let cfg=await cr.json();if(cfg.playlists)plUrls=cfg.playlists.map(p=>p.url);}catch(e){}
    if(!plUrls.length) plUrls=["https://raw.githubusercontent.com/sm-monirulislam/Tapmad_Auto_Update_Playlist/refs/heads/main/tapmad_sm.m3u","https://raw.githubusercontent.com/sm-monirulislam/AynaOTT_Auto_Update_Playlist/refs/heads/main/aynaott.m3u","https://raw.githubusercontent.com/sm-monirulislam/jago_bd_auto_update_playlist-/refs/heads/main/jago_bd_main.m3u","https://iptv-org.github.io/iptv/countries/bd.m3u"];
    for(var pi=0;pi<plUrls.length;pi++){
      try{var res=await fetch(plUrls[pi]);if(!res.ok)continue;var text=await res.text();var lines=text.split("\n");var cur=null;
        for(var li=0;li<lines.length;li++){var line=lines[li].trim();
          if(line.indexOf("#EXTINF")===0){var nm=line.split(",").pop().trim();var lm=line.match(/tvg-logo="([^"]+)"/);var gm=line.match(/group-title="([^"]+)"/);cur={name:nm,logo:lm?lm[1]:"",group:gm?gm[1]:"General",src:plUrls[pi].includes('Tapmad')?'Tapmad':plUrls[pi].includes('Ayna')?'AynaOTT':plUrls[pi].includes('jago')?'JagoBD':'Bangladesh'};}
          else if(line.indexOf("http")===0&&cur){cur.url=line;if(cur.name&&cur.url&&!list.some(x=>x.url===cur.url))list.push(cur);cur=null;}
        }}catch(e){}
      if(list.length>800) break;
    }
    var filtered=list.filter(x=>x.url!==streamSource&&x.name.toLowerCase()!==currentName.toLowerCase());
    var sameBoth=[],samePlaylist=[],sameCat=[];var mySrc=(srcParam||'').toLowerCase();
    filtered.forEach(cc=>{if(cc.src.toLowerCase()===mySrc&&getCategory(cc.name,cc.group)===myCat)sameBoth.push(cc);else if(cc.src.toLowerCase()===mySrc)samePlaylist.push(cc);else if(getCategory(cc.name,cc.group)===myCat)sameCat.push(cc);});
    var show=shuffle(sameBoth).concat(shuffle(samePlaylist),shuffle(sameCat)).slice(0,40);
    if(!show.length) throw new Error('empty');
    grid.innerHTML='';
    show.forEach(c=>{
      var card=document.createElement('div');card.className='sug-card'+(c.name===currentName?' active':'');card.title=cleanName(c.name);
      card.addEventListener('click',()=>openSuggest(c.url,c.name,c.src,c.group));
      var logoWrap=document.createElement('div');logoWrap.className='sug-logo-wrap';
      var img=document.createElement('img');img.src=c.logo||'https://cdn-icons-png.flaticon.com/512/1179/1179069.png';img.onerror=function(){this.src='https://cdn-icons-png.flaticon.com/512/1179/1179069.png'};
      logoWrap.appendChild(img);
      var txt=document.createElement('div');txt.className='sug-txt';
      var p=document.createElement('p');p.textContent=cleanName(c.name);
      var sm=document.createElement('small');sm.textContent='LIVE • HD';
      txt.append(p,sm);
      var play=document.createElement('div');play.className='sug-play';play.textContent='▶';
      card.append(logoWrap,txt,play);grid.appendChild(card);
    });
  }catch(e){grid.innerHTML='<div style="flex:0 0 100%;text-align:center;font-size:12px;color:#888;padding:10px">No more channels - <a href="index.html" style="color:#FFC107">View All</a></div>';}
}
function openSuggest(url,name,src,group){window.location.href='player.html?url='+encodeURIComponent(url)+'&name='+encodeURIComponent(name)+'&src='+encodeURIComponent(src||'')+'&group='+encodeURIComponent(group||'')+'&fs=0';}
loadSuggestions();
if(!streamSource){showState('<div class="state-content"><div class="glyph warn">⚠</div><p class="title">No stream URL supplied</p><p class="sub">Home থেকে কোনো চ্যানেলে চাপ দিয়ে খুলো</p><button class="retry-btn" onclick="location.href=\'index.html\'">Go Home</button>'+brandBlock()+'</div>');}else{
var video=document.createElement('video');video.setAttribute('playsinline','');video.setAttribute('webkit-playsinline','');video.muted=false;video.volume=1;video.autoplay=true;video.controls=false;video.preload='auto';video.playsInline=true;video.style.cssText='width:100%;height:100%;object-fit:contain;background:#000';document.getElementById('player').appendChild(video);
var hls=null;var shakaPlayer=null;var everPlayed=false;var triedIdx=-1;
function updateMuteBtn(){var l1=document.getElementById('muteLine1');var l2=document.getElementById('muteLine2');var w=document.getElementById('muteWave');if(video.muted||video.volume===0){if(l1)l1.style.display='';if(l2)l2.style.display='';if(w)w.style.display='none';}else{if(l1)l1.style.display='none';if(l2)l2.style.display='none';if(w)w.style.display='';}}
updateMuteBtn();
function doPlay(){video.muted=false;video.volume=1;updateMuteBtn();video.play().then(()=>{hideLoader();everPlayed=true;tapPlayEl.classList.remove('show');updateMuteBtn();requestWakeLock();if(FS_PARAM==='1'&&!document.fullscreenElement){setTimeout(()=>{toggleFullscreen();},400);}}).catch(()=>{video.muted=true;video.play().then(()=>{hideLoader();everPlayed=true;tapPlayEl.classList.remove('show');updateMuteBtn();requestWakeLock();}).catch(()=>{tapPlayEl.classList.add('show');});updateMuteBtn();});}
tapPlayEl.addEventListener('click',()=>{video.muted=false;video.volume=1;video.play().then(()=>{tapPlayEl.classList.remove('show');hideLoader();updateMuteBtn();requestWakeLock();}).catch(()=>{});});
muteBtnEl.addEventListener('click',e=>{e.stopPropagation();video.muted=!video.muted;if(!video.muted){video.volume=1;video.play().catch(()=>{});}updateMuteBtn();showControls();});
async function destroyCurrentPlayer(){if(hls){try{hls.destroy()}catch(e){}hls=null;window._hls=null;}if(shakaPlayer){try{await shakaPlayer.destroy()}catch(e){}shakaPlayer=null;window._shaka=null;}try{video.pause();video.removeAttribute('src');video.load();}catch(e){}}
async function loadStream(url,attemptIdx=0){
  triedIdx=attemptIdx;
  try{
    showLoader();tapPlayEl.classList.remove('show');await destroyCurrentPlayer();
    var isMPD=/\.mpd(?:$|[?#])/i.test(url);
    var isM3U8=/\.m3u8(?:$|[?#])/i.test(url)||/m3u8/i.test(url);
    if(isMPD){
      if(!window.shaka||!shaka.Player.isBrowserSupported()){tryNextProxy('MPD not supported');return;}
      shaka.polyfill.installAll();shakaPlayer=new shaka.Player(video);window._shaka=shakaPlayer;
      shakaPlayer.configure({streaming:{bufferingGoal:30,rebufferingGoal:2,bufferBehind:30,retryParameters:{maxAttempts:3,baseDelay:1000,backoffFactor:2,timeout:30000}}});
      shakaPlayer.addEventListener('error',()=>{if(!everPlayed)tryNextProxy('MPD Error');});
      await shakaPlayer.load(url);
      try{var tracks=shakaPlayer.getVariantTracks();var hs=[];tracks.forEach(tr=>{if(tr.height&&hs.indexOf(tr.height)===-1)hs.push(tr.height);});availableHeights=hs.sort((a,b)=>b-a);renderQualityList();applyQualityToPlayer();}catch(e){}
      doPlay();return;
    }
    if(isM3U8){
      if(window.Hls&&Hls.isSupported()){
        hls=new Hls({maxBufferLength:isLowQuality()?8:30,maxMaxBufferLength:isLowQuality()?12:60,enableWorker:false,lowLatencyMode:false,manifestLoadingMaxRetry:2,levelLoadingMaxRetry:3,fragLoadingMaxRetry:3,manifestLoadingRetryDelay:800});
        window._hls=hls;hls.loadSource(url);hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED,()=>{try{var hs2=[];hls.levels.forEach(lv=>{if(lv.height&&hs2.indexOf(lv.height)===-1)hs2.push(lv.height);});availableHeights=hs2.sort((a,b)=>b-a);renderQualityList();applyQualityToPlayer();}catch(e){}doPlay();});
        hls.on(Hls.Events.ERROR,(e,data)=>{if(!data.fatal)return;if(data.type===Hls.ErrorTypes.NETWORK_ERROR){tryNextProxy('Network Error');}else if(data.type===Hls.ErrorTypes.MEDIA_ERROR){try{hls.recoverMediaError();}catch(err){tryNextProxy('Media Error');}}else{tryNextProxy('HLS Error');}});
      }else if(video.canPlayType('application/vnd.apple.mpegurl')){video.src=url;doPlay();}
      else{tryNextProxy('HLS not supported');}
      return;
    }
    video.src=url;doPlay();video.onerror=()=>{if(!everPlayed)tryNextProxy('Video Error');};
  }catch(err){tryNextProxy(err.message||'Load failed');}
}
function tryNextProxy(reason){
  if(everPlayed) return;
  if(triedIdx===-1){ setTimeout(()=>loadStream(makeProxyUrl(streamSource,0),0),600); return; }
  if(triedIdx>=0 && triedIdx+1 < PROXIES.length){ setTimeout(()=>loadStream(makeProxyUrl(streamSource,triedIdx+1),triedIdx+1),800); return; }
  showNoStreamState({message:reason});
}
function showNoStreamState(err){releaseWakeLock();tapPlayEl.classList.remove('show');showState('<div class="state-content"><div class="glyph">❌</div><p class="title">This channel is not working right now</p><p class="sub">'+(err&&err.message?err.message:'Tried Direct + 4 Proxy.')+'</p><button class="retry-btn" onclick="location.reload()">Retry</button><br><button class="retry-btn2" onclick="tryDirectManually()">Try Direct</button><br><button class="retry-btn2" onclick="tryProxyManually()">Try with Proxy</button><br><button class="retry-btn2" onclick="location.href=\'index.html\'">Go Home</button>'+brandBlock()+'</div>');}
window.tryProxyManually=function(){showLoader();loadStream(makeProxyUrl(streamSource,0),0);};
window.tryDirectManually=function(){showLoader();loadStream(streamSource,-1);};
video.addEventListener('playing',()=>{hideLoader();everPlayed=true;tapPlayEl.classList.remove('show');updateMuteBtn();requestWakeLock();});
video.addEventListener('waiting',()=>{if(!video.paused)showLoader();});
video.addEventListener('canplay',()=>{if(!video.paused)hideLoader();});
video.addEventListener('pause',()=>{playBtn.textContent='▶';releaseWakeLock();});
video.addEventListener('play',()=>{playBtn.textContent='❚❚';requestWakeLock();});
video.addEventListener('volumechange',()=>{updateMuteBtn();});
playBtn.addEventListener('click',e=>{e.stopPropagation();if(video.paused){video.muted=false;video.volume=1;video.play().catch(()=>{tapPlayEl.classList.add('show');});updateMuteBtn();}else{video.pause();}showControls();});
fsBtn.addEventListener('click',e=>{e.stopPropagation();toggleFullscreen();showControls();});
if(isToffee){ loadStream(makeProxyUrl(streamSource,0),0); } else { loadStream(streamSource,-1); }
setTimeout(()=>{if(!everPlayed){ loadStream(makeProxyUrl(streamSource,0),0); }},6000);
}
</script>
