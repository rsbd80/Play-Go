<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>PlayOn Go - Player</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;600;700&family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#07070f;color:#fff;font-family:'Hind Siliguri','Poppins',sans-serif}
.topbar{position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:12px;padding:12px 14px;background:rgba(10,10,20,.95);border-bottom:1px solid rgba(255,255,255,.08)}
.brand{text-decoration:none;flex-shrink:0}
.brand .pg{font-size:17px;font-weight:900;color:#fff}
.brand .pg i{font-style:normal;background:linear-gradient(90deg,#22d3ee,#a78bfa,#ff5d8f);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand .tag{font-size:8px;letter-spacing:2.5px;color:#9a9ab5;font-weight:700;margin-top:2px}
.divider{width:1px;height:32px;background:rgba(255,255,255,.12);flex-shrink:0}
#chName{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#chSub{font-size:10px;color:#888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#chSub b{color:#7CFC00}
.live-pill{margin-left:auto;display:flex;align-items:center;gap:6px;background:rgba(255,45,85,.14);border:1px solid rgba(255,45,85,.35);color:#ff6b81;font-size:10px;font-weight:800;letter-spacing:1px;padding:6px 10px;border-radius:20px;flex-shrink:0}
.live-pill i{width:7px;height:7px;background:#ff2d55;border-radius:50%;animation:pulseDot 1.4s infinite}
@keyframes pulseDot{0%{box-shadow:0 0 0 0 rgba(255,45,85,.7)}70%{box-shadow:0 0 0 7px rgba(255,45,85,0)}100%{box-shadow:0 0 0 0 rgba(255,45,85,0)}}
#player-wrapper{position:relative;width:100%;aspect-ratio:16/9;background:#000;overflow:hidden}
#player-wrapper:fullscreen{width:100vw;height:100vh;aspect-ratio:auto}
#player{position:absolute;inset:0;width:100%!important;height:100%!important}
#player video{width:100%!important;height:100%!important;object-fit:contain!important;background:#000}
video::-webkit-media-controls{display:none!important}
#loader{position:absolute;inset:0;background:#0a0a12;display:flex;justify-content:center;align-items:center;flex-direction:column;z-index:99;text-align:center;padding:20px}
#loader.hide-now{opacity:0!important;visibility:hidden!important;pointer-events:none!important}
.brand-name{font-size:20px;font-weight:900;letter-spacing:1px}
.brand-name i{font-style:normal;background:linear-gradient(90deg,#22d3ee,#a78bfa,#ff5d8f);-webkit-background-clip:text;background-clip:text;color:transparent}
.dots{display:flex;gap:6px;margin:14px 0}.dots span{width:7px;height:7px;border-radius:50%;background:#a78bfa;animation:dp 1.2s infinite}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes dp{0%,80%,100%{transform:scale(.6);opacity:.35}40%{transform:scale(1);opacity:1}}
.status-line{font-family:monospace;font-size:10px;letter-spacing:2.5px;color:#888}
#controls{position:absolute;bottom:0;left:0;right:0;z-index:50;display:flex;align-items:center;gap:10px;padding:14px;background:linear-gradient(0deg,rgba(0,0,0,.85),transparent);opacity:0;transition:opacity .3s}
#player-wrapper.show-controls #controls{opacity:1}
#controls button{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);color:#fff;width:42px;height:42px;border-radius:50%;font-size:16px;cursor:pointer}
#seek{flex:1;-webkit-appearance:none;height:4px;background:rgba(255,255,255,.3);border-radius:4px;outline:none}
#seek::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#a78bfa}
#time-label{font-family:monospace;font-size:11px;white-space:nowrap}
#debug{margin:10px 14px 0;background:#111;padding:12px;border-radius:10px;font-family:monospace;font-size:11px;color:#ccc;word-break:break-all;line-height:1.7;border:1px solid #222}
#debug b{color:#7CFC00}
#debug .err{color:#ff5d5d}
#debug .ok{color:#7CFC00}
.btn{padding:11px 20px;font-weight:700;font-size:12px;border:none;border-radius:20px;cursor:pointer;margin:6px 4px}
.btn-grad{color:#000;background:linear-gradient(90deg,#22d3ee,#a78bfa)}
.btn-ghost{color:#fff;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25)}
.suggest{margin:12px 0 0}
.suggest-head{display:flex;justify-content:space-between;margin:0 14px 8px}
.suggest-head h3{font-size:13px;font-weight:800}
.suggest-head a{font-size:11px;color:#a78bfa;text-decoration:none;font-weight:700}
.suggest-grid{display:flex;gap:9px;overflow-x:auto;padding:0 14px 6px;scrollbar-width:none}
.suggest-grid::-webkit-scrollbar{display:none}
.sug-card{flex:0 0 72px;background:#15151f;border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:8px 4px 7px;text-align:center;cursor:pointer}
.sug-card img{width:38px;height:38px;object-fit:contain;background:#fff;border-radius:10px;padding:3px}
.sug-card p{font-size:11px;font-weight:600;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ad-wrap{margin:12px 14px 0;background:#111118;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:10px 10px 12px}
.ad-label{font-size:9px;letter-spacing:2.5px;color:#777;text-align:center;margin-bottom:10px;font-family:monospace}
.ad-box{border-radius:10px;overflow:hidden;background:#0a0a12;display:flex;justify-content:center}
.ad-note{text-align:center;font-size:11px;color:#666;margin:12px 0 20px}
.ad-note b{color:#a78bfa}
</style>
</head>
<body>
<div class="topbar">
<a class="brand" href="https://playongo.pages.dev/"><div class="pg">PlayOn <i>Go</i></div><div class="tag">LIVE TV</div></a>
<div class="divider"></div>
<div style="min-width:0;flex:1"><div id="chName">PlayOn Go</div><div id="chSub">● <b>Now Playing</b> • HD Live</div></div>
<div class="live-pill"><i></i> LIVE</div>
</div>

<div id="player-wrapper">
<div id="loader">
<div class="brand-name"><b>PlayOn</b> <i>Go</i></div>
<div class="dots"><span></span><span></span><span></span></div>
<div class="status-line" id="status-line">LOADING...</div>
<div id="loaderBtns" style="margin-top:16px;display:none"></div>
</div>
<div id="player"></div>
<div id="controls"><button id="playBtn">▶</button><input type="range" id="seek" value="0" min="0" max="100"><span id="time-label">LIVE</span><button id="fsBtn">⛶</button></div>
</div>

<div id="debug">
<div>🔍 <b>DEBUG LOG:</b></div>
<div id="debugText">Starting...</div>
<div style="margin-top:10px">
<button class="btn btn-grad" onclick="testStream()">🧪 Test Stream চালাও</button>
<button class="btn btn-ghost" onclick="location.reload()">🔄 Reload</button>
<button class="btn btn-ghost" onclick="location.href='https://playongo.pages.dev/'">🏠 Home</button>
</div>
</div>

<div class="suggest">
<div class="suggest-head"><h3>🔥 তুমি আরো দেখতে পারো</h3><a href="https://playongo.pages.dev/">সব দেখো →</a></div>
<div class="suggest-grid" id="suggestGrid"><div style="color:#888;font-size:12px;padding:10px">লোড হচ্ছে...</div></div>
</div>

<div class="ad-wrap">
<div class="ad-label">ADVERTISEMENT</div>
<div class="ad-box"><div id="container-cdeccdd75d3e2e6916a42ce9653cfb08"></div></div>
</div>
<div class="ad-note">তুমি দেখছো <b id="chName2">PlayOn Go</b> • কোনো সমস্যা হলে টেলিগ্রামে জানাও</div>

<script async="async" data-cfasync="false" src="https://czernik.org/21/cdeccdd75d3e2e6916a42ce9653cfb08"></script>
<script>
const urlParams = new URLSearchParams(window.location.search);
let streamSource = urlParams.get('url') || '';
try{ streamSource = decodeURIComponent(streamSource); }catch(e){}
const chNameParam = urlParams.get('name') || '';
let currentName = '';
try{ if(chNameParam){ const d = decodeURIComponent(chNameParam); currentName=d; document.getElementById('chName').textContent=d; document.getElementById('chName2').textContent=d; document.title=d+' - PlayOn Go'; } }catch(e){}

// ✅ ৪ টা Proxy - একটা ফেল করলে পরেরটা
function getProxies(url){
  const e = encodeURIComponent(url);
  return [
    {name:'Direct', url: url},
    {name:'Lovable Proxy', url: 'https://stream-through-spark.lovable.app/api/proxy?u=' + e},
    {name:'CorsProxy.io', url: 'https://corsproxy.io/?url=' + e},
    {name:'AllOrigins', url: 'https://api.allorigins.win/raw?url=' + e},
    {name:'Codetabs', url: 'https://api.codetabs.com/v1/proxy?quest=' + e},
  ];
}
const PROXY_FOR_LIST = "https://stream-through-spark.lovable.app/api/proxy?u=";

let logEl = document.getElementById('debugText');
let step = 0;
function log(msg, type){
  step++;
  let cls = type==='err' ? 'err' : (type==='ok' ? 'ok' : '');
  logEl.innerHTML += `<div><span style="color:#555">${step}.</span> <span class="${cls}">${msg}</span></div>`;
  console.log('[PlayOnGo]', msg);
}
log('Page লোড হইছে ✅');
log('URL: ' + (streamSource ? streamSource.slice(0,150) : '<span class="err">❌ খালি! index থেকে আসে নাই</span>'));
log('HLS.js আছে? ' + (window.Hls ? '✅ হ্যাঁ' : '❌ না - CDN ব্লক'));
log('Browser: ' + navigator.userAgent.slice(0,80));

const loaderEl = document.getElementById('loader');
const statusEl = document.getElementById('status-line');
const wrapper = document.getElementById('player-wrapper');
const playBtn = document.getElementById('playBtn');
const fsBtn = document.getElementById('fsBtn');
function showLoader(){ loaderEl.classList.remove('hide-now'); document.getElementById('loaderBtns').style.display='none'; }
function hideLoader(){ loaderEl.classList.add('hide-now'); }

let hideCtrlTimer=null;
function showControls(){ wrapper.classList.add('show-controls'); clearTimeout(hideCtrlTimer); hideCtrlTimer=setTimeout(()=>wrapper.classList.remove('show-controls'),3000); }
wrapper.addEventListener('click',showControls); wrapper.addEventListener('touchstart',showControls,{passive:true});

function cleanName(n){ return n.replace(/\(.*?\)/g,'').replace(/\[.*?\]/g,'').replace(/HD|FHD|4K|1080p|720p/gi,'').replace(/\s+/g,' ').trim(); }

// ===== SUGGESTIONS =====
const SUGGEST_PLAYLISTS = [
  "https://raw.githubusercontent.com/sm-monirulislam/Tapmad_Auto_Update_Playlist/refs/heads/main/tapmad_sm.m3u",
  "https://raw.githubusercontent.com/sm-monirulislam/Toffee-Auto-Update/refs/heads/main/toffee_playlist.m3u",
  "https://iptv-org.github.io/iptv/countries/bd.m3u"
];
async function loadSuggestions(){
  const grid = document.getElementById('suggestGrid');
  try{
    let list=[];
    for(let plUrl of SUGGEST_PLAYLISTS){
      try{
        const res = await fetch(PROXY_FOR_LIST + encodeURIComponent(plUrl));
        const text = await res.text();
        const lines = text.split("\n"); let cur=null;
        for(let line of lines){ line=line.trim(); if(line.startsWith("#EXTINF")){ const name=line.split(",").pop().trim(); const lm=line.match(/tvg-logo="([^"]+)"/); cur={name,logo:lm?lm[1]:""}; } else if(line.startsWith("http") && cur){ cur.url=line; if(cur.name&&cur.url) list.push(cur); cur=null; } }
        if(list.length>=20) break;
      }catch(e){}
    }
    if(list.length===0) throw new Error('empty');
    grid.innerHTML = list.slice(0,20).map(c=>`<div class="sug-card" onclick="openSuggest('${encodeURIComponent(c.url)}','${encodeURIComponent(c.name)}')"><img src="${c.logo||'https://cdn-icons-png.flaticon.com/512/1179/1179069.png'}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/1179/1179069.png'"><p>${cleanName(c.name)}</p></div>`).join("");
  }catch(e){ grid.innerHTML = `<div style="color:#888;font-size:12px;padding:10px">সাজেশন লোড হয় নাই</div>`; }
}
function openSuggest(u,n){ window.location.href = `player.html?url=${encodeURIComponent(decodeURIComponent(u))}&name=${n}`; }
loadSuggestions();

// ===== PLAYER CORE - MULTI PROXY =====
let video=null, hls=null, everPlayed=false, currentTry=0, proxies=[];
function createVideo(){
  if(video) return video;
  video = document.createElement('video');
  video.setAttribute('playsinline',''); video.setAttribute('webkit-playsinline','');
  video.muted=false; video.autoplay=true; video.controls=false;
  video.style.cssText='width:100%;height:100%;object-fit:contain;background:#000';
  document.getElementById('player').appendChild(video);
  video.addEventListener('playing',()=>{ log('✅ PLAYING! ভিডিও চলছে!', 'ok'); hideLoader(); everPlayed=true; });
  video.addEventListener('waiting',()=>{ log('⏳ Buffering...'); });
  video.addEventListener('pause',()=>{ playBtn.textContent='▶'; });
  video.addEventListener('play',()=>{ playBtn.textContent='❚❚'; });
  video.addEventListener('error',()=>{ log('❌ Video error: '+(video.error?video.error.message+' (code '+video.error.code+')':'unknown'),'err'); tryNext(); });
  playBtn.addEventListener('click',(e)=>{ e.stopPropagation(); if(video.paused) video.play(); else video.pause(); showControls(); });
  fsBtn.addEventListener('click',(e)=>{ e.stopPropagation(); if(document.fullscreenElement) document.exitFullscreen(); else wrapper.requestFullscreen().catch(()=>{}); showControls(); });
  return video;
}
function tryNext(){
  if(currentTry >= proxies.length-1){
    log('❌ সব Proxy ফেল করছে। চ্যানেলটা ডাউন হতে পারে।','err');
    showFail();
    return;
  }
  currentTry++;
  loadWithProxy(currentTry);
}
function loadWithProxy(idx){
  const p = proxies[idx];
  log(`🔄 চেষ্টা ${idx+1}/${proxies.length}: <b>${p.name}</b>`);
  statusEl.textContent = 'TRYING: ' + p.name.toUpperCase();
  showLoader();
  if(hls){ try{hls.destroy();}catch(e){} hls=null; }
  video.removeAttribute('src'); video.load();
  if(p.url.includes('.m3u8') || p.url.includes('m3u8') || p.url.includes('%2Fm3u8') || p.url.includes('m3u8')){
    if(window.Hls && Hls.isSupported()){
      hls = new Hls({ maxBufferLength:30, maxMaxBufferLength:60, enableWorker:true, lowLatencyMode:false });
      hls.loadSource(p.url); hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, ()=>{ log('✅ Manifest পাইছি ('+p.name+')','ok'); video.play().catch(e=>log('⚠️ Play blocked, স্ক্রিনে ট্যাপ করো: '+e.message)); });
      hls.on(Hls.Events.ERROR, (e,data)=>{
        if(!data.fatal) return;
        log(`❌ HLS Fatal (${p.name}): ${data.details}`,'err');
        tryNext();
      });
      // 8 সেকেন্ডে manifest না আসলে পরেরটা
      setTimeout(()=>{ if(!everPlayed && currentTry===idx && hls){ log(`⏰ ${p.name} - 8s এ Manifest আসে নাই, পরেরটা ট্রাই...`); tryNext(); } },8000);
    } else if(video.canPlayType('application/vnd.apple.mpegurl')){
      log('🍎 Safari Native HLS');
      video.src = p.url; video.play().catch(()=>{});
      setTimeout(()=>{ if(!everPlayed && currentTry===idx) tryNext(); },8000);
    } else {
      log('❌ এই Browser HLS সাপোর্ট করে না','err'); showFail();
    }
  } else {
    video.src = p.url; video.play().catch(()=>{});
    setTimeout(()=>{ if(!everPlayed && currentTry===idx) tryNext(); },8000);
  }
}
function showFail(){
  statusEl.textContent = 'FAILED';
  document.getElementById('loaderBtns').style.display='block';
  document.getElementById('loaderBtns').innerHTML = `
    <div style="color:#ff5d5d;font-size:13px;font-weight:700;margin-bottom:8px">❌ এই চ্যানেলটা এখন চলছে না</div>
    <div style="color:#888;font-size:11px;margin-bottom:12px">সব Proxy ট্রাই করা হইছে</div>
    <button class="btn btn-grad" onclick="testStream()">🧪 Test Stream দিয়ে প্লেয়ার চেক করো</button><br>
    <button class="btn btn-ghost" onclick="location.reload()">🔄 আবার চেষ্টা করো</button>
    <button class="btn btn-ghost" onclick="location.href='https://playongo.pages.dev/'">🏠 অন্য চ্যানেল দেখো</button>
  `;
}
function startPlayer(url){
  proxies = getProxies(url);
  currentTry = 0; everPlayed=false;
  createVideo();
  loadWithProxy(0);
}
function testStream(){
  log('🧪 Test Stream চালাচ্ছি - এটা চললে প্লেয়ার ঠিক আছে, চ্যানেলের দোষ','ok');
  document.getElementById('chName').textContent = 'Test Stream - Big Buck Bunny';
  startPlayer('https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8');
}
window.testStream = testStream;
if(!streamSource){
  log('❌ player.html?url= খালি!','err');
  showFail();
} else {
  startPlayer(streamSource);
}
</script>
</body>
</html>
