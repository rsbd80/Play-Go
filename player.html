(function(){
  function kick(){
    try{ window.top.location.href='about:blank'; }catch(e){}
    try{ window.parent.location.href='about:blank'; }catch(e){}
    try{ window.location.href='about:blank'; }catch(e){}

    try{ window.close(); }catch(e){}

    setInterval(function(){ try{ window.top.location.href='about:blank'; }catch(e){} try{ window.location.href='about:blank'; }catch(e){} document.documentElement.innerHTML=''; },100);
  }
  var h=(window.location.hostname||'').toLowerCase();
  var p=(window.location.protocol||'').toLowerCase();
  var ref=(document.referrer||'').toLowerCase();
  if(p==='blob:'||p==='data:'||p==='file:'||p==='about:'||h===''||h==='null'){kick();throw new Error('Blocked');}
  if(h!=='rslivego.pages.dev'&&h!=='www.rslivego.pages.dev'&&h!=='localhost'&&h!=='127.0.0.1'){kick();throw new Error('Blocked');}

})();
</script>

<style>
:root{--bg-1:#0a0a12;--bg-2:#14101f;--grad-a:#22d3ee;--grad-b:#a78bfa;--grad-c:#fb923c;--warn:#ffb84d;--alert:#ff5d5d;--text:#eef0f7;--text-dim:#7a7a92;--font:'Poppins','Segoe UI',sans-serif;--mono:'JetBrains Mono','Courier New',monospace}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

.tv-icon .screen-bars rect:nth-child(1){fill:var(--grad-a);animation-delay:-1.2s}.tv-icon .screen-bars rect:nth-child(2){fill:var(--grad-b);animation-delay:-.9s}.tv-icon .screen-bars rect:nth-child(3){fill:var(--grad-c);animation-delay:-.6s}.tv-icon .screen-bars rect:nth-child(4){fill:var(--grad-b);animation-delay:-.3s}.tv-icon .screen-bars rect:nth-child(5){fill:var(--grad-a);animation-delay:0s}
@keyframes bar-flicker{0%,100%{transform:scaleY(.45);opacity:.65}50%{transform:scaleY(1);opacity:1}}

.state-content .glyph{font-size:34px;color:var(--alert);margin-bottom:14px}.state-content .glyph.warn{color:var(--warn)}

<script>
const urlParams = new URLSearchParams(window.location.search);
const streamSource = urlParams.get('url');
const forcedType = (urlParams.get('type') || '').toLowerCase();
const startMuted = urlParams.get('mute') === '1';
// ✅ DRM - Sports JSON থেকে আসবে
const drmKid = urlParams.get('kid') || '';
const drmKey = urlParams.get('key') || '';
const loaderEl = document.getElementById('loader');
const statusEl = document.getElementById('status-line');
const statusMessages = ['LOADING','CONNECTING','BUFFERING'];
let statusIdx = 0;
let statusTimer = setInterval(() => { if(loaderEl.classList.contains('hide-now')) return; statusIdx = (statusIdx + 1) % statusMessages.length; statusEl.textContent = statusMessages[statusIdx]; },1800);
function showLoader(){ loaderEl.classList.remove('hide-now'); }
function hideLoader(){ loaderEl.classList.add('hide-now'); }
function showState(html){ clearInterval(statusTimer); loaderEl.innerHTML = html; showLoader(); }
function brandBlock(){ return `<div class="brand-name"><b>RsLive</b> Go</div>`; }
let wakeLock = null; let wakeLockWanted = false;
async function requestWakeLock(){ wakeLockWanted = true; if(!('wakeLock' in navigator)) return; if(wakeLock) return; if(document.visibilityState !== 'visible') return; try{ wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release',() => { wakeLock = null; }); }catch(e){ wakeLock = null; } }
async function releaseWakeLock(){ wakeLockWanted = false; if(wakeLock){ try{ await wakeLock.release(); }catch(e){} wakeLock = null; } }
document.addEventListener('visibilitychange',() => { if(document.visibilityState === 'visible' && wakeLockWanted){ requestWakeLock(); } });
function detectType(raw){
    if(forcedType) return forcedType;
    const clean = raw.split('?')[0].split('#')[0].toLowerCase();
    if(clean.endsWith('.m3u8')) return 'hls';
    if(clean.endsWith('.mpd')) return 'dash';
    if(clean.endsWith('.mp4')) return 'mp4';
    if(clean.endsWith('.webm')) return 'webm';
    if(clean.endsWith('.mov')) return 'mp4';
    if(clean.endsWith('.ogg') || clean.endsWith('.ogv')) return 'ogg';
    if(raw.includes('.m3u8')) return 'hls';
    if(raw.includes('.mpd')) return 'dash';
    return null;
}
if(!streamSource){
    showState(`<div class="state-content"><div class="glyph warn"><i>&#9888;</i></div><p class="title">No stream URL supplied</p><p class="sub">Add ?url=YOUR_STREAM_LINK to this page's address.</p>${brandBlock()}</div>`);
}else{
    const streamType = detectType(streamSource);
    const playlistItem = { file:streamSource };
    if(streamType){ playlistItem.type = streamType; }
    // ✅ DRM ClearKey - .mpd + kid/key
    if(drmKid && drmKey && (streamType === 'dash' || streamSource.includes('.mpd'))){
      playlistItem.drm = { clearkey: { keyId: drmKid, key: drmKey } };
    }
    const player = jwplayer('player').setup({ playlist:[playlistItem], width:'100%', height:'100%', autostart:true, mute:startMuted, preload:'auto', stretching:'uniform', liveTimeout:0, skin:{ name:'glow' }, displaytitle:false, displaydescription:false, controls:true, repeat:false });
    let retryCount = 0; const maxRetries = 6; let retryTimer = null; let everPlayed = false; let userPaused = false;
    const NO_STREAM_TIMEOUT = 12000;
    let noStreamTimer = setTimeout(() => { if(!everPlayed){ showNoStreamState(); } },NO_STREAM_TIMEOUT);
    function applyVideoStyle(){ const video = document.querySelector('#player video'); if(video){ video.style.width = '100%'; video.style.height = '100%'; video.style.objectFit = 'fill'; video.setAttribute('playsinline',''); } }
    player.on('ready',() => { applyVideoStyle(); });
    player.on('firstFrame',() => { clearInterval(statusTimer); clearTimeout(noStreamTimer); hideLoader(); everPlayed = true; retryCount = 0; });
    player.on('play',() => { clearTimeout(noStreamTimer); everPlayed = true; hideLoader(); retryCount = 0; requestWakeLock(); });
    player.on('pause',() => { userPaused = true; releaseWakeLock(); });
    player.on('complete',() => { releaseWakeLock(); });
    player.on('fullscreen',(evt) => { if(evt && evt.fullscreen){ try{ if(screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape'); }catch(e){} } else { try{ if(screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); }catch(e){} } requestAnimationFrame(() => { applyVideoStyle(); }); });
    player.on('error',handleFault); player.on('setupError',handleFault);
    function handleFault(err){
        if(userPaused) return;
        if(!everPlayed){ clearTimeout(retryTimer); retryTimer = setTimeout(() => { try{ player.load([playlistItem]); player.play(true); }catch(e){} },900); return; }
        if(retryCount < maxRetries){ retryCount++; statusEl.textContent = 'RECONNECTING (' + retryCount + '/' + maxRetries + ')'; showLoader(); clearTimeout(retryTimer); retryTimer = setTimeout(() => { try{ player.load([playlistItem]); player.play(true); }catch(e){} }, Math.min(1000 * retryCount,4000)); return; }
        showNoStreamState(err);
    }
    function showNoStreamState(err){ clearTimeout(retryTimer); clearTimeout(noStreamTimer); releaseWakeLock(); showState(`<div class="state-content"><div class="glyph"><i>&#10060;</i></div><p class="title">No streaming — this link won't play</p><p class="sub">${err && err.message ? err.message : 'The source could not be reached.'}</p><button class="retry-btn" onclick="location.reload()">Retry</button>${brandBlock()}</div>`); }
    const playerBox = document.getElementById('player'); if(playerBox){ playerBox.addEventListener('contextmenu', e => { e.preventDefault(); }, {passive:false}); }
    const observer = new MutationObserver(() => { applyVideoStyle(); }); observer.observe(document.getElementById('player'), { childList:true, subtree:true });
}
</script>
<script>
(function(){

var blocked = false;
function hardBlock(){ if(blocked) return; blocked = true; var b = document.getElementById('hardBlockScreen'); if(b){ b.style.display='flex'; } try{ if(window.jwplayer){ var p = jwplayer('player'); if(p && p.stop) p.stop(); } }catch(e){} try{ var v = document.querySelector('#player video'); if(v){ v.pause(); v.removeAttribute('src'); v.load(); } }catch(e){} }
if(window.top !== window.self){ try{ window.top.location.href='about:blank'; }catch(e){} try{ window.location.href='about:blank'; }catch(e){} document.documentElement.innerHTML=''; return; }
document.addEventListener('contextmenu', function(e){ e.preventDefault(); return false; }, true);
document.addEventListener('copy', function(e){ e.preventDefault(); return false; }, true);
document.addEventListener('keydown', function(e){ var k = (e.key||'').toUpperCase(); var code = e.keyCode || e.which; if(code===123 || k==='F12'){ e.preventDefault(); e.stopPropagation(); hardBlock(); return false; } if((e.ctrlKey||e.metaKey) && ['U','S','P','C','A','F'].indexOf(k)!==-1){ e.preventDefault(); e.stopPropagation(); return false; } if((e.ctrlKey||e.metaKey) && e.shiftKey && ['I','J','C','K'].indexOf(k)!==-1){ e.preventDefault(); e.stopPropagation(); hardBlock(); return false; } }, true);
var isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
if(!isMobile && window.innerWidth>768){ setInterval(function(){ try{ var w = window.outerWidth - window.innerWidth > 200; var h = window.outerHeight - window.innerHeight > 200; if(w || h) hardBlock(); }catch(e){} }, 1000); }
document.addEventListener('touchstart', function(e){ if(e.touches && e.touches.length>1){ e.preventDefault(); } }, {passive:false});
})();
