.suggest-grid{display:flex;gap:10px;overflow-x:auto;padding:4px 14px 10px;scrollbar-width:none}
.suggest-grid::-webkit-scrollbar{display:none}
.sug-card{flex:0 0 86px;width:86px;height:104px;background:#0a0a12;border:1px solid #1e1e28;border-radius:18px;padding:10px 6px 8px;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center}
.sug-card img{width:44px;height:44px;object-fit:contain;background:#fff;border-radius:12px;padding:4px}
.sug-card p{font-size:11.5px;font-weight:600;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;color:#fff}
.sug-card small{font-size:8.5px;color:#ccc;margin-top:2px}
.sug-skel{flex:0 0 86px;width:86px;height:104px;border-radius:18px;background:#0a0a12;flex-shrink:0}
.ad-wrap{margin:14px 14px 0;background:#0a0a12;border:1px solid #1e1e28;border-radius:18px;padding:12px}
.ad-label{font-size:9px;letter-spacing:3px;color:#777;text-align:center;margin-bottom:10px}
.ad-box{border-radius:12px;overflow:hidden;background:#0a0a12;display:flex;justify-content:center}
.ad-note{text-align:center;font-size:11px;color:#666;margin:14px 0 22px}
.ad-note b{color:#fff}
@media(min-width:900px){
  .main-layout{display:flex;gap:16px;padding:0 14px;max-width:1400px;margin:0 auto}
  .player-col{flex:1;min-width:0}
  #player-wrapper{width:100%;margin:12px 0 0}
  .suggest{width:330px;flex-shrink:0;margin:12px 0 0;background:#0a0a12;border:1px solid #1e1e28;border-radius:18px;padding:12px 0 8px}
  .suggest-grid{flex-direction:column;overflow-x:hidden;overflow-y:auto;padding:0 10px 10px;gap:8px}
  .sug-card{width:100%;height:62px;flex-direction:row;text-align:left;padding:8px 10px;gap:10px}
  .sug-card img{width:42px;height:42px;margin:0}
  .sug-card .sug-txt{flex:1;min-width:0;text-align:left}
  .sug-card p{margin:0;font-size:13px;text-align:left}
  .sug-card small{margin-top:2px;text-align:left}
  .sug-card .sug-play{width:30px;height:30px;flex-shrink:0;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;color:#000}
  .ad-wrap{max-width:1400px;margin-left:auto;margin-right:auto}
}
</style>

<script async="async" data-cfasync="false" src="https://czernik.org/21/cdeccdd75d3e2e6916a42ce9653cfb08"></script>
<script>
function goHome(){ window.location.href = window.location.origin + '/?t=' + Date.now(); }
function exitFsMode(){
  document.body.classList.remove('fs-mode');
  try{ if(document.fullscreenElement) document.exitFullscreen(); }catch(e){}
  try{ if(screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); }catch(e){}
}
const PROXY = "https://stream-through-spark.lovable.app/api/proxy?u=";
const urlParams = new URLSearchParams(window.location.search);
let streamSource = urlParams.get('url') || '';
try{ streamSource = decodeURIComponent(streamSource); }catch(e){}
let drmKid = urlParams.get('kid') || '';
let drmKey = urlParams.get('key') || '';
const chNameParam = urlParams.get('name') || '';
const srcParam = urlParams.get('src') || '';
const groupParam = urlParams.get('group') || '';
const autoFS = urlParams.get('fs') === '1';
const PROXY_FIRST = ['toffee','jago','ayna','tapmad'];
const PROXY_FALLBACK = ['toffee','jago','ayna','tapmad','sonyliv','bongo'];
const isToffee = PROXY_FIRST.includes(srcParam.toLowerCase()) || PROXY_FIRST.some(n => streamSource.toLowerCase().includes(n));
const canUseProxy = PROXY_FALLBACK.includes(srcParam.toLowerCase()) || PROXY_FALLBACK.some(n => streamSource.toLowerCase().includes(n));
let currentName = ''; let currentGroup = '';
try{ if(chNameParam){ currentName = decodeURIComponent(chNameParam); document.getElementById('chName').textContent = currentName; document.getElementById('chName2').textContent = currentName; document.title = currentName + ' - RsLive Go'; } }catch(e){}
try{ if(groupParam){ currentGroup = decodeURIComponent(groupParam); } }catch(e){}
const loaderEl = document.getElementById('loader');
const statusEl = document.getElementById('status-line');
const wrapper = document.getElementById('player-wrapper');
const playBtn = document.getElementById('playBtn');
const fsBtn = document.getElementById('fsBtn');
const tapPlayEl = document.getElementById('tapPlay');
const muteBtnEl = document.getElementById('muteBtn');
const serverBarEl = document.getElementById('serverBar');
const serverBarWrap = document.getElementById('serverBarWrap');
let statusTimer = setInterval(()=>{ if(loaderEl.classList.contains('hide-now')) return; statusEl.textContent = ['LOADING','CONNECTING','BUFFERING'][Math.floor(Math.random()*3)]; },1800);
function showLoader(){ loaderEl.classList.remove('hide-now'); }
function hideLoader(){ loaderEl.classList.add('hide-now'); }
function showState(html){ clearInterval(statusTimer); loaderEl.innerHTML=html; showLoader(); }
function brandBlock(){ return `<div class="brand-name"><b>RsLive</b> <i>Go</i></div>`; }
let wakeLock=null,wakeLockWanted=false;
async function requestWakeLock(){ wakeLockWanted=true; if(!('wakeLock' in navigator))return; if(wakeLock)return; if(document.visibilityState!=='visible')return; try{ wakeLock=await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release',()=>{wakeLock=null;}); }catch(e){ wakeLock=null; } }
async function releaseWakeLock(){ wakeLockWanted=false; if(wakeLock){ try{await wakeLock.release();}catch(e){} wakeLock=null; } }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&wakeLockWanted) requestWakeLock(); });
let hideCtrlTimer=null;
function showControls(){ wrapper.classList.add('show-controls'); clearTimeout(hideCtrlTimer); hideCtrlTimer=setTimeout(()=>wrapper.classList.remove('show-controls'),3000); }
function enterFsMode(){
  document.body.classList.add('fs-mode');
  const tryFS = ()=>{
    try{ if(wrapper.requestFullscreen) wrapper.requestFullscreen(); }catch(e){}
    try{ if(wrapper.webkitRequestFullscreen) wrapper.webkitRequestFullscreen(); }catch(e){}
    try{ if(screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(()=>{}); }catch(e){}
  };
  tryFS();
  document.addEventListener('touchend', tryFS, {once:true});
  document.addEventListener('click', tryFS, {once:true});
}
function toggleFullscreen(){
  if(document.body.classList.contains('fs-mode')) exitFsMode();
  else enterFsMode();
}
if(autoFS){ enterFsMode(); }
document.addEventListener('fullscreenchange', ()=>{ if(!document.fullscreenElement){ try{ if(screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); }catch(e){} } });
let lastTap = 0, singleTapTimer = null;
function handleTap(e){
  if(e.target.closest('button') || e.target.closest('input') || e.target.closest('#tapPlay') || e.target.closest('#exitFsBtn')) return;
  e.preventDefault();
  let now = Date.now();
  if(now - lastTap < 300){ clearTimeout(singleTapTimer); lastTap = 0; toggleFullscreen(); return; }
  lastTap = now; clearTimeout(singleTapTimer);
  singleTapTimer = setTimeout(()=>{ lastTap = 0; showControls(); }, 300);
}
wrapper.addEventListener('touchend', handleTap, {passive:false});
wrapper.addEventListener('click', (e)=>{ if(e.target.closest('button')||e.target.closest('input')) return; showControls(); });
wrapper.addEventListener('dblclick', (e)=>{ if(e.target.closest('button')||e.target.closest('input')) return; e.preventDefault(); toggleFullscreen(); });
wrapper.addEventListener('mousemove', showControls);
function cleanName(name){ return name.replace(/\(.*?\)/g,'').replace(/\[.*?\]/g,'').replace(/HD|FHD|4K|1080p|720p/gi,'').replace(/\s+/g,' ').trim(); }
function makeProxyUrl(o){ if(!o) return o; if(o.startsWith(PROXY)) return o; return PROXY + encodeURIComponent(o); }
class ProxyLoader extends Hls.DefaultConfig.loader {
  load(context, config, callbacks){ if(context && context.url && !context.url.startsWith(PROXY)){ context.url = makeProxyUrl(context.url); } super.load(context, config, callbacks); }
}
function getCategory(name, group){
  const t = (name + ' ' + group).toLowerCase();
  if(t.includes('sport')||t.includes('cricket')||t.includes('football')||t.includes('t sports')) return 'sports';
  if(t.includes('news')||t.includes('somoy')||t.includes('jamuna')) return 'news';
  if(t.includes('movie')||t.includes('cinema')) return 'movies';
  if(t.includes('kid')||t.includes('cartoon')||t.includes('disney')) return 'kids';
  if(t.includes('music')||t.includes('mtv')) return 'music';
  if(t.includes('bangla')||t.includes('btv')||t.includes('channel i')) return 'bangla';
  if(t.includes('star')||t.includes('sony')||t.includes('zee')||t.includes('colors')) return 'entertainment';
  return 'general';
}
function shuffle(arr){ for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }
const SUGGEST_PLAYLISTS = ["https://raw.githubusercontent.com/sm-monirulislam/Tapmad_Auto_Update_Playlist/refs/heads/main/tapmad_sm.m3u","https://raw.githubusercontent.com/sm-monirulislam/AynaOTT_Auto_Update_Playlist/refs/heads/main/aynaott.m3u","https://raw.githubusercontent.com/sm-monirulislam/jago_bd_auto_update_playlist-/refs/heads/main/jago_bd_main.m3u","https://iptv-org.github.io/iptv/countries/bd.m3u"];
const isSportsPage = (srcParam||'').toLowerCase()==='sports' || currentName.includes('Vs');
if(isSportsPage){ let sb=document.getElementById('suggestBox'); if(sb) sb.style.display='none'; }
async function loadSuggestions(){
  if(isSportsPage) return;
  const grid = document.getElementById('suggestGrid');
  const myCat = getCategory(currentName, currentGroup);
  const mySrc = (srcParam || '').toLowerCase();
  const titleEl = document.getElementById('suggestTitle');
  if(titleEl){ let label = myCat==='sports'?'Sports':myCat==='news'?'News':myCat==='movies'?'Movies':myCat==='kids'?'Kids':myCat==='music'?'Music':myCat==='bangla'?'Bangla':myCat==='entertainment'?'Entertainment':'Same Category'; titleEl.textContent = 'More ' + label; }
  try{
    let list=[];
    for(let plUrl of SUGGEST_PLAYLISTS){
      try{
        const res = await fetch(plUrl); const text = await res.text(); const lines = text.split("\n"); let cur=null;
        for(let line of lines){ line=line.trim(); if(line.startsWith("#EXTINF")){ const name=line.split(",").pop().trim(); const logoMatch=line.match(/tvg-logo="([^"]+)"/); const groupMatch=line.match(/group-title="([^"]+)"/); cur={name,logo:logoMatch?logoMatch[1]:"",group:groupMatch?groupMatch[1]:"General",src:plUrl.includes('Tapmad')?'Tapmad':plUrl.includes('Ayna')?'AynaOTT':plUrl.includes('jago')?'JagoBD':'Bangladesh'}; } else if(line.startsWith("http") && cur){ cur.url=line; if(cur.name&&cur.url && !list.find(x=>x.url===cur.url)) list.push(cur); cur=null; } }
      }catch(e){}
    }
    let filtered = list.filter(c=>c.url !== streamSource && c.name.toLowerCase() !== currentName.toLowerCase());
    let sameBoth = filtered.filter(c => c.src.toLowerCase() === mySrc && getCategory(c.name, c.group) === myCat);
    let samePlaylist = filtered.filter(c => c.src.toLowerCase() === mySrc && getCategory(c.name, c.group) !== myCat);
    let sameCat = filtered.filter(c => c.src.toLowerCase() !== mySrc && getCategory(c.name, c.group) === myCat);
    const show = [...shuffle(sameBoth), ...shuffle(samePlaylist), ...shuffle(sameCat)].slice(0,20);
    if(show.length===0) throw new Error('empty');
    grid.innerHTML = show.map(c=>`<div class="sug-card" onclick="openSuggest('${encodeURIComponent(c.url)}','${encodeURIComponent(c.name)}','${c.src}','${encodeURIComponent(c.group)}')"><img src="${c.logo || 'https://cdn-icons-png.flaticon.com/512/1179/1179069.png'}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/1179/1179069.png'"><div class="sug-txt"><p>${cleanName(c.name)}</p><small>LIVE • HD</small></div><div class="sug-play">▶</div></div>`).join("");
  }catch(e){ grid.innerHTML = `<div style="flex:0 0 100%;text-align:center;font-size:12px;color:#888;padding:10px">No more channels in this category</div>`; }
}
function openSuggest(urlEnc, nameEnc, src, groupEnc){ const url = decodeURIComponent(urlEnc); window.location.href = `player.html?url=${encodeURIComponent(url)}&name=${nameEnc}&src=${encodeURIComponent(src||'')}&group=${groupEnc||''}`; }
loadSuggestions();
if(!streamSource){
  showState(`<div class="state-content"><p class="title">No stream URL supplied</p><p class="sub">Open from Home by clicking a channel</p><button class="retry-btn" onclick="location.href='index.html'">Go Home</button>${brandBlock()}</div>`);
} else {
  const video = document.createElement('video');
  video.setAttribute('playsinline',''); video.setAttribute('webkit-playsinline','');
  video.muted = false; video.volume = 1; video.autoplay = true; video.controls = false; video.preload = 'auto'; video.playsInline = true;
  video.style.cssText='width:100%;height:100%;object-fit:contain;background:#000';
  document.getElementById('player').appendChild(video);
  let hls=null, everPlayed=false, triedDirect=false, triedProxy=false;
  let serverList = []; let currentServerIdx = 0; let autoFailTimer = null;
  try{ let savedMatch = JSON.parse(localStorage.getItem('rslive_sports_match')||'null'); if(savedMatch && savedMatch.streams && savedMatch.streams.length && savedMatch.name === currentName){ serverList = savedMatch.streams; let found = serverList.findIndex(s=>s.stream_url===streamSource); if(found>=0) currentServerIdx = found; } }catch(e){}
  function renderServers(){
    if(!serverList.length || serverList.length<2){ serverBarWrap.classList.remove('show'); return; }
    serverBarWrap.classList.add('show');
    serverBarEl.innerHTML = serverList.map((s,i)=>{ let label = s.channel_name ? s.channel_name : ('Server '+(i+1)); if(label.length>18) label = label.slice(0,18); return `<button class="srv-btn ${i===currentServerIdx?'active':''}" onclick="switchServer(${i},event)">${label}</button>`; }).join('');
  }
  function tryNextServer(){
    if(!serverList.length) return false;
    if(currentServerIdx >= serverList.length-1) return false;
    currentServerIdx++; let s = serverList[currentServerIdx];
    streamSource = s.stream_url; drmKid = s.kid || ''; drmKey = s.key || '';
    triedProxy = false; triedDirect = false; everPlayed = false;
    renderServers(); if(statusEl) statusEl.textContent = 'TRYING SERVER ' + (currentServerIdx+1); showLoader(); loadStream(streamSource, false); return true;
  }
  window.switchServer = function(idx, e){
    if(e) e.stopPropagation(); if(idx===currentServerIdx) return;
    if(autoFailTimer){ clearTimeout(autoFailTimer); autoFailTimer=null; }
    currentServerIdx = idx; let s = serverList[idx]; if(!s) return;
    streamSource = s.stream_url; drmKid = s.kid || ''; drmKey = s.key || '';
    triedProxy = false; triedDirect = false; everPlayed = false;
    renderServers(); showLoader(); loadStream(streamSource, false);
  };
  renderServers();
  function startAutoFailWatch(){
    if(autoFailTimer) clearTimeout(autoFailTimer);
    if(!serverList.length || serverList.length<2) return;
    autoFailTimer = setTimeout(()=>{ if(!everPlayed){ if(tryNextServer()) startAutoFailWatch(); } }, 6000);
  }
  function updateMuteBtn(){ muteBtnEl.textContent = (video.muted || video.volume===0) ? '🔇' : '🔊'; }
  updateMuteBtn();
  function doPlay(){
    video.muted = false; video.volume = 1; updateMuteBtn();
    video.play().then(()=>{ hideLoader(); everPlayed=true; if(autoFailTimer){clearTimeout(autoFailTimer);autoFailTimer=null;} tapPlayEl.classList.remove('show'); updateMuteBtn(); requestWakeLock(); if(autoFS) enterFsMode(); }).catch(()=>{
      video.muted = true;
      video.play().then(()=>{ hideLoader(); everPlayed=true; if(autoFailTimer){clearTimeout(autoFailTimer);autoFailTimer=null;} updateMuteBtn(); requestWakeLock(); if(autoFS) enterFsMode(); }).catch(()=>{ tapPlayEl.classList.add('show'); });
      updateMuteBtn();
    });
  }
  tapPlayEl.addEventListener('click', ()=>{ video.muted=false; video.volume=1; video.play().then(()=>{ tapPlayEl.classList.remove('show'); hideLoader(); updateMuteBtn(); if(autoFS) enterFsMode(); }).catch(()=>{}); });
  muteBtnEl.addEventListener('click', (e)=>{ e.stopPropagation(); video.muted = !video.muted; if(!video.muted){ video.volume=1; video.play().catch(()=>{}); } updateMuteBtn(); showControls(); });
  let shakaPlayer = null;
  function loadStream(url, viaProxy){
    if(hls){ try{hls.destroy();}catch(e){} hls=null; }
    if(shakaPlayer){ try{ shakaPlayer.destroy(); }catch(e){} shakaPlayer=null; }
    video.removeAttribute('src'); video.load();
    startAutoFailWatch();
    if(url.includes('.m3u8') || url.includes('m3u8')){
      if(window.Hls && Hls.isSupported()){
        const cfg = { maxBufferLength:30, maxMaxBufferLength:60, enableWorker:false, manifestLoadingMaxRetry:2, levelLoadingMaxRetry:2, fragLoadingMaxRetry:2 };
        if(viaProxy){ cfg.loader = ProxyLoader; }
        hls = new Hls(cfg); hls.loadSource(url); hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, ()=>{ doPlay(); });
        hls.on(Hls.Events.ERROR, (e,data)=>{
          if(!data.fatal) return;
          if(data.type===Hls.ErrorTypes.NETWORK_ERROR){
            if(!everPlayed && tryNextServer()) return;
            if(!viaProxy && canUseProxy && !triedProxy){ triedProxy=true; loadStream(makeProxyUrl(streamSource), true); }
            else if(viaProxy && !triedDirect){ triedDirect=true; loadStream(streamSource, false); }
            else { hls.startLoad(); }
          } else if(data.type===Hls.ErrorTypes.MEDIA_ERROR){ hls.recoverMediaError(); }
          else {
            if(!everPlayed && tryNextServer()) return;
            if(!viaProxy && canUseProxy && !triedProxy){ triedProxy=true; loadStream(makeProxyUrl(streamSource), true); }
            else if(viaProxy && !triedDirect){ triedDirect=true; loadStream(streamSource, false); }
            else showNoStreamState({message:'HLS Error: '+data.details});
          }
        });
      } else if(video.canPlayType('application/vnd.apple.mpegurl')){ video.src=url; doPlay(); }
      else { showNoStreamState({message:'Browser does not support HLS'}); }
    } else if(url.includes('.mpd') || url.includes('dash')){ loadDash(url); }
    else { video.src=url; doPlay(); }
  }
  async function loadDash(url){
    try{
      if(shakaPlayer){ try{ await shakaPlayer.destroy(); }catch(e){} shakaPlayer=null; }
      shaka.polyfill.installAll();
      if(!shaka.Player.isBrowserSupported()){ showNoStreamState({message:'Browser does not support DASH'}); return; }
      shakaPlayer = new shaka.Player(video);
      shakaPlayer.addEventListener('error', (e)=>{ if(!everPlayed && tryNextServer()) return; showNoStreamState({message: (e.detail && e.detail.message) || 'DRM / DASH Error'}); });
      if(drmKid && drmKey){ shakaPlayer.configure({ drm: { clearKeys: { [drmKid]: drmKey } } }); }
      await shakaPlayer.load(url); doPlay();
    }catch(e){ if(!everPlayed && tryNextServer()) return; showNoStreamState({message: e.message || 'DASH Load Failed'}); }
  }
  function showNoStreamState(err){
    if(!everPlayed && tryNextServer()) return;
    releaseWakeLock(); tapPlayEl.classList.remove('show');
    showState(`<div class="state-content"><div style="font-size:34px">❌</div><p class="title">This channel is not playing right now</p><p class="sub">${err&&err.message?err.message:'The source could not be reached.'}</p><button class="retry-btn" onclick="location.reload()">Retry</button><br><button class="retry-btn2" onclick="tryProxyManually()">Try with Proxy</button><br><button class="retry-btn2" onclick="tryDirectManually()">Try Direct</button><br><button class="retry-btn2" onclick="location.href='index.html'">Go Home</button>${brandBlock()}</div>`);
  }
  window.tryProxyManually = function(){ showLoader(); loadStream(makeProxyUrl(streamSource), true); };
  window.tryDirectManually = function(){ showLoader(); loadStream(streamSource, false); };
  video.addEventListener('playing',()=>{ hideLoader(); everPlayed=true; if(autoFailTimer){clearTimeout(autoFailTimer);autoFailTimer=null;} tapPlayEl.classList.remove('show'); updateMuteBtn(); requestWakeLock(); });
  video.addEventListener('waiting',()=>{ if(!video.paused) showLoader(); });
  video.addEventListener('pause',()=>{ playBtn.textContent='▶'; releaseWakeLock(); });
  video.addEventListener('play',()=>{ playBtn.textContent='❚❚'; requestWakeLock(); });
  video.addEventListener('volumechange',()=>{ updateMuteBtn(); });
  video.addEventListener('error',()=>{ if(!everPlayed && tryNextServer()) return; if(!everPlayed && canUseProxy && !triedProxy){ triedProxy=true; loadStream(makeProxyUrl(streamSource), true); } });
  playBtn.addEventListener('click',(e)=>{ e.stopPropagation(); if(video.paused){ video.muted=false; video.volume=1; video.play(); updateMuteBtn(); } else { video.pause(); } showControls(); });
  fsBtn.addEventListener('click',(e)=>{ e.stopPropagation(); toggleFullscreen(); showControls(); });
  if(isToffee){ loadStream(makeProxyUrl(streamSource), true); } else { loadStream(streamSource, false); }
}
</script>
<script>
(function(){
  if(window.top !== window.self){ try{ window.top.location = window.self.location; }catch(e){ document.body.innerHTML=''; } }
  document.addEventListener('contextmenu', e=>{ e.preventDefault(); return false; });
  document.addEventListener('copy', e=>{ e.preventDefault(); return false; });
})();
</script>
