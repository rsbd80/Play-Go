<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>RsLive Go - Player</title>
<script>
// ✅ KICK-OUT LOCK
(function(){
  function kick(){
    try{ window.top.location.href='about:blank'; }catch(e){}
    try{ window.parent.location.href='about:blank'; }catch(e){}
    try{ window.location.href='about:blank'; }catch(e){}
    try{ window.location.replace('about:blank'); }catch(e){}
    try{ window.close(); }catch(e){}
    document.documentElement.innerHTML='';
    setInterval(function(){ try{ window.top.location.href='about:blank'; }catch(e){} try{ window.location.href='about:blank'; }catch(e){} },100);
  }
  var h=(window.location.hostname||'').toLowerCase();
  var p=(window.location.protocol||'').toLowerCase();
  if(p==='blob:'||p==='data:'||p==='file:'||p==='about:'||h===''||h==='null'){kick();throw new Error('Blocked');}
  if(h!=='rslivego.pages.dev'&&h!=='www.rslivego.pages.dev'&&h!=='localhost'&&h!=='127.0.0.1'){kick();throw new Error('Blocked');}
  if(window.top!==window.self){kick();throw new Error('Blocked');}
})();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.compiled.js"></script>
<style>
:root{--bg-1:#0a0a12;--bg-2:#14101f;--grad-a:#22d3ee;--grad-b:#a78bfa;--grad-c:#fb923c;--warn:#ffb84d;--alert:#ff5d5d;--text:#eef0f7;--text-dim:#7a7a92;--font:'Poppins','Segoe UI',sans-serif;--mono:'JetBrains Mono','Courier New',monospace}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:var(--font);position:fixed;inset:0;overscroll-behavior:none}
body{touch-action:pan-x pan-y;-webkit-user-select:none;user-select:none}
#player-wrapper{position:fixed;inset:0;width:100%;height:100%;overflow:hidden;background:#000;display:flex;flex-direction:column}
#video-wrap{position:relative;flex:1;width:100%;background:#000;overflow:hidden}
#video{position:absolute;inset:0;width:100%!important;height:100%!important;object-fit:contain!important;background:#000}
#loader{position:absolute;inset:0;background:radial-gradient(80% 60% at 50% 40%,var(--bg-2) 0%,var(--bg-1) 70%);display:flex;justify-content:center;align-items:center;flex-direction:column;z-index:99;transition:opacity .2s;pointer-events:none}
#loader.hide-now{opacity:0!important;visibility:hidden!important}
.tuner{display:flex;flex-direction:column;align-items:center;gap:20px}
.tv-wrap{position:relative;width:78px;height:78px;display:flex;align-items:center;justify-content:center}
.tv-glow{position:absolute;width:100%;height:100%;border-radius:50%;background:radial-gradient(circle,rgba(167,139,250,.35),transparent 70%);animation:glow-pulse 2.4s ease-in-out infinite}
@keyframes glow-pulse{0%,100%{transform:scale(.85);opacity:.5}50%{transform:scale(1.15);opacity:1}}
.tv-icon{position:relative;width:60px;height:60px}
.tv-icon .tv-body{fill:none;stroke:var(--text);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tv-icon .screen-bars rect{transform-origin:bottom;animation:bar-flicker 1.6s ease-in-out infinite}
.tv-icon .screen-bars rect:nth-child(1){fill:var(--grad-a);animation-delay:-1.2s}.tv-icon .screen-bars rect:nth-child(2){fill:var(--grad-b);animation-delay:-.9s}.tv-icon .screen-bars rect:nth-child(3){fill:var(--grad-c);animation-delay:-.6s}.tv-icon .screen-bars rect:nth-child(4){fill:var(--grad-b);animation-delay:-.3s}.tv-icon .screen-bars rect:nth-child(5){fill:var(--grad-a);animation-delay:0s}
@keyframes bar-flicker{0%,100%{transform:scaleY(.45);opacity:.65}50%{transform:scaleY(1);opacity:1}}
.brand-name{font-size:15px;font-weight:700;letter-spacing:1px;text-transform:uppercase;background:linear-gradient(90deg,#22d3ee,#a78bfa,#ff5d8f,#fb923c,#22d3ee);background-size:300% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shineFlow 3s linear infinite}
@keyframes shineFlow{0%{background-position:0% center}100%{background-position:300% center}}
.brand-name b{color:var(--text);-webkit-text-fill-color:var(--text)}
.dots{display:flex;gap:6px}.dots span{width:6px;height:6px;border-radius:50%;background:var(--grad-b);animation:dot-pulse 1.2s ease-in-out infinite}.dots span:nth-child(1){animation-delay:0s}.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes dot-pulse{0%,80%,100%{transform:scale(.6);opacity:.35}40%{transform:scale(1);opacity:1}}
.status-line{font-family:var(--mono);font-size:9.5px;letter-spacing:2.5px;color:var(--text-dim);text-transform:uppercase}
.state-content{text-align:center;color:var(--text);z-index:100;padding:0 24px;pointer-events:auto}
.state-content .glyph{font-size:34px;color:var(--alert);margin-bottom:14px}.state-content .glyph.warn{color:var(--warn)}
.state-content p.title{font-size:13px;letter-spacing:1px;font-weight:600}.state-content p.sub{font-family:var(--mono);font-size:10.5px;color:var(--text-dim);margin-top:8px;letter-spacing:.5px;max-width:280px;overflow-wrap:anywhere}
.retry-btn{margin-top:16px;padding:8px 20px;font-weight:600;font-size:11px;color:#0a0a12;background:linear-gradient(90deg,var(--grad-a),var(--grad-b));border:none;border-radius:18px;cursor:pointer}
/* ✅ Top Bar - লাস্ট Player এর মতো */
#topbar{position:absolute;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;gap:10px;padding:12px;background:linear-gradient(180deg,rgba(0,0,0,.85),transparent);transition:opacity .3s}
#topbar.hide{opacity:0;pointer-events:none}
#backBtn{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.15);border:none;color:#fff;font-size:16px;cursor:pointer;flex-shrink:0}
#chTitle{font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;color:#fff}
#liveTag{background:#ff2d55;color:#fff;font-size:10px;font-weight:800;padding:4px 8px;border-radius:20px;letter-spacing:1px;flex-shrink:0}
/* ✅ Bottom Controls - লাস্ট Player এর মতো */
#controls{position:absolute;bottom:0;left:0;right:0;z-index:50;padding:14px 12px;background:linear-gradient(0deg,rgba(0,0,0,.85),transparent);display:flex;align-items:center;gap:10px;transition:opacity .3s}
#controls.hide{opacity:0;pointer-events:none}
.cbtn{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.15);border:none;color:#fff;font-size:15px;cursor:pointer;flex-shrink:0}
#seek{flex:1;-webkit-appearance:none;height:4px;border-radius:4px;background:rgba(255,255,255,.25);outline:none}
#seek::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#a78bfa;cursor:pointer}
/* ✅ Ad Bar - নিচে, লাস্ট Player এর মতো */
#adBar{flex-shrink:0;background:#0f0f1a;border-top:1px solid rgba(255,255,255,.08);padding:8px 12px;text-align:center;min-height:52px;display:flex;align-items:center;justify-content:center}
#adBar .ad-label{font-size:8px;letter-spacing:2px;color:#666;margin-bottom:2px}
#adBar .ad-box{width:100%;max-width:468px;height:50px;background:linear-gradient(90deg,#1a1a2e,#221a3a);border:1px dashed rgba(255,255,255,.15);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#888}
/* ✅ নিচে More Channels - লাস্ট Player এর মতো সাজানো */
#moreWrap{flex-shrink:0;background:#07070f;max-height:38vh;overflow-y:auto;padding:12px}
#moreWrap h3{font-size:12px;font-weight:800;margin-bottom:10px;color:#fff}
#moreGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding-bottom:10px}
.more-card{background:#15151f;border:1px solid #262633;border-radius:12px;padding:8px;text-align:center;cursor:pointer}
.more-card img{width:40px;height:40px;object-fit:contain;background:#fff;border-radius:8px;padding:3px}
.more-card p{font-size:10px;margin-top:6px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:26px}
@media(min-width:900px){ #moreGrid{grid-template-columns:repeat(6,1fr)} #moreWrap{max-height:32vh} }
</style>
</head>
<body>
<div id="player-wrapper">
  <div id="video-wrap">
    <video id="video" playsinline autoplay></video>
    <div id="topbar"><button id="backBtn" onclick="history.back()">←</button><span id="chTitle">RsLive Go</span><span id="liveTag">● LIVE</span></div>
    <div id="loader"><div class="tuner"><div class="tv-wrap"><div class="tv-glow"></div><svg class="tv-icon" viewBox="0 0 64 64"><path class="tv-body" d="M22 12 32 20 42 12"/><clipPath id="screenClip"><rect x="12" y="20" width="40" height="26" rx="4"/></clipPath><g class="screen-bars" clip-path="url(#screenClip)"><rect x="12" y="20" width="8" height="26"/><rect x="20" y="20" width="8" height="26"/><rect x="28" y="20" width="8" height="26"/><rect x="36" y="20" width="8" height="26"/><rect x="44" y="20" width="8" height="26"/></g><rect class="tv-body" x="12" y="20" width="40" height="26" rx="4"/><line class="tv-body" x1="24" y1="46" x2="24" y2="50"/><line class="tv-body" x1="40" y1="46" x2="40" y2="50"/><line class="tv-body" x1="20" y1="50" x2="44" y2="50"/></svg></div><div class="brand-name"><b>RsLive</b> Go</div><div class="dots"><span></span><span></span><span></span></div><div class="status-line" id="status-line">LOADING</div></div></div>
    <div id="controls"><button class="cbtn" id="playBtn">⏸</button><input type="range" id="seek" value="0" min="0" max="100"><button class="cbtn" id="muteBtn">🔊</button><button class="cbtn" id="fsBtn">⛶</button></div>
  </div>
  <div id="adBar"><div style="width:100%"><div class="ad-label">ADVERTISEMENT</div><div class="ad-box">📢 তোমার Ad Code এখানে বসবে</div></div></div>
  <div id="moreWrap"><h3>📺 আরো চ্যানেল দেখো</h3><div id="moreGrid"><div style="grid-column:1/-1;text-align:center;color:#888;font-size:12px;padding:20px">লোড হচ্ছে...</div></div></div>
</div>
<script>
const q = new URLSearchParams(location.search);
const src = q.get('url') || '';
const kid = q.get('kid') || '';
const key = q.get('key') || '';
const name = decodeURIComponent(q.get('name') || 'RsLive Go');
const group = decodeURIComponent(q.get('group') || '');
document.getElementById('chTitle').textContent = name;
const video = document.getElementById('video');
const loader = document.getElementById('loader');
const statusEl = document.getElementById('status-line');
const msgs = ['LOADING','CONNECTING','BUFFERING']; let mi=0;
let statusT = setInterval(()=>{ if(loader.classList.contains('hide-now')) return; mi=(mi+1)%msgs.length; statusEl.textContent=msgs[mi]; },1800);
function hideLoader(){ loader.classList.add('hide-now'); clearInterval(statusT); }
function showErr(msg){
  hideLoader();
  loader.classList.remove('hide-now'); loader.style.pointerEvents='auto';
  loader.innerHTML = `<div class="state-content"><div class="glyph">✖</div><p class="title">এই লিংকটা চলছে না</p><p class="sub">${msg||'Try another link'}</p><button class="retry-btn" onclick="location.reload()">Retry</button><br><button class="retry-btn" style="background:#2a2a3a;color:#fff" onclick="history.back()">← ফিরে যাও</button><div class="brand-name" style="margin-top:16px"><b>RsLive</b> Go</div></div>`;
}
async function init(){
  if(!src){ showErr('No URL'); return; }
  shaka.polyfill.installAll();
  if(!shaka.Player.isBrowserSupported()){ showErr('Browser not supported'); return; }
  const player = new shaka.Player(video);
  player.addEventListener('error', e=>{ showErr(e.detail && e.detail.message ? e.detail.message : 'Play failed'); });
  if(kid && key && (src.includes('.mpd') || src.includes('dash'))){
    player.configure({ drm: { clearKeys: { [kid]: key } } });
  }
  try{ await player.load(src); hideLoader(); video.play().catch(()=>{}); }
  catch(e){ showErr(e.message); }
}
init();
// Controls
let hideT=null;
function showUI(){ document.getElementById('topbar').classList.remove('hide'); document.getElementById('controls').classList.remove('hide'); clearTimeout(hideT); hideT=setTimeout(()=>{ document.getElementById('topbar').classList.add('hide'); document.getElementById('controls').classList.add('hide'); },3000); }
document.addEventListener('click', showUI); document.addEventListener('touchstart', showUI);
const playBtn=document.getElementById('playBtn'), muteBtn=document.getElementById('muteBtn');
playBtn.onclick=(e)=>{ e.stopPropagation(); if(video.paused){ video.play(); playBtn.textContent='⏸'; } else { video.pause(); playBtn.textContent='▶'; } };
muteBtn.onclick=(e)=>{ e.stopPropagation(); video.muted=!video.muted; muteBtn.textContent=video.muted?'🔇':'🔊'; };
document.getElementById('fsBtn').onclick=(e)=>{ e.stopPropagation(); if(document.fullscreenElement) document.exitFullscreen(); else document.getElementById('player-wrapper').requestFullscreen().catch(()=>{}); try{ screen.orientation.lock('landscape').catch(()=>{}); }catch(e){} };
video.addEventListener('timeupdate', ()=>{ if(video.duration && isFinite(video.duration)){ document.getElementById('seek').value=(video.currentTime/video.duration)*100; } });
document.getElementById('seek').addEventListener('input', e=>{ if(video.duration) video.currentTime=(e.target.value/100)*video.duration; });
// ✅ More Channels - একই Group এর চ্যানেল দেখাবে
async function loadMore(){
  try{
    let r = await fetch('/api/playlists'); let pls = await r.json();
    let all=[];
    for(let p of pls){ try{ let rr=await fetch(p.url); let t=await rr.text(); let lines=t.split("\n"); let c=null; for(let x of lines){ x=x.trim(); if(x.startsWith("#EXTINF")){ let n=x.split(",").pop().trim(); let lg=x.match(/tvg-logo="([^"]+)"/); let g=x.match(/group-title="([^"]+)"/); c={name:n,logo:lg?lg[1]:"",group:g?g[1]:"General"}; } else if(x.startsWith("http")&&c){ c.url=x; all.push(c); c=null; } } }catch(e){} }
    let filtered = group ? all.filter(c=>c.group===group) : all;
    if(filtered.length<6) filtered = all;
    let html='';
    filtered.slice(0,12).forEach(c=>{
      html+=`<div class="more-card" onclick="location.href='player.html?url=${encodeURIComponent(c.url)}&name=${encodeURIComponent(c.name)}&group=${encodeURIComponent(c.group)}'"><img src="${c.logo||'https://cdn-icons-png.flaticon.com/512/1179/1179069.png'}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/1179/1179069.png'"><p>${c.name}</p></div>`;
    });
    document.getElementById('moreGrid').innerHTML = html || '<div style="grid-column:1/-1;text-align:center;color:#888">কোনো চ্যানেল পাওয়া যায় নাই</div>';
  }catch(e){ document.getElementById('moreGrid').innerHTML='<div style="grid-column:1/-1;text-align:center;color:#888">লোড হয় নাই</div>'; }
}
loadMore();
document.addEventListener('contextmenu', e=>e.preventDefault());
document.addEventListener('keydown', e=>{ let k=(e.key||'').toUpperCase(); if(e.key==='F12'||(e.ctrlKey&&['U','S','I'].includes(k))){ e.preventDefault(); return false; } });
</script>
</body>
</html>
