<script>
/* ================= POWERFUL PLAYER - RsLive Go ================= */
const PROXY = "https://stream-through-spark.lovable.app/api/proxy?u=";
const SPORTS_JSON = "https://raw.githubusercontent.com/sm-monirulislam/Upcoming-and-Live-Sports-Data/refs/heads/main/Sports_data.json";
const SUGGEST_PLAYLISTS = [
  "https://raw.githubusercontent.com/sm-monirulislam/Tapmad_Auto_Update_Playlist/refs/heads/main/tapmad_sm.m3u",
  "https://raw.githubusercontent.com/sm-monirulislam/SonyLiv_Event_Playlist/refs/heads/main/sonyLiv.m3u",
  "https://raw.githubusercontent.com/sm-monirulislam/Toffee-Auto-Update/refs/heads/main/toffee_playlist.m3u",
  "https://raw.githubusercontent.com/sm-monirulislam/AynaOTT_Auto_Update_Playlist/refs/heads/main/aynaott.m3u",
  "https://raw.githubusercontent.com/sm-monirulislam/jago_bd_auto_update_playlist-/refs/heads/main/jago_bd_main.m3u"
];
const P = new URLSearchParams(location.search);
let streamSource = P.get('url') || '';
try{ streamSource = decodeURIComponent(streamSource); }catch(e){}
let currentName = ''; try{ currentName = decodeURIComponent(P.get('name')||''); }catch(e){ currentName = P.get('name')||''; }
let srcParam = P.get('src')||''; let groupParam = ''; try{ groupParam = decodeURIComponent(P.get('group')||''); }catch(e){}
let currentKid = ''; try{ currentKid = decodeURIComponent(P.get('kid')||''); }catch(e){}
let currentKey = ''; try{ currentKey = decodeURIComponent(P.get('key')||''); }catch(e){}
// clearkey JSON আকারে আসলে: {"kid":"key"}
if(currentKid && currentKid.startsWith('{')){ try{ let o=JSON.parse(currentKid); let k=Object.keys(o)[0]; currentKid=k; currentKey=o[k]; }catch(e){} }
if(currentKey && currentKey.startsWith('{')){ try{ let o=JSON.parse(currentKey); let k=Object.keys(o)[0]; currentKid=k; currentKey=o[k]; }catch(e){} }
// kid/key যদি একসাথে আসে: kid:key
if(currentKid && currentKid.includes(':') && !currentKey){ let parts=currentKid.split(':'); currentKid=parts[0]; currentKey=parts[1]; }

if(currentName){ document.getElementById('chName2').textContent = currentName; document.title = currentName + ' - RsLive Go'; }
const IS_TOUCH = ('ontouchstart' in window) || navigator.maxTouchPoints>0;
const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
const wrapper = document.getElementById('player-wrapper');
const loaderEl = document.getElementById('loader');
const debugBox = document.getElementById('debugBox');
const qualityMenu = document.getElementById('qualityMenu');
const LOADER_HTML = loaderEl.innerHTML;

let video=null, hls=null, shakaPlayer=null, everPlayed=false;
let SERVER_LIST=[], CURRENT_SERVER_IDX=0, playSession=0, failoverTimer=null;
let isSwitching=false, sameServerRetry=0, triedProxy=false;
let statusTimer=null, statusIdx=0;
const statusMsgs=['LOADING','CONNECTING','BUFFERING','DECODING'];

function logDebug(msg){ debugBox.style.display='block'; debugBox.textContent = msg; setTimeout(()=>{ debugBox.style.display='none'; }, 6000); console.log('[RsLive]', msg); }
function startStatus(){ if(statusTimer) clearInterval(statusTimer); statusTimer=setInterval(()=>{ let s=document.getElementById('status-line'); if(s && !loaderEl.classList.contains('hide')){ statusIdx=(statusIdx+1)%statusMsgs.length; s.textContent=statusMsgs[statusIdx]; } },1500); }
startStatus();
function showLoader(){ if(!document.getElementById('status-line')) loaderEl.innerHTML=LOADER_HTML; loaderEl.classList.remove('hide'); }
function hideLoader(){ loaderEl.classList.add('hide'); }
function showState(title, sub, showRetry){
  if(statusTimer) clearInterval(statusTimer);
  loaderEl.innerHTML = `<div class="state"><div class="g">❌</div><p><b>${title}</b></p><small>${sub}</small>${showRetry?`<br><button onclick="manualRetry()">↻ আবার চেষ্টা করো</button><br><button onclick="nextServerManual()" style="background:rgba(255,255,255,.15)">⏭️ Next Server</button>`:''}</div>`;
  loaderEl.classList.remove('hide');
}
function brandLoader(){ loaderEl.innerHTML=LOADER_HTML; startStatus(); showLoader(); }

let hideT=null;
function hideControls(){ wrapper.classList.remove('show'); qualityMenu.classList.remove('show'); }
function showControls(){ wrapper.classList.add('show'); clearTimeout(hideT); hideT=setTimeout(hideControls, 3500); }
let lastTap=0, tapTimer=null, ignoreClick=false;
function handleTap(e){
  if(e.target.closest('button')||e.target.closest('input')||e.target.closest('#qualityMenu')) return;
  if(qualityMenu.classList.contains('show')){ hideControls(); return; }
  e.preventDefault(); let now=Date.now();
  if(now-lastTap<300){ clearTimeout(tapTimer); tapTimer=null; lastTap=0; ignoreClick=true; setTimeout(()=>ignoreClick=false,400); toggleFS(); return; }
  lastTap=now; clearTimeout(tapTimer); tapTimer=setTimeout(()=>{ lastTap=0; wrapper.classList.contains('show')?hideControls():showControls(); },300);
}
if(IS_TOUCH){ wrapper.addEventListener('touchend',handleTap,{passive:false}); }
else { wrapper.addEventListener('click',(e)=>{ if(e.target.closest('button')||e.target.closest('input')) return; if(qualityMenu.classList.contains('show')){hideControls();return;} wrapper.classList.contains('show')?hideControls():showControls(); }); wrapper.addEventListener('dblclick',(e)=>{ if(e.target.closest('button')||e.target.closest('input')) return; toggleFS(); }); }
wrapper.addEventListener('mousemove',showControls);
let fsBusy=false;
async function toggleFS(){ if(fsBusy) return; fsBusy=true; setTimeout(()=>fsBusy=false,600); const v=getVideo(); if(!v) return; if(IS_IOS){ try{ if(v.webkitDisplayingFullscreen) v.webkitExitFullscreen(); else v.webkitEnterFullscreen(); }catch(e){} return; } if(document.fullscreenElement){ try{ await document.exitFullscreen(); }catch(e){} try{ screen.orientation.unlock(); }catch(e){} } else { try{ await wrapper.requestFullscreen(); }catch(e){} try{ await screen.orientation.lock('landscape'); }catch(e){} } }
document.getElementById('fsBtn').onclick=(e)=>{ e.stopPropagation(); toggleFS(); showControls(); };
document.getElementById('retryBtn').onclick=(e)=>{ e.stopPropagation(); manualRetry(); showControls(); };

function getVideo(){ return document.querySelector('#player video'); }
function ensureVideo(){
  if(video) return video;
  video=document.createElement('video');
  video.setAttribute('playsinline',''); video.setAttribute('webkit-playsinline','');
  video.muted=false; video.volume=1; video.autoplay=true; video.controls=false; video.preload='auto'; video.playsInline=true;
  video.style.cssText='width:100%;height:100%;object-fit:fill;background:#000';
  document.getElementById('player').appendChild(video);
  video.addEventListener('playing',()=>{ hideLoader(); everPlayed=true; sameServerRetry=0; isSwitching=false; if(failoverTimer){clearTimeout(failoverTimer); failoverTimer=null;} updateMute(); });
  video.addEventListener('waiting',()=>{ if(!video.paused) showLoader(); });
  video.addEventListener('pause',()=>{ document.getElementById('playBtn').textContent='▶'; });
  video.addEventListener('play',()=>{ document.getElementById('playBtn').textContent='❚❚'; });
  video.addEventListener('volumechange',updateMute);
  return video;
}
function updateMute(){ if(!video) return; document.getElementById('muteBtn').textContent = (video.muted||video.volume===0)?'🔇':'🔊'; }
function doPlay(){ if(!video) return; video.muted=false; video.volume=1; updateMute(); let p=video.play(); if(p) p.then(()=>{hideLoader(); everPlayed=true;}).catch(()=>{ video.muted=true; video.play().catch(()=>{}); updateMute(); }); }
document.getElementById('muteBtn').onclick=(e)=>{ e.stopPropagation(); if(!video) return; video.muted=!video.muted; if(!video.muted){ video.volume=1; video.play().catch(()=>{}); } updateMute(); showControls(); };
document.getElementById('playBtn').onclick=(e)=>{ e.stopPropagation(); if(!video) return; if(video.paused){ video.muted=false; video.volume=1; video.play(); } else video.pause(); showControls(); };

/* ===== UNIVERSAL EXTRACTOR ===== */
function extractStreamsDeep(obj, out, kidKey){
  if(!obj) return out;
  if(typeof obj==='string'){
    if(obj.startsWith('http') && (obj.includes('.m3u8')||obj.includes('.mpd')||obj.includes('.mp4')||obj.includes('stream')||obj.includes('live'))){
      if(!obj.match(/\.(png|jpg|jpeg|webp|svg)(\?|$)/i)) out.push({url:obj, kid:kidKey?.kid||'', key:kidKey?.key||''});
    }
    return out;
  }
  if(Array.isArray(obj)){ obj.forEach(v=>extractStreamsDeep(v,out,kidKey)); return out; }
  if(typeof obj==='object'){
    let localKid = kidKey?.kid||'', localKey = kidKey?.key||'';
    for(let k in obj){
      let lk=k.toLowerCase(); let v=obj[k];
      if(lk==='clearkey' && typeof v==='object'){ let ks=Object.keys(v); if(ks.length){ localKid=ks[0]; localKey=v[ks[0]]; } }
      if((lk==='kid'||lk==='key_id') && typeof v==='string') localKid=v;
      if((lk==='key'||lk==='drm_key'||lk==='k') && typeof v==='string' && v.length>10) localKey=v;
    }
    for(let k in obj){
      let lk=k.toLowerCase(); let v=obj[k];
      if(typeof v==='string' && v.startsWith('http') && (lk.includes('stream')||lk.includes('link')||lk.includes('url')||lk.includes('server')||lk.includes('m3u')||lk.includes('mpd')||lk.includes('play')||lk.includes('src')||lk.includes('source')||lk.includes('embed'))){
        if(!v.match(/\.(png|jpg|jpeg|webp|svg)(\?|$)/i)) out.push({url:v, kid:localKid, key:localKey});
      } else extractStreamsDeep(v,out,{kid:localKid,key:localKey});
    }
  }
  return out;
}
function isDashUrl(url){ if(!url) return false; let u=url.toLowerCase(); if(u.includes('.mpd')) return true; if(u.includes('/dash')||u.includes('manifest')) return true; if(currentKid&&currentKey) return true; return false; }
function isHlsUrl(url){ return url.toLowerCase().includes('.m3u8')||url.toLowerCase().includes('m3u8'); }
function makeProxy(o){ if(!o||o.startsWith(PROXY)) return o; return PROXY+encodeURIComponent(o); }
class ProxyLoader extends Hls.DefaultConfig.loader{ load(c,cf,cb){ if(c&&c.url&&!c.url.startsWith(PROXY)) c.url=makeProxy(c.url); super.load(c,cf,cb); } }

/* ===== QUALITY ===== */
let currentQuality='auto';
function qLabel(h){ if(!h) return 'AUTO'; if(h<=360) return '360p'; if(h<=480) return '480p'; if(h<=540) return '540p'; if(h<=720) return '720p'; if(h<=1080) return '1080p'; return h+'p'; }
function buildQuality(){
  let opts=[{id:'auto',label:'Auto',sub:'নেট অনুযায়ী'}];
  if(hls&&hls.levels&&hls.levels.length){ let seen=new Set(); hls.levels.forEach((lv,i)=>{ let lbl=qLabel(lv.height||0); if(!seen.has(lbl)){ seen.add(lbl); opts.push({id:'hls-'+i,label:lbl,sub:Math.round((lv.bitrate||0)/1000)+' kbps',level:i,height:lv.height||0}); } }); opts=[opts[0],...opts.slice(1).sort((a,b)=>(b.height||0)-(a.height||0))]; }
  else if(shakaPlayer){ try{ let tracks=shakaPlayer.getVariantTracks(); let seen=new Set(); tracks.forEach(t=>{ let lbl=qLabel(t.height||0); if(!seen.has(lbl)){ seen.add(lbl); opts.push({id:'shaka-'+t.id,label:lbl,sub:Math.round((t.bandwidth||0)/1000)+' kbps',trackId:t.id,height:t.height||0}); } }); opts=[opts[0],...opts.slice(1).sort((a,b)=>(b.height||0)-(a.height||0))]; }catch(e){} }
  if(opts.length<=1) opts=[{id:'auto',label:'Auto',sub:'নেট অনুযায়ী'},{id:'low',label:'360p',sub:'লো নেট • স্মুথ',height:360},{id:'med',label:'480p',sub:'মিডিয়াম',height:480},{id:'high',label:'720p',sub:'ভালো নেট',height:720},{id:'fhd',label:'1080p',sub:'হাই কোয়ালিটি',height:1080}];
  qualityMenu.innerHTML=`<div class="qm-t">⚙️ QUALITY</div>`+opts.map(o=>{ let act=(currentQuality==='auto'&&o.id==='auto')||currentQuality===o.label; return `<div class="qm-o ${act?'active':''}" onclick="setQuality('${o.id}','${o.label}',${o.level??-1},${o.trackId??-1},${o.height||0})">${o.label} <small>${o.sub||''}</small></div>`; }).join('');
}
function setQuality(id,label,level,trackId,height){
  currentQuality=(id==='auto')?'auto':label; hideControls();
  if(hls){ if(id==='auto'){ hls.currentLevel=-1; hls.autoLevelEnabled=true; } else if(level>=0){ hls.currentLevel=level; hls.autoLevelEnabled=false; } else { let best=-1,bd=99999; hls.levels.forEach((lv,i)=>{ let d=Math.abs((lv.height||0)-height); if(d<bd){bd=d;best=i;} }); if(best>=0){ hls.currentLevel=best; hls.autoLevelEnabled=false; } } }
  if(shakaPlayer){ try{ if(id==='auto') shakaPlayer.configure({abr:{enabled:true}}); else { shakaPlayer.configure({abr:{enabled:false}}); let tr=shakaPlayer.getVariantTracks(); let tg=null; if(trackId>=0) tg=tr.find(t=>t.id===trackId); if(!tg&&height) tg=tr.reduce((a,b)=>Math.abs((a.height||0)-height)<Math.abs((b.height||0)-height)?a:b); if(tg) shakaPlayer.selectVariantTrack(tg,true); } }catch(e){} }
  buildQuality();
}
window.setQuality=setQuality;
document.getElementById('qualityBtn').onclick=(e)=>{ e.stopPropagation(); buildQuality(); qualityMenu.classList.toggle('show'); showControls(); };
document.addEventListener('click',(e)=>{ if(!e.target.closest('#qualityMenu')&&!e.target.closest('#qualityBtn')) qualityMenu.classList.remove('show'); });

/* ===== CORE LOAD ===== */
function updateServerUI(a,f){
  document.querySelectorAll('.server-chip').forEach((el,i)=>{ el.classList.toggle('playing',i===a); if(i===f) el.classList.add('fail'); let s=document.getElementById('server-sub-'+i); if(s){ if(i===f) s.textContent='✕ FAILED'; else if(i===a) s.textContent='▶ PLAYING'; else s.textContent='TAP TO PLAY'; } });
}
function manualRetry(){ sameServerRetry=0; isSwitching=false; triedProxy=false; brandLoader(); loadStream(streamSource,false); }
window.manualRetry=manualRetry;
function nextServerManual(){ sameServerRetry=99; tryNextOrFail(); }
window.nextServerManual=nextServerManual;

function tryNextOrFail(){
  if(isSwitching) return;
  if(failoverTimer){clearTimeout(failoverTimer); failoverTimer=null;}
  // ১. একই Server এ ৩ বার Retry
  if(sameServerRetry < 3){
    sameServerRetry++; isSwitching=true; brandLoader(); logDebug('Retry same server '+sameServerRetry+'/3 - waiting 2s...');
    setTimeout(()=>{ isSwitching=false; loadStream(streamSource,false); },2000);
    return;
  }
  sameServerRetry=0;
  // ২. Next Server
  if(SERVER_LIST.length>1 && CURRENT_SERVER_IDX < SERVER_LIST.length-1){
    let failed=CURRENT_SERVER_IDX; CURRENT_SERVER_IDX++;
    streamSource=SERVER_LIST[CURRENT_SERVER_IDX].url;
    currentKid=SERVER_LIST[CURRENT_SERVER_IDX].kid||currentKid||'';
    currentKey=SERVER_LIST[CURRENT_SERVER_IDX].key||currentKey||'';
    triedProxy=false; isSwitching=true; brandLoader(); updateServerUI(CURRENT_SERVER_IDX,failed);
    logDebug('Switching to Server '+(CURRENT_SERVER_IDX+1)+'...');
    setTimeout(()=>{ isSwitching=false; loadStream(streamSource,false); },1200);
    return;
  }
  // ৩. Proxy দিয়ে Try
  if(!triedProxy && streamSource && !streamSource.startsWith(PROXY)){
    triedProxy=true; isSwitching=true; brandLoader(); logDebug('Trying via Proxy...');
    setTimeout(()=>{ isSwitching=false; loadStream(makeProxy(streamSource),true); },1000);
    return;
  }
  updateServerUI(CURRENT_SERVER_IDX,CURRENT_SERVER_IDX);
  showState('FAILED','এই চ্যানেলটা এখন চলছে না। নিচে Server বদলে দেখো বা একটু পরে আবার Try করো।', true);
}

function loadStream(url, viaProxy){
  ensureVideo();
  if(!url){ showState('No Stream','এই ম্যাচে এখনো Stream লিংক আসে নাই।', true); return; }
  // JSON হলে ভিতর থেকে Stream বের করো
  if(url.includes('.json') && !url.includes('.m3u8')){
    brandLoader(); logDebug('JSON detected, extracting stream...');
    fetch(url).then(r=>r.json()).then(j=>{
      let found = extractStreamsDeep(j, []);
      if(found.length){ streamSource=found[0].url; currentKid=found[0].kid||currentKid; currentKey=found[0].key||currentKey; SERVER_LIST=found.map(f=>({url:f.url,kid:f.kid,key:f.key})); renderServers(); loadStream(found[0].url,false); }
      else showState('No Stream','JSON এ কোনো Stream পাওয়া যায় নাই', true);
    }).catch(()=>showState('No Stream','JSON লোড হয় নাই', true));
    return;
  }
  // M3U হলে ভিতর থেকে প্রথম লিংক নাও
  if(url.includes('.m3u') && !url.includes('.m3u8')){
    brandLoader();
    fetch(url).then(r=>r.text()).then(t=>{
      let m=t.match(/https?:\/\/[^\s"']+/g);
      if(m && m.length){ streamSource=m[0]; loadStream(m[0],false); }
      else showState('No Stream','M3U তে লিংক পাওয়া যায় নাই', true);
    }).catch(()=>showState('No Stream','M3U লোড হয় নাই', true));
    return;
  }

  playSession++; let mySession=playSession; currentQuality='auto';
  if(hls){ try{hls.destroy();}catch(e){} hls=null; }
  if(shakaPlayer){ try{shakaPlayer.destroy();}catch(e){} shakaPlayer=null; }
  video.removeAttribute('src'); video.load();
  if(failoverTimer) clearTimeout(failoverTimer);
  let timeoutMs = isDashUrl(url) ? 15000 : 10000;
  failoverTimer=setTimeout(()=>{ if(mySession!==playSession) return; if(video&&!video.paused&&video.readyState>=2) return; if(everPlayed) return; logDebug('Timeout '+timeoutMs+'ms - retrying...'); tryNextOrFail(); }, timeoutMs);

  if(isDashUrl(url)){ loadDASH(url,viaProxy,mySession); return; }
  if(isHlsUrl(url)){
    if(window.Hls && Hls.isSupported()){
      let cfg={ maxBufferLength:10, maxMaxBufferLength:20, maxBufferSize:10*1000*1000, enableWorker:true, lowLatencyMode:true, backBufferLength:0, manifestLoadingMaxRetry:1, levelLoadingMaxRetry:2, fragLoadingMaxRetry:2, manifestLoadingRetryDelay:500, levelLoadingRetryDelay:500, fragLoadingRetryDelay:500, manifestLoadingTimeOut:10000, levelLoadingTimeOut:10000, fragLoadingTimeOut:10000, startLevel:-1, autoStartLoad:true, abrEwmaDefaultEstimate:3000000, abrEwmaFastLive:3, abrEwmaSlowLive:9 };
      if(viaProxy) cfg.loader=ProxyLoader;
      hls=new Hls(cfg); hls.loadSource(url); hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED,()=>{ doPlay(); buildQuality(); });
      hls.on(Hls.Events.LEVEL_SWITCHED,()=>buildQuality());
      hls.on(Hls.Events.ERROR,(e,data)=>{ if(mySession!==playSession) return; if(!data.fatal) return; if(data.type===Hls.ErrorTypes.MEDIA_ERROR){ try{hls.recoverMediaError();}catch(err){} return; } logDebug('HLS Fatal: '+data.details); tryNextOrFail(); });
    } else if(video.canPlayType('application/vnd.apple.mpegurl')){ video.src=url; doPlay(); }
    else showState('Not Supported','এই ডিভাইসে HLS চলে না', true);
    return;
  }
  // MP4 / Direct
  video.src=url; doPlay();
  video.onerror=()=>{ if(mySession===playSession) tryNextOrFail(); };
}

async function loadDASH(url,viaProxy,mySession){
  ensureVideo();
  if(!window.shaka){ showState('No Shaka','DASH Player লোড হয় নাই', true); return; }
  if(shakaPlayer){ try{await shakaPlayer.destroy();}catch(e){} shakaPlayer=null; }
  if(mySession!==playSession) return;
  try{ shaka.Player.polyfill.installAll(); }catch(e){}
  shakaPlayer=new shaka.Player(video);
  try{
    shakaPlayer.configure({
      drm:(currentKid&&currentKey)?{clearKeys:{[currentKid]:currentKey}}:{},
      abr:{enabled:true,defaultBandwidthEstimate:3000000,switchInterval:4,bandwidthUpgradeTarget:0.85,bandwidthDowngradeTarget:0.95},
      streaming:{bufferingGoal:6,rebufferingGoal:2,bufferBehind:4,safeSeekOffset:2,retryParameters:{timeout:10000,maxAttempts:3,baseDelay:500,backoffFactor:1.5,fuzzFactor:0},smallGapLimit:0.5,jumpLargeGaps:true},
      manifest:{retryParameters:{timeout:10000,maxAttempts:3,baseDelay:500,backoffFactor:1.5,fuzzFactor:0}}
    });
  }catch(e){}
  if(viaProxy){ try{ shakaPlayer.getNetworkingEngine().registerRequestFilter((type,req)=>{ if(req.uris&&req.uris[0]&&!req.uris[0].startsWith(PROXY)) req.uris[0]=makeProxy(req.uris[0]); }); }catch(e){} }
  shakaPlayer.addEventListener('error',(e)=>{ if(mySession===playSession){ logDebug('DASH Error: '+(e.detail?.message||'unknown')); tryNextOrFail(); } });
  shakaPlayer.addEventListener('adaptation',()=>buildQuality());
  try{ await shakaPlayer.load(url); if(mySession===playSession){ doPlay(); buildQuality(); } }
  catch(e){ if(mySession===playSession){ logDebug('DASH Load Fail: '+e.message); tryNextOrFail(); } }
}

function renderServers(){
  let row=document.getElementById('serverRow');
  if(!SERVER_LIST.length){ row.innerHTML=''; return; }
  document.getElementById('suggestTitle').textContent='🔴 Extra Server - '+SERVER_LIST.length+' টা';
  row.innerHTML=SERVER_LIST.map((c,i)=>`<div class="server-chip ${i===CURRENT_SERVER_IDX?'playing':''}" onclick="playServer(${i})"><b>Server ${i+1}</b><small id="server-sub-${i}">${i===CURRENT_SERVER_IDX?'▶ PLAYING':'TAP TO PLAY'}</small></div>`).join('');
}
function playServer(idx){
  if(!SERVER_LIST[idx]) return;
  sameServerRetry=0; isSwitching=false; triedProxy=false; everPlayed=false;
  CURRENT_SERVER_IDX=idx; streamSource=SERVER_LIST[idx].url;
  currentKid=SERVER_LIST[idx].kid||currentKid||''; currentKey=SERVER_LIST[idx].key||currentKey||'';
  updateServerUI(idx,-1); brandLoader(); loadStream(streamSource,false);
}
window.playServer=playServer;

function isLiveSports(){ let s=(srcParam||'').toLowerCase(); let g=(groupParam||'').toLowerCase(); let n=(currentName||'').toLowerCase(); if(s.includes('event')) return true; if(g.includes('event')||g.includes('live sport')) return true; if(/\s+vs\s+|\svs\s/.test(n)) return true; return false; }
function cleanName(n){ return (n||'').replace(/\(.*?\)/g,'').replace(/\[.*?\]/g,'').replace(/HD|FHD|4K|1080p|720p/gi,'').replace(/\s+/g,' ').trim(); }

async function loadServers(){
  let stored=null; try{ stored=JSON.parse(localStorage.getItem('rslive_sports_match')||'null'); }catch(e){}
  let jsonServers=[];
  if(stored && stored.streams && stored.streams.length) jsonServers=stored.streams.map(s=>({url:s.stream_url||s.url||'',kid:s.kid||'',key:s.key||''})).filter(x=>x.url);
  // Sports_data.json থেকেও সরাসরি খুঁজো - নাম মিললে সব Server পাবে
  if(isLiveSports()){
    try{
      let r=await fetch(SPORTS_JSON+'?t='+Date.now()); let j=await r.json();
      let arr=Array.isArray(j)?j:(j.matches||j.data||j.sports||j.events||[]);
      for(let m of arr){
        let name = (m.event_name||m.match||m.title||m.name||'') + ' ' + (m.team_a||'') + ' ' + (m.team_b||'');
        let cur = currentName.toLowerCase().replace(/[^a-z0-9]/g,'');
        let cand = name.toLowerCase().replace(/[^a-z0-9]/g,'');
        // নামের একটা টিম মিললেই নাও
        let parts = currentName.toLowerCase().split(/vs/i).map(s=>s.replace(/[^a-z0-9]/g,'').trim()).filter(s=>s.length>3);
        let match = parts.length===0 || parts.some(p=>cand.includes(p)) || cand.includes(cur);
        if(match){
          let found = extractStreamsDeep(m, []);
          found.forEach(f=>{ if(!jsonServers.find(x=>x.url===f.url)) jsonServers.push(f); });
        }
      }
    }catch(e){}
  }
  let seen=new Set(); SERVER_LIST=[...jsonServers].filter(s=>{ if(!s.url||seen.has(s.url)) return false; seen.add(s.url); return true; });
  if(streamSource && !SERVER_LIST.find(s=>s.url===streamSource)) SERVER_LIST.unshift({url:streamSource,kid:currentKid||'',key:currentKey||''});
  if(SERVER_LIST.length){
    let found=SERVER_LIST.findIndex(s=>s.url===streamSource); CURRENT_SERVER_IDX=found>=0?found:0;
    if(found>=0){ currentKid=SERVER_LIST[found].kid||currentKid||''; currentKey=SERVER_LIST[found].key||currentKey||''; }
    renderServers();
  }
  // Suggest Channels
  try{
    let list=[];
    for(let plUrl of SUGGEST_PLAYLISTS){
      try{ let res=await fetch(plUrl); let txt=await res.text(); let lines=txt.split("\n"); let cur=null; for(let line of lines){ line=line.trim(); if(line.startsWith("#EXTINF")){ let nm=line.split(",").pop().trim(); let lg=(line.match(/tvg-logo="([^"]+)"/)||[])[1]||""; let gp=(line.match(/group-title="([^"]+)"/)||[])[1]||"General"; cur={name:nm,logo:lg,group:gp,src:plUrl.includes('Tapmad')?'Tapmad':plUrl.includes('Sony')?'SonyLiv':plUrl.includes('Toffee')?'Toffee':plUrl.includes('Ayna')?'AynaOTT':'JagoBD'}; } else if(line.startsWith("http")&&cur){ cur.url=line; if(cur.name&&cur.url) list.push(cur); cur=null; } } }catch(e){}
    }
    let filtered=list.filter(c=>c.url!==streamSource).slice(0,20);
    document.getElementById('suggestGrid').innerHTML=filtered.map(c=>`<div class="sug" onclick="openSuggest('${encodeURIComponent(c.url)}','${encodeURIComponent(c.name)}','${c.src}','${encodeURIComponent(c.group)}')"><img src="${c.logo||'https://cdn-icons-png.flaticon.com/512/1179/1179069.png'}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/1179/1179069.png'"><div><p>${cleanName(c.name)}</p><small>${c.src} • LIVE</small></div></div>`).join('');
  }catch(e){}
}
function openSuggest(u,n,s,g){ location.href=`player.html?url=${u}&name=${n}&src=${encodeURIComponent(s)}&group=${g}&t=${Date.now()}`; }

/* ===== START ===== */
loadServers();
ensureVideo();
if(streamSource){ brandLoader(); loadStream(streamSource,false); }
else { showState('No Link','কোনো Stream লিংক পাওয়া যায় নাই। Home থেকে আবার Try করো।', true); }
</script>
