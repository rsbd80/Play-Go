<!DOCTYPE html>
<html lang="bn">
<head>

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#080808;font-family:Arial,Helvetica,sans-serif}
#player-container{position:fixed;inset:0;width:100%;height:100%;background:#000;overflow:hidden}
video{width:100%;height:100%;object-fit:contain;background:#000}
video.fit-fill{object-fit:fill!important}
video.fit-zoom{object-fit:cover!important}
#rs-loader{position:absolute;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:transparent;pointer-events:none;opacity:1;visibility:visible;transition:opacity .25s,visibility .25s}
#rs-loader.hide{opacity:0;visibility:hidden}
.loader-box{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px 16px;border-radius:10px;background:rgba(0,0,0,.72);border:1px solid rgba(255,255,255,.08)}
.loader-spinner{width:27px;height:27px;border-radius:50%;border:3px solid rgba(255,255,255,.15);border-top-color:#ff3030;border-right-color:#ff3030;animation:rs-spin .8s linear infinite}
.loader-name{margin-top:8px;font-size:12px;font-weight:900;color:#fff;letter-spacing:.6px;white-space:nowrap}
.loader-name span{color:#ff3030}
#loader-message{margin-top:4px;font-size:10px;color:#aaa;white-space:nowrap;text-align:center;max-width:220px}
@keyframes rs-spin{to{transform:rotate(360deg)}}
#player-container.loading .shaka-controls-container{opacity:0!important;visibility:hidden!important;pointer-events:none!important}
#player-container.loading .shaka-play-button-container{display:none!important}
.shaka-controls-container{width:100%!important;opacity:1!important;visibility:visible!important;overflow:visible!important;transition:opacity .25s ease,visibility .25s ease}
.shaka-controls-container.rs-force-hide{opacity:0!important;visibility:hidden!important;pointer-events:none!important}
.shaka-bottom-controls{width:100%!important;padding:0 10px 8px!important;opacity:1!important;visibility:visible!important;overflow:visible!important}
.shaka-controls-button-panel{display:flex!important;align-items:center!important;flex-wrap:nowrap!important;width:100%!important;min-width:0!important;overflow:visible!important;gap:2px!important;opacity:1!important;visibility:visible!important}
.shaka-controls-button-panel .shaka-play-pause-button{order:0!important;flex:0 0 38px!important;width:38px!important;height:34px!important;min-width:38px!important;max-width:38px!important;margin:0 2px 0 4px!important;padding:0!important;display:flex!important;align-items:center!important;justify-content:center!important;opacity:1!important;visibility:visible!important;overflow:visible!important;color:#fff!important}
.shaka-controls-button-panel .shaka-play-pause-button i,.shaka-controls-button-panel .shaka-play-pause-button svg{width:22px!important;height:22px!important;font-size:22px!important;line-height:22px!important;opacity:1!important;visibility:visible!important;display:inline-flex!important;align-items:center!important;justify-content:center!important}
.shaka-controls-button-panel .shaka-mute-button{order:1!important;flex:0 0 36px!important;width:36px!important;min-width:36px!important;margin:0!important;display:flex!important;align-items:center!important;justify-content:center!important;opacity:1!important;visibility:visible!important}
.shaka-controls-button-panel .shaka-volume-bar-container{order:2!important;flex:0 0 78px!important;width:78px!important;min-width:64px!important;max-width:86px!important;height:24px!important;display:flex!important;align-items:center!important;padding:2px 4px 0!important;margin-right:6px!important;background:transparent!important;box-shadow:none!important;border:none!important;opacity:1!important;visibility:visible!important}
.shaka-controls-button-panel .shaka-volume-bar-container>*{width:100%!important;height:4px!important;min-height:4px!important;max-height:4px!important;border-radius:999px!important;background:#fff!important;box-shadow:none!important;border:none!important;position:relative!important;overflow:visible!important;transform:translateY(1px)!important;opacity:1!important}
.shaka-controls-button-panel .shaka-volume-bar-container input[type="range"]{-webkit-appearance:none!important;appearance:none!important;width:100%!important;height:24px!important;min-height:24px!important;max-height:24px!important;background:transparent!important;margin:0!important;padding:0!important;outline:none!important;border:none!important;cursor:pointer!important;transform:translateY(1px)!important;opacity:1!important}
.shaka-controls-button-panel .shaka-volume-bar-container input[type="range"]::-webkit-slider-runnable-track{height:4px!important;background:#fff!important;border-radius:999px!important;border:none!important}
.shaka-controls-button-panel .shaka-volume-bar-container input[type="range"]::-moz-range-track{height:4px!important;background:#fff!important;border-radius:999px!important;border:none!important}
.shaka-controls-button-panel .shaka-volume-bar-container input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none!important;appearance:none!important;width:12px!important;height:12px!important;border-radius:50%!important;background:#fff!important;margin-top:-4px!important;border:none!important;box-shadow:none!important;opacity:1!important}
.shaka-controls-button-panel .shaka-volume-bar-container input[type="range"]::-moz-range-thumb{width:12px!important;height:12px!important;border-radius:50%!important;background:#fff!important;border:none!important;box-shadow:none!important;opacity:1!important}
.shaka-controls-button-panel .shaka-current-time,.shaka-controls-button-panel .shaka-time-container{order:3!important;flex:0 0 auto!important;margin-right:2px!important;font-size:12px!important;opacity:1!important;visibility:visible!important}
.shaka-controls-button-panel .shaka-spacer{order:4!important;flex:1 1 auto!important;min-width:0!important}
.shaka-controls-button-panel .shaka-resolution-button{order:5!important;flex:0 0 36px!important;min-width:36px!important;opacity:1!important;visibility:visible!important}
.shaka-controls-button-panel .shaka-pip-button{order:6!important;flex:0 0 36px!important;min-width:36px!important;opacity:1!important;visibility:visible!important}
.rs-fit-btn{order:7!important;flex:0 0 42px!important;opacity:1!important;visibility:visible!important}
.shaka-controls-button-panel .shaka-fullscreen-button{order:8!important;flex:0 0 40px!important;width:40px!important;min-width:40px!important;max-width:40px!important;margin:0!important;opacity:1!important;visibility:visible!important}
.shaka-controls-button-panel button{flex-shrink:0!important}
.rs-fit-btn{border:0;background:transparent;color:white;cursor:pointer;padding:0 3px;min-width:38px;display:flex;align-items:center;justify-content:center}
.rs-fit-label{font-size:10px;font-weight:800;padding:4px 6px;border:1px solid #666;border-radius:5px;color:#ddd;white-space:nowrap}
.rs-fit-btn.fill .rs-fit-label{color:#38bdf8;border-color:#38bdf8}
.rs-fit-btn.zoom .rs-fit-label{color:#a78bfa;border-color:#a78bfa}
/* NEW: Server + Retry Buttons */
.rs-server-btn{order:9!important;flex:0 0 auto!important;min-width:52px!important;padding:0 6px!important;background:rgba(255,48,48,.18)!important;border:1px solid rgba(255,48,48,.5)!important;border-radius:6px!important;color:#fff!important;font-size:10px!important;font-weight:800!important;white-space:nowrap!important}
.rs-server-btn:active{background:#ff3030!important}
#player-container:fullscreen,#player-container:-webkit-full-screen{width:100vw;height:100vh;background:#000}
#player-container:fullscreen video,#player-container:-webkit-full-screen video{width:100%;height:100%}
#status{position:fixed;top:max(12px,env(safe-area-inset-top));right:12px;z-index:100;display:flex;align-items:center;gap:7px;padding:7px 11px;border-radius:30px;background:rgba(15,15,15,.85);border:1px solid rgba(255,255,255,.10);color:#ddd;font-size:11px;font-weight:600;opacity:0;transform:translateY(-8px);transition:.25s;pointer-events:none;backdrop-filter:blur(12px)}
#status.show{opacity:1;transform:translateY(0)}
.dot{width:7px;height:7px;background:#38bdf8;border-radius:50%}
#status.live .dot{background:#22c55e;animation:rs-pulse 1.5s infinite}
#status.loading .dot{background:#fbbf24;animation:rs-pulse 1s infinite}
#status.error .dot{background:#ef4444}
@keyframes rs-pulse{50%{opacity:.35;transform:scale(.65)}}
#serverBar{position:fixed;bottom:64px;left:50%;transform:translateX(-50%);z-index:90;display:none;gap:6px;flex-wrap:wrap;justify-content:center;max-width:95%}
#serverBar.show{display:flex}
#serverBar button{background:rgba(0,0,0,.75);border:1px solid rgba(255,255,255,.2);color:#fff;padding:8px 14px;border-radius:99px;font-size:11px;font-weight:700;cursor:pointer;backdrop-filter:blur(10px)}
#serverBar button.active{background:#ff3030;border-color:#ff3030}
#serverBar button.fail{opacity:.4;border-color:#ef4444}
@media(max-width:480px){
  #status{top:10px;right:10px;font-size:10px;padding:6px 9px}
  .shaka-bottom-controls{padding:0 6px 5px!important}
  .shaka-controls-button-panel{gap:1px!important}
  .shaka-controls-button-panel .shaka-play-pause-button{flex:0 0 34px!important;width:34px!important;height:32px!important;min-width:34px!important;max-width:34px!important;margin:0 2px 0 4px!important}
  .shaka-controls-button-panel .shaka-play-pause-button i,.shaka-controls-button-panel .shaka-play-pause-button svg{width:20px!important;height:20px!important;font-size:20px!important;line-height:20px!important}
  .shaka-controls-button-panel .shaka-mute-button{flex:0 0 30px!important;width:30px!important;min-width:30px!important}
  .shaka-controls-button-panel .shaka-volume-bar-container{display:flex!important;flex:0 0 60px!important;width:60px!important;min-width:52px!important;max-width:68px!important;height:20px!important;padding:2px 3px 0!important;margin-right:4px!important}
  .shaka-controls-button-panel .shaka-volume-bar-container>*{height:3.5px!important;min-height:3.5px!important;max-height:3.5px!important;background:#fff!important;transform:translateY(1px)!important}
  .shaka-controls-button-panel .shaka-volume-bar-container input[type="range"]{height:20px!important;min-height:20px!important;max-height:20px!important;transform:translateY(1px)!important}
  .shaka-controls-button-panel .shaka-volume-bar-container input[type="range"]::-webkit-slider-runnable-track{height:3.5px!important;background:#fff!important}
  .shaka-controls-button-panel .shaka-volume-bar-container input[type="range"]::-moz-range-track{height:3.5px!important;background:#fff!important}
  .shaka-controls-button-panel .shaka-volume-bar-container input[type="range"]::-webkit-slider-thumb{width:11px!important;height:11px!important;margin-top:-3.75px!important;background:#fff!important}
  .shaka-controls-button-panel .shaka-volume-bar-container input[type="range"]::-moz-range-thumb{width:11px!important;height:11px!important;background:#fff!important}
  .shaka-controls-button-panel .shaka-time-container{font-size:11px!important;flex:0 0 auto!important}
  .shaka-controls-button-panel .shaka-resolution-button{flex:0 0 30px!important;min-width:30px!important}
  .shaka-controls-button-panel .shaka-pip-button{flex:0 0 30px!important;min-width:30px!important}
  .rs-fit-btn{flex:0 0 34px!important;min-width:34px!important}
  .rs-fit-label{font-size:9px;padding:3px 4px}
  .shaka-controls-button-panel .shaka-fullscreen-button{flex:0 0 32px!important;width:32px!important;min-width:32px!important;max-width:32px!important}
}
@media(max-width:360px){ .shaka-controls-button-panel .shaka-time-container{display:none!important} }
</style>

<body>
<div id="player-container" class="loading">
  <video id="video" autoplay playsinline preload="metadata"></video>
  <div id="rs-loader"><div class="loader-box"><div class="loader-spinner"></div><div class="loader-name">RS <span>LIVE TV</span></div><div id="loader-message">Connecting...</div></div></div>
</div>
<div id="status"><span class="dot"></span><span id="statusText">Ready</span></div>
<div id="serverBar"></div>
<script src="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/shaka-player.ui.min.js"></script>
<script>
(function(){
"use strict";
const video=document.getElementById("video");
const container=document.getElementById("player-container");
const status=document.getElementById("status");
const statusText=document.getElementById("statusText");
const loader=document.getElementById("rs-loader");
const loaderMessage=document.getElementById("loader-message");
const serverBar=document.getElementById("serverBar");
const PROXY="https://stream-through-spark.lovable.app/api/proxy?u=";
const SPORTS_JSON="https://raw.githubusercontent.com/sm-monirulislam/Upcoming-and-Live-Sports-Data/refs/heads/main/Sports_data.json";
let player, ui, controls, statusTimer, fitButton, autoHideTimer;
const AUTO_HIDE_DELAY=4000;
let fitIndex=0, previousFitIndex=0, isFullscreen=false, lastTap=0;
const AUDIO_STORAGE_KEY="rs_player_audio_enabled";
let audioEnabled=true, audioUnlocked=false;
try{ const s=localStorage.getItem(AUDIO_STORAGE_KEY); audioEnabled=(s!=="false"); }catch(e){ audioEnabled=true; }
const FIT_MODES=["contain","fill","cover"];
const FIT_LABELS=["FIT","FILL","ZOOM"];

/* ============ DRM + URL PARAMS - POWERFUL PARSER ============ */
const params=new URLSearchParams(window.location.search);
let rawUrl=params.get("url")||"";
try{ rawUrl=decodeURIComponent(rawUrl); }catch(e){}
let CH_NAME=""; try{ CH_NAME=decodeURIComponent(params.get("name")||""); }catch(e){ CH_NAME=params.get("name")||""; }
let SRC_PARAM=params.get("src")||"";
let GROUP_PARAM=""; try{ GROUP_PARAM=decodeURIComponent(params.get("group")||""); }catch(e){}
let currentKid=params.get("kid")||params.get("key_id")||params.get("keyId")||"";
let currentKey=params.get("key")||params.get("k")||params.get("drm_key")||"";
let licenseUrl=params.get("license")||params.get("license_url")||params.get("drm")||"";
try{ currentKid=decodeURIComponent(currentKid); }catch(e){}
try{ currentKey=decodeURIComponent(currentKey); }catch(e){}
try{ licenseUrl=decodeURIComponent(licenseUrl); }catch(e){}
// clearkey JSON: {"kid":"key"} বা {"abcd":"efgh"}
function parseClearKeyStr(str){
  if(!str) return null;
  str=str.trim();
  if(str.startsWith("{")){ try{ let o=JSON.parse(str); let k=Object.keys(o)[0]; return {kid:k,key:o[k]}; }catch(e){} }
  if(str.includes(":") && !str.includes("http")){ let p=str.split(":"); if(p.length>=2) return {kid:p[0].trim(),key:p[1].trim()}; }
  return null;
}
let ck=parseClearKeyStr(currentKid)||parseClearKeyStr(currentKey);
if(ck){ currentKid=ck.kid; currentKey=ck.key; }
// clearkey param আলাদা থাকলে
let clearkeyParam=params.get("clearkey")||params.get("clearKey")||params.get("clear_keys")||"";
if(clearkeyParam){ try{ clearkeyParam=decodeURIComponent(clearkeyParam); let c2=parseClearKeyStr(clearkeyParam); if(c2){ currentKid=c2.kid; currentKey=c2.key; } }catch(e){} }
// kid/key 32 hex না হলে trim
currentKid=(currentKid||"").trim(); currentKey=(currentKey||"").trim();
console.log("RS DRM:", currentKid?"KID ✓":"KID ✗", currentKey?"KEY ✓":"KEY ✗", "License:", licenseUrl||"none");

/* ============ SERVER LIST ============ */
let SERVER_LIST=[];
let CURRENT_SERVER_IDX=0;
let sameServerRetry=0;
let isSwitching=false;
let triedProxy=false;
let triedHlsFallback=false;
let playSession=0;
let currentStreamUrl=rawUrl;

function renderServerBar(){
  if(SERVER_LIST.length<=1){ serverBar.classList.remove("show"); return; }
  serverBar.innerHTML=SERVER_LIST.map((s,i)=>`<button class="${i===CURRENT_SERVER_IDX?'active':''} ${s.failed?'fail':''}" onclick="window.rsPlayServer(${i})">Server ${i+1} ${s.failed?'✕':i===CURRENT_SERVER_IDX?'▶':''}</button>`).join("");
  serverBar.classList.add("show");
  setTimeout(()=>serverBar.classList.remove("show"), 6000);
}
window.rsPlayServer=function(idx){
  if(!SERVER_LIST[idx]) return;
  sameServerRetry=0; isSwitching=false; triedProxy=false; triedHlsFallback=false;
  CURRENT_SERVER_IDX=idx; currentStreamUrl=SERVER_LIST[idx].url;
  currentKid=SERVER_LIST[idx].kid||currentKid||"";
  currentKey=SERVER_LIST[idx].key||currentKey||"";
  licenseUrl=SERVER_LIST[idx].license||licenseUrl||"";
  renderServerBar();
  loadStream(currentStreamUrl);
};
function extractStreamsDeep(obj,out,kidKey){
  if(!obj) return out;
  if(typeof obj==="string"){
    if(obj.startsWith("http") && (obj.includes(".m3u8")||obj.includes(".mpd")||obj.includes(".mp4")||obj.includes("stream")||obj.includes("live"))){
      if(!obj.match(/\.(png|jpg|jpeg|webp|svg)(\?|$)/i)) out.push({url:obj,kid:kidKey?.kid||"",key:kidKey?.key||"",license:kidKey?.license||""});
    }
    return out;
  }
  if(Array.isArray(obj)){ obj.forEach(v=>extractStreamsDeep(v,out,kidKey)); return out; }
  if(typeof obj==="object"){
    let lkKid=kidKey?.kid||"", lkKey=kidKey?.key||"", lkLic=kidKey?.license||"";
    for(let k in obj){
      let lk=k.toLowerCase(), v=obj[k];
      if(lk==="clearkey" && typeof v==="object"){ let ks=Object.keys(v); if(ks.length){ lkKid=ks[0]; lkKey=v[ks[0]]; } }
      if((lk==="kid"||lk==="key_id") && typeof v==="string") lkKid=v;
      if((lk==="key"||lk==="drm_key"||lk==="k") && typeof v==="string" && v.length>10) lkKey=v;
      if(lk.includes("license") && typeof v==="string" && v.startsWith("http")) lkLic=v;
    }
    for(let k in obj){
      let lk=k.toLowerCase(), v=obj[k];
      if(typeof v==="string" && v.startsWith("http") && (lk.includes("stream")||lk.includes("link")||lk.includes("url")||lk.includes("server")||lk.includes("m3u")||lk.includes("mpd")||lk.includes("play")||lk.includes("src")||lk.includes("source")||lk.includes("embed"))){
        if(!v.match(/\.(png|jpg|jpeg|webp|svg)(\?|$)/i)) out.push({url:v,kid:lkKid,key:lkKey,license:lkLic});
      } else extractStreamsDeep(v,out,{kid:lkKid,key:lkKey,license:lkLic});
    }
  }
  return out;
}
async function loadServersFromSportsJson(){
  try{
    let stored=null; try{ stored=JSON.parse(localStorage.getItem("rslive_sports_match")||"null"); }catch(e){}
    if(stored && stored.streams && stored.streams.length){
      stored.streams.forEach(s=>{ let u=s.stream_url||s.url||s.link||""; if(u && !SERVER_LIST.find(x=>x.url===u)) SERVER_LIST.push({url:u,kid:s.kid||"",key:s.key||"",license:s.license||""}); });
    }
    // Sports_data.json থেকে নাম মিলিয়ে সব Server
    let r=await fetch(SPORTS_JSON+"?t="+Date.now());
    let j=await r.json();
    let arr=Array.isArray(j)?j:(j.matches||j.data||j.sports||j.events||[]);
    for(let m of arr){
      let name=(m.event_name||m.match||m.title||m.name||"")+" "+(m.team_a||"")+" "+(m.team_b||"")+" "+(m.home||"")+" "+(m.away||"");
      let cur=CH_NAME.toLowerCase().replace(/[^a-z0-9]/g,"");
      let cand=name.toLowerCase().replace(/[^a-z0-9]/g,"");
      let parts=CH_NAME.toLowerCase().split(/vs/i).map(s=>s.replace(/[^a-z0-9]/g,"").trim()).filter(s=>s.length>3);
      let match=parts.length===0 || parts.some(p=>cand.includes(p)) || (cur && cand.includes(cur));
      let isEvent=(SRC_PARAM||"").toLowerCase().includes("event") || (GROUP_PARAM||"").toLowerCase().includes("event") || CH_NAME.toLowerCase().includes(" vs ");
      if(match && (isEvent || parts.length>0)){
        let found=extractStreamsDeep(m,[]);
        found.forEach(f=>{ if(!SERVER_LIST.find(x=>x.url===f.url)) SERVER_LIST.push(f); });
      }
    }
  }catch(e){ console.log("Sports JSON load fail",e); }
  if(currentStreamUrl && !SERVER_LIST.find(s=>s.url===currentStreamUrl)) SERVER_LIST.unshift({url:currentStreamUrl,kid:currentKid,key:currentKey,license:licenseUrl});
  let idx=SERVER_LIST.findIndex(s=>s.url===currentStreamUrl);
  CURRENT_SERVER_IDX=idx>=0?idx:0;
  if(idx>=0){ currentKid=SERVER_LIST[idx].kid||currentKid; currentKey=SERVER_LIST[idx].key||currentKey; licenseUrl=SERVER_LIST[idx].license||licenseUrl; }
  renderServerBar();
}
function isDash(u){ if(!u) return false; let s=u.toLowerCase(); if(s.includes(".mpd")) return true; if(s.includes("/dash")||s.includes("manifest")) return true; if(currentKid&&currentKey) return true; return false; }
function isHls(u){ return u.toLowerCase().includes(".m3u8")||u.toLowerCase().includes("m3u8"); }
function makeProxy(o){ if(!o||o.startsWith(PROXY)) return o; return PROXY+encodeURIComponent(o); }

function saveAudioPreference(){ try{ localStorage.setItem(AUDIO_STORAGE_KEY,String(audioEnabled)); }catch(e){} }
function unlockAudio(){ if(audioUnlocked) return; audioUnlocked=true; audioEnabled=true; saveAudioPreference(); video.muted=false; video.play().catch(e=>console.log("Audio play blocked",e)); }
function syncPlayPauseButton(){ const b=container.querySelector(".shaka-play-pause-button"); if(!b) return; b.style.display="flex"; b.style.opacity="1"; b.style.visibility="visible"; b.style.overflow="visible"; }
function getControlsEl(){ return container.querySelector(".shaka-controls-container"); }
function showControlsClear(){ syncPlayPauseButton(); const c=getControlsEl(); if(c){ c.classList.remove("rs-force-hide"); c.style.opacity="1"; c.style.visibility="visible"; } const b=container.querySelector(".shaka-bottom-controls"); if(b){ b.style.opacity="1"; b.style.visibility="visible"; } }
function hideControlsNow(){ const c=getControlsEl(); if(c){ c.classList.add("rs-force-hide"); c.style.opacity="0"; c.style.visibility="hidden"; } if(controls && typeof controls.hide==="function") controls.hide(); }
function scheduleAutoHide(delay=AUTO_HIDE_DELAY){ showControlsClear(); clearTimeout(autoHideTimer); autoHideTimer=setTimeout(()=>{ if(!video.paused && !container.classList.contains("loading")) hideControlsNow(); },delay); }
function setStatus(text,type="loading",duration=4000){ statusText.textContent=text; status.className="show "+type; clearTimeout(statusTimer); if(duration>0) statusTimer=setTimeout(()=>status.classList.remove("show"),duration); }
function showLoader(msg="Connecting..."){ loaderMessage.textContent=msg; loader.classList.remove("hide"); container.classList.add("loading"); }
function hideLoader(){ loader.classList.add("hide"); container.classList.remove("loading"); }
function applyFit(){ video.classList.remove("fit-fill","fit-zoom"); if(fitButton) fitButton.classList.remove("fill","zoom"); if(FIT_MODES[fitIndex]==="fill"){ video.classList.add("fit-fill"); if(fitButton) fitButton.classList.add("fill"); } if(FIT_MODES[fitIndex]==="cover"){ video.classList.add("fit-zoom"); if(fitButton) fitButton.classList.add("zoom"); } if(fitButton){ const l=fitButton.querySelector(".rs-fit-label"); if(l) l.textContent=FIT_LABELS[fitIndex]; } }
function addFitButton(){
  const panel=container.querySelector(".shaka-controls-button-panel"); if(!panel||panel.querySelector(".rs-fit-btn")) return;
  const btn=document.createElement("button"); btn.type="button"; btn.className="rs-fit-btn"; btn.title="Video Fit Mode"; btn.innerHTML='<span class="rs-fit-label">FIT</span>'; fitButton=btn;
  const fsBtn=panel.querySelector(".shaka-fullscreen-button"); if(fsBtn) panel.insertBefore(btn,fsBtn); else panel.appendChild(btn);
  btn.addEventListener("click",function(e){ e.stopPropagation(); fitIndex=(fitIndex+1)%FIT_MODES.length; applyFit(); scheduleAutoHide(AUTO_HIDE_DELAY); });
  applyFit();
}
function addServerButton(){
  const panel=container.querySelector(".shaka-controls-button-panel"); if(!panel||panel.querySelector(".rs-server-btn")) return;
  const btn=document.createElement("button"); btn.type="button"; btn.className="rs-server-btn"; btn.textContent="SERVER ↻";
  btn.addEventListener("click",function(e){ e.stopPropagation(); if(SERVER_LIST.length>1){ renderServerBar(); serverBar.classList.add("show"); } else { setStatus("Only 1 Server","loading",2000); } scheduleAutoHide(AUTO_HIDE_DELAY); });
  panel.appendChild(btn);
}
function checkFullscreen(){
  const fs=!!document.fullscreenElement||!!document.webkitFullscreenElement;
  if(fs && !isFullscreen){ previousFitIndex=fitIndex; fitIndex=1; isFullscreen=true; applyFit(); }
  else if(!fs && isFullscreen){ fitIndex=previousFitIndex; isFullscreen=false; applyFit(); }
  scheduleAutoHide(AUTO_HIDE_DELAY);
}
document.addEventListener("fullscreenchange",checkFullscreen);
document.addEventListener("webkitfullscreenchange",checkFullscreen);
container.addEventListener("pointerdown",function(){ if(!audioUnlocked && audioEnabled) unlockAudio(); scheduleAutoHide(AUTO_HIDE_DELAY); },{passive:true});
document.addEventListener("click",function(e){ const m=e.target.closest(".shaka-mute-button"); if(!m) return; setTimeout(()=>{ audioEnabled=!video.muted; audioUnlocked=true; saveAudioPreference(); },120); });
video.addEventListener("volumechange",function(){ if(audioUnlocked){ audioEnabled=!video.muted; saveAudioPreference(); } });
video.addEventListener("touchend",function(e){ if(e.changedTouches.length!==1) return; const now=Date.now(); if(now-lastTap<300){ lastTap=0; clearTimeout(autoHideTimer); hideControlsNow(); } else lastTap=now; },{passive:true});
video.addEventListener("dblclick",function(){ clearTimeout(autoHideTimer); hideControlsNow(); });

/* ============ POWERFUL FAILOVER ============ */
function tryNextOrFail(reason){
  if(isSwitching) return;
  console.log("RS Failover:",reason,"retry:",sameServerRetry);
  // 1. একই Server এ 3 বার Retry
  if(sameServerRetry<3){
    sameServerRetry++; isSwitching=true; showLoader("Retrying... ("+sameServerRetry+"/3)");
    setTimeout(()=>{ isSwitching=false; loadStream(currentStreamUrl,false); },2000);
    return;
  }
  sameServerRetry=0;
  if(SERVER_LIST[CURRENT_SERVER_IDX]) SERVER_LIST[CURRENT_SERVER_IDX].failed=true;
  // 2. Next Server
  if(SERVER_LIST.length>1 && CURRENT_SERVER_IDX < SERVER_LIST.length-1){
    CURRENT_SERVER_IDX++; currentStreamUrl=SERVER_LIST[CURRENT_SERVER_IDX].url;
    currentKid=SERVER_LIST[CURRENT_SERVER_IDX].kid||currentKid||"";
    currentKey=SERVER_LIST[CURRENT_SERVER_IDX].key||currentKey||"";
    licenseUrl=SERVER_LIST[CURRENT_SERVER_IDX].license||licenseUrl||"";
    triedProxy=false; triedHlsFallback=false; isSwitching=true;
    showLoader("Switching Server "+(CURRENT_SERVER_IDX+1)+"...");
    renderServerBar();
    setTimeout(()=>{ isSwitching=false; loadStream(currentStreamUrl,false); },1200);
    return;
  }
  // 3. Proxy দিয়ে Try
  if(!triedProxy && currentStreamUrl && !currentStreamUrl.startsWith(PROXY)){
    triedProxy=true; isSwitching=true; showLoader("Trying via Proxy...");
    setTimeout(()=>{ isSwitching=false; loadStream(makeProxy(currentStreamUrl),true); },1000);
    return;
  }
  showLoader("Stream Failed - Tap to Retry");
  setStatus("All Servers Failed - Tap Server Button","error",0);
  renderServerBar();
  // Tap করলে Retry
  video.addEventListener("click",function retryOnce(){ video.removeEventListener("click",retryOnce); sameServerRetry=0; triedProxy=false; CURRENT_SERVER_IDX=0; if(SERVER_LIST[0]){ currentStreamUrl=SERVER_LIST[0].url; currentKid=SERVER_LIST[0].kid||""; currentKey=SERVER_LIST[0].key||""; } SERVER_LIST.forEach(s=>s.failed=false); loadStream(currentStreamUrl,false); },{once:true});
}

let hlsInstance=null;
function destroyHls(){ if(hlsInstance){ try{hlsInstance.destroy();}catch(e){} hlsInstance=null; } }

async function init(){
  showLoader("Initializing player...");
  shaka.polyfill.installAll();
  if(!shaka.Player.isBrowserSupported()){ showLoader("Browser not supported"); setStatus("Browser Not Supported","error",0); return; }
  try{
    player=new shaka.Player(); await player.attach(video);
    ui=new shaka.ui.Overlay(player,container,video);
    ui.configure({ addBigPlayButton:false, autoHide:false, controlPanelElements:["play_pause","mute","volume","time_and_duration","spacer","quality","picture_in_picture","fullscreen"], seekBarColors:{base:"#555",buffered:"#777",played:"#ff3030"} });
    controls=ui.getControls();
    requestAnimationFrame(function(){ addFitButton(); addServerButton(); syncPlayPauseButton(); const vb=container.querySelector(".shaka-volume-bar-container"); if(vb){ vb.style.display="flex"; vb.style.opacity="1"; vb.style.visibility="visible"; } });
    player.addEventListener("error",function(e){
      console.error("Shaka error:",e.detail);
      if(playSession && video && !video.paused && video.readyState>=2) return;
      // DRM Error হলে সাথে সাথে Failover না করে 1 বার Retry
      showLoader("Stream error..."); setStatus("Stream Error "+(e.detail.code||""),"error",4000);
      // error event থেকে সরাসরি failover ডাকবো না, loadStream এর catch এ যাবে
    });
    video.addEventListener("playing",function(){ hideLoader(); syncPlayPauseButton(); setStatus("LIVE","live",4000); if(audioUnlocked && audioEnabled) video.muted=false; scheduleAutoHide(AUTO_HIDE_DELAY); });
    video.addEventListener("waiting",function(){ showLoader("Buffering..."); setStatus("Buffering...","loading",0); });
    video.addEventListener("stalled",function(){ showLoader("Reconnecting..."); });
    video.addEventListener("pause",function(){ if(!video.ended){ hideLoader(); showControlsClear(); clearTimeout(autoHideTimer); setStatus("Paused","loading",2500); } });
    await loadServersFromSportsJson();
    if(!currentStreamUrl){ hideLoader(); setStatus("Ready - No Stream URL","loading",5000); return; }
    await loadStream(currentStreamUrl,false);
  }catch(e){ console.error("Init:",e); showLoader("Player initialization failed"); setStatus("Initialization Failed","error",0); }
}

async function loadStream(url, viaProxy){
  // JSON হলে ভিতর থেকে Stream বের করো
  if(url && url.includes(".json") && !url.includes(".m3u8")){
    showLoader("Reading JSON...");
    try{
      let r=await fetch(url); let j=await r.json();
      let found=extractStreamsDeep(j,[]);
      if(found.length){ SERVER_LIST=found; CURRENT_SERVER_IDX=0; currentStreamUrl=found[0].url; currentKid=found[0].kid||currentKid; currentKey=found[0].key||currentKey; licenseUrl=found[0].license||licenseUrl; renderServerBar(); return loadStream(found[0].url,false); }
    }catch(e){ console.log("JSON parse fail",e); }
    showLoader("No Stream in JSON"); setStatus("No Stream Found","error",0); return;
  }
  // M3U হলে প্রথম লিংক নাও
  if(url && url.includes(".m3u") && !url.includes(".m3u8")){
    showLoader("Reading Playlist...");
    try{ let r=await fetch(url); let t=await r.text(); let m=t.match(/https?:\/\/[^\s"']+/g); if(m && m.length){ currentStreamUrl=m[0]; return loadStream(m[0],false); } }catch(e){}
    showLoader("No Stream in Playlist"); return;
  }
  playSession++; let mySession=playSession;
  destroyHls();
  try{ if(player) await player.unload(); }catch(e){}
  video.removeAttribute("src"); video.load();
  showLoader("Connecting...");
  setStatus("Connecting...","loading",0);
  // ===== DRM CONFIG - MPD এর জন্য সবচেয়ে গুরুত্বপূর্ণ =====
  try{
    let drmConfig={};
    if(currentKid && currentKey){
      drmConfig.clearKeys={}; drmConfig.clearKeys[currentKid]=currentKey;
      console.log("RS DRM ClearKey Applied:",currentKid);
    }
    if(licenseUrl){
      // Widevine / PlayReady License
      drmConfig.servers={ "com.widevine.alpha": licenseUrl, "com.microsoft.playready": licenseUrl };
    }
    // DRM থাকলে ABR একটু Slow, Buffer বেশি
    player.configure({
      drm: drmConfig,
      abr:{ enabled:true, defaultBandwidthEstimate:3000000, switchInterval:4, bandwidthUpgradeTarget:0.85, bandwidthDowngradeTarget:0.95 },
      streaming:{ bufferingGoal:8, rebufferingGoal:2, bufferBehind:6, safeSeekOffset:2, retryParameters:{timeout:12000,maxAttempts:3,baseDelay:600,backoffFactor:1.5,fuzzFactor:0}, smallGapLimit:0.5, jumpLargeGaps:true, ignoreTextStreamFailures:true },
      manifest:{ retryParameters:{timeout:12000,maxAttempts:3,baseDelay:600,backoffFactor:1.5,fuzzFactor:0}, dash:{ignoreMinBufferTime:true, ignoreSuggestedPresentationDelay:true} },
      preferredAudioLanguage:"en",
      preferredTextLanguage:"en"
    });
    // Proxy হলে সব Request Proxy দিয়ে
    if(viaProxy){
      try{ player.getNetworkingEngine().clearAllRequestFilters(); }catch(e){}
      player.getNetworkingEngine().registerRequestFilter((type,req)=>{ if(req.uris && req.uris[0] && !req.uris[0].startsWith(PROXY)) req.uris[0]=makeProxy(req.uris[0]); });
    } else {
      try{ player.getNetworkingEngine().clearAllRequestFilters(); }catch(e){}
    }
  }catch(e){ console.log("Configure fail",e); }

  // ===== HLS হলে Shaka Fail হলে HLS.js Fallback =====
  if(isHls(url) && window.Hls && Hls.isSupported() && triedHlsFallback){
    showLoader("Trying HLS Engine...");
    return loadWithHlsJs(url, viaProxy, mySession);
  }
  try{
    await player.load(url);
    if(mySession!==playSession) return;
    showLoader("Starting video...");
    video.muted=!audioEnabled;
    try{ await video.play(); if(!video.muted) audioEnabled=true; }
    catch(e){ console.log("Autoplay blocked",e); video.muted=true; try{ await video.play(); }catch(e2){ console.log("Muted autoplay blocked",e2); showLoader("Tap video to play"); } }
  }catch(e){
    console.error("Shaka Load Error:",e);
    if(mySession!==playSession) return;
    // HLS হলে 1 বার HLS.js দিয়ে Try করো - Shaka তে অনেক HLS চলে না
    if(isHls(url) && window.Hls && Hls.isSupported() && !triedHlsFallback){
      triedHlsFallback=true; showLoader("Trying HLS Engine...");
      return loadWithHlsJs(url, viaProxy, mySession);
    }
    // DRM Error হলে Key ভুল হতে পারে - তাও Next Server এ যাও
    showLoader("Playback failed");
    setStatus("Playback Failed: "+(e.code||e.message||""),"error",3000);
    setTimeout(()=>{ if(mySession===playSession) tryNextOrFail(e.message||"load fail"); },800);
  }
}

function loadWithHlsJs(url, viaProxy, mySession){
  destroyHls();
  showLoader("Loading HLS...");
  let cfg={ maxBufferLength:12, maxMaxBufferLength:24, enableWorker:true, lowLatencyMode:true, backBufferLength:0, manifestLoadingMaxRetry:2, levelLoadingMaxRetry:3, fragLoadingMaxRetry:3, manifestLoadingRetryDelay:500, levelLoadingRetryDelay:500, fragLoadingRetryDelay:500, manifestLoadingTimeOut:12000, levelLoadingTimeOut:12000, fragLoadingTimeOut:12000, startLevel:-1, autoStartLoad:true, abrEwmaDefaultEstimate:3000000 };
  if(viaProxy){
    cfg.loader=class extends Hls.DefaultConfig.loader{ load(c,cf,cb){ if(c&&c.url&&!c.url.startsWith(PROXY)) c.url=makeProxy(c.url); super.load(c,cf,cb); } };
  }
  hlsInstance=new Hls(cfg);
  hlsInstance.loadSource(url);
  hlsInstance.attachMedia(video);
  hlsInstance.on(Hls.Events.MANIFEST_PARSED,()=>{ video.play().catch(()=>{}); });
  hlsInstance.on(Hls.Events.ERROR,(ev,data)=>{ if(mySession!==playSession) return; if(!data.fatal) return; console.log("HLS.js fatal",data); if(data.type===Hls.ErrorTypes.MEDIA_ERROR){ try{hlsInstance.recoverMediaError();}catch(e){} return; } tryNextOrFail(data.details||"hls fatal"); });
}
document.addEventListener("DOMContentLoaded",init);
})();
</script>
