<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>RsLive Go - Live TV</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;600;700&family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#05050d;color:#fff;font-family:'Hind Siliguri',sans-serif;padding-bottom:80px;overflow-x:hidden}
.wrap{position:relative;z-index:1;max-width:1200px;margin:0 auto}
.sticky-top{position:sticky;top:0;z-index:100;background:#05050d}
header{background:rgba(8,8,18,.96);backdrop-filter:blur(20px);padding:16px 16px 10px;border-bottom:1px solid rgba(255,255,255,.08)}
.header-top{display:flex;align-items:center;justify-content:space-between;max-width:1200px;margin:0 auto}
.logo{display:flex;align-items:center;gap:12px}
.logo .play-ico{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#22d3ee,#a78bfa,#ff5d8f);display:flex;align-items:center;justify-content:center;font-size:17px}
.logo-text .name{font-family:'Poppins';font-size:24px;font-weight:900}
.logo-text .name i{font-style:normal;background:linear-gradient(90deg,#22d3ee,#a78bfa,#ff5d8f);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo-text .tag{font-size:9px;letter-spacing:3.5px;color:#9a9ab5;font-weight:700;margin-top:3px}
.live-pill{display:flex;align-items:center;gap:6px;background:rgba(255,45,85,.14);border:1px solid rgba(255,45,85,.35);color:#ff6b81;font-size:10px;font-weight:800;padding:7px 11px;border-radius:20px}
.live-pill i{width:7px;height:7px;background:#ff2d55;border-radius:50%}
.search-wrap{position:relative;margin-top:14px}
.search-wrap .s-ico{position:absolute;left:15px;top:50%;transform:translateY(-50%)}
#search{width:100%;padding:14px 16px 14px 42px;border-radius:16px;border:1px solid rgba(255,255,255,.12);background:#12121f;color:#fff;font-size:14px;font-family:'Hind Siliguri';outline:none}
#cats{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;white-space:nowrap;scrollbar-width:none;background:#05050d;border-bottom:1px solid rgba(255,255,255,.07)}
#cats::-webkit-scrollbar{display:none}
.cat{padding:9px 17px;border-radius:20px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);font-size:12.5px;font-weight:600;cursor:pointer;flex-shrink:0}
.cat.active{background:linear-gradient(90deg,#22d3ee,#a78bfa);color:#000;font-weight:800;border:none}
#count{padding:10px 16px 0;font-size:12px;color:#888}
#grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:10px 12px}
@media(min-width:700px){#grid{grid-template-columns:repeat(5,1fr);gap:14px}}
@media(min-width:1000px){#grid{grid-template-columns:repeat(6,1fr);gap:16px}}
.card{background:linear-gradient(160deg,#181826,#10101c);border:1px solid #262633;border-radius:14px;padding:10px 6px;text-align:center;cursor:pointer;aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.card img{width:48px;height:48px;object-fit:contain;background:#fff;border-radius:10px;padding:5px}
.card p{font-size:10.5px;margin-top:7px;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-height:26px}
.card small{font-size:9px;color:#22d3ee;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
#noticeBar{display:none;background:linear-gradient(90deg,#22d3ee,#a78bfa,#ff5d8f);color:#000;font-size:12.5px;font-weight:700;padding:9px 14px;text-align:center}
#featured{display:none;margin:14px 16px 0;background:#221a3a;border:1px solid rgba(167,139,250,.4);border-radius:16px;padding:16px;cursor:pointer}
#status{position:fixed;bottom:0;left:0;right:0;z-index:200;background:#0a0a16;padding:10px;text-align:center;font-size:11px;color:#9a9ab5;border-top:1px solid rgba(255,255,255,.1)}
.telegram-float{position:fixed;right:16px;bottom:48px;z-index:201;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#2AABEE,#229ED9);display:flex;align-items:center;justify-content:center;text-decoration:none}
.telegram-float svg{width:28px;height:28px;fill:#fff}
</style>
</head>
<body>
<div id="noticeBar"></div>
<div class="sticky-top">
<header><div class="header-top"><div class="logo"><div class="play-ico">▶</div><div class="logo-text"><div class="name" id="siteNameEl">RsLive <i>Go</i></div><div class="tag" id="taglineEl">LIVE TV • BANGLADESH</div></div></div><div class="live-pill" id="livePill"><i></i> LIVE</div></div><div class="search-wrap"><span class="s-ico">🔍</span><input id="search" placeholder="চ্যানেল খুঁজো..."></div></header>
<div id="cats"></div>
</div>
<div class="wrap">
<div id="featured" onclick="if(window._featUrl) openCh(encodeURIComponent(window._featUrl),encodeURIComponent(window._featName),'Featured','Featured')"><div style="font-size:11px;color:#ff5d8f;font-weight:800">⭐ FEATURED LIVE</div><b id="featName">Featured Channel</b><br><span>এখনই দেখো →</span></div>
<div id="count"></div>
<div id="grid"><div style="grid-column:1/-1;text-align:center;padding:40px;color:#aaa">⏳ চ্যানেল লোড হচ্ছে...</div></div>
</div>
<div id="status">RsLive Go: Loading...</div>
<a class="telegram-float" id="teleBtn" href="https://t.me/rslivetv" target="_blank"><svg viewBox="0 0 24 24"><path d="M9.04 15.31l-.38 5.32c.54 0 .78-.23 1.06-.5l2.55-2.44 5.28 3.87c.97.53 1.66.25 1.92-.9L24 3.6c.1-.9-.32-1.38-1.1-1.12L1.5 10.2c-.9.35-.88 1.45.14 1.72l5.48 1.71 12.66-8.04c.6-.36 1.14-.17.7.23L9.04 15.31z"/></svg></a>
<script>
const DEFAULT_CFG={siteName:'RsLive Go',tagline:'LIVE TV • BANGLADESH',telegram:'https://t.me/rslivetv',searchPh:'চ্যানেল খুঁজো...',statusText:'✅ মোট {count} টা চ্যানেল - RsLive Go',showLive:true,showTele:true,proxyUrl:'https://stream-through-spark.lovable.app/api/proxy?u=',notice:'',showNotice:false,featName:'',featUrl:'',showFeat:false,playlists:[
{name:'Tapmad',url:'https://raw.githubusercontent.com/sm-monirulislam/Tapmad_Auto_Update_Playlist/refs/heads/main/tapmad_sm.m3u',useProxy:false},
{name:'SonyLiv',url:'https://raw.githubusercontent.com/sm-monirulislam/SonyLiv_Event_Playlist/refs/heads/main/sonyLiv.m3u',useProxy:true},
{name:'Toffee',url:'https://raw.githubusercontent.com/sm-monirulislam/Toffee-Auto-Update/refs/heads/main/toffee_playlist.m3u',useProxy:true},
{name:'AynaOTT',url:'https://raw.githubusercontent.com/sm-monirulislam/AynaOTT_Auto_Update_Playlist/refs/heads/main/aynaott.m3u',useProxy:false},
{name:'JagoBD',url:'https://raw.githubusercontent.com/sm-monirulislam/jago_bd_auto_update_playlist-/refs/heads/main/jago_bd_main.m3u',useProxy:false},
{name:'Bangladesh',url:'https://iptv-org.github.io/iptv/countries/bd.m3u',useProxy:false},
{name:'India',url:'https://iptv-org.github.io/iptv/countries/in.m3u',useProxy:false},
{name:'Sports',url:'https://iptv-org.github.io/iptv/categories/sports.m3u',useProxy:false},
]};
// ===== আলাদা Admin থেকে লিংক দিয়ে আসলে ওই সেটিংস পড়বে =====
function getCfgFromLink(){
  try{
    const p=new URLSearchParams(location.search);
    const c=p.get('cfg');
    if(!c) return null;
    let s=c.replaceAll('-','+').replaceAll('_','/');
    while(s.length%4) s+='=';
    return JSON.parse(decodeURIComponent(escape(atob(s))));
  }catch(e){ return null; }
}
let saved=null;
let linkCfg=getCfgFromLink();
if(linkCfg && linkCfg.playlists && linkCfg.playlists.length>0){
  saved=linkCfg;
  try{ localStorage.setItem('rslive_config', JSON.stringify(linkCfg)); }catch(e){}
} else {
  try{saved=JSON.parse(localStorage.getItem('rslive_config')||'null')}catch(e){}
  if(!saved || !saved.playlists || saved.playlists.length===0) saved=null;
}
const CFG={...DEFAULT_CFG,...(saved||{})};
if(saved && saved.playlists && saved.playlists.length>0) CFG.playlists=saved.playlists;
document.getElementById('siteNameEl').innerHTML=CFG.siteName.replace('Go','<i>Go</i>');
document.getElementById('taglineEl').textContent=CFG.tagline;
document.getElementById('search').placeholder=CFG.searchPh;
document.getElementById('teleBtn').href=CFG.telegram;
if(!CFG.showLive) document.getElementById('livePill').style.display='none';
if(!CFG.showTele) document.getElementById('teleBtn').style.display='none';
if(CFG.showNotice&&CFG.notice){const n=document.getElementById('noticeBar');n.textContent=CFG.notice;n.style.display='block'}
if(CFG.showFeat&&CFG.featName){document.getElementById('featured').style.display='block';document.getElementById('featName').textContent=CFG.featName;window._featUrl=CFG.featUrl;window._featName=CFG.featName}
const PROXY=CFG.proxyUrl; const PLAYLISTS=CFG.playlists;
let allChannels=[]; let activeCat="All";
async function loadOne(p){const fetchUrl=p.useProxy?PROXY+encodeURIComponent(p.url):p.url; try{const res=await fetch(fetchUrl);const text=await res.text();return parseM3U(text)}catch(e){return[]}}
function parseM3U(text){const lines=text.split("\n");const out=[];let cur=null;for(let line of lines){line=line.trim();if(line.startsWith("#EXTINF")){const name=line.split(",").pop().trim();const logoMatch=line.match(/tvg-logo="([^"]+)"/);const groupMatch=line.match(/group-title="([^"]+)"/);cur={name,logo:logoMatch?logoMatch[1]:"",group:groupMatch?groupMatch[1]:"General"}}else if(line.startsWith("http")&&cur){cur.url=line;if(cur.name&&cur.url)out.push(cur);cur=null}}return out}
async function loadAll(){document.getElementById("status").textContent="⏳ চ্যানেল লোড হচ্ছে...";for(let p of PLAYLISTS){const list=await loadOne(p);for(let ch of list){ch.source=p.name;if(!allChannels.find(x=>x.url===ch.url))allChannels.push(ch)}document.getElementById("status").textContent=`✅ ${allChannels.length} টা চ্যানেল লোড হইছে... (${p.name})`;render()}document.getElementById("status").textContent=CFG.statusText.replace('{count}',allChannels.length);if(allChannels.length===0){document.getElementById("grid").innerHTML=`<div style="grid-column:1/-1;text-align:center;padding:40px;color:#ff5d5d">❌ চ্যানেল লোড হয় নাই<br><br>নেট চেক করে Refresh দাও।</div>`}}
function getCats(){return ["All","Tapmad","SonyLiv","Toffee","AynaOTT","JagoBD","Sports","News","General","Entertainment","Movies","Kids","Music","Bangladesh","India"]}
function render(){const q=document.getElementById("search").value.toLowerCase();let filtered=allChannels.filter(c=>{const matchSearch=!q||c.name.toLowerCase().includes(q);let matchCat=true;if(activeCat==="All")matchCat=true;else if(["Tapmad","SonyLiv","Toffee","AynaOTT","JagoBD"].includes(activeCat))matchCat=c.source===activeCat;else if(activeCat==="Sports")matchCat=c.group.toLowerCase().includes("sport");else if(activeCat==="News")matchCat=c.group.toLowerCase().includes("news");else if(activeCat==="Movies")matchCat=c.group.toLowerCase().includes("movie");else if(activeCat==="Kids")matchCat=c.group.toLowerCase().includes("kid")||c.group.toLowerCase().includes("children");else if(activeCat==="Music")matchCat=c.group.toLowerCase().includes("music");else if(activeCat==="Entertainment")matchCat=c.group.toLowerCase().includes("entertainment")||c.group.toLowerCase().includes("general");else if(activeCat==="Bangladesh")matchCat=c.name.toLowerCase().includes("bangla")||c.name.toLowerCase().includes("btv")||c.name.toLowerCase().includes("t sports")||c.name.toLowerCase().includes("channel i")||c.name.toLowerCase().includes("somoy")||c.name.toLowerCase().includes("jamuna")||c.name.toLowerCase().includes("ntv")||c.name.toLowerCase().includes("maasranga");else if(activeCat==="India")matchCat=c.name.toLowerCase().includes("star")||c.name.toLowerCase().includes("sony")||c.name.toLowerCase().includes("zee")||c.name.toLowerCase().includes("colors");else matchCat=c.group.toLowerCase().includes(activeCat.toLowerCase());return matchSearch&&matchCat});document.getElementById("count").textContent=`${filtered.length} টা চ্যানেল দেখাচ্ছে`;document.getElementById("cats").innerHTML=getCats().map(c=>`<div class="cat ${c===activeCat?'active':''}" onclick="setCat('${c}')">${c}</div>`).join("");document.getElementById("grid").innerHTML=filtered.slice(0,500).map(c=>`<div class="card" onclick="openCh('${encodeURIComponent(c.url)}','${encodeURIComponent(c.name)}','${c.source}','${encodeURIComponent(c.group)}')"><img src="${c.logo||'https://cdn-icons-png.flaticon.com/512/1179/1179069.png'}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/1179/1179069.png'"><p>${c.name}</p><small>${c.group}</small></div>`).join("")}
function setCat(c){activeCat=c;render()}
function openCh(urlEnc,nameEnc,src,groupEnc){const url=decodeURIComponent(urlEnc);window.location.href=`player.html?url=${encodeURIComponent(url)}&name=${nameEnc}&src=${encodeURIComponent(src||'')}&group=${groupEnc||''}`}
document.getElementById("search").addEventListener("input",render);loadAll();
</script>
</body>
</html>
