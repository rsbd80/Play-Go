<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
html,body{height:100%;overflow:hidden}

.sticky{flex-shrink:0;position:relative;z-index:100}

.header-top{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:2;order:1}
.search-wrap{position:relative;margin-top:14px;z-index:2;order:2}
.logo{display:flex;align-items:center;gap:11px;cursor:pointer}
.logo:active{transform:scale(.96)}
.logo .play-ico{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#22d3ee 0%,#a78bfa 50%,#ff5d8f 100%);display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;box-shadow:0 6px 22px rgba(167,139,250,.55),inset 0 1px 0 rgba(255,255,255,.4);animation:logoFloat 2.8s ease-in-out infinite}
@keyframes logoFloat{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-2px) rotate(-2deg)}}
.logo-text{line-height:1}
.logo-text .name{font-family:'Poppins',sans-serif;font-size:23px;font-weight:900;letter-spacing:.3px}
.logo-text .name i{font-style:normal;background:linear-gradient(90deg,#22d3ee,#a78bfa,#ff5d8f,#22d3ee);background-size:300% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 3s linear infinite}
@keyframes shine{to{background-position:300% center}}
.logo-text .tag{font-size:9px;letter-spacing:3.5px;color:#9a9ab5;font-weight:700;margin-top:2px}
.live-pill{display:flex;align-items:center;gap:6px;background:rgba(255,45,85,.14);border:1px solid rgba(255,45,85,.35);color:#ff6b81;font-size:10px;font-weight:800;letter-spacing:1px;padding:6px 10px;border-radius:20px;flex-shrink:0}
.live-pill i{width:7px;height:7px;background:#ff2d55;border-radius:50%;box-shadow:0 0 0 0 rgba(255,45,85,.7);animation:pulseDot 1.4s infinite}
@keyframes pulseDot{0%{box-shadow:0 0 0 0 rgba(255,45,85,.7)}70%{box-shadow:0 0 0 7px rgba(255,45,85,0)}100%{box-shadow:0 0 0 0 rgba(255,45,85,0)}}
.search-wrap .s-ico{position:absolute;left:15px;top:50%;transform:translateY(-50%);font-size:16px;z-index:2}
#search{width:100%;padding:14px 16px 14px 42px;border-radius:16px;border:1px solid rgba(255,255,255,.12);background:linear-gradient(180deg,#1d1d2e,#14141f);color:#fff;font-size:14px;font-family:'Hind Siliguri',sans-serif;outline:none;transition:.25s;box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 6px 20px rgba(0,0,0,.3);user-select:text;-webkit-user-select:text}
#search::placeholder{color:#7a7a92}
#search:focus{border-color:#a78bfa;box-shadow:0 0 0 3px rgba(167,139,250,.22),0 10px 28px rgba(167,139,250,.18);background:#1a1a2b}
#cats{display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;padding:14px 16px;white-space:nowrap;scrollbar-width:none;background:#07070f;border-bottom:1px solid rgba(255,255,255,.08);-webkit-overflow-scrolling:touch;flex-shrink:0}
#cats::-webkit-scrollbar{display:none}
.cat{padding:9px 14px;border-radius:20px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);font-size:12.5px;font-weight:600;cursor:pointer;flex-shrink:0;transition:background .1s;display:inline-flex;align-items:center;gap:6px}
.cat .cat-count{font-size:11px;font-weight:700;background:rgba(255,255,255,.12);color:#ccc;padding:2px 8px;border-radius:20px;min-width:24px;text-align:center}
.cat.active{background:#2a2a3a;color:#fff;border:1px solid rgba(255,255,255,.28);box-shadow:none}
.cat.active .cat-count{background:rgba(255,255,255,.18);color:#fff}
#count{display:none!important}
#scrollArea{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:90px;scrollbar-width:thin}

#grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:12px 16px}

.card{background:#15151f;border:1px solid #262633;border-radius:14px;padding:10px 6px;text-align:center;cursor:pointer;transition:border-color .1s;aspect-ratio:1/1;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}

.card small{font-size:9px;color:#22d3ee}
#loadMoreWrap{text-align:center;padding:6px 16px 18px;display:none}
#loadMoreBtn{width:100%;max-width:320px;padding:13px;border:none;border-radius:14px;background:#2a2a3a;color:#fff;font-family:'Hind Siliguri',sans-serif;font-size:14px;font-weight:700;cursor:pointer;border:1px solid rgba(255,255,255,.2)}
#loadMoreBtn:active{transform:scale(.97)}
#noticeBar{display:none;background:linear-gradient(90deg,#22d3ee,#a78bfa,#ff5d8f);color:#000;font-size:12.5px;font-weight:700;padding:9px;text-align:center;flex-shrink:0}
#featured{display:none;margin:14px 16px 0;background:#221a3a;border:1px solid #a78bfa;border-radius:14px;padding:14px;cursor:pointer}
#status{position:fixed;bottom:0;left:0;right:0;background:rgba(10,10,20,.92);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);padding:11px 12px;text-align:center;font-size:12px;font-weight:600;color:#c8c8dd;border-top:1px solid rgba(255,255,255,.08);z-index:200}

.tele{position:fixed;right:14px;bottom:110px;width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,#2AABEE,#229ED9);display:flex;align-items:center;justify-content:center;z-index:999;text-decoration:none;box-shadow:0 8px 24px rgba(42,171,238,.5);animation:floatBtn 2.5s ease-in-out infinite}
.tele svg{width:26px;height:26px;fill:#fff;transform:translateX(-1px)}
.tele::before{content:"";position:absolute;inset:0;border-radius:50%;background:#2AABEE;animation:telePulse 1.8s ease-out infinite;z-index:-1}
@keyframes telePulse{0%{transform:scale(1);opacity:.6}100%{transform:scale(1.7);opacity:0}}
@keyframes floatBtn{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.tele:active{transform:scale(.92)}
#blockScreen{display:none;position:fixed;inset:0;background:#07070f;z-index:99999;align-items:center;justify-content:center;text-align:center;padding:30px}
#installBar{display:none;position:fixed;left:12px;right:12px;bottom:38px;z-index:998;background:linear-gradient(135deg,#1a1a2e 0%,#2d1b4e 45%,#1a1a2e 100%);border:1px solid rgba(167,139,250,.45);color:#fff;border-radius:100px;padding:4px 4px 4px 8px;align-items:center;justify-content:center;gap:7px;box-shadow:0 10px 28px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.05) inset;min-height:36px}
#installBar .ib-ico{width:26px;height:26px;flex-shrink:0;border-radius:50%;background:linear-gradient(135deg,#22d3ee,#a78bfa,#ff5d8f);display:flex;align-items:center;justify-content:center;font-size:12px;box-shadow:0 3px 10px rgba(167,139,250,.5)}
#installBar .ib-txt{flex:1;text-align:center;line-height:1.2;min-width:0}
#installBar .ib-txt b{font-family:'Poppins','Hind Siliguri',sans-serif;font-size:12.5px;font-weight:800;letter-spacing:.3px;display:block;background:linear-gradient(90deg,#fff,#c4b5fd,#fda4af);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
#installBar .ib-txt span{font-size:10px;color:#b8b8d0;display:block;font-weight:600;white-space:nowrap}
#installBar .ib-btn{background:linear-gradient(90deg,#22d3ee,#a78bfa,#ff5d8f);background-size:200% auto;color:#fff;border:none;padding:7px 12px;border-radius:100px;font-family:'Hind Siliguri',sans-serif;font-weight:800;font-size:11.5px;white-space:nowrap;flex-shrink:0;box-shadow:0 4px 14px rgba(167,139,250,.55);animation:btnShine 2.5s linear infinite}
@keyframes btnShine{to{background-position:200% center}}
#installBar .ib-btn:active{transform:scale(.94)}
#installBar .ib-close{width:22px;height:22px;flex-shrink:0;border-radius:50%;background:rgba(255,255,255,.12);color:#ddd;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;cursor:pointer}
.desktop-wrap{display:flex;flex-direction:column;flex:1;min-height:0}

@media(min-width:1300px){
