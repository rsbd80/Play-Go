<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>RsLive Go - Live TV</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#07070f">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;600;700&family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;overflow-x:hidden}
body{background:#07070f;color:#eef0f7;font-family:'Poppins','Hind Siliguri',sans-serif;padding-bottom:78px;min-height:100vh}
/* Header + Search এক লাইনে - বামে Header, ডানে ছোট Search */
.topbar{position:sticky;top:0;z-index:100;padding:10px 10px 8px;background:rgba(10,10,20,.92);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:8px}
.brand{display:flex;align-items:center;gap:7px;flex-shrink:0}
.brand .ico{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#22d3ee,#a78bfa,#ff5d8f);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.brand .pg{font-size:17px;font-weight:900;line-height:1;white-space:nowrap}
.brand .pg i{font-style:normal;background:linear-gradient(90deg,#22d3ee,#a78bfa,#ff5d8f,#fb923c);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand .tag{font-size:7.5px;letter-spacing:2px;color:#9a9ab5;font-weight:700;margin-top:1px;white-space:nowrap}
.search{flex:1;min-width:0}
.search input{width:100%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:9px 10px;color:#fff;outline:none;font-family:inherit;font-size:12px}
.view{display:none;padding:10px 8px 0;width:100%}
.view.active{display:block}
.sec-title{font-size:14px;font-weight:800;margin:6px 2px 10px}
.grid{display:grid;grid-template-columns:repeat(3, minmax(0,1fr));gap:10px;width:100%}
.card{background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.11);border-radius:16px;padding:12px 6px 10px;text-align:center;cursor:pointer;position:relative;aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;overflow:hidden}
.card:active{transform:scale(.95);border-color:#a78bfa}
.card img{width:54px;height:54px;object-fit:cover;background:#fff;border-radius:50%;padding:4px;border:2px solid rgba(167,139,250,.4);flex-shrink:0}
.card p{font-size:12px;font-weight:600;margin-top:8px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:30px;word-break:break-word}
.live-badge{position:absolute;top:5px;right:5px;background:#ff2d55;color:#fff;font-size:7px;font-weight:800;padding:2px 6px;border-radius:20px}
/* Events Pill - ছবির মতো, Category Playlist থেকে */
.pill-row{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.pill-row::-webkit-scrollbar{display:none}
.pill{flex-shrink:0;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);border-radius:20px;padding:7px 12px;cursor:pointer;font-family:inherit;color:#cbd5e1;font-size:12.5px;font-weight:700;white-space:nowrap}
.pill .cnt{background:rgba(255,255,255,.14);font-size:11px;padding:2px 7px;border-radius:20px;min-width:24px;text-align:center}
.pill.active{background:rgba(167,139,250,.25);border-color:rgba(167,139,250,.55);color:#fff}
.pill.active .cnt{background:#a78bfa;color:#fff}
/* Match Card - ছবির মতো */
.match-card{background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:14px 12px 12px;margin-bottom:12px;cursor:pointer}
.match-card:active{transform:scale(.98);border-color:#a78bfa}
.match-title{text-align:center;font-size:12px;font-weight:700;letter-spacing:.5px;color:#9a9ab5;text-transform:uppercase;margin-bottom:12px}
.match-teams{display:flex;align-items:center;justify-content:space-between;gap:8px}
.m-team{flex:1;text-align:center;min-width:0}
.m-team img{width:62px;height:62px;object-fit:cover;background:#fff;border-radius:14px;padding:4px}
.m-team p{font-size:14px;font-weight:700;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-mid{text-align:center;flex-shrink:0}
.m-live{display:inline-block;background:linear-gradient(90deg,#ff2d55,#ff5d8f);color:#fff;font-size:11px;font-weight:800;padding:5px 12px;border-radius:20px;letter-spacing:1px}
.m-live i{width:6px;height:6px;background:#fff;border-radius:50%;display:inline-block;margin-right:5px}
.m-vs{font-size:20px;font-weight:800;font-style:italic;color:#fff;margin-top:8px}
.m-time{text-align:center;font-size:12px;color:#9a9ab5;margin-top:12px}
.cat-grid{display:grid;grid-template-columns:repeat(2, minmax(0,1fr));gap:10px;width:100%}
.cat-card{background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.11);border-radius:18px;padding:12px 8px;text-align:center;cursor:pointer;aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0}
.cat-card .cat-logo{width:60px;height:60px;border-radius:50%;background:#fff;padding:5px;display:flex;align-items:center;justify-content:center;border:3px solid rgba(167,139,250,.45);margin-bottom:8px}
.cat-card .cat-logo img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.cat-card h3{font-size:13px;font-weight:800}
.cat-card p{font-size:10.5px;color:#9a9ab5;margin-top:2px}
.cat-card .count{margin-top:7px;background:rgba(167,139,250,.18);border:1px solid rgba(167,139,250,.4);color:#e9d5ff;font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px}
.back-btn{display:inline-flex;gap:6px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);padding:8px 12px;border-radius:20px;font-size:12px;font-weight:700;margin-bottom:10px;cursor:pointer}
.empty{text-align:center;color:#888;font-size:13px;padding:30px 10px;line-height:1.6}
.skel{aspect-ratio:1/1;border-radius:16px;background:#15151f}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:200;background:rgba(10,10,20,.97);backdrop-filter:blur(16px);border-top:1px solid rgba(255,255,255,.10);padding:5px 6px calc(5px + env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.nav-btn{background:transparent;border:1px solid transparent;color:#8a8a9e;padding:6px 4px 5px;border-radius:12px;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.nav-btn .nav-ico{width:20px;height:20px;display:flex;align-items:center;justify-content:center}
.nav-btn .nav-ico svg{width:20px;height:20px}
.nav-btn .nav-label{font-size:12px;font-weight:700;line-height:1}
.nav-btn.active{color:#fff;background:linear-gradient(180deg,rgba(167,139,250,.22),rgba(34,211,238,.12));border-color:rgba(167,139,250,.45)}
.nav-btn.active .nav-ico{color:#a78bfa}
.nav-btn .dot{position:absolute;top:5px;right:22%;width:6px;height:6px;background:#ff2d55;border-radius:50%;border:1px solid #0a0a14;display:none}
.nav-btn.has-live .dot{display:block}
@media(min-width:900px){body{padding-bottom:0}.bottom-nav{position:sticky;top:0;bottom:auto;max-width:600px;margin:0 auto;border-radius:0 0 14px 14px;border:1px solid rgba(255,255,255,.1);border-top:none}.grid{grid-template-columns:repeat(6,1fr)}.cat-grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<!-- Header বামে, Search ডানে - এক লাইনে -->
<div class="topbar">
  <div class="brand"><div class="ico">▶</div><div><div class="pg">RsLive <i>Go</i></div><div class="tag">LIVE TV • BANGLADESH</div></div></div>
  <div class="search"><input id="searchInput" placeholder="🔍 Search..."></div>
</div>

<div id="view-home" class="view active">
  <div id="homeGrid" class="grid"><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
</div>

<!-- EVENTS - উপরে Category Playlist Pill, নিচে আসল ম্যাচ, Default নাই -->
<div id="view-events" class="view">
  <div class="pill-row" id="eventsPills"></div>
  <div id="eventsList"></div>
</div>

<div id="view-categories" class="view">
  <div id="catListWrap"><div id="catGrid" class="cat-grid"></div></div>
  <div id="catDetailWrap" style="display:none"><div class="back-btn" onclick="backToCategories()">← সব Category</div><div class="sec-title" id="catDetailTitle">Category</div><div id="catDetailGrid" class="grid"></div></div>
</div>

<nav class="bottom-nav">
  <button class="nav-btn" id="navEvents" onclick="switchTab('events')">
    <span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8"/><path d="M12 17v4"/><path d="M7 4h10v5a5 5 0 0 1-10 0V4z"/><path d="M7 6H4a2 2 0 0 0 2 5h1"/><path d="M17 6h3a2 2 0 0 1-2 5h-1"/></svg></span>
    <span class="nav-label">Events</span><span class="dot"></span>
  </button>
  <button class="nav-btn active" id="navHome" onclick="switchTab('home')">
    <span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9 21v-6h6v6"/></svg></span>
    <span class="nav-label">Home</span>
  </button>
  <button class="nav-btn" id="navCategories" onclick="switchTab('categories')">
    <span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></span>
    <span class="nav-label">Categories</span>
  </button>
</nav>
<script src="/app.js"></script>
</body>
</html>
