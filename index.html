<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
html{overflow-x:hidden;overflow-y:auto}
body{background:#07070f;color:#fff;font-family:'Hind Siliguri','Segoe UI',sans-serif;padding-bottom:80px;overflow-x:hidden}
.sticky{position:sticky;top:0;z-index:100}
header{position:relative;z-index:20;background:rgba(10,10,20,.92);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);padding:16px 16px 16px;border-bottom:1px solid rgba(255,255,255,.08);overflow:hidden}
header::before{content:"";position:absolute;top:-60px;left:-20px;width:220px;height:120px;background:radial-gradient(circle,rgba(34,211,238,.28),transparent 70%);filter:blur(10px);pointer-events:none}
header::after{content:"";position:absolute;top:-60px;right:-20px;width:220px;height:120px;background:radial-gradient(circle,rgba(167,139,250,.30),transparent 70%);filter:blur(10px);pointer-events:none}
.header-top{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:2}
.logo{display:flex;align-items:center;gap:11px}
.logo .play-ico{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#22d3ee 0%,#a78bfa 50%,#ff5d8f 100%);display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;box-shadow:0 6px 22px rgba(167,139,250,.55),inset 0 1px 0 rgba(255,255,255,.4);animation:logoFloat 2.8s ease-in-out infinite}
@keyframes logoFloat{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-2px) rotate(-2deg)}}
.logo-text{line-height:1}
.logo-text .name{font-family:'Poppins',sans-serif;font-size:23px;font-weight:900;letter-spacing:.3px}
.logo-text .name i{font-style:normal;background:linear-gradient(90deg,#22d3ee,#a78bfa,#ff5d8f,#22d3ee);background-size:300% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 3s linear infinite}
@keyframes shine{to{background-position:300% center}}
.logo-text .tag{font-size:9px;letter-spacing:3.5px;color:#9a9ab5;font-weight:700;margin-top:2px}
.live-pill{display:flex;align-items:center;gap:6px;background:rgba(255,45,85,.14);border:1px solid rgba(255,45,85,.35);color:#ff6b81;font-size:10px;font-weight:800;letter-spacing:1px;padding:6px 10px;border-radius:20px}
.live-pill i{width:7px;height:7px;background:#ff2d55;border-radius:50%;box-shadow:0 0 0 0 rgba(255,45,85,.7);animation:pulseDot 1.4s infinite}
@keyframes pulseDot{0%{box-shadow:0 0 0 0 rgba(255,45,85,.7)}70%{box-shadow:0 0 0 7px rgba(255,45,85,0)}100%{box-shadow:0 0 0 0 rgba(255,45,85,0)}}
.search-wrap{position:relative;margin-top:14px;z-index:2}
.search-wrap .s-ico{position:absolute;left:15px;top:50%;transform:translateY(-50%);font-size:16px;z-index:2}
#search{width:100%;padding:14px 16px 14px 42px;border-radius:16px;border:1px solid rgba(255,255,255,.12);background:linear-gradient(180deg,#1d1d2e,#14141f);color:#fff;font-size:14px;font-family:'Hind Siliguri',sans-serif;outline:none;transition:.25s;box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 6px 20px rgba(0,0,0,.3);user-select:text;-webkit-user-select:text}
#search::placeholder{color:#7a7a92}
#search:focus{border-color:#a78bfa;box-shadow:0 0 0 3px rgba(167,139,250,.22),0 10px 28px rgba(167,139,250,.18);background:#1a1a2b}
#cats{display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;padding:14px 16px;white-space:nowrap;scrollbar-width:none;background:#07070f;border-bottom:1px solid rgba(255,255,255,.08);-webkit-overflow-scrolling:touch}
#cats::-webkit-scrollbar{display:none}
.cat{padding:9px 17px;border-radius:20px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);font-size:12.5px;font-weight:600;cursor:pointer;flex-shrink:0;transition:.2s}
.cat.active{background:linear-gradient(90deg,#22d3ee,#a78bfa);color:#000;font-weight:800;border:none;box-shadow:0 4px 16px rgba(167,139,250,.4)}
#count{padding:10px 16px 0;font-size:12px;color:#888}
#grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:12px 16px}
@media(min-width:600px){#grid{grid-template-columns:repeat(5,1fr)}}
@media(min-width:1000px){#grid{grid-template-columns:repeat(6,1fr)}}
.card{background:#15151f;border:1px solid #262633;border-radius:14px;padding:10px 6px;text-align:center;cursor:pointer;transition:.2s;aspect-ratio:1/1;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.card:hover{border-color:#a78bfa;transform:translateY(-2px);box-shadow:0 8px 20px rgba(167,139,250,.15)}
.card img{width:52px;height:52px;object-fit:contain;background:#fff;border-radius:10px;padding:4px;flex-shrink:0;pointer-events:none}
.card p{font-size:11px;margin-top:8px;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-height:28px}
.card small{font-size:9px;color:#22d3ee}
#noticeBar{display:none;background:linear-gradient(90deg,#22d3ee,#a78bfa,#ff5d8f);color:#000;font-size:12.5px;font-weight:700;padding:9px;text-align:center}
#featured{display:none;margin:14px 16px 0;background:#221a3a;border:1px solid #a78bfa;border-radius:14px;padding:14px;cursor:pointer}
#status{position:fixed;bottom:0;left:0;right:0;background:rgba(10,10,20,.92);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);padding:11px 12px;text-align:center;font-size:12px;font-weight:600;color:#c8c8dd;border-top:1px solid rgba(255,255,255,.08);z-index:200}
#status b{background:linear-gradient(90deg,#22d3ee,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent}
.tele{position:fixed;right:16px;bottom:48px;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#2AABEE,#229ED9);display:flex;align-items:center;justify-content:center;z-index:999;text-decoration:none;box-shadow:0 8px 24px rgba(42,171,238,.5);animation:floatBtn 2.5s ease-in-out infinite}
.tele svg{width:28px;height:28px;fill:#fff;transform:translateX(-1px)}
.tele::before{content:"";position:absolute;inset:0;border-radius:50%;background:#2AABEE;animation:telePulse 1.8s ease-out infinite;z-index:-1}
@keyframes telePulse{0%{transform:scale(1);opacity:.6}100%{transform:scale(1.7);opacity:0}}
@keyframes floatBtn{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.tele:active{transform:scale(.92)}
#blockScreen{display:none;position:fixed;inset:0;background:#07070f;z-index:99999;align-items:center;justify-content:center;text-align:center;padding:30px}
#installBar{display:none;position:fixed;left:12px;right:12px;bottom:38px;z-index:998;background:linear-gradient(90deg,#22d3ee,#a78bfa,#ff5d8f);color:#000;border-radius:16px;padding:12px 14px;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
</style>

<body>
<div id="blockScreen"><div><div style="font-size:50px">🔒</div><h2 style="margin:12px 0">Security Alert</h2><p style="color:#aaa">DevTools বন্ধ করে আবার ঢুকো<br>RsLive Go Protected</p><button onclick="location.reload()" style="margin-top:16px;padding:10px 20px;border:none;border-radius:10px;background:linear-gradient(90deg,#22d3ee,#a78bfa);font-weight:800">Reload</button></div></div>
<div id="noticeBar"></div>
<div class="sticky">
<header>
<div class="header-top">
<div class="logo">
<div class="play-ico">▶</div>
<div class="logo-text"><div class="name">RsLive <i>Go</i></div><div class="tag" id="taglineEl">LIVE TV • BANGLADESH</div></div>
</div>
<div class="live-pill" id="livePill"><i></i> LIVE</div>
</div>
<div class="search-wrap">
<span class="s-ico">🔍</span>
<input id="search" placeholder="চ্যানেল খুঁজো..." autocomplete="off">
</div>
</header>
<div id="cats"></div>
</div>
<div id="featured" onclick="if(window._f) openCh(encodeURIComponent(window._f),encodeURIComponent(window._fn),'Featured','Featured')"><div style="font-size:11px;color:#ff5d8f;font-weight:800">⭐ FEATURED LIVE</div><b id="featName"></b><br><span style="font-size:11px;color:#22d3ee">এখনই দেখো →</span></div>
<div id="count"></div>
<div id="grid"><div style="grid-column:1/-1;text-align:center;padding:40px;color:#aaa">⏳ চ্যানেল লোড হচ্ছে...</div></div>
<div id="status">Loading...</div>
<a class="tele" id="teleBtn" href="https://t.me/rslivetv" target="_blank" aria-label="Telegram"><svg viewBox="0 0 24 24"><path d="M9.04 15.31l-.38 5.32c.54 0 .78-.23 1.06-.5l2.55-2.44 5.28 3.87c.97.53 1.66.25 1.92-.9L24 3.6c.1-.9-.32-1.38-1.1-1.12L1.5 10.2c-.9.35-.88 1.45.14 1.72l5.48 1.71 12.66-8.04c.6-.36 1.14-.17.7.23L9.04 15.31z"/></svg></a>

<!-- Install App Banner -->
<div id="installBar">
  <div style="font-size:24px">📲</div>
  <div style="flex:1;line-height:1.2"><b style="font-size:14px">RsLive Go App ইন্সটল করো</b><br><span style="font-size:11px;opacity:.8">হোম স্ক্রিন থেকে ১ ক্লিকে খুলবে, ফুল স্ক্রিনে চলবে</span></div>
  <button id="installBtn" style="background:#000;color:#fff;border:none;padding:9px 14px;border-radius:10px;font-weight:800;font-size:12px;white-space:nowrap">Install</button>
  <span id="closeInstall" style="font-size:18px;cursor:pointer;padding:0 2px">✕</span>
</div>

<script>
const CONFIG_VERSION = 'v4-pwa-secure';
const DEFAULT={siteName:'RsLive Go',tagline:'LIVE TV • BANGLADESH',telegram:'https://t.me/rslivetv',searchPh:'চ্যানেল খুঁজো...',statusText:'✅ মোট {count} টা চ্যানেল - RsLive Go',showLive:true,showTele:true,proxyUrl:'https://stream-through-spark.lovable.app/api/proxy?u=',notice:'',showNotice:false,featName:'',featUrl:'',showFeat:false,playlists:[]};
let saved=null; try{saved=JSON.parse(localStorage.getItem('rslive_config')||'null')}catch(e){}
if(!saved || saved.version !== CONFIG_VERSION || !saved.playlists){ saved=null; localStorage.removeItem('rslive_config'); }
const CFG={...DEFAULT,...(saved||{})}; if(saved&&saved.playlists) CFG.playlists=saved.playlists;
document.getElementById('taglineEl').textContent=CFG.tagline;
document.getElementById('search').placeholder=CFG.searchPh;
document.getElementById('teleBtn').href=CFG.telegram;
if(!CFG.showLive) document.getElementById('livePill').style.display='none';
if(!CFG.showTele) document.getElementById('teleBtn').style.display='none';
if(CFG.showNotice&&CFG.notice){let n=document.getElementById('noticeBar');n.textContent=CFG.notice;n.style.display='block'}
if(CFG.showFeat&&CFG.featName){document.getElementById('featured').style.display='block';document.getElementById('featName').textContent=CFG.featName;window._f=CFG.featUrl;window._fn=CFG.featName}
let all=[]; let cat="All";
async function getPlaylistsFromSW(){
  try{
    await navigator.serviceWorker.ready;
    let r = await fetch('/api/playlists');
    let data = await r.json();
    if(data && data.length) return data;
  }catch(e){}
  return CFG.playlists;
}
async function loadOne(p){let u=p.useProxy?CFG.proxyUrl+encodeURIComponent(p.url):p.url; try{let r=await fetch(u);let t=await r.text();return parse(t)}catch(e){return[]}}
function parse(t){let l=t.split("\n"),o=[],c=null;for(let x of l){x=x.trim();if(x.startsWith("#EXTINF")){let n=x.split(",").pop().trim();let lg=x.match(/tvg-logo="([^"]+)"/);let g=x.match(/group-title="([^"]+)"/);c={name:n,logo:lg?lg[1]:"",group:g?g[1]:"General"}}else if(x.startsWith("http")&&c){c.url=x;o.push(c);c=null}}return o}
async function loadAll(){
  CFG.playlists = await getPlaylistsFromSW();
  for(let p of CFG.playlists){let list=await loadOne(p);for(let ch of list){ch.source=p.name;if(!all.find(y=>y.url===ch.url))all.push(ch)}document.getElementById("status").innerHTML=`✅ মোট <b>${all.length}</b> টা চ্যানেল লোড হইছে...`;render()}document.getElementById("status").innerHTML=CFG.statusText.replace('{count}',`<b>${all.length}</b>`)}
function getCats(){let sources = [...new Set(CFG.playlists.map(p=>p.name))]; return ["All", ...sources, "Sports","News","Entertainment","Movies","Kids","Music","Bangladesh","India"];}
function render(){let q=document.getElementById("search").value.toLowerCase();let f=all.filter(c=>{let s=!q||c.name.toLowerCase().includes(q);let m=true;if(cat==="All")m=true;else if(CFG.playlists.find(p=>p.name===cat))m=c.source===cat;else if(cat==="Sports")m=c.group.toLowerCase().includes("sport")||c.group.toLowerCase().includes("cricket")||c.group.toLowerCase().includes("football");else if(cat==="News")m=c.group.toLowerCase().includes("news");else if(cat==="Movies")m=c.group.toLowerCase().includes("movie");else if(cat==="Kids")m=c.group.toLowerCase().includes("kid");else if(cat==="Music")m=c.group.toLowerCase().includes("music");else if(cat==="Entertainment")m=c.group.toLowerCase().includes("entertainment")||c.group.toLowerCase().includes("general");else if(cat==="Bangladesh")m=c.name.toLowerCase().includes("bangla")||c.name.toLowerCase().includes("btv")||c.name.toLowerCase().includes("t sports")||c.name.toLowerCase().includes("somoy")||c.name.toLowerCase().includes("jamuna");else if(cat==="India")m=c.name.toLowerCase().includes("star")||c.name.toLowerCase().includes("sony")||c.name.toLowerCase().includes("zee")||c.name.toLowerCase().includes("colors");else m=c.group.toLowerCase().includes(cat.toLowerCase());return s&&m});document.getElementById("count").textContent=f.length+" টা চ্যানেল দেখাচ্ছে";document.getElementById("cats").innerHTML=getCats().map(c=>`<div class="cat ${c===cat?'active':''}" onclick="setCat('${c}')">${c}</div>`).join("");document.getElementById("grid").innerHTML=f.slice(0,500).map(c=>`<div class="card" onclick="openCh('${encodeURIComponent(c.url)}','${encodeURIComponent(c.name)}','${c.source}','${encodeURIComponent(c.group)}')"><img src="${c.logo||'https://cdn-icons-png.flaticon.com/512/1179/1179069.png'}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/1179/1179069.png'"><p>${c.name}</p><small>${c.group}</small></div>`).join("")}
function setCat(c){cat=c;render()}
function openCh(u,n,s,g){window.location.href=`player.html?url=${u}&name=${n}&src=${encodeURIComponent(s)}&group=${g}`}
document.getElementById("search").addEventListener("input",render);loadAll();
</script>
<script>
// ===== RsLive Go HARD SECURITY =====
(function(){
  if(window.top !== window.self){ try{ window.top.location = window.self.location; }catch(e){ document.body.innerHTML=''; } }
  document.addEventListener('contextmenu', e=>{ e.preventDefault(); return false; });
  document.addEventListener('copy', e=>{ e.preventDefault(); return false; });
  document.addEventListener('cut', e=>{ e.preventDefault(); return false; });
  document.addEventListener('dragstart', e=>{ e.preventDefault(); return false; });
  document.addEventListener('selectstart', e=>{ if(e.target.id!=='search') e.preventDefault(); });
  document.addEventListener('keydown', e=>{
    let k = e.key.toUpperCase();
    if(e.key==='F12' || (e.ctrlKey && ['U','S','P','C','A'].includes(k)) || (e.ctrlKey && e.shiftKey && ['I','J','C','K'].includes(k)) || (e.metaKey && ['U','S','I'].includes(k))){
      e.preventDefault(); e.stopPropagation(); return false;
    }
  }, true);
  function block(){ let b=document.getElementById('blockScreen'); if(b){ b.style.display='flex'; } document.body.style.overflow='hidden'; }
  setInterval(()=>{
    let w = window.outerWidth - window.innerWidth > 160;
    let h = window.outerHeight - window.innerHeight > 160;
    if(w || h) block();
  }, 800);
  setInterval(()=>{ (function(){ return false; })['constructor']('debugger')['call'](); }, 1500);
  console.clear();
  setInterval(()=>console.clear(), 2000);
  console.log('%cSTOP! %cRsLive Go Protected', 'color:red;font-size:28px;font-weight:bold', 'color:#fff;font-size:14px');
})();
</script>
<script>
// ===== PWA Install System =====
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/sw.js').catch(()=>{});
}
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredPrompt = e;
  if(!window.matchMedia('(display-mode: standalone)').matches){
    let bar = document.getElementById('installBar');
    if(bar && !localStorage.getItem('rslive_install_closed')){
      bar.style.display = 'flex';
    }
  }
});
document.getElementById('installBtn')?.addEventListener('click', async ()=>{
  if(!deferredPrompt){
    alert('ব্রাউজারের Menu (⋮) -> Add to Home Screen এ চাপ দাও');
    return;
  }
  deferredPrompt.prompt();
  let choice = await deferredPrompt.userChoice;
  if(choice.outcome === 'accepted'){
    document.getElementById('installBar').style.display = 'none';
  }
  deferredPrompt = null;
});
document.getElementById('closeInstall')?.addEventListener('click', ()=>{
  document.getElementById('installBar').style.display = 'none';
  localStorage.setItem('rslive_install_closed','1');
});
window.addEventListener('appinstalled', ()=>{
  document.getElementById('installBar').style.display = 'none';
});
</script>
