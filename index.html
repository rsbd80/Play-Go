<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>RsLive Go - Live TV</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;600;700&family=Poppins:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#05050d;color:#fff;font-family:'Hind Siliguri',sans-serif;padding-bottom:60px}
.sticky{position:sticky;top:0;z-index:100;background:#05050d}
header{background:#0a0a16;padding:14px 16px 10px;border-bottom:1px solid #222}
.top{display:flex;justify-content:space-between;align-items:center;max-width:1200px;margin:0 auto}
.logo{display:flex;gap:10px;align-items:center}
.logo .ico{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#22d3ee,#a78bfa,#ff5d8f);display:flex;align-items:center;justify-content:center;font-size:16px}
.logo b{font-family:'Poppins';font-size:22px}
.logo b i{font-style:normal;color:#a78bfa}
.logo span{font-size:9px;letter-spacing:3px;color:#888;display:block}
.live{background:rgba(255,45,85,.15);color:#ff6b81;font-size:10px;font-weight:800;padding:6px 10px;border-radius:20px;border:1px solid rgba(255,45,85,.3)}
.search{position:relative;margin-top:12px;max-width:1200px;margin-left:auto;margin-right:auto}
.search span{position:absolute;left:14px;top:50%;transform:translateY(-50%)}
#search{width:100%;padding:13px 13px 13px 40px;border-radius:14px;border:1px solid #333;background:#12121f;color:#fff;outline:none;font-family:'Hind Siliguri';font-size:14px}
#cats{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;white-space:nowrap;scrollbar-width:none;border-bottom:1px solid #222}
#cats::-webkit-scrollbar{display:none}
.cat{padding:8px 16px;border-radius:20px;background:#1a1a2c;border:1px solid #333;font-size:12.5px;font-weight:600;cursor:pointer;flex-shrink:0}
.cat.active{background:linear-gradient(90deg,#22d3ee,#a78bfa);color:#000;border:none}
#count{padding:10px 16px 0;font-size:12px;color:#888;max-width:1200px;margin:0 auto}
#grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px 12px;max-width:1200px;margin:0 auto}
@media(min-width:700px){#grid{grid-template-columns:repeat(5,1fr);gap:14px}}
@media(min-width:1000px){#grid{grid-template-columns:repeat(6,1fr)}}
.card{background:#15151f;border:1px solid #262633;border-radius:14px;padding:10px 6px;text-align:center;cursor:pointer;aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center}
.card img{width:48px;height:48px;object-fit:contain;background:#fff;border-radius:10px;padding:5px}
.card p{font-size:11px;margin-top:7px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card small{font-size:9px;color:#22d3ee}
#noticeBar{display:none;background:linear-gradient(90deg,#22d3ee,#a78bfa,#ff5d8f);color:#000;font-size:12.5px;font-weight:700;padding:9px;text-align:center}
#featured{display:none;margin:14px 16px 0;background:#221a3a;border:1px solid #a78bfa;border-radius:14px;padding:14px;cursor:pointer}
#status{position:fixed;bottom:0;left:0;right:0;background:#0a0a16;padding:10px;text-align:center;font-size:11px;color:#aaa;border-top:1px solid #222;z-index:200}
.tele{position:fixed;right:16px;bottom:48px;width:54px;height:54px;border-radius:50%;background:#229ED9;display:flex;align-items:center;justify-content:center;z-index:201;text-decoration:none;font-size:24px}
</style>
</head>
<body>
<div id="noticeBar"></div>
<div class="sticky">
<header><div class="top"><div class="logo"><div class="ico">▶</div><div><b>RsLive <i>Go</i></b><span id="taglineEl">LIVE TV • BANGLADESH</span></div></div><div class="live" id="livePill">● LIVE</div></div><div class="search"><span>🔍</span><input id="search" placeholder="চ্যানেল খুঁজো..."></div></header>
<div id="cats"></div>
</div>
<div id="featured" onclick="if(window._f) openCh(encodeURIComponent(window._f),encodeURIComponent(window._fn),'Featured','Featured')"><div style="font-size:11px;color:#ff5d8f;font-weight:800">⭐ FEATURED LIVE</div><b id="featName"></b><br><span style="font-size:11px;color:#22d3ee">এখনই দেখো →</span></div>
<div id="count"></div>
<div id="grid"><div style="grid-column:1/-1;text-align:center;padding:40px;color:#aaa">⏳ চ্যানেল লোড হচ্ছে...</div></div>
<div id="status">Loading...</div>
<a class="tele" id="teleBtn" href="https://t.me/rslivetv" target="_blank">✈️</a>
<script>
const DEFAULT={siteName:'RsLive Go',tagline:'LIVE TV • BANGLADESH',telegram:'https://t.me/rslivetv',searchPh:'চ্যানেল খুঁজো...',statusText:'✅ মোট {count} টা চ্যানেল - RsLive Go',showLive:true,showTele:true,proxyUrl:'https://stream-through-spark.lovable.app/api/proxy?u=',notice:'',showNotice:false,featName:'',featUrl:'',showFeat:false,playlists:[
{name:'Tapmad',url:'https://raw.githubusercontent.com/sm-monirulislam/Tapmad_Auto_Update_Playlist/refs/heads/main/tapmad_sm.m3u',useProxy:false},
{name:'SonyLiv',url:'https://raw.githubusercontent.com/sm-monirulislam/SonyLiv_Event_Playlist/refs/heads/main/sonyLiv.m3u',useProxy:true},
{name:'Toffee',url:'https://raw.githubusercontent.com/sm-monirulislam/Toffee-Auto-Update/refs/heads/main/toffee_playlist.m3u',useProxy:true},
{name:'AynaOTT',url:'https://raw.githubusercontent.com/sm-monirulislam/AynaOTT_Auto_Update_Playlist/refs/heads/main/aynaott.m3u',useProxy:false},
{name:'JagoBD',url:'https://raw.githubusercontent.com/sm-monirulislam/jago_bd_auto_update_playlist-/refs/heads/main/jago_bd_main.m3u',useProxy:false},
{name:'Bangladesh',url:'https://iptv-org.github.io/iptv/countries/bd.m3u',useProxy:false},
{name:'India',url:'https://iptv-org.github.io/iptv/countries/in.m3u',useProxy:false},
{name:'Sports',url:'https://iptv-org.github.io/iptv/categories/sports.m3u',useProxy:false},
]};
let saved=null; try{saved=JSON.parse(localStorage.getItem('rslive_config')||'null')}catch(e){}
if(!saved || !saved.playlists || saved.playlists.length===0) saved=null;
const CFG={...DEFAULT,...(saved||{})}; if(saved&&saved.playlists) CFG.playlists=saved.playlists;
document.getElementById('taglineEl').textContent=CFG.tagline;
document.getElementById('search').placeholder=CFG.searchPh;
document.getElementById('teleBtn').href=CFG.telegram;
if(!CFG.showLive) document.getElementById('livePill').style.display='none';
if(!CFG.showTele) document.getElementById('teleBtn').style.display='none';
if(CFG.showNotice&&CFG.notice){let n=document.getElementById('noticeBar');n.textContent=CFG.notice;n.style.display='block'}
if(CFG.showFeat&&CFG.featName){document.getElementById('featured').style.display='block';document.getElementById('featName').textContent=CFG.featName;window._f=CFG.featUrl;window._fn=CFG.featName}
let all=[]; let cat="All";
async function loadOne(p){let u=p.useProxy?CFG.proxyUrl+encodeURIComponent(p.url):p.url; try{let r=await fetch(u);let t=await r.text();return parse(t)}catch(e){return[]}}
function parse(t){let l=t.split("\n"),o=[],c=null;for(let x of l){x=x.trim();if(x.startsWith("#EXTINF")){let n=x.split(",").pop().trim();let lg=x.match(/tvg-logo="([^"]+)"/);let g=x.match(/group-title="([^"]+)"/);c={name:n,logo:lg?lg[1]:"",group:g?g[1]:"General"}}else if(x.startsWith("http")&&c){c.url=x;o.push(c);c=null}}return o}
async function loadAll(){for(let p of CFG.playlists){let list=await loadOne(p);for(let ch of list){ch.source=p.name;if(!all.find(y=>y.url===ch.url))all.push(ch)}document.getElementById("status").textContent=`✅ ${all.length} টা চ্যানেল লোড হইছে...`;render()}document.getElementById("status").textContent=CFG.statusText.replace('{count}',all.length)}
function getCats(){return ["All","Tapmad","SonyLiv","Toffee","AynaOTT","JagoBD","Sports","News","Entertainment","Movies","Kids","Music","Bangladesh","India"]}
function render(){let q=document.getElementById("search").value.toLowerCase();let f=all.filter(c=>{let s=!q||c.name.toLowerCase().includes(q);let m=true;if(cat==="All")m=true;else if(["Tapmad","SonyLiv","Toffee","AynaOTT","JagoBD"].includes(cat))m=c.source===cat;else if(cat==="Sports")m=c.group.toLowerCase().includes("sport");else if(cat==="News")m=c.group.toLowerCase().includes("news");else if(cat==="Movies")m=c.group.toLowerCase().includes("movie");else if(cat==="Kids")m=c.group.toLowerCase().includes("kid");else if(cat==="Music")m=c.group.toLowerCase().includes("music");else if(cat==="Entertainment")m=c.group.toLowerCase().includes("entertainment")||c.group.toLowerCase().includes("general");else if(cat==="Bangladesh")m=c.name.toLowerCase().includes("bangla")||c.name.toLowerCase().includes("btv")||c.name.toLowerCase().includes("t sports")||c.name.toLowerCase().includes("somoy")||c.name.toLowerCase().includes("jamuna");else if(cat==="India")m=c.name.toLowerCase().includes("star")||c.name.toLowerCase().includes("sony")||c.name.toLowerCase().includes("zee")||c.name.toLowerCase().includes("colors");else m=c.group.toLowerCase().includes(cat.toLowerCase());return s&&m});document.getElementById("count").textContent=f.length+" টা চ্যানেল দেখাচ্ছে";document.getElementById("cats").innerHTML=getCats().map(c=>`<div class="cat ${c===cat?'active':''}" onclick="setCat('${c}')">${c}</div>`).join("");document.getElementById("grid").innerHTML=f.slice(0,500).map(c=>`<div class="card" onclick="openCh('${encodeURIComponent(c.url)}','${encodeURIComponent(c.name)}','${c.source}','${encodeURIComponent(c.group)}')"><img src="${c.logo||'https://cdn-icons-png.flaticon.com/512/1179/1179069.png'}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/1179/1179069.png'"><p>${c.name}</p><small>${c.group}</small></div>`).join("")}
function setCat(c){cat=c;render()}
function openCh(u,n,s,g){window.location.href=`player.html?url=${u}&name=${n}&src=${encodeURIComponent(s)}&group=${g}`}
document.getElementById("search").addEventListener("input",render);loadAll();
</script>
</body>
</html>
