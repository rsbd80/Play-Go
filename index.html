<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none}
html,body{height:100%;overflow:hidden;overflow-x:hidden;width:100%;max-width:100%;overscroll-behavior-x:none}
body{background:#07070f;color:#fff;font-family:'Hind Siliguri',sans-serif;display:flex;flex-direction:column;touch-action:pan-y;position:relative}
.sticky{flex-shrink:0;position:relative;z-index:100;overflow-x:hidden;max-width:100vw}
header{position:relative;z-index:20;background:rgba(10,10,20,.92);backdrop-filter:blur(16px);padding:14px 12px;border-bottom:1px solid rgba(255,255,255,.08);overflow-x:hidden}
.top-row{display:flex;flex-direction:column;gap:0;position:relative;z-index:2}
.header-top{display:flex;align-items:center;justify-content:space-between;order:1}
.search-wrap{position:relative;margin-top:12px;z-index:2;order:2}
.logo{display:flex;align-items:center;gap:10px;cursor:pointer}
.logo .play-ico{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#22d3ee,#a78bfa,#ff5d8f);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.logo-text .name{font-family:'Poppins',sans-serif;font-size:21px;font-weight:900;line-height:1}
.logo-text .name i{font-style:normal;background:linear-gradient(90deg,#22d3ee,#a78bfa,#ff5d8f);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo-text .tag{font-size:8.5px;letter-spacing:3px;color:#9a9ab5;font-weight:700;margin-top:2px}
.live-pill{display:flex;align-items:center;gap:6px;background:rgba(255,45,85,.14);border:1px solid rgba(255,45,85,.35);color:#ff6b81;font-size:10px;font-weight:800;padding:5px 9px;border-radius:20px;flex-shrink:0}
.live-pill i{width:7px;height:7px;background:#ff2d55;border-radius:50%}
.search-wrap .s-ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:15px}
#search{width:100%;padding:12px 14px 12px 40px;border-radius:14px;border:1px solid rgba(255,255,255,.12);background:#1d1d2e;color:#fff;font-size:13.5px;font-family:'Hind Siliguri',sans-serif;outline:none;user-select:text;-webkit-user-select:text}
#cats{display:flex;gap:7px;overflow-x:auto;overflow-y:hidden;padding:12px 12px;white-space:nowrap;scrollbar-width:none;background:#07070f;border-bottom:1px solid rgba(255,255,255,.08);flex-shrink:0;-webkit-overflow-scrolling:touch}
#cats::-webkit-scrollbar{display:none}
.cat{padding:8px 12px;border-radius:20px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);font-size:12px;font-weight:600;cursor:pointer;flex-shrink:0;display:inline-flex;align-items:center;gap:5px}
.cat .cat-count{font-size:10.5px;background:rgba(255,255,255,.12);padding:2px 7px;border-radius:20px}
.cat.active{background:#2a2a3a;border:1px solid rgba(255,255,255,.28)}
#scrollArea{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:90px;max-width:100vw}
#grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px 12px;max-width:100%}
.card{background:#15151f;border:1px solid #262633;border-radius:12px;padding:8px 4px;text-align:center;cursor:pointer;aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;min-width:0}
.card img{width:44px;height:44px;object-fit:contain;background:#fff;border-radius:8px;padding:3px;flex-shrink:0}
.card p{font-size:10.5px;margin-top:6px;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-height:26px;word-break:break-word}
.card small{font-size:8.5px;color:#22d3ee}
#loadMoreWrap{text-align:center;padding:6px 12px 18px;display:none}
#loadMoreBtn{width:100%;max-width:320px;padding:12px;border:none;border-radius:12px;background:#2a2a3a;color:#fff;font-family:'Hind Siliguri',sans-serif;font-size:13.5px;font-weight:700;cursor:pointer;border:1px solid rgba(255,255,255,.2)}
#noticeBar{display:none;background:linear-gradient(90deg,#22d3ee,#a78bfa,#ff5d8f);color:#000;font-size:12px;font-weight:700;padding:8px;text-align:center}
#featured{display:none;margin:12px 12px 0;background:#221a3a;border:1px solid #a78bfa;border-radius:12px;padding:12px;cursor:pointer}
#status{position:fixed;bottom:0;left:0;right:0;background:rgba(10,10,20,.92);padding:10px 10px;text-align:center;font-size:11.5px;color:#c8c8dd;border-top:1px solid rgba(255,255,255,.08);z-index:200;overflow-x:hidden}
#status b{background:linear-gradient(90deg,#22d3ee,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent}
.tele{position:fixed;right:12px;bottom:100px;width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#2AABEE,#229ED9);display:flex;align-items:center;justify-content:center;z-index:999;text-decoration:none}
.tele svg{width:24px;height:24px;fill:#fff}
#installBar{display:none;position:fixed;left:10px;right:10px;bottom:36px;z-index:998;background:#1a1a2e;border:1px solid rgba(167,139,250,.45);border-radius:100px;padding:4px 4px 4px 8px;align-items:center;justify-content:center;gap:6px}
#installBar .ib-ico{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,#22d3ee,#a78bfa,#ff5d8f);display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0}
#installBar .ib-txt{flex:1;text-align:center;min-width:0}
#installBar .ib-txt b{font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#installBar .ib-txt span{font-size:10px;color:#b8b8d0;display:block;white-space:nowrap}
#installBar .ib-btn{background:linear-gradient(90deg,#22d3ee,#a78bfa,#ff5d8f);color:#fff;border:none;padding:7px 11px;border-radius:100px;font-weight:800;font-size:11px;flex-shrink:0}
#installBar .ib-close{width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-size:10px;cursor:pointer;flex-shrink:0}
.desktop-wrap{display:flex;flex-direction:column;flex:1;min-height:0;overflow-x:hidden;max-width:100vw}
#mainCol{flex:1;min-height:0;display:flex;flex-direction:column;overflow-x:hidden;max-width:100vw}
@media(min-width:900px){
body{display:block;overflow-y:auto}
.sticky{position:sticky;top:0}
header{max-width:1440px;margin:0 auto;padding:16px 24px}
.top-row{flex-direction:row;align-items:center;gap:20px}
.header-top{flex-shrink:0}
.search-wrap{flex:1;margin-top:0;max-width:720px;margin-left:auto}
.desktop-wrap{flex-direction:row;max-width:1440px;margin:0 auto;gap:18px;padding:16px 24px 40px}
#mainCol{order:1}
#cats{order:2;flex-direction:column;overflow-x:hidden;width:260px;flex-shrink:0;position:sticky;top:120px;max-height:calc(100vh - 160px);padding:0 0 20px;white-space:normal;border:none;background:transparent}
.cat{width:100%;text-align:left;padding:11px 12px;border-radius:12px;font-size:13.5px}
#scrollArea{overflow:visible;padding-bottom:30px}
#grid{grid-template-columns:repeat(5,1fr);gap:12px;padding:14px 0}
.card{border-radius:16px;padding:14px 8px}
.card img{width:60px;height:60px;border-radius:12px;padding:6px}
.card p{font-size:12px;min-height:32px}
.card small{font-size:10px}
}
@media(min-width:1300px){ #grid{grid-template-columns:repeat(6,1fr)} }
</style>
</head>
