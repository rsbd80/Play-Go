<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>RsLive Go - Live TV</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#07070f">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;600;700&family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#07070f;color:#eef0f7;font-family:'Poppins','Hind Siliguri',sans-serif;padding-bottom:62px;min-height:100vh}
.topbar{position:sticky;top:0;z-index:100;padding:14px 12px 10px;background:rgba(10,10,20,.92);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.08)}
.brand{display:flex;align-items:center;gap:10px}
.brand .ico{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#22d3ee,#a78bfa,#ff5d8f);display:flex;align-items:center;justify-content:center;font-size:15px}
.brand .pg{font-size:21px;font-weight:900;line-height:1}
.brand .pg i{font-style:normal;background:linear-gradient(90deg,#22d3ee,#a78bfa,#ff5d8f,#fb923c);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand .tag{font-size:8.5px;letter-spacing:3px;color:#9a9ab5;font-weight:700;margin-top:2px}
.search{margin:10px 0 2px}
.search input{width:100%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:11px 12px;color:#fff;outline:none;font-family:inherit;font-size:13px}
.view{display:none;padding:10px 12px 0}
.view.active{display:block}
.sec-title{font-size:15px;font-weight:800;margin:6px 2px 10px;display:flex;align-items:center;gap:8px}
/* ===== Pill Row - ছবির মতো, লোগো সহ ===== */
.pill-row{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.pill-row::-webkit-scrollbar{display:none}
.pill{flex-shrink:0;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:20px;padding:7px 12px 7px 7px;cursor:pointer;font-family:inherit;color:#cbd5e1;font-size:13px;font-weight:700;white-space:nowrap}
.pill img{width:26px;height:26px;object-fit:cover;border-radius:50%;background:#fff;padding:2px}
.pill .cnt{background:rgba(255,255,255,.12);font-size:11px;padding:2px 7px;border-radius:20px;min-width:24px;text-align:center}
.pill.active{background:rgba(167,139,250,.25);border-color:rgba(167,139,250,.55);color:#fff}
.pill.active .cnt{background:#a78bfa;color:#fff}
/* ===== Match Card - ছবির মতো ===== */
.match-card{background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:14px 12px 12px;margin-bottom:12px;cursor:pointer}
.match-card:active{transform:scale(.98);border-color:#a78bfa}
.match-title{text-align:center;font-size:12px;font-weight:700;letter-spacing:.5px;color:#9a9ab5;text-transform:uppercase;margin-bottom:12px;line-height:1.4}
.match-teams{display:flex;align-items:center;justify-content:space-between;gap:8px}
.m-team{flex:1;text-align:center;min-width:0}
.m-team img{width:62px;height:62px;object-fit:cover;background:#fff;border-radius:14px;padding:4px}
.m-team p{font-size:14px;font-weight:700;margin-top:8px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-mid{text-align:center;flex-shrink:0}
.m-live{display:inline-block;background:linear-gradient(90deg,#ff2d55,#ff5d8f);color:#fff;font-size:11px;font-weight:800;padding:5px 12px;border-radius:20px;letter-spacing:1px}
.m-live i{width:6px;height:6px;background:#fff;border-radius:50%;display:inline-block;margin-right:5px;animation:pulse 1.2s infinite}
@keyframes pulse{0%{opacity:1}50%{opacity:.3}100%{opacity:1}}
.m-vs{font-size:20px;font-weight:800;font-style:italic;color:#fff;margin-top:8px}
.m-time{text-align:center;font-size:12px;color:#9a9ab5;margin-top:12px;display:flex;align-items:center;justify-content:center;gap:6px}
/* Channel Card - Square 1x1 + Circle Logo */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.card{background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:10px 6px 8px;text-align:center;cursor:pointer;position:relative;aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center}
.card:active{transform:scale(.96);border-color:#a78bfa}
.card img{width:58px;height:58px;object-fit:cover;background:#fff;border-radius:50%;padding:4px;border:2px solid rgba(167,139,250,.35)}
.card p{font-size:11.5px;font-weight:600;margin-top:8px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:28px}
.card small{font-size:9px;color:#888}
.live-badge{position:absolute;top:6px;right:6px;background:#ff2d55;color:#fff;font-size:8px;font-weight:800;padding:2px 6px;border-radius:20px}
/* Category */
.cat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.cat-card{background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:14px 10px;text-align:center;cursor:pointer;aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center}
.cat-card .cat-logo{width:68px;height:68px;border-radius:50%;background:#fff;padding:6px;display:flex;align-items:center;justify-content:center;border:3px solid rgba(167,139,250,.45);margin-bottom:10px}
.cat-card .cat-logo img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.cat-card h3{font-size:14px;font-weight:800}
.cat-card p{font-size:11px;color:#9a9ab5;margin-top:3px}
.cat-card .count{margin-top:8px;background:rgba(167,139,250,.18);border:1px solid rgba(167,139,250,.4);color:#e9d5ff;font-size:10px;font-weight:700;padding:4px 10px;border-radius:20px}
.back-btn{display:inline-flex;gap:6px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);padding:8px 12px;border-radius:20px;font-size:12px;font-weight:700;margin-bottom:10px;cursor:pointer}
.empty{text-align:center;color:#888;font-size:13px;padding:30px 10px;line-height:1.6}
.skel{aspect-ratio:1/1;border-radius:18px;background:#15151f;position:relative;overflow:hidden}
.skel::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent);animation:sh 1.2s infinite}
@keyframes sh{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
/* Bottom Nav - চিকন, আইকন নাই */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:200;background:rgba(10,10,20,.97);border-top:1px solid rgba(255,255,255,.10);padding:6px 6px calc(6px + env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.nav-btn{background:transparent;border:1px solid transparent;color:#8a8a9e;padding:8px 4px;border-radius:12px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:700;position:relative}
.nav-btn.active{color:#fff;background:linear-gradient(180deg,rgba(167,139,250,.22),rgba(34,211,238,.12));border-color:rgba(167,139,250,.45)}
.nav-btn .dot{position:absolute;top:6px;right:18%;width:6px;height:6px;background:#ff2d55;border-radius:50%;display:none}
.nav-btn.has-live .dot{display:block}
@media(min-width:900px){body{padding-bottom:0}.bottom-nav{position:sticky;top:0;bottom:auto;max-width:600px;margin:0 auto;border-radius:0 0 14px 14px;border:1px solid rgba(255,255,255,.1);border-top:none}.grid{grid-template-columns:repeat(6,1fr)}.cat-grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand"><div class="ico">▶</div><div><div class="pg">RsLive <i>Go</i></div><div class="tag">LIVE TV • BANGLADESH</div></div></div>
  <div class="search"><input id="searchInput" placeholder="🔍 Search channel..."></div>
</div>

<div id="view-home" class="view active">
  <div class="sec-title">📺 সব চ্যানেল</div>
  <div id="homeGrid" class="grid"><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
</div>

<!-- EVENTS - ছবির মতো -->
<div id="view-events" class="view">
  <div class="pill-row" id="eventsPills"></div>
  <div id="eventsList"></div>
  <div id="eventsEmpty" class="empty" style="display:none">এখন কোনো Live ম্যাচ নাই 😔</div>
</div>

<div id="view-categories" class="view">
  <div id="catListWrap"><div class="sec-title">🗂️ Categories</div><div id="catGrid" class="cat-grid"></div></div>
  <div id="catDetailWrap" style="display:none"><div class="back-btn" onclick="backToCategories()">← সব Category</div><div class="sec-title" id="catDetailTitle">Category</div><div id="catDetailGrid" class="grid"></div></div>
</div>

<nav class="bottom-nav">
  <button class="nav-btn" id="navEvents" onclick="switchTab('events')">Events<span class="dot"></span></button>
  <button class="nav-btn active" id="navHome" onclick="switchTab('home')">Home</button>
  <button class="nav-btn" id="navCategories" onclick="switchTab('categories')">Categories</button>
</nav>
<script src="/app.js"></script>
</body>
</html>
