<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>RsLive Go - Live TV</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#07070f">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;600;700&family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;overflow-x:hidden}
body{background:#07070f;color:#eef0f7;font-family:'Poppins','Hind Siliguri',sans-serif;padding-bottom:68px;min-height:100vh}
.topbar{position:sticky;top:0;z-index:100;padding:12px 10px 8px;background:rgba(10,10,20,.92);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.08)}
.brand{display:flex;align-items:center;gap:8px}
.brand .ico{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#22d3ee,#a78bfa,#ff5d8f);display:flex;align-items:center;justify-content:center;font-size:13px}
.brand .pg{font-size:19px;font-weight:900;line-height:1}
.brand .pg i{font-style:normal;background:linear-gradient(90deg,#22d3ee,#a78bfa,#ff5d8f,#fb923c);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand .tag{font-size:8px;letter-spacing:3px;color:#9a9ab5;font-weight:700;margin-top:1px}
.search{margin:8px 0 2px}
.search input{width:100%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:10px 12px;color:#fff;outline:none;font-family:inherit;font-size:13px}
.view{display:none;padding:8px 8px 0;width:100%}
.view.active{display:block}
.sec-title{font-size:14px;font-weight:800;margin:4px 2px 8px}
/* Home Category Pill - উপরে সিরিয়াল */
.cat-pill-row{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.cat-pill-row::-webkit-scrollbar{display:none}
.cat-pill{flex-shrink:0;display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);border-radius:20px;padding:6px 11px;cursor:pointer;font-family:inherit;color:#cbd5e1;font-size:12px;font-weight:700;white-space:nowrap}
.cat-pill.active{background:rgba(167,139,250,.25);border-color:rgba(167,139,250,.55);color:#fff}
/* ===== Channel Card - ছোট, ৪ কলাম, Square 1x1, গোল লোগো ===== */
.grid{display:grid;grid-template-columns:repeat(4, minmax(0,1fr));gap:7px;width:100%}
.card{background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.11);border-radius:14px;padding:8px 4px 6px;text-align:center;cursor:pointer;position:relative;aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;overflow:hidden}
.card:active{transform:scale(.95);border-color:#a78bfa}
.card img{width:38px;height:38px;object-fit:cover;background:#fff;border-radius:50%;padding:3px;border:1.5px solid rgba(167,139,250,.4);flex-shrink:0}
.card p{font-size:10px;font-weight:600;margin-top:6px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:24px;word-break:break-word}
.card small{font-size:8px;color:#888;margin-top:1px}
.live-badge{position:absolute;top:4px;right:4px;background:#ff2d55;color:#fff;font-size:7px;font-weight:800;padding:1px 5px;border-radius:20px}
/* ===== Upcoming Match - Events এ শুধু এইটাই থাকবে ===== */
.up-card{background:linear-gradient(135deg,rgba(34,211,238,.16),rgba(167,139,250,.18),rgba(255,93,143,.14));border:1px solid rgba(167,139,250,.35);border-radius:18px;padding:12px;margin-bottom:12px}
.up-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.up-badge{background:#ff2d55;color:#fff;font-size:9px;font-weight:800;padding:4px 8px;border-radius:20px}
.up-time{font-size:11px;color:#cbd5e1;font-weight:600}
.up-teams{display:flex;align-items:center;justify-content:space-between;gap:8px}
.up-team{flex:1;text-align:center}
.up-team img{width:52px;height:52px;object-fit:cover;border-radius:50%;background:#fff;padding:3px;border:2px solid rgba(255,255,255,.3)}
.up-team p{font-size:12px;font-weight:700;margin-top:6px}
.up-vs{font-size:16px;font-weight:900;color:#a78bfa;background:rgba(255,255,255,.08);width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.up-btn{margin-top:10px;width:100%;border:none;padding:10px;border-radius:12px;background:linear-gradient(90deg,#22d3ee,#a78bfa,#ff5d8f);color:#fff;font-weight:800;font-family:inherit;font-size:13px;cursor:pointer}
/* Category - শুধু Category */
.cat-grid{display:grid;grid-template-columns:repeat(2, minmax(0,1fr));gap:10px;width:100%}
.cat-card{background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.11);border-radius:18px;padding:12px 8px;text-align:center;cursor:pointer;aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0}
.cat-card .cat-logo{width:60px;height:60px;border-radius:50%;background:#fff;padding:5px;display:flex;align-items:center;justify-content:center;border:3px solid rgba(167,139,250,.45);margin-bottom:8px}
.cat-card .cat-logo img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.cat-card h3{font-size:13px;font-weight:800}
.cat-card p{font-size:10.5px;color:#9a9ab5;margin-top:2px}
.cat-card .count{margin-top:7px;background:rgba(167,139,250,.18);border:1px solid rgba(167,139,250,.4);color:#e9d5ff;font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px}
.back-btn{display:inline-flex;gap:6px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);padding:8px 12px;border-radius:20px;font-size:12px;font-weight:700;margin-bottom:10px;cursor:pointer}
.empty{text-align:center;color:#888;font-size:13px;padding:30px 10px;line-height:1.6}
.skel{aspect-ratio:1/1;border-radius:14px;background:#15151f}
/* Bottom Nav - চিকন, আইকন নাই */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:200;background:rgba(10,10,20,.97);border-top:1px solid rgba(255,255,255,.10);padding:6px 6px calc(6px + env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.nav-btn{background:transparent;border:1px solid transparent;color:#8a8a9e;padding:8px 4px;border-radius:12px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:700;position:relative}
.nav-btn.active{color:#fff;background:linear-gradient(180deg,rgba(167,139,250,.22),rgba(34,211,238,.12));border-color:rgba(167,139,250,.45)}
.nav-btn .dot{position:absolute;top:6px;right:18%;width:6px;height:6px;background:#ff2d55;border-radius:50%;display:none}
.nav-btn.has-live .dot{display:block}
@media(min-width:900px){body{padding-bottom:0}.bottom-nav{position:sticky;top:0;bottom:auto;max-width:600px;margin:0 auto;border-radius:0 0 14px 14px;border:1px solid rgba(255,255,255,.1);border-top:none}.grid{grid-template-columns:repeat(6,1fr)}.cat-grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand"><div class="ico">▶</div><div><div class="pg">RsLive <i>Go</i></div><div class="tag">LIVE TV • BANGLADESH</div></div></div>
  <div class="search"><input id="searchInput" placeholder="🔍 Search channel..."></div>
</div>

<!-- HOME - All Channels + উপরে Category Pill -->
<div id="view-home" class="view active">
  <div class="cat-pill-row" id="homeCatPills"></div>
  <div class="sec-title">📺 সব চ্যানেল</div>
  <div id="homeGrid" class="grid"><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
</div>

<!-- EVENTS - শুধু Upcoming Match, আর কিছু না -->
<div id="view-events" class="view">
  <div class="sec-title">🔥 Upcoming Match</div>
  <div id="eventsList"></div>
</div>

<!-- CATEGORIES - শুধু Category -->
<div id="view-categories" class="view">
  <div id="catListWrap"><div class="sec-title">🗂️ Categories</div><div id="catGrid" class="cat-grid"></div></div>
  <div id="catDetailWrap" style="display:none"><div class="back-btn" onclick="backToCategories()">← সব Category</div><div class="sec-title" id="catDetailTitle">Category</div><div id="catDetailGrid" class="grid"></div></div>
</div>

<nav class="bottom-nav">
  <button class="nav-btn" id="navEvents" onclick="switchTab('events')">Events<span class="dot"></span></button>
  <button class="nav-btn active" id="navHome" onclick="switchTab('home')">Home</button>
  <button class="nav-btn" id="navCategories" onclick="switchTab('categories')">Categories</button>
</nav>
<script src="/app.js"></script>
</body>
</html>
