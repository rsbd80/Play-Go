<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Play Go - Live TV</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;600;700&family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#07070f;color:#fff;font-family:'Hind Siliguri','Segoe UI',sans-serif;padding-bottom:80px}
header{position:sticky;top:0;z-index:20;background:rgba(10,10,20,.92);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);padding:16px 16px 16px;border-bottom:1px solid rgba(255,255,255,.08);overflow:hidden}
header::before{content:"";position:absolute;top:-60px;left:-20px;width:220px;height:120px;background:radial-gradient(circle,rgba(34,211,238,.28),transparent 70%);filter:blur(10px);pointer-events:none}
header::after{content:"";position:absolute;top:-60px;right:-20px;width:220px;height:120px;background:radial-gradient(circle,rgba(167,139,250,.30),transparent 70%);filter:blur(10px);pointer-events:none}
.header-top{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:2}
.logo{display:flex;align-items:center;gap:11px}
.logo .play-ico{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#22d3ee 0%,#a78bfa 50%,#ff5d8f 100%);display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;box-shadow:0 6px 22px rgba(167,139,250,.55),inset 0 1px 0 rgba(255,255,255,.4);animation:logoFloat 2.8s ease-in-out infinite}
@keyframes logoFloat{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-2px) rotate(-2deg)}}
.logo-text{line-height:1}
.logo-text .name{font-family:'Poppins',sans-serif;font-size:23px;font-weight:900;letter-spacing:.3px}
.logo-text .name i{font-style:normal;background:linear-gradient(90deg,#22d3ee,#a78bfa,#ff5d8f,#22d3ee);background-size:300% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 3s linear infinite}
@keyframes shine{to{background-position:300% center}}
.logo-text .tag{font-size:9px;letter-spacing:3.5px;color:#9a9ab5;font-weight:700;margin-top:2px}
.live-pill{display:flex;align-items:center;gap:6px;background:rgba(255,45,85,.14);border:1px solid rgba(255,45,85,.35);color:#ff6b81;font-size:10px;font-weight:800;letter-spacing:1px;padding:6px 10px;border-radius:20px}
.live-pill i{width:7px;height:7px;background:#ff2d55;border-radius:50%;box-shadow:0 0 0 0 rgba(255,45,85,.7);animation:pulseDot 1.4s infinite}
@keyframes pulseDot{0%{box-shadow:0 0 0 0 rgba(255,45,85,.7)}70%{box-shadow:0 0 0 7px rgba(255,45,85,0)}100%{box-shadow:0 0 0 0 rgba(255,45,85,0)}}
.search-wrap{position:relative;margin-top:14px;z-index:2}
.search-wrap .s-ico{position:absolute;left:15px;top:50%;transform:translateY(-50%);font-size:16px;z-index:2}
#search{width:100%;padding:14px 16px 14px 42px;border-radius:16px;border:1px solid rgba(255,255,255,.12);background:linear-gradient(180deg,#1d1d2e,#14141f);color:#fff;font-size:14px;font-family:'Hind Siliguri',sans-serif;outline:none;transition:.25s;box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 6px 20px rgba(0,0,0,.3)}
#search::placeholder{color:#7a7a92}
#search:focus{border-color:#a78bfa;box-shadow:0 0 0 3px rgba(167,139,250,.22),0 10px 28px rgba(167,139,250,.18);background:#1a1a2b}
#cats{display:flex;gap:8px;overflow-x:auto;padding:14px 16px;white-space:nowrap;scrollbar-width:none}
#cats::-webkit-scrollbar{display:none}
.cat{padding:9px 17px;border-radius:20px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);font-size:12.5px;font-weight:600;cursor:pointer;flex-shrink:0;transition:.2s}
.cat.active{background:linear-gradient(90deg,#22d3ee,#a78bfa);color:#000;font-weight:800;border:none;box-shadow:0 4px 16px rgba(167,139,250,.4)}
#count{padding:0 16px;font-size:12px;color:#888}
#count b{color:#fff}
#grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:12px 16px}
@media(min-width:600px){#grid{grid-template-columns:repeat(5,1fr)}}
@media(min-width:1000px){#grid{grid-template-columns:repeat(7,1fr)}}
.card{background:#15151f;border:1px solid #262633;border-radius:14px;padding:12px 6px;text-align:center;cursor:pointer;transition:.2s}
.card:hover{border-color:#a78bfa;transform:translateY(-2px);box-shadow:0 8px 20px rgba(167,139,250,.15)}
.card img{width:52px;height:52px;object-fit:contain;background:#fff;border-radius:10px;padding:4px}
.card p{font-size:11px;margin-top:8px;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-height:28px}
.card small{font-size:9px;color:#22d3ee}
#loading{text-align:center;padding:40px 20px 20px;color:#aaa}
.loader-ring{position:relative;width:90px;height:90px;display:flex;align-items:center;justify-content:center;margin:0 auto}
.loader-ring::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,#22d3ee,#a78bfa,#ff5d8f,#22d3ee);animation:spinRing 1.1s linear infinite;-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5px));mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5px))}
.loader-ring::after{content:"";position:absolute;inset:13px;border-radius:50%;background:#12121e;box-shadow:0 0 30px rgba(167,139,250,.35)}
@keyframes spinRing{to{transform:rotate(360deg)}}
.loader-emoji{position:relative;z-index:2;font-size:32px;animation:pop 1.2s ease-in-out infinite}
@keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.loader-brand{font-family:'Poppins',sans-serif;font-size:20px;font-weight:900;letter-spacing:1px;margin-top:16px;background:linear-gradient(90deg,#22d3ee,#a78bfa,#ff5d8f);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 2s linear infinite}
.loader-brand b{color:#fff;-webkit-text-fill-color:#fff}
.loader-status{font-family:monospace;font-size:10px;letter-spacing:3px;color:#888;margin-top:8px}
.load-bar{width:190px;height:5px;background:rgba(255,255,255,.12);border-radius:10px;overflow:hidden;margin:16px auto 0}
.load-bar i{display:block;height:100%;width:40%;background:linear-gradient(90deg,#22d3ee,#a78bfa,#ff5d8f);border-radius:10px;animation:slideBar 1.1s ease-in-out infinite}
@keyframes slideBar{0%{transform:translateX(-100%)}100%{transform:translateX(480%)}}
.loader-text{font-size:13px;color:#c8c8dd;margin-top:12px}
.loader-text b{color:#fff}
.skeleton-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:16px}
.skel{height:96px;border-radius:14px;background:#15151f;position:relative;overflow:hidden}
.skel::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent);animation:shimmer 1.2s infinite}
@keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
#status{position:fixed;bottom:0;left:0;right:0;background:#111;padding:8px;text-align:center;font-size:11px;color:#7CFC00;border-top:1px solid #222}
.telegram-float{position:fixed;right:16px;bottom:44px;z-index:999;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#2AABEE,#229ED9);display:flex;align-items:center;justify-content:center;text-decoration:none;box-shadow:0 8px 24px rgba(42,171,238,.5);animation:floatBtn 2.5s ease-in-out infinite}
.telegram-float svg{width:28px;height:28px;fill:#fff;transform:translateX(-1px)}
.telegram-float::before{content:"";position:absolute;inset:0;border-radius:50%;background:#2AABEE;animation:telePulse 1.8s ease-out infinite;z-index:-1}
@keyframes telePulse{0%{transform:scale(1);opacity:.6}100%{transform:scale(1.7);opacity:0}}
@keyframes floatBtn{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.telegram-float:active{transform:scale(.92)}
</style>
</head>
<body>
<header>
<div class="header-top">
<div class="logo">
<div class="play-ico">▶</div>
<div class="logo-text"><div class="name">Play <i>Go</i></div><div class="tag">LIVE TV • BANGLADESH</div></div>
</div>
<div class="live-pill"><i></i> LIVE</div>
</div>
<div class="search-wrap">
<span class="s-ico">🔍</span>
<input id="search" placeholder="চ্যানেল খুঁজো...">
</div>
</header>
<div id="cats"></div>
<div id="count"></div>
<div id="grid">
  <div id="loading" style="grid-column:1/-1">
    <div class="loader-ring"><div class="loader-emoji">▶</div></div>
    <div class="loader-brand"><b>Play</b> Go</div>
    <div class="loader-status">LOADING CHANNELS...</div>
    <div class="load-bar"><i></i></div>
    <div class="loader-text">চ্যানেল লোড হচ্ছে... <b>একটু অপেক্ষা করো</b></div>
  </div>
  <div class="skeleton-grid" style="grid-column:1/-1">
    <div class="skel"></div><div class="skel"></div><div class="skel"></div>
    <div class="skel"></div><div class="skel"></div><div class="skel"></div>
    <div class="skel"></div><div class="skel"></div><div class="skel"></div>
  </div>
</div>
<div id="status">Play Go: Loading...</div>
<a class="telegram-float" href="https://t.me/rslivetv" target="_blank" aria-label="Telegram">
<svg viewBox="0 0 24 24"><path d="M9.04 15.31l-.38 5.32c.54 0 .78-.23 1.06-.5l2.55-2.44 5.28 3.87c.97.53 1.66.25 1.92-.9L24 3.6c.1-.9-.32-1.38-1.1-1.12L1.5 10.2c-.9.35-.88 1.45.14 1.72l5.48 1.71 12.66-8.04c.6-.36 1.14-.17.7.23L9.04 15.31z"/></svg>
</a>
<script>
// ✅ Proxy - Lovable
const PROXY = "https://stream-through-spark.lovable.app/api/proxy?u=";

// ✅✅✅ মোট ৮ টা প্লেলিস্ট - তোমার সিরিয়ালে
const PLAYLISTS = [
  // --- ১. আগে তোমার ৫ টা ---
  { name: "Tapmad", url: "https://raw.githubusercontent.com/sm-monirulislam/Tapmad_Auto_Update_Playlist/refs/heads/main/tapmad_sm.m3u" },
  { name: "SonyLiv", url: "https://raw.githubusercontent.com/sm-monirulislam/SonyLiv_Event_Playlist/refs/heads/main/sonyLiv.m3u" },
  { name: "Toffee", url: "https://raw.githubusercontent.com/sm-monirulislam/Toffee-Auto-Update/refs/heads/main/toffee_playlist.m3u" },
  { name: "AynaOTT", url: "https://raw.githubusercontent.com/sm-monirulislam/AynaOTT_Auto_Update_Playlist/refs/heads/main/aynaott.m3u" },
  { name: "JagoBD", url: "https://raw.githubusercontent.com/sm-monirulislam/jago_bd_auto_update_playlist-/refs/heads/main/jago_bd_main.m3u" },
  // --- ২. পরে বাকি ৩ টা ---
  { name: "Bangladesh", url: "" },
  { name: "India", url: "" },
  { name: "Sports", url: "" }
];
let allChannels = [];
let activeCat = "All";
async function loadOne(url){
  const proxyUrl = PROXY + encodeURIComponent(url);
  try{ const res = await fetch(proxyUrl); const text = await res.text(); return parseM3U(text); }catch(e){ return []; }
}
function parseM3U(text){
  const lines = text.split("\n"); const out=[]; let cur=null;
  for(let line of lines){
    line=line.trim();
    if(line.startsWith("#EXTINF")){
      const name=line.split(",").pop().trim();
      const logoMatch=line.match(/tvg-logo="([^"]+)"/);
      const groupMatch=line.match(/group-title="([^"]+)"/);
      cur={name,logo:logoMatch?logoMatch[1]:"",group:groupMatch?groupMatch[1]:"General"};
    } else if(line.startsWith("http") && cur){ cur.url=line; if(cur.name&&cur.url) out.push(cur); cur=null; }
  }
  return out;
}
async function loadAll(){
  document.getElementById("status").textContent = "⏳ চ্যানেল লোড হচ্ছে...";
  for(let p of PLAYLISTS){
    const list = await loadOne(p.url);
    for(let ch of list){ ch.source = p.name; if(!allChannels.find(x=>x.url===ch.url)) allChannels.push(ch); }
    document.getElementById("status").textContent = `✅ ${allChannels.length} টা চ্যানেল লোড হইছে... (${p.name})`;
    render();
  }
  document.getElementById("status").textContent = `✅ মোট ${allChannels.length} টা চ্যানেল - Play Go`;
  if(allChannels.length===0){
    document.getElementById("grid").innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:40px;color:#ff5d5d">❌ চ্যানেল লোড হয় নাই<br><br>Proxy লিংকটা ঠিক আছে কিনা চেক করো।</div>`;
  }
}
function getCats(){ return ["All", "Tapmad", "SonyLiv", "Toffee", "AynaOTT", "JagoBD", "Sports", "News", "General", "Entertainment", "Movies", "Kids", "Music", "Bangladesh", "India"]; }
function render(){
  const q = document.getElementById("search").value.toLowerCase();
  let filtered = allChannels.filter(c=>{
    const matchSearch = !q || c.name.toLowerCase().includes(q);
    let matchCat = true;
    if(activeCat==="All") matchCat = true;
    else if(["Tapmad","SonyLiv","Toffee","AynaOTT","JagoBD"].includes(activeCat)) matchCat = c.source===activeCat;
    else if(activeCat==="Sports") matchCat = c.group.toLowerCase().includes("sport");
    else if(activeCat==="News") matchCat = c.group.toLowerCase().includes("news");
    else if(activeCat==="Movies") matchCat = c.group.toLowerCase().includes("movie");
    else if(activeCat==="Kids") matchCat = c.group.toLowerCase().includes("kid") || c.group.toLowerCase().includes("children");
    else if(activeCat==="Music") matchCat = c.group.toLowerCase().includes("music");
    else if(activeCat==="Entertainment") matchCat = c.group.toLowerCase().includes("entertainment") || c.group.toLowerCase().includes("general");
    else if(activeCat==="Bangladesh") matchCat = c.name.toLowerCase().includes("bangla") || c.name.toLowerCase().includes("btv") || c.name.toLowerCase().includes("t sports") || c.name.toLowerCase().includes("channel i") || c.name.toLowerCase().includes("somoy") || c.name.toLowerCase().includes("jamuna") || c.name.toLowerCase().includes("ntv") || c.name.toLowerCase().includes("maasranga");
    else if(activeCat==="India") matchCat = c.name.toLowerCase().includes("star") || c.name.toLowerCase().includes("sony") || c.name.toLowerCase().includes("zee") || c.name.toLowerCase().includes("colors");
    else matchCat = c.group.toLowerCase().includes(activeCat.toLowerCase());
    return matchSearch && matchCat;
  });
  document.getElementById("count").textContent = `${filtered.length} টা চ্যানেল দেখাচ্ছে`;
  document.getElementById("cats").innerHTML = getCats().map(c=>`<div class="cat ${c===activeCat?'active':''}" onclick="setCat('${c}')">${c}</div>`).join("");
  document.getElementById("grid").innerHTML = filtered.slice(0,500).map(c=>`
    <div class="card" onclick="openCh('${encodeURIComponent(c.url)}','${encodeURIComponent(c.name)}')">
      <img src="${c.logo || 'https://cdn-icons-png.flaticon.com/512/1179/1179069.png'}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/1179/1179069.png'">
      <p>${c.name}</p>
      <small>${c.group}</small>
    </div>
  `).join("");
}
function setCat(c){ activeCat=c; render(); }
function openCh(urlEnc, nameEnc){
  const url = decodeURIComponent(urlEnc);
  window.location.href = `player.html?url=${encodeURIComponent(url)}&name=${nameEnc}`;
}
document.getElementById("search").addEventListener("input", render);
loadAll();
</script>
</body>
</html>
