<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>RsLive Go - Live TV</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;600;700&family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(600px 300px at 50% -80px, rgba(167,139,250,.18), transparent 70%), radial-gradient(500px 250px at 100% 0%, rgba(34,211,238,.12), transparent 70%), #07070f;font-family:'Poppins','Hind Siliguri',sans-serif;color:#fff;overflow-x:hidden;padding-bottom:30px}
.topbar{position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:12px;padding:13px 14px;background:rgba(10,10,20,.88);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.10)}
.brand{display:flex;align-items:center;gap:9px}
.brand .play-ico{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,#22d3ee,#a78bfa,#ff5d8f);display:flex;align-items:center;justify-content:center;font-size:14px;box-shadow:0 5px 18px rgba(167,139,250,.55)}
.brand-text{line-height:1}
.brand-text .pg{font-size:18px;font-weight:900;white-space:nowrap}
.brand-text .pg i{font-style:normal;background:linear-gradient(90deg,#22d3ee,#a78bfa,#ff5d8f);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand-text .tag{font-size:8px;letter-spacing:2.8px;color:#9a9ab5;font-weight:700;margin-top:3px}
.live-pill{margin-left:auto;display:flex;align-items:center;gap:6px;background:rgba(255,45,85,.16);border:1px solid rgba(255,45,85,.40);color:#ff6b81;font-size:10px;font-weight:800;letter-spacing:1px;padding:7px 11px;border-radius:20px}
.live-pill i{width:7px;height:7px;background:#ff2d55;border-radius:50%;animation:pulseDot 1.4s infinite}
@keyframes pulseDot{0%{box-shadow:0 0 0 0 rgba(255,45,85,.7)}70%{box-shadow:0 0 0 7px rgba(255,45,85,0)}100%{box-shadow:0 0 0 0 rgba(255,45,85,0)}}
.hero{padding:18px 14px 6px}
.hero h1{font-size:22px;font-weight:900;line-height:1.3}
.hero h1 i{font-style:normal;background:linear-gradient(90deg,#22d3ee,#a78bfa,#ff5d8f);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{font-size:12px;color:#999;margin-top:6px;font-family:'Hind Siliguri',sans-serif}
.search-box{margin:14px 14px 0;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:12px 14px}
.search-box input{flex:1;background:none;border:none;outline:none;color:#fff;font-size:14px;font-family:'Hind Siliguri',sans-serif}
.search-box input::placeholder{color:#777}
.cats{display:flex;gap:8px;overflow-x:auto;padding:14px 14px 4px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex-shrink:0;padding:8px 16px;border-radius:20px;font-size:12px;font-weight:700;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.10);cursor:pointer;font-family:'Hind Siliguri',sans-serif}
.cat.active{background:linear-gradient(135deg,#22d3ee,#a78bfa);color:#fff;border-color:transparent;box-shadow:0 4px 14px rgba(167,139,250,.5)}
.section{padding:14px 14px 0}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.section-head h3{font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px;white-space:nowrap}
.section-head h3 span{width:28px;height:28px;background:rgba(255,138,0,.15);border:1px solid rgba(255,138,0,.35);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px}
.section-head a{font-size:14px;font-weight:800;display:flex;align-items:center;gap:7px;color:#fff;text-decoration:none;white-space:nowrap}
.section-head a .arrow-ico{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#22d3ee 0%,#a78bfa 50%,#ff5d8f 100%);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(167,139,250,.55), inset 0 1px 0 rgba(255,255,255,.5);animation:arrowNudge 1.8s ease-in-out infinite}
.section-head a .arrow-ico svg{width:14px;height:14px;fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
@keyframes arrowNudge{0%,100%{transform:translateX(0)}50%{transform:translateX(3px)}}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.card{background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.11);border-radius:16px;padding:10px 4px 8px;text-align:center;cursor:pointer;transition:.2s}
.card:active{transform:scale(.93);border-color:#a78bfa}
.card img{width:42px;height:42px;object-fit:contain;background:#fff;border-radius:11px;padding:3px}
.card p{font-size:11px;font-weight:600;margin-top:7px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:'Hind Siliguri',sans-serif}
.card small{font-size:9px;color:#888}
.skel{height:78px;border-radius:16px;background:#15151f;position:relative;overflow:hidden}
.skel::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent);animation:shimmer 1.2s infinite}
@keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.empty{text-align:center;padding:40px 20px;color:#888;font-size:13px;font-family:'Hind Siliguri',sans-serif}
.footer{text-align:center;font-size:11px;color:#666;margin:26px 0 10px}
.footer b{color:#a78bfa}
</style>
</head>
<body>
<div class="topbar">
<div class="brand"><div class="play-ico">▶</div><div class="brand-text"><div class="pg">RsLive <i>Go</i></div><div class="tag">LIVE TV</div></div></div>
<div class="live-pill"><i></i> LIVE</div>
</div>

<div class="hero">
<h1>সব লাইভ টিভি <i>এক জায়গায়</i></h1>
<p>তোমার পছন্দের চ্যানেলে ক্লিক করো, সাথে সাথে চলবে • RsLive Go</p>
</div>

<div class="search-box">🔍 <input id="search" placeholder="চ্যানেল খুঁজো... যেমন: T Sports, Jamuna, Star Jalsha"></div>

<div class="cats" id="cats"></div>

<div class="section">
<div class="section-head"><h3><span>🔥</span> সব চ্যানেল</h3><a href="player.html"><span class="arrow-ico"><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg></span> সব দেখো</a></div>
<div class="grid" id="grid">
<div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div>
</div>
</div>

<div class="footer">Made with ❤️ by <b>RsLive Go</b> • কোনো সমস্যা হলে টেলিগ্রামে জানাও</div>

<script>
const PLAYLISTS = [
  {url:"https://raw.githubusercontent.com/sm-monirulislam/Tapmad_Auto_Update_Playlist/refs/heads/main/tapmad_sm.m3u", src:"Tapmad"},
  {url:"https://raw.githubusercontent.com/sm-monirulislam/AynaOTT_Auto_Update_Playlist/refs/heads/main/aynaott.m3u", src:"AynaOTT"},
  {url:"https://raw.githubusercontent.com/sm-monirulislam/jago_bd_auto_update_playlist-/refs/heads/main/jago_bd_main.m3u", src:"JagoBD"},
  {url:"https://iptv-org.github.io/iptv/countries/bd.m3u", src:"Bangladesh"}
];
let all = [];
let activeCat = 'সব';
function cleanName(n){ return n.replace(/\(.*?\)/g,'').replace(/\[.*?\]/g,'').replace(/HD|FHD|4K|1080p|720p/gi,'').replace(/\s+/g,' ').trim(); }
function getCategory(name, group){
  const t = (name + ' ' + group).toLowerCase();
  if(t.includes('sport') || t.includes('cricket') || t.includes('football') || t.includes('t sports') || t.includes('ten ') || t.includes('star sports') || t.includes('sony sports') || t.includes('ptv sports')) return 'খেলা';
  if(t.includes('news') || t.includes('somoy') || t.includes('jamuna') || t.includes('dbc') || t.includes('independent') || t.includes('atn news') || t.includes('channel 24') || t.includes('ekattor') || t.includes('ndtv') || t.includes('aaj tak')) return 'নিউজ';
  if(t.includes('movie') || t.includes('cinema') || t.includes('film') || t.includes('star gold') || t.includes('zee cinema')) return 'মুভি';
  if(t.includes('kid') || t.includes('cartoon') || t.includes('chutti') || t.includes('disney') || t.includes('pogo') || t.includes('nick')) return 'কিডস';
  if(t.includes('music') || t.includes('song') || t.includes('mtv') || t.includes('9xm')) return 'মিউজিক';
  if(t.includes('bangla') || t.includes('btv') || t.includes('channel i') || t.includes('ntv') || t.includes('maasranga') || t.includes('gazi') || t.includes('jalsha') || t.includes('zee bangla') || t.includes('colors bangla')) return 'বাংলা';
  return 'অন্যান্য';
}
async function loadAll(){
  const grid = document.getElementById('grid');
  try{
    for(let pl of PLAYLISTS){
      try{
        const res = await fetch(pl.url);
        const text = await res.text();
        const lines = text.split("\n"); let cur=null;
        for(let line of lines){ line=line.trim(); if(line.startsWith("#EXTINF")){ const name=line.split(",").pop().trim(); const logoMatch=line.match(/tvg-logo="([^"]+)"/); const groupMatch=line.match(/group-title="([^"]+)"/); cur={name,logo:logoMatch?logoMatch[1]:"",group:groupMatch?groupMatch[1]:"General",src:pl.src}; } else if(line.startsWith("http") && cur){ cur.url=line; cur.cat=getCategory(cur.name,cur.group); if(cur.name && cur.url && !all.find(x=>x.url===cur.url)) all.push(cur); cur=null; } }
      }catch(e){}
    }
    renderCats();
    render();
  }catch(e){ grid.innerHTML = `<div class="empty">চ্যানেল লোড হচ্ছে না, আবার চেষ্টা করো</div>`; }
}
function renderCats(){
  const cats = ['সব', ...new Set(all.map(c=>c.cat))];
  document.getElementById('cats').innerHTML = cats.map(c=>`<div class="cat ${c===activeCat?'active':''}" onclick="setCat('${c}')">${c}</div>`).join("");
}
function setCat(c){ activeCat=c; renderCats(); render(); }
function render(){
  const q = document.getElementById('search').value.toLowerCase();
  const grid = document.getElementById('grid');
  let list = all.filter(c => (activeCat==='সব' || c.cat===activeCat) && cleanName(c.name).toLowerCase().includes(q));
  if(list.length===0){ grid.innerHTML = `<div class="empty" style="grid-column:1/-1">কোনো চ্যানেল পাওয়া যায়নি 😔</div>`; return; }
  grid.innerHTML = list.map(c=>`<div class="card" onclick="openCh('${encodeURIComponent(c.url)}','${encodeURIComponent(c.name)}','${c.src}','${encodeURIComponent(c.group)}')"><img src="${c.logo || 'https://cdn-icons-png.flaticon.com/512/1179/1179069.png'}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/1179/1179069.png'"><p>${cleanName(c.name)}</p><small>${c.src} • ${c.cat}</small></div>`).join("");
}
function openCh(urlEnc, nameEnc, src, groupEnc){
  const url = decodeURIComponent(urlEnc);
  window.location.href = `player.html?url=${encodeURIComponent(url)}&name=${nameEnc}&src=${encodeURIComponent(src||'')}&group=${groupEnc||''}`;
}
document.getElementById('search').addEventListener('input', render);
loadAll();
</script>
</body>
</html>
