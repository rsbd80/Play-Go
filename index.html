<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<title>RsLive Go</title>
<script>
// ===== ANTI-PREVIEW LOCK - আগেরটার মতো =====
// 1. যদি iframe এর ভিতরে চলে = CodeBeautify / Online Viewer / অন্য সাইটে Embed করছে = সাথে সাথে ব্ল্যাংক
if (window.top !== window.self) {
  document.documentElement.innerHTML = '';
  document.write('');
  try { window.top.location = 'about:blank'; } catch(e){}
  throw new Error('Blocked');
}
// 2. যদি তোমার ডোমেইন ছাড়া অন্য কোথাও চলে = ব্ল্যাংক
// নিচে তোমার ডোমেইনটা বসাও, যেমন: rslivego.com
var ALLOWED = ['localhost', '127.0.0.1', 'rslivego.com', 'www.rslivego.com'];
if (ALLOWED.indexOf(window.location.hostname) === -1 && window.location.hostname !== '') {
  // ফাঁকা জায়গায় / CodeBeautify তে চালালে hostname থাকে না বা অন্য থাকে, তাই ব্ল্যাংক
  document.documentElement.innerHTML = '<body style="background:#000;color:#fff;display:flex;align-items:center;justify-content:center;height:100vh;font-family:sans-serif">Blocked</body>';
  document.write('');
  throw new Error('Blocked');
}
// 3. Referrer দিয়ে চেক - CodeBeautify / HTML Viewer থেকে আসলে ব্ল্যাংক
var ref = document.referrer || '';
if (ref.indexOf('codebeautify') !== -1 || ref.indexOf('html-viewer') !== -1 || ref.indexOf('onlinehtmleditor') !== -1 || ref.indexOf('htmlpreview') !== -1) {
  document.documentElement.innerHTML = '';
  throw new Error('Blocked');
}
</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="/manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;600;700&family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#07070f;color:#fff;font-family:'Hind Siliguri',sans-serif}
</style>
</head>
<body>
<div id="app">Loading...</div>
<script src="app.js"></script>
<script>
// শেষ চেক - 0.5 সেকেন্ড পরেও যদি iframe এ থাকে, ব্ল্যাংক
setTimeout(function(){
  if(window.top !== window.self){
    document.body.innerHTML = '';
    document.documentElement.innerHTML = '';
  }
}, 500);
</script>
</body>
</html>
