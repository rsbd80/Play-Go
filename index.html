<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>RsLive Go - Live TV</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#07070f">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;600;700&family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(600px 300px at 50% -80px, rgba(167,139,250,.18), transparent 70%), #07070f;color:#eef0f7;font-family:'Poppins','Hind Siliguri',sans-serif;padding-bottom:86px;min-height:100vh}
a{color:inherit;text-decoration:none}
.topbar{position:sticky;top:0;z-index:100;padding:14px 12px 10px;background:rgba(10,10,20,.92);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.08)}
.brand{display:flex;align-items:center;gap:10px}
.brand .ico{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#22d3ee,#a78bfa,#ff5d8f);display:flex;align-items:center;justify-content:center;font-size:15px}
.brand .pg{font-size:21px;font-weight:900;line-height:1}
.brand .pg i{font-style:normal;background:linear-gradient(90deg,#22d3ee,#a78bfa,#ff5d8f,#fb923c);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand .tag{font-size:8.5px;letter-spacing:3px;color:#9a9ab5;font-weight:700;margin-top:2px}
.search{margin:10px 0 2px;display:flex;gap:8px}
.search input{flex:1;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:11px 12px;color:#fff;outline:none;font-family:inherit;font-size:13px}
.search input::placeholder{color:#777}
.view{display:none;padding:10px 12px 0}
.view.active{display:block}
.sec-title{font-size:15px;font-weight:800;margin:6px 2px 10px;display:flex;align-items:center;gap:8px}
.live-dot{width:8px;height:8px;background:#ff2d55;border-radius:50%;display:inline-block;animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,45,85,.7)}70%{box-shadow:0 0 0 7px rgba(255,45,85,0)}100%{box-shadow:0 0 0 0 rgba(255,45,85,0)}}

/* ===== Upcoming Match - থাকবে ===== */
.upcoming-wrap{margin:2px 0 14px}
.up-card{background:linear-gradient(135deg,rgba(34,211,238,.16),rgba(167,139,250,.18),rgba(255,93,143,.14));border:1px solid rgba(167,139,250,.35);border-radius:18px;padding:12px;position:relative;overflow:hidden}
.up-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.up-badge{background:#ff2d55;color:#fff;font-size:9px;font-weight:800;padding:4px 8px;border-radius:20px;letter-spacing:.5px}
.up-time{font-size:11px;color:#cbd5e1;font-weight:600}
.up-teams{display:flex;align-items:center;justify-content:space-between;gap:8px}
.up-team{flex:1;text-align:center}
.up-team img{width:52px;height:52px;object-fit:cover;border-radius:50%;background:#fff;padding:3px;border:2px solid rgba(255,255,255,.3)}
.up-team p{font-size:12px;font-weight:700;margin-top:6px;line-height:1.2}
.up-vs{font-size:16px;font-weight:900;color:#a78bfa;background:rgba(255,255,255,.08);width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.up-btn{margin-top:10px;width:100%;border:none;padding:10px;border-radius:12px;background:linear-gradient(90deg,#22d3ee,#a78bfa,#ff5d8f);color:#fff;font-weight:800;font-family:inherit;font-size:13px;cursor:pointer}

/* ===== Channel Card - Square 1x1 + Circle Logo ===== */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.card{background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:10px 6px 8px;text-align:center;cursor:pointer;position:relative;overflow:hidden;aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center}
.card:active{transform:scale(.96);border-color:#a78bfa}
.card img{width:58px;height:58px;object-fit:cover;background:#fff;border-radius:50%;padding:4px;border:2px solid rgba(167,139,250,.35);box-shadow:0 4px 14px rgba(0,0,0,.4)}
.card p{font-size:11.5px;font-weight:600;margin-top:8px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:28px;font-family:'Hind Siliguri',sans-serif}
.card small{font-size:9px;color:#888;margin-top:2px}
.live-badge{position:absolute;top:6px;right:6px;background:#ff2d55;color:#fff;font-size:8px;font-weight:800;padding:2px 6px;border-radius:20px;z-index:2}

/* ===== Category Card - Square 1x1 + Circle Logo ===== */
.cat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.cat-card{background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:14px 10px;text-align:center;cursor:pointer;position:relative;overflow:hidden;aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center}
.cat-card:active{transform:scale(.96);border-color:#a78bfa}
.cat-card .cat-logo{width:68px;height:68px;margin:0 auto 10px;border-radius:50%;background:#fff;padding:6px;overflow:hidden;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.4);border:3px solid rgba(167,139,250,.45)}
.cat-card .cat-logo img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.cat-card h3{font-size:14px;font-weight:800}
.cat-card p{font-size:11px;color:#9a9ab5;margin-top:3px;line-height:1.3}
.cat-card .count{margin-top:8px;display:inline-block;background:rgba(167,139,250,.18);border:1px solid rgba(167,139,250,.4);color:#e9d5ff;font-size:10px;font-weight:700;padding:4px 10px;border-radius:20px}
.back-btn{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);padding:8px 12px;border-radius:20px;font-size:12px;font-weight:700;margin-bottom:10px;cursor:pointer}
.empty{text-align:center;color:#888;font-size:13px;padding:30px 10px;line-height:1.6}
.skel{aspect-ratio:1/1;border-radius:18px;background:#15151f;position:relative;overflow:hidden}
.skel::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent);animation:sh 1.2s infinite}
@keyframes sh{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}

/* ===== Bottom Nav - Premium, শুধু ১ লাইন লেখা ===== */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:200;background:rgba(10,10,20,.97);backdrop-filter:blur(16px);border-top:1px solid rgba(255,255,255,.10);padding:8px 8px calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;box-shadow:0 -6px 24px rgba(0,0,0,.5)}
.nav-btn{background:transparent;border:1px solid transparent;color:#8a8a9e;padding:10px 4px 9px;border-radius:16px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font-family:inherit;transition:.2s;position:relative}
.nav-btn .nav-ico-wrap{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;transition:.2s}
.nav-btn .nav-ico-wrap svg{width:22px;height:22px}
.nav-btn .nav-label{font-size:13px;font-weight:800;letter-spacing:.2px}
/* Active - Premium Gradient */
.nav-btn.active{color:#fff;background:linear-gradient(180deg,rgba(167,139,250,.22),rgba(34,211,238,.12));border-color:rgba(167,139,250,.45);box-shadow:0 6px 18px rgba(167,139,250,.25)}
.nav-btn.active .nav-ico-wrap{background:linear-gradient(135deg,#22d3ee,#a78bfa,#ff5d8f);border-color:transparent;box-shadow:0 4px 14px rgba(167,139,250,.6)}
.nav-btn.active .nav-ico-wrap svg{filter:brightness(0) invert(1)}
.nav-btn .dot{position:absolute;top:8px;right:24%;width:8px;height:8px;background:#ff2d55;border-radius:50%;border:2px solid #0a0a14;display:none}
.nav-btn.has-live .dot{display:block}
@media(min-width:900px){body{padding-bottom:0}.bottom-nav{position:sticky;top:0;bottom:auto;max-width:600px;margin:0 auto;border-radius:0 0 18px 18px;border:1px solid rgba(255,255,255,.1);border-top:none}.grid{grid-template-columns:repeat(6,1fr)}.cat-grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand"><div class="ico">▶</div><div><div class="pg">RsLive <i>Go</i></div><div class="tag">LIVE TV • BANGLADESH</div></div></div>
  <div class="search"><input id="searchInput" placeholder="🔍 চ্যানেল খুঁজো... যেমন: T Sports, NTV, Sony..."></div>
</div>

<div id="view-home" class="view active">
  <div class="sec-title">📺 সব চ্যানেল</div>
  <div id="homeGrid" class="grid"><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
</div>

<div id="view-events" class="view">
  <!-- Upcoming Match - থাকবে -->
  <div class="upcoming-wrap">
    <div class="sec-title">🔥 Upcoming Match</div>
    <div class="up-card">
      <div class="up-top"><span class="up-badge">UPCOMING</span><span class="up-time">🕐 আজ • রাত ৮:০০ টা</span></div>
      <div class="up-teams">
        <div class="up-team"><img src="https://flagcdn.com/w320/bd.png"><p>Bangladesh</p></div>
        <div class="up-vs">VS</div>
        <div class="up-team"><img src="https://flagcdn.com/w320/za.png"><p>South Africa</p></div>
      </div>
      <button class="up-btn" onclick="switchTab('home')">📺 চ্যানেল দেখো</button>
    </div>
  </div>
  <div class="sec-title"><span class="live-dot"></span> Live Events • Live Sports</div>
  <div id="eventsGrid" class="grid"></div>
  <div id="eventsEmpty" class="empty" style="display:none">এখন কোনো Live ম্যাচ নাই 😔<br>একটু পরে আবার চেক করো</div>
</div>

<div id="view-categories" class="view">
  <div id="catListWrap">
    <div class="sec-title">🗂️ Categories</div>
    <div id="catGrid" class="cat-grid"></div>
  </div>
  <div id="catDetailWrap" style="display:none">
    <div class="back-btn" onclick="backToCategories()">← সব Category</div>
    <div class="sec-title" id="catDetailTitle">Category</div>
    <div id="catDetailGrid" class="grid"></div>
  </div>
</div>

<!-- Bottom Nav - Premium Icon, শুধু ১ লাইন লেখা -->
<nav class="bottom-nav">
  <button class="nav-btn" id="navEvents" onclick="switchTab('events')">
    <span class="nav-ico-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a15 15 0 0 1 0 20"/><path d="M12 2a15 15 0 0 0 0 20"/><path d="M2 12h20"/><path d="M12 2l3 4-1 4-2-1-2 1-1-4z" fill="currentColor" stroke="none"/></svg></span>
    <span class="nav-label">Events</span><span class="dot"></span>
  </button>
  <button class="nav-btn active" id="navHome" onclick="switchTab('home')">
    <span class="nav-ico-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9 21v-6h6v6"/></svg></span>
    <span class="nav-label">Home</span>
  </button>
  <button class="nav-btn" id="navCategories" onclick="switchTab('categories')">
    <span class="nav-ico-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M3 13h18"/></svg></span>
    <span class="nav-label">Categories</span>
  </button>
</nav>
<script src="/app.js"></script>
</body>
</html>
